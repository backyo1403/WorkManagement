   not interrupting. */
.tb-speech{
  position:fixed; z-index:131; max-width:210px; pointer-events:none;
  background:var(--surface); color:var(--text); border:1px solid var(--border);
  border-radius:13px; padding:7px 11px; font-size:12px; line-height:1.45;
  box-shadow:var(--shadow-lg);
  animation:tbSay .22s cubic-bezier(.34,1.3,.64,1) both;
}
.tb-speech::after{
  content:''; position:absolute; left:50%; bottom:-5px; width:9px; height:9px;
  transform:translateX(-50%) rotate(45deg);
  background:var(--surface); border-right:1px solid var(--border); border-bottom:1px solid var(--border);
}
.tb-speech.out{animation:tbSayOut .18s ease forwards;}
@keyframes tbSay{from{opacity:0; transform:translateY(5px) scale(.95);} to{opacity:1; transform:none;}}
@keyframes tbSayOut{to{opacity:0; transform:translateY(-4px);}}
:root:not([data-motion="full"]) .tb-speech{animation:none;}
/* Evolution sparks. Six small squares, in his own pixel idiom, gone in a
   second — a moment, not a fanfare. */
.tb-spark{
  position:fixed; z-index:131; width:5px; height:5px; border-radius:1px;
  pointer-events:none; background:var(--brand);
  animation:tbSpark .9s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes tbSpark{
  0%{opacity:0; transform:translate(0,0) scale(.6);}
  20%{opacity:1;}
  100%{opacity:0; transform:translate(var(--dx), var(--dy)) scale(1.1);}
}
:root:not([data-motion="full"]) .tb-spark{display:none;}
/* Effect flavours. The rig's table names nine of them; these are the shapes
   they take. All are small, all are brief, none of them is a popup. */
.tb-spark.big{width:7px; height:7px;}
.tb-spark.warn{background:var(--danger, #C0483A);}
.tb-spark.calm{background:var(--text-3);}
.tb-spark.in{animation:tbSparkIn .7s ease-in forwards;}
@keyframes tbSparkIn{
  0%{opacity:0; transform:translate(var(--dx), var(--dy)) scale(1);}
  25%{opacity:1;}
  100%{opacity:0; transform:translate(0,0) scale(.4);}
}
.tb-zzz{
  position:fixed; z-index:131; pointer-events:none;
  font-size:13px; font-weight:800; color:var(--text-3);
  animation:tbZzz 2.4s ease-out forwards;
}
@keyframes tbZzz{
  0%{opacity:0; transform:translate(0,0) scale(.7);}
  25%{opacity:.9;}
  100%{opacity:0; transform:translate(16px,-34px) scale(1.1);}
}
:root:not([data-motion="full"]) .tb-zzz{display:none;}
.tb-sec{font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-3); margin:16px 0 7px;}
.tb-sec:first-of-type{margin-top:0;}
.tb-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:7px;}
.tb-pick{
  display:flex; align-items:center; gap:8px; min-width:0;
  padding:9px 11px; border-radius:11px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  font-size:12.5px; font-weight:600; text-align:left;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  transition:border-color .12s ease, background .12s ease, transform .12s ease;
}
.tb-pick i{font-style:normal; font-size:16px; line-height:1; flex-shrink:0;}
.tb-pick:hover:not(:disabled){border-color:var(--brand); transform:translateY(-1px);}
.tb-pick.on{border-color:var(--brand); background:color-mix(in srgb, var(--brand) 14%, transparent);}
.tb-pick:disabled{opacity:.4; cursor:not-allowed;}
.tb-pick small{margin-left:auto; font-size:10px; font-weight:600; color:var(--text-3);}
.tb-cols{display:flex; gap:7px; flex-wrap:wrap;}
.tb-cols button{
  width:26px; height:26px; border-radius:50%; padding:0; cursor:pointer;
  border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
  transition:transform .12s ease, border-color .12s ease;
}
.tb-cols button:hover{transform:scale(1.1);}
.tb-cols button.on{border-color:var(--text); transform:scale(1.06);}
.tb-age{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--text-2);}
.tb-age .bar{flex:1; height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
.tb-age .bar i{display:block; height:100%; background:var(--brand); border-radius:99px;}
.tb-borrowed{margin-top:9px; padding:9px 11px; border-radius:10px; font-size:11.5px; line-height:1.5;
  background:color-mix(in srgb, var(--brand) 10%, transparent); color:var(--text-2);}

/* ---- ask box, chips, quick actions, and the way through to care ---- */
.tb-ask{display:flex; gap:7px; margin-bottom:8px;}
.tb-ask input{
  flex:1; min-width:0; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); border-radius:10px; padding:9px 12px; font-size:12.5px; outline:none;
  transition:border-color .14s ease, background .14s ease;
}
.tb-ask input:focus{border-color:var(--brand); background:var(--surface);}
.tb-ask button{
  border:none; background:var(--brand); color:var(--on-brand, #fff);
  border-radius:10px; padding:0 14px; font-size:12px; font-weight:700; cursor:pointer;
}
.tb-chips{display:flex; flex-wrap:wrap; gap:5px;}
.tb-chip{
  border:1px solid var(--border); background:var(--surface); color:var(--text-2);
  border-radius:999px; padding:5px 11px; font-size:11.5px; font-weight:600; cursor:pointer;
  transition:border-color .12s ease, color .12s ease;
}
.tb-chip:hover{border-color:var(--brand); color:var(--text);}
.tb-answer{
  margin-top:12px; padding:11px 13px; border-radius:0 12px 12px 0;
  background:color-mix(in srgb, var(--brand) 8%, var(--surface-2));
  border-left:3px solid var(--brand);
  font-size:12.5px; line-height:1.55; color:var(--text);
}
.tb-answer-acts{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px;}
.tb-answer-acts button{
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  border-radius:8px; padding:5px 10px; font-size:11px; font-weight:650; cursor:pointer;
}
.tb-answer-acts button:hover{background:var(--brand); color:var(--on-brand,#fff); border-color:transparent;}
/* One row that reads as a door rather than a button: it leads somewhere. */
.tb-care{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:12px 13px; border-radius:12px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  transition:border-color .12s ease, transform .12s ease;
}
.tb-care:hover{border-color:var(--brand); transform:translateY(-1px);}
.tb-care i{font-style:normal; font-size:20px; line-height:1;}
.tb-care span{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0;}
.tb-care b{font-size:12.5px; font-weight:650;}
.tb-care small{font-size:11px; color:var(--text-3);}
.tb-care em{font-style:normal; font-size:18px; color:var(--text-3);}
.tb-back{
  border:none; background:none; color:var(--text-2); cursor:pointer;
  font-size:22px; line-height:1; padding:0 8px 0 0; margin-right:2px;
}
.tb-back:hover{color:var(--text);}

/* ---------- Tobby ----------
   A fixed strip on the bottom edge, wide enough for him and nothing else. He
   never covers a control: on mobile the bar owns the last 62px and he stands
   on its roof. */
.tobby-dock{
  /* Lifted clear of the bottom edge. Sitting flush on it put his feet in the
     last few pixels of the window, and the viewport is taller than the button
     that holds it — so the bottom of the render fell off the screen entirely
     and he stood there with no paws. */
  position:fixed; bottom:26px; left:0; z-index:130;
  width:76px; height:88px; pointer-events:none;
  display:flex; align-items:flex-end; justify-content:center;
  /* No transition on `left` here. render() rebuilds the shell on every page
     change, so the dock is a new element starting at left:0 and only then put
     back in its corner — with a transition on the property, that replacement
     played as him sliding across the whole window on every navigation. Walking
     sets its own transition for the duration of the walk and clears it. */
}
.tobby-dock[data-dragging="1"]{ transition:none; }
/* The button is the whole dock. It used to be 72x72 holding a 76x88 stage,
   which overflowed it by sixteen pixels downward — measured on the deployed
   build as a stage bottom sixteen pixels below the window. */
.tb-body{
  position:relative; pointer-events:auto; cursor:grab;
  width:100%; height:100%; padding:0; border:none; background:none;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
}
.tb-body:active{cursor:grabbing;}
.tb-stage{display:block; width:100%; height:100%;}
.tb-stage canvas{display:block; width:100%; height:100%;}
@media (max-width:699px){
  /* The bottom bar owns the last 62px; clearing it entirely plus the same lift
     keeps him off every nav button. */
  .tobby-dock{bottom:94px; width:64px; height:74px;}
}
@media print{ .tobby-dock{display:none !important;} }
</style>

<div class="toast-wrap" id="toasts"></div>
<script>
/* =========================================================
   BACH OFFICE — standalone preview
   Structure follows the Coogo Flow reference: Departments,
   Employees, Workflows, Projects, Tasks, Gantt, Kanban,
   Calendar, Notifications, Settings (Telegram/Zalo/AI).
   Persistence: localStorage only (no real backend/auth).
   ========================================================= */

const STORE_KEY = "bachoffice.state.v1";
const AVATAR_PALETTE = ["#2563EB","#7C3AED","#EC4899","#F59E0B","#16A34A","#0EA5E9","#EF4444","#0891B2"];
const DEPT_ICONS = ["🏢","💻","📣","💰","🎯","🛠️","📦","🎨","⚖️","🌱"];
const WORKFLOW_ICONS = ["📁","🚀","🎨","⚙️","🔬","🎧","📊","🧩"];
const PROJECT_ICONS = ["🛒","📱","📈","🖥️","🎓","🧾","🌐","🏗️","📦","🎯"];
const WORKFLOW_COLORS = ["#2563EB","#7C3AED","#EC4899","#F59E0B","#16A34A","#0EA5E9","#EF4444","#64748B"];
/** "Sự kiện" is a status, not a fourth kind of record, so it inherits the whole
 *  task machine — filters, kanban, search, projects — for free. What makes it
 *  different is how its dates are read: a task's `start` is when you mean to
 *  begin and `deadline` is when it is due, but an EVENT's start and deadline
 *  are the two ends of the thing itself. See eventRange(). */
const TASK_STATUS_EVENT = "Sự kiện";
const TASK_STATUSES = ["Cần làm","Đang làm","Hoàn thành",TASK_STATUS_EVENT];
function isEvent(t){ return !!t && t.status === TASK_STATUS_EVENT; }
/** The span an event actually occupies. Falls back to its estimate when no
 *  deadline was given, so a half-filled event still draws something sane. */
function eventRange(t){
  if(!t || !t.start) return null;
  const s = new Date(t.start);
  if(isNaN(s)) return null;
  let e = t.deadline ? new Date(t.deadline) : null;
  if(!e || isNaN(e) || e <= s) e = new Date(s.getTime() + Math.max(0.5, t.estimateHours || 1)*3600000);
  return { start:s, end:e };
}
/** Does this event touch the given day at all? */
function eventCoversDay(t, d){
  const r = eventRange(t);
  if(!r) return false;
  const a = new Date(d); a.setHours(0,0,0,0);
  const b = new Date(a);  b.setDate(b.getDate()+1);
  return r.start < b && r.end > a;
}
const TASK_PRIORITIES = [["ASAP","ASAP"],["Cao","CAO"],["Trung bình","TB"],["Thấp","THẤP"]];
/* Seven-step red scale: the nearer the deadline, the deeper the red. */
const DUE_SCALE = [
  { maxDays: 1,        bg:'#9E1B1B', fg:'#FFFFFF' },  // overdue / due today / tomorrow
  { maxDays: 3,        bg:'#C42B26', fg:'#FFFFFF' },  // 2–3 days
  { maxDays: 7,        bg:'#E03A3A', fg:'#FFFFFF' },  // 4–7 days
  { maxDays: 14,       bg:'#F26161', fg:'#FFFFFF' },  // 8–14 days
  { maxDays: 30,       bg:'#F9A3A3', fg:'#5A1010' },  // 15 days – 1 month
  { maxDays: 60,       bg:'#FAC4C4', fg:'#5A1010' },  // 1–2 months
  { maxDays: Infinity, bg:'#FCE0E0', fg:'#5A1010' },  // further out
];
function dueScaleFor(days){ return DUE_SCALE.find(s=> days <= s.maxDays) || DUE_SCALE[DUE_SCALE.length-1]; }
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/** DD-MMM, e.g. 12-Aug */
function fmtDDMMM(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return String(d.getDate()).padStart(2,'0') + '-' + MONTHS_SHORT[d.getMonth()];
}
const EMPLOYEE_ROLES = ["Chủ sở hữu","Trưởng nhóm","Người thực hiện"];

/* =========================================================
   i18n — Vietnamese is the source language. Switching to English
   runs a post-render pass that swaps known UI phrases, so any
   phrase not in the dictionary simply stays Vietnamese instead
   of showing a broken key.
   ========================================================= */
let LANG = (function(){ try{ return localStorage.getItem('bachoffice.lang') || 'vi'; }catch(e){ return 'vi'; } })();
function loc(){ return LANG==='en' ? 'en-US' : 'vi-VN'; }
const DICT_EN = {
  // nav + groups
  "Tổng quan":"Overview", "Quản lý":"Manage", "Công việc":"Work", "Hệ thống":"System",
  "Dashboard":"Dashboard", "Nhóm công việc":"Work Groups", "Người thực hiện":"People",
  "Workflow":"Workflow", "Dự án":"Projects", "Sơ đồ Gantt":"Gantt Chart",

const DICT_EN_RE = [
  [/^(\d+) nhiệm vụ$/, "$1 tasks"], [/^(\d+) công việc$/, "$1 tasks"], [/^(\d+) việc$/, "$1 tasks"],
  [/^Còn (\d+) ngày$/, (m,n)=> n==='1' ? "1 day left" : n+" days left"],
  [/^Quá hạn (\d+) ngày$/, (m,n)=> n==='1' ? "1 day overdue" : n+" days overdue"],
  [/^⚠ Quá hạn$/, "⚠ Overdue"], [/^🔥 Đến hạn hôm nay$/, "🔥 Due today"],
  [/^(\d+) người thực hiện · (\d+) nhiệm vụ$/, "$1 people · $2 tasks"],
  [/^(\d+)\/(\d+) nhiệm vụ hoàn thành \((\d+)%\)$/, "$1/$2 tasks done ($3%)"],
  [/^Chào buổi (sáng|chiều|tối), (.+) 👋$/, (m,p,n)=>`Good ${p==='sáng'?'morning':p==='chiều'?'afternoon':'evening'}, ${n} 👋`],
  [/^(\d+) đang thực hiện · (\d+) đã hoàn thành$/, "$1 in progress · $2 completed"],
  [/^(\d+) ngày$/, "$1 days"], [/^\((\d+) việc\)$/, "($1 tasks)"],
  [/^Tháng (\d+), (\d+)$/, "Month $1, $2"], [/^Tháng (\d+)\/(\d+)$/, "$1/$2"],
  [/^Khung giờ (.+)$/, "Hours $1"],
  [/^(.+) ơi, hôm nay cần làm gì\?$/, "$1, what needs doing today?"],
  [/^Còn (\d+) ngày$/, (m,n)=> n==='1' ? "1 day left" : n+" days left"],
  [/^Công việc con \((\d+)\/(\d+)\)$/, "Subtasks ($1/$2)"],

  [/^(\d+) ngày trước$/, "$1 d ago"],
  [/^vừa xong$/, "just now"],

  [/^Chuyển checklist thành nhiệm vụ \((\d+)\)$/, "Convert checklist to tasks ($1)"],

function trPhrase(s){
  const key = s.trim();
  if(!key) return null;
  if(DICT_EN[key] !== undefined) return s.replace(key, DICT_EN[key]);
  for(const [re, rep] of DICT_EN_RE){
    if(re.test(key)) return s.replace(key, key.replace(re, rep));
  }
  // Many labels are "<emoji> <phrase>" in a single text node — translate the
  // phrase and keep the icon prefix.
  const m = key.match(/^([^\p{L}\p{N}]+)(.+)$/u);
  if(m){
    const inner = trPhrase(m[2]);
    if(inner !== null) return s.replace(key, m[1] + inner.trim());
  }
  return null;
}
/** Walk the rendered DOM and swap known Vietnamese UI phrases for English. */
function applyLang(root){
  if(LANG !== 'en') return;
  root = root || document.body;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const p = n.parentNode;
      if(!p) return NodeFilter.FILTER_REJECT;
      const tag = p.nodeName;
      if(tag==='SCRIPT'||tag==='STYLE') return NodeFilter.FILTER_REJECT;
      return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = [];
  let n; while((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(node=>{
    // An <option> without an explicit value attribute derives its value from
    // its text, so translating the label would silently corrupt the stored
    // value. Skip those rather than write bad data.
    const p = node.parentNode;
    if(p && p.nodeName === 'OPTION' && !p.hasAttribute('value')) return;
    const out = trPhrase(node.nodeValue);
    if(out !== null) node.nodeValue = out;
  });
  root.querySelectorAll('[placeholder]').forEach(el=>{ const o = trPhrase(el.getAttribute('placeholder')); if(o!==null) el.setAttribute('placeholder', o); });
  root.querySelectorAll('[title]').forEach(el=>{ const o = trPhrase(el.getAttribute('title')); if(o!==null) el.setAttribute('title', o); });
}
/* Modals are appended to <body> after render (and some re-draw their own
   innerHTML), so watch for those subtrees and translate them too. */
let langObserver = null;
function startLangObserver(){
  if(langObserver) langObserver.disconnect();
  langObserver = new MutationObserver(muts=>{
    if(LANG!=='en') return;
    const seen = new Set();
    muts.forEach(m=>{
      m.addedNodes.forEach(node=>{
        if(node.nodeType!==1) return;
        const target = node.classList && node.classList.contains('overlay') ? node : node.closest && node.closest('.overlay');
        if(target && !seen.has(target)){ seen.add(target); }
      });
      if(m.type==='childList' && m.target && m.target.nodeType===1){
        const ov = m.target.classList && m.target.classList.contains('overlay') ? m.target : (m.target.closest && m.target.closest('.overlay'));
        if(ov && !seen.has(ov)) seen.add(ov);
      }
    });
    seen.forEach(ov=> applyLang(ov));
  });
  langObserver.observe(document.body, {childList:true, subtree:true});
}
function setLang(next){
  LANG = next;

/* ---------- storage ---------- */
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return seedState();
}
/** Repair invariants that older saved data (or the demo seed) may violate. */
function normalizeState(){
  if(!STATE) return;
  let changed = 0;
  const validGroups = WORK_GROUPS.map(g=>g.key);
  // Work groups are a fixed set of three.
  STATE.departments = WORK_GROUPS.map(g=>({id:g.key, name:g.name, icon:g.icon, color:g.color, key:g.key}));
  // Every project belongs to a group.
  STATE.projects.forEach(p=>{ if(!validGroups.includes(p.groupId)){ p.groupId='work'; changed++; } });
  // A task always sits in its project's group.
  STATE.tasks.forEach(t=>{
    const p = t.projectId ? STATE.projects.find(x=>x.id===t.projectId) : null;
    if(p && t.departmentId !== p.groupId){ t.departmentId = p.groupId; changed++; }
    else if(!p && !validGroups.includes(t.departmentId)){ t.departmentId = 'work'; changed++; }
    if(!Array.isArray(t.hashtags)) t.hashtags = [];
    if(!Array.isArray(t.checklist)) t.checklist = [];
    // Fields added by the colour / alarm / freeze features. Colours go into a
    // style attribute, so only published keys survive a round-trip through
    // storage; a thaw time in the past is simply dropped.
    if(!taskColorAllowed(t.color)){ t.color = null; changed++; }
    if(t.alarmAt !== undefined && !isFiniteDate(t.alarmAt)){ t.alarmAt = null; changed++; }
    if(t.frozenUntil && (!isFiniteDate(t.frozenUntil) || new Date(t.frozenUntil) <= new Date())){
      t.frozenUntil = null; changed++;
    }
    t.checklist.forEach(c=>{
      if(!taskColorAllowed(c.color)){ c.color = null; changed++; }
      if(c.alarmAt !== undefined && !isFiniteDate(c.alarmAt)){ c.alarmAt = null; changed++; }
      if(c.frozenUntil && (!isFiniteDate(c.frozenUntil) || new Date(c.frozenUntil) <= new Date())){
        c.frozenUntil = null; changed++;
      }
    });
    const want = computeCompletion(t);
    if(t.completion !== want){ t.completion = want; changed++; }
  });
  // People must sit in a real group too.
  STATE.employees.forEach(e=>{ if(!validGroups.includes(e.departmentId)){ e.departmentId='work'; changed++; } });
  if(!Array.isArray(STATE.hashtags)) STATE.hashtags = [];

  /* ---- Notes migration ----
     A saved state from before the Notes module simply has no notes/notebooks.
     Create them empty rather than resetting anything, and backfill any field
     added later so older notes keep working. */
  if(!Array.isArray(STATE.notebooks)){ STATE.notebooks = []; changed++; }
  if(!Array.isArray(STATE.notes)){ STATE.notes = []; changed++; }
  const taskIds = new Set(STATE.tasks.map(t=>t.id));
  const projectIds = new Set(STATE.projects.map(p=>p.id));
  const notebookIds = new Set(STATE.notebooks.map(n=>n.id));
  STATE.notes.forEach(n=>{
    if(!Array.isArray(n.linkedTaskIds)){ n.linkedTaskIds = []; changed++; }
    if(!Array.isArray(n.hashtags)){ n.hashtags = []; changed++; }
    if(!Array.isArray(n.attachments)){ n.attachments = []; changed++; }
    if(!Array.isArray(n.versions)){ n.versions = []; changed++; }
    if(typeof n.content !== 'string'){ n.content = ''; changed++; }
    if(typeof n.title !== 'string'){ n.title = ''; changed++; }
    if(!n.createdAt){ n.createdAt = nowISO(); changed++; }
    if(!n.updatedAt){ n.updatedAt = n.createdAt; changed++; }
    // The card colour goes straight into a style attribute, so only values we
    // published are ever accepted back out of storage.
    if(!noteColorAllowed(n.color)){ n.color = null; changed++; }
    // Drop references to things that no longer exist, so a deleted project or
    // notebook can never strand a note behind a filter it cannot leave.
    if(n.projectId && !projectIds.has(n.projectId)){ n.projectId = null; changed++; }
    if(n.notebookId && !notebookIds.has(n.notebookId)){ n.notebookId = null; changed++; }
    // A note follows its project's group, the same rule tasks obey.
    const p = n.projectId ? STATE.projects.find(x=>x.id===n.projectId) : null;
    if(p && n.departmentId !== p.groupId){ n.departmentId = p.groupId; changed++; }
    else if(!p && !validGroups.includes(n.departmentId)){ n.departmentId = 'work'; changed++; }
    // Links to deleted tasks are pruned here; the UI also guards against them
    // for anything imported between two normalise passes.
    const live = n.linkedTaskIds.filter(id=> taskIds.has(id));
    if(live.length !== n.linkedTaskIds.length){ n.linkedTaskIds = live; changed++; }
    if(n.versions.length > MAX_NOTE_VERSIONS){ n.versions = n.versions.slice(0, MAX_NOTE_VERSIONS); changed++; }
  });

  if(changed) persist();
  return changed;
}

/** Small circular progress meter. Drawn as a stroked circle whose dash offset
 *  carries the percentage, so it scales to any size without extra markup.

function progressRingHtml(pct, size, title){
  pct = Math.max(0, Math.min(100, Math.round(pct||0)));
  const s = size || 16;
  const sw = Math.max(1.6, s*0.16);          // stroke scales with the ring
  const r  = (s - sw)/2;
  const circ = 2*Math.PI*r;
  const done = pct >= 100;
  return `<svg class="prog-ring ${done?'full':''}" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"
    aria-hidden="true"><title>${title || 'Tiến độ '+pct+'%'}</title>
    <circle class="prog-ring-track" cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke-width="${sw}"/>
    <circle class="prog-ring-bar" cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${circ.toFixed(2)}"
      stroke-dashoffset="${(circ*(1-pct/100)).toFixed(2)}"
      transform="rotate(-90 ${s/2} ${s/2})"/>
  </svg>`;
}

function wireHashtagField(ns, tags, redraw){
  const input = document.getElementById(ns+'_tagInput');
  const suggestBox = document.getElementById(ns+'_tagSuggest');
  if(!input) return;
  function addTag(raw){
    const n = normalizeTag(raw);
    if(!n) return;
    if(!tags.includes(n)) tags.push(n);
    registerHashtags([n]);
    redraw();
  }
  function paintSuggestions(){
    const list = hashtagSuggestions(input.value, tags);
    if(!list.length || !input.value.trim()){ suggestBox.classList.remove('open'); suggestBox.innerHTML=''; return; }
    suggestBox.innerHTML = list.map(t=>`<button type="button" data-tag-pick="${esc(t)}">#${esc(t)}</button>`).join("");
    suggestBox.classList.add('open');
    suggestBox.querySelectorAll('[data-tag-pick]').forEach(b=> b.onmousedown = (e)=>{ e.preventDefault(); addTag(b.dataset.tagPick); });
  }
  input.oninput = paintSuggestions;
  input.onfocus = paintSuggestions;
  input.onblur = ()=> setTimeout(()=> suggestBox.classList.remove('open'), 120);
  input.onkeydown = (e)=>{
    if(e.key==='Enter' || e.key===','){ e.preventDefault(); addTag(input.value); }
    else if(e.key==='Backspace' && !input.value && tags.length){ tags.pop(); redraw(); }
  };
  document.querySelectorAll(`[data-${ns}-tag-del]`).forEach(b=> b.onclick = (e)=>{
    e.preventDefault();
    const v = b.getAttribute(`data-${ns}-tag-del`);
    const i = tags.indexOf(v); if(i>=0) tags.splice(i,1);
    redraw();
  });
}
function hashtagChipsHtml(tags, max){
  if(!tags || !tags.length) return '';
  const shown = max ? tags.slice(0,max) : tags;
  return shown.map(t=>`<span class="hashtag-mini">#${esc(t)}</span>`).join("")
       + (max && tags.length>max ? `<span class="hashtag-mini">+${tags.length-max}</span>` : '');

/** Hover cards default to opening downward; near the bottom (or right) edge
 *  that clips them, so flip the card up / pull it left on hover. */
function wireHoverCardFlip(root){
  (root||document).querySelectorAll('.task-row-wrap, .tt-block, .cal-pill, .dash-cal-cell').forEach(wrap=>{
    const card = wrap.querySelector(':scope > .hover-card');
    if(!card) return;
    wrap.addEventListener('mouseenter', ()=>{
      card.classList.remove('flip-up','flip-left');
      // measure with the card momentarily visible
      const prev = card.style.visibility;
      card.style.visibility = 'hidden';
      card.style.display = 'block';
      const r = card.getBoundingClientRect();
      const anchor = wrap.getBoundingClientRect();
      const vh = window.innerHeight, vw = window.innerWidth;
      if(anchor.bottom + r.height + 12 > vh && anchor.top - r.height - 12 > 0) card.classList.add('flip-up');
      if(anchor.left + r.width + 12 > vw) card.classList.add('flip-left');
      card.style.display = '';
      card.style.visibility = prev;
    });
  });
}

function progressGradientColor(pct){
  pct = Math.max(0,Math.min(100,pct));
  const RED=[239,68,68], AMBER=[245,158,11], GREEN=[22,163,74];
  const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
  const mix = pct<=50 ? [0,1,2].map(i=>lerp(RED[i],AMBER[i],pct/50)) : [0,1,2].map(i=>lerp(AMBER[i],GREEN[i],(pct-50)/50));
  return "#"+mix.map(n=>n.toString(16).padStart(2,'0')).join('');
}

/* ---------- sound ----------
   Tones are synthesised rather than shipped as audio files: it keeps the app a
   single self-contained document and costs nothing to load. Browsers block
   audio until the user has interacted with the page, so every call is wrapped
   — a blocked chime must never take the feature that triggered it down. */
let AUDIO_CTX = null;
function audioCtx(){
  if(!STATE.settings || STATE.settings.sound === false) return null;
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    if(!AUDIO_CTX) AUDIO_CTX = new C();
    if(AUDIO_CTX.state === 'suspended') AUDIO_CTX.resume();
    return AUDIO_CTX;
  }catch(e){ return null; }
}
/** One note. `type` shapes the timbre, `at` offsets it inside a sequence. */
function playTone(freq, durMs, at, type, gain){
  const ctx = audioCtx(); if(!ctx) return;
  try{
    const t0 = ctx.currentTime + (at||0);
    const osc = ctx.createOscillator(), amp = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    // Short attack, exponential decay — a plain gate would click.
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(gain||0.14, t0 + 0.012);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs/1000);
    osc.connect(amp); amp.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + durMs/1000 + 0.02);
  }catch(e){}
}
function playChime(){
  playTone(880, 260, 0,    'triangle', .12);
  playTone(1320, 320, 0.13,'triangle', .10);
}

/* ---------- freeze ----------
   A frozen task is still real work — it is only pushed out of sight until it
   thaws, so nothing here ever changes status, dates or completion. */
const FREEZE_OPTIONS = [
  ['1h',  1,   '1 giờ'],
  ['3h',  3,   '3 giờ'],
  ['6h',  6,   '6 giờ'],
  ['12h', 12,  '12 giờ'],
  ['1d',  24,  '1 ngày'],
  ['3d',  72,  '3 ngày'],
  ['7d',  168, '7 ngày'],
];
function isFrozen(item){ return !!(item && item.frozenUntil && new Date(item.frozenUntil) > new Date()); }
/** Human countdown for the frost overlay, e.g. "còn 2 giờ 40 phút". */
function freezeRemaining(item){
  if(!isFrozen(item)) return '';
  // Round to whole minutes first, then split — rounding each part separately
  // produces nonsense like "2 giờ 60 phút".
  const mins = Math.max(1, Math.round((new Date(item.frozenUntil) - new Date())/60000));
  const h = Math.floor(mins/60), m = mins%60;
  if(h >= 24){ const d = Math.floor(h/24); return d + ' ngày' + (h%24 ? ' ' + (h%24) + ' giờ' : ''); }
  return h ? (h + ' giờ' + (m ? ' ' + m + ' phút' : '')) : (m + ' phút');
}
function completionFromChecklist(list){ if(!list || !list.length) return null; return Math.round(list.filter(c=>c.done).length/list.length*100); }
/** Single source of truth for progress:
 *  · with subtasks   → % of subtasks done
 *  · without subtasks → 0% while To do / In progress, 100% once Done */
function computeCompletion(task){
  if(task.status === 'Hoàn thành') return 100;
  const auto = completionFromChecklist(task.checklist);
  return auto === null ? 0 : auto;
}

/** Progress of a project = the average of its tasks' own progress, so a task
 *  that is half-way through its subtasks contributes half a task instead of
 *  nothing. `computeCompletion` is what supplies each task's share: % of its
 *  subtasks done, or 0/100 when it has none. */
function projectProgress(pid){
  const ts = projectTasks(pid); if(!ts.length) return 0;
  const sum = ts.reduce((acc,t)=> acc + computeCompletion(t), 0);

function availableWorkingHours(untilDate, from){
  from = from || new Date();
  let h=0; let cur=new Date(from); const end=new Date(untilDate);
  if(end<=cur) return 0;
  const ws=STATE.settings.workStart, we=STATE.settings.workEnd;
  while(cur<end){
    const day=cur.getDay();
    if(day!==0 && day!==6){
      const dayStart=new Date(cur); dayStart.setHours(ws,0,0,0);
      const dayEnd=new Date(cur); dayEnd.setHours(we,0,0,0);
      const winStart = cur>dayStart?cur:dayStart;
      const winEnd = end<dayEnd?end:dayEnd;
      if(winEnd>winStart) h += (winEnd-winStart)/3600000;
    }
    cur.setDate(cur.getDate()+1); cur.setHours(0,0,0,0);
  }
  return h;
}
function deadlineRisk(t){
  if(!t.deadline || t.status==='Hoàn thành' || t.archived) return {level:"none"};
  const remainingEffort = Math.max(0, (t.estimateHours||1) * (1 - (t.completion||0)/100));
  const avail = availableWorkingHours(t.deadline);
  if(isOverdue(t)) return {level:"high", remainingEffort, avail, reason:"Đã quá hạn"};
  if(avail<=0) return {level:"high", remainingEffort, avail, reason:"Không còn thời gian làm việc trước hạn"};
  const ratio = remainingEffort/avail;
  if(ratio>=0.8) return {level:"high", remainingEffort, avail, reason:"Khối lượng còn lại vượt thời gian có sẵn"};
  if(ratio>=0.45) return {level:"medium", remainingEffort, avail, reason:"Gấp nhưng vẫn khả thi"};
  return {level:"low", remainingEffort, avail, reason:"Đúng tiến độ"};
}

function isLoggedIn(){ return !!SESSION_USER_ID && !!empById(SESSION_USER_ID); }
function attemptLogin(username, password){
  const u = STATE.employees.find(e=>
    e.username.trim().toLowerCase() === String(username||"").trim().toLowerCase() &&
    e.password === String(password||"")
  );
  if(!u) return false;
  SESSION_USER_ID = u.id;
  STATE.currentUserId = u.id;
  persist();
  try{ sessionStorage.setItem('bachoffice.session', u.id); }catch(e){}
  return true;
}
function logout(reason){
  SESSION_USER_ID = null;
  try{ sessionStorage.removeItem('bachoffice.session'); }catch(e){}
  stopIdleWatch();
  loginError = reason || "";
  renderApp();
}
function viewLogin(){
  return `<div class="login-wrap">

function wireLogin(){
  const user = document.getElementById('login_user');
  const pass = document.getElementById('login_pass');
  const go = ()=>{
    if(attemptLogin(user.value, pass.value)){ loginError=""; renderApp(); toast('Xin chào, '+currentUser().name); }
    else { loginError = "Sai tên đăng nhập hoặc mật khẩu"; renderApp(); document.getElementById('login_user').value = user.value; }
  };
  document.getElementById('loginBtn').onclick = go;
  [user,pass].forEach(el=> el.onkeydown = (e)=>{ if(e.key==='Enter') go(); });
  user.focus();
}

/* --- idle auto-lock --- */
let idleTimer = null;
const IDLE_EVENTS = ['mousemove','mousedown','keydown','touchstart','wheel','scroll'];
function autoLockMinutes(){
  const v = STATE.settings.autoLockMinutes;
  return typeof v === 'number' ? v : 15;
}
function resetIdleTimer(){
  if(idleTimer) clearTimeout(idleTimer);
  const mins = autoLockMinutes();
  if(!mins || !isLoggedIn()) return;
  idleTimer = setTimeout(()=> logout('Phiên đã tự khoá do không hoạt động'), mins*60000);
}
function startIdleWatch(){
  stopIdleWatch();
  if(!autoLockMinutes()) return;
  IDLE_EVENTS.forEach(ev=> document.addEventListener(ev, resetIdleTimer, {passive:true}));
  resetIdleTimer();
}
function stopIdleWatch(){
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = null;
  IDLE_EVENTS.forEach(ev=> document.removeEventListener(ev, resetIdleTimer));
}
/** Top-level: show the login screen or the app. */
function renderApp(){
  if(!isLoggedIn()){
    stopIdleWatch();
    document.getElementById('app').innerHTML = viewLogin();
    wireLogin();
    applyLang(document.body);
    return;
  }
  render();
  startIdleWatch();
}

/* ---------- notebook PIN ----------
   A tiny synchronous hash. This gates the UI so a locked notebook is not
   readable at a glance — it is NOT encryption: the note bodies sit in the same
   localStorage entry as plain text and anyone with devtools can read them.
   Real confidentiality needs the content encrypted under a key derived from the
   PIN, with the key never stored. Called out in the Settings copy too. */
function hashPin(pin, salt){
  const s = salt + '|' + pin;
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for(let i=0;i<s.length;i++){
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
    h2 = Math.imul(h2 + c, 2654435761) >>> 0;
  }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
function newSalt(){ return Math.random().toString(36).slice(2,12); }

/** Unlocked notebooks live in sessionStorage: they expire after two hours and
 *  vanish when the tab closes. */
const UNLOCK_KEY = 'bachoffice.unlockedNotebooks';
function readUnlocks(){ try{ return JSON.parse(sessionStorage.getItem(UNLOCK_KEY) || '{}'); }catch(e){ return {}; } }
function writeUnlocks(map){ try{ sessionStorage.setItem(UNLOCK_KEY, JSON.stringify(map)); }catch(e){} }
function notebookUnlocked(notebookId){
  if(!notebookId) return true;
  const nb = notebookById(notebookId);
  if(!nb || !nb.pinHash) return true;
  const at = readUnlocks()[notebookId];
  return !!at && (Date.now() - at) < NOTEBOOK_AUTO_LOCK_MS;
}

/* =========================================================

   piece of user text escaped on the way out, so note content can

const MD_RE = {

  bullet:/^\s*[-*+]\s+(.*)$/,

  quote:/^>\s?(.*)$/,

/** `rgb(a)` from a computed style back to the `#rrggbb` the markers store. */
function toHex(color){
  if(!color) return '';
  if(color[0] === '#') return color.toLowerCase();
  const m = color.match(/\d+/g);
  if(!m || m.length < 3) return '';
  return '#' + m.slice(0,3).map(v=> (+v).toString(16).padStart(2,'0')).join('');

const MD_INLINE = [
  { re:/^`([^`]+)`/,                out:(m)=>`<code class="md-code">${esc(m[1])}</code>` },
  // Markdown has no colour syntax. `{c:#hex|text}` and `{h:#hex|text}` are the
  // local extensions the colour and highlight pickers round-trip through.
  { re:/^\{c:(#[0-9a-fA-F]{3,8})\|([\s\S]+?)\}/,
    out:(m)=>`<span class="md-fg" style="color:${esc(m[1])}">${mdInline(m[2])}</span>` },
  { re:/^\{h:(#[0-9a-fA-F]{3,8})\|([\s\S]+?)\}/,
    out:(m)=>`<span class="md-bg" style="background:${esc(m[1])}">${mdInline(m[2])}</span>` },
  { re:/^\[([^\]]*)\]\(([^)\s]+)\)/, out:(m)=>{
      // Only http(s)/mailto become links; anything else renders as plain text
      // rather than a clickable javascript: or data: trap.
      const href = m[2];
      if(!/^(https?:|mailto:)/i.test(href)) return mdInline(m[1]);
      return `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${mdInline(m[1])}</a>`;
    } },
  { re:/^\*\*([\s\S]+?)\*\*/, out:(m)=>`<strong>${mdInline(m[1])}</strong>` },
  { re:/^__([\s\S]+?)__/,     out:(m)=>`<strong>${mdInline(m[1])}</strong>` },
  // Markdown has no underline; `++text++` is the extension used here so the
  // editor's underline button round-trips instead of being dropped on save.
  { re:/^\+\+([\s\S]+?)\+\+/, out:(m)=>`<u>${mdInline(m[1])}</u>` },
  { re:/^~~([\s\S]+?)~~/,     out:(m)=>`<s>${mdInline(m[1])}</s>` },
  { re:/^\*([\s\S]+?)\*/,     out:(m)=>`<em>${mdInline(m[1])}</em>` },
  { re:/^_([\s\S]+?)_/,       out:(m)=>`<em>${mdInline(m[1])}</em>` },
];
function mdInline(src){
  if(!src) return '';
  let out = '', plain = '', i = 0;
  while(i < src.length){
    const rest = src.slice(i);
    let hit = null;
    for(const p of MD_INLINE){
      const m = p.re.exec(rest);
      if(m){ hit = { m, out:p.out }; break; }
    }
    if(hit){
      if(plain){ out += esc(plain); plain = ''; }
      out += hit.out(hit.m);
      i += hit.m[0].length;
    } else {
      plain += src[i];
      i++;
    }
  }
  return out + (plain ? esc(plain) : '');
}
/**
 * Render Markdown to HTML. `interactive` makes checklist boxes clickable.
 * Returns the block elements only, with no wrapper — the contenteditable uses
 * this so its own children are the blocks, which is what mdFromHtml walks.
 */
function mdRenderInner(src, interactive){
  const lines = (src||'').split('\n');
  const out = [];
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    if(!line.trim()){ i++; continue; }

    const fence = MD_RE.fence.exec(line);
    if(fence){
      const body = [];
      i++;
      while(i < lines.length && !MD_RE.fence.test(lines[i])) body.push(lines[i++]);
      i++;
      out.push(`<pre class="md-pre"><code>${esc(body.join('\n'))}</code></pre>`);
      continue;
    }
    if(MD_RE.hr.test(line)){ out.push('<hr>'); i++; continue; }

    const h = MD_RE.heading.exec(line);
    if(h){ out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); i++; continue; }

    if(MD_RE.quote.test(line)){
      const body = [];
      while(i < lines.length && MD_RE.quote.test(lines[i])) body.push(MD_RE.quote.exec(lines[i++])[1]);
      out.push(`<blockquote>${mdInline(body.join(' '))}</blockquote>`);
      continue;
    }

    const isBullet = MD_RE.bullet.test(line), isOrdered = MD_RE.ordered.test(line);
    if(isBullet || isOrdered){
      const ordered = isOrdered && !isBullet;
      const items = [];
      let anyTask = false;
      while(i < lines.length){
        const l = lines[i];
        const task = MD_RE.task.exec(l);
        if(task){
          anyTask = true;
          const done = task[1].toLowerCase()==='x';
          items.push(`<li class="md-task"><button type="button" class="md-checkbox ${done?'done':''}"
            ${interactive?`data-md-toggle="${i}"`:'disabled'} aria-pressed="${done}">${done?'✓':''}</button
            ><span class="${done?'md-task-done':''}">${mdInline(task[2])}</span></li>`);
        } else if(!ordered && MD_RE.bullet.test(l)){
          items.push(`<li>${mdInline(MD_RE.bullet.exec(l)[1])}</li>`);
        } else if(ordered && MD_RE.ordered.test(l)){
          items.push(`<li>${mdInline(MD_RE.ordered.exec(l)[1])}</li>`);
        } else break;
        i++;
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag} class="${anyTask?'md-tasklist':''}">${items.join('')}</${tag}>`);
      continue;
    }

    const para = [];
    while(i < lines.length && lines[i].trim() && !mdStartsBlock(lines[i])) para.push(lines[i++]);
    if(para.length) out.push(`<p>${mdInline(para.join(' '))}</p>`);
    else i++;   // never spin on a line we failed to classify

  return out.join('');
}
/** The read-only view: the same blocks inside a `.md-body` wrapper. */
function mdRender(src, interactive){
  const inner = mdRenderInner(src, interactive);

/** Every `- [ ]` / `- [x]` line, with its line number. */
function mdChecklist(src){
  return (src||'').split('\n').map((line,i)=>{
    const m = MD_RE.task.exec(line);
    return m ? { text:m[2].trim(), checked:m[1].toLowerCase()==='x', line:i } : null;

/** Flip one checkbox in the source, leaving every other line untouched. */
function mdToggleLine(src, line){
  const lines = (src||'').split('\n');
  const target = lines[line];
  if(target === undefined) return src;
  const m = MD_RE.task.exec(target);
  if(!m) return src;

/** Strip markers for previews and search. Never rendered as markup. */
function mdPlain(src){

    .replace(/```[\s\S]*?```/g,' ')
    .replace(/`([^`]+)`/g,'$1')
    .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/^\s*#{1,6}\s+/gm,'')
    .replace(/^\s*>\s?/gm,'')
    .replace(/^\s*[-*+]\s+\[[ xX]\]\s*/gm,'')
    .replace(/^\s*[-*+]\s+/gm,'')
    .replace(/^\s*\d+[.)]\s+/gm,'')

    .replace(/\{[ch]:#[0-9a-fA-F]{3,8}\|([\s\S]*?)\}/g,'$1')

    .replace(/[*_~]/g,'')

/* ---------- HTML → Markdown ----------
   The editor is contenteditable, so what the user sees is real bold/italic
   markup. Markdown stays the stored format — templates, the checklist parser
   and "convert to tasks" all read it — so the DOM is serialised back on every
   save rather than switching the data model to HTML. */
function mdFromHtml(root){
  const INLINE_WRAP = { STRONG:'**', B:'**', EM:'*', I:'*', U:'++', S:'~~', STRIKE:'~~', DEL:'~~' };

  function inline(node){
    if(node.nodeType === 3) return node.nodeValue.replace(/ /g,' ');
    if(node.nodeType !== 1) return '';
    const tag = node.nodeName;
    if(tag === 'BR') return '\n';

    let inner;
    if(tag === 'CODE'){
      inner = '`' + node.textContent + '`';
    } else if(tag === 'A'){
      const href = node.getAttribute('href') || '';
      inner = href ? `[${children(node)}](${href})` : children(node);
    } else {
      inner = children(node);
      const wrap = INLINE_WRAP[tag];
      // Never emit `****` for an empty span — it would render as literal stars.
      if(wrap && inner.trim()) inner = wrap + inner + wrap;
    }

    /* Colour is read from *any* element, not just SPAN: execCommand styles
       whichever tag already wraps the selection, so a coloured bold run comes
       back as `<strong style="color:…">` rather than a span of its own. */
    const style = node.style || {};
    const fg = toHex(style.color || (tag === 'FONT' ? node.getAttribute('color') : ''));
    const bg = toHex(style.backgroundColor);
    if(bg) inner = `{h:${bg}|${inner}}`;
    if(fg) inner = `{c:${fg}|${inner}}`;
    return inner;
  }
  function children(node){ return Array.from(node.childNodes).map(inline).join(''); }

  function listItems(list, ordered, out){
    Array.from(list.children).forEach((li, i)=>{
      if(li.nodeName !== 'LI') return;
      const box = li.querySelector('.md-checkbox');
      // Serialise the checkbox from its own state, then skip it as content.
      const text = Array.from(li.childNodes)
        .filter(c=> !(c.nodeType===1 && c.classList && c.classList.contains('md-checkbox')))
        .map(inline).join('').trim();
      if(box) out.push(`- [${box.classList.contains('done')?'x':' '}] ${text}`);
      else out.push(ordered ? `${i+1}. ${text}` : `- ${text}`);
    });
  }

  const out = [];
  Array.from(root.childNodes).forEach(node=>{
    if(node.nodeType === 3){
      const t = node.nodeValue.trim();
      if(t){ out.push(t); out.push(''); }
      return;
    }
    if(node.nodeType !== 1) return;
    switch(node.nodeName){
      case 'H1': out.push('# ' + children(node)); out.push(''); break;
      case 'H2': out.push('## ' + children(node)); out.push(''); break;
      case 'H3': case 'H4': case 'H5': case 'H6':
        out.push('### ' + children(node)); out.push(''); break;
      case 'UL': listItems(node, false, out); out.push(''); break;
      case 'OL': listItems(node, true, out); out.push(''); break;
      case 'BLOCKQUOTE':
        children(node).split('\n').forEach(l=> out.push('> ' + l));
        out.push(''); break;
      case 'PRE':
        out.push('```'); out.push(node.textContent.replace(/\n$/,'')); out.push('```'); out.push(''); break;
      case 'HR': out.push('---'); out.push(''); break;
      case 'BR': out.push(''); break;
      default: {
        // P, DIV and anything else the browser produced for a line.
        const text = inline(node);
        text.split('\n').forEach(l=> out.push(l));
        out.push('');
      }
    }
  });

  // Collapse the runs of blank lines the per-block padding leaves behind.
  return out.join('\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+/,'').replace(/\s+$/,'') + '\n';
}
function notePreview(n, max){
  max = max || 140;

  return plain.length > max ? plain.slice(0,max).trimEnd() + '…' : plain;
}
/** Relative where it reads better, absolute once it stops being useful. */
function relTime(iso){
  const mins = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if(mins < 1) return 'vừa xong';
  if(mins < 60) return mins + ' phút trước';
  const hours = Math.round(mins/60);
  if(hours < 24) return hours + ' giờ trước';
  const days = Math.round(hours/24);
  if(days === 1) return 'hôm qua';
  if(days < 7) return days + ' ngày trước';
  return new Date(iso).toLocaleDateString(loc(),{day:'2-digit',month:'2-digit'});
}
function fmtBytes(n){
  if(!n) return '—';
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return Math.round(n/1024) + ' KB';
  return (n/(1024*1024)).toFixed(1) + ' MB';
}

/* ---------- note writes ---------- */
function addNote(partial){
  const now = nowISO();
  const note = Object.assign({
    id: uid(), title:'', content:'', notebookId:null, projectId:null,
    departmentId: ACTIVE_GROUP || 'work', authorId: STATE.currentUserId,
    favorite:false, archived:false, deletedAt:null, templateKey:null, color:null,
    hashtags:[], linkedTaskIds:[], attachments:[], versions:[],
    createdAt: now, updatedAt: now,
  }, partial||{});
  // A note attached to a project always follows that project's group.
  const p = note.projectId ? projectById(note.projectId) : null;
  if(p) note.departmentId = p.groupId;
  STATE.notes.unshift(note);
  registerHashtags(note.hashtags);
  persist();
  return note;
}
/** Snapshot before an edit, but only when the last one is old enough that a
 *  new entry is worth keeping — autosave would otherwise flood the history. */
function snapshotNote(n){
  if(!Array.isArray(n.versions)) n.versions = [];
  const last = n.versions[0];
  if(last && last.title === n.title && last.content === n.content) return;
  if(last && (Date.now() - new Date(last.createdAt).getTime()) < NOTE_VERSION_GAP_MS) return;
  n.versions.unshift({ id:uid(), title:n.title, content:n.content, createdAt: nowISO() });
  if(n.versions.length > MAX_NOTE_VERSIONS) n.versions.length = MAX_NOTE_VERSIONS;
}
function updateNote(id, patch, opts){
  const n = noteById(id);
  if(!n) return null;
  const touchesText = patch.title !== undefined || patch.content !== undefined;
  if(touchesText && !(opts && opts.snapshot === false)) snapshotNote(n);
  Object.assign(n, patch);
  if(patch.projectId !== undefined){
    const p = patch.projectId ? projectById(patch.projectId) : null;
    if(p) n.departmentId = p.groupId;
  }
  if(patch.hashtags) registerHashtags(patch.hashtags);
  n.updatedAt = nowISO();
  persist();
  return n;
}
/** The single write for the Note ↔ Task relationship, used by both sides. */
function setNoteTaskLink(noteId, taskId, linked){
  const n = noteById(noteId);
  if(!n) return null;
  if(!Array.isArray(n.linkedTaskIds)) n.linkedTaskIds = [];
  const has = n.linkedTaskIds.includes(taskId);
    if(linked && !has){ n.linkedTaskIds.push(taskId); }
  if(!linked && has) n.linkedTaskIds = n.linkedTaskIds.filter(x=>x!==taskId);
  n.updatedAt = nowISO();
  persist();
  return n;
}
/**
 * Turn the note's checklist into real Tasks and link them back.
 * Re-running is safe: an item whose text already matches a task linked to this
 * note is skipped, so a second run creates nothing.
 */
function convertChecklistToTasks(noteId){
  const n = noteById(noteId);
  if(!n) return {created:0, skipped:0};
  const items = mdChecklist(n.content);
  const already = new Set(noteLinkedTasks(n).filter(t=>!t.missing).map(t=>t.title.trim().toLowerCase()));
  let created = 0, skipped = 0;
  items.forEach(item=>{
    if(already.has(item.text.toLowerCase())){ skipped++; return; }
    const task = addTask({
      title: item.text,
      status: 'Cần làm',
      priority: 'Trung bình',
      projectId: n.projectId || null,
      departmentId: n.departmentId,
    });
    logActivity(task, `Tạo từ checklist của ghi chú "${noteTitleOf(n)}"`);
    n.linkedTaskIds.push(task.id);
    already.add(item.text.toLowerCase());
    created++;
  });
  n.updatedAt = nowISO();
  persist();
  return {created, skipped};
}
/** Checklist items that have not become tasks yet. */
function unconvertedChecklist(n){
  const already = new Set(noteLinkedTasks(n).filter(t=>!t.missing).map(t=>t.title.trim().toLowerCase()));
  return mdChecklist(n.content).filter(c=> !already.has(c.text.toLowerCase()));
}
/** Matches title, body, tags, notebook, project and linked task titles. */
function noteMatches(n, q){
  q = q.trim().toLowerCase();
  if(!q) return false;
  const tags = (n.hashtags||[]).map(x=>x.toLowerCase());
  if(q.startsWith('#')){
    const needle = q.slice(1).replace(/\s+/g,'-');
    return needle ? tags.some(t=>t.includes(needle)) : tags.length>0;
  }
  const nb = notebookById(n.notebookId);
  const proj = projectById(n.projectId);
  const linked = noteLinkedTasks(n).filter(t=>!t.missing).map(t=>t.title);
  return [n.title, mdPlain(n.content), nb?nb.name:'', proj?proj.name:'', ...linked]
    .some(v => (v||'').toLowerCase().includes(q)) || tags.some(t=>t.includes(q));
}

function computeNotifications(){
  const list = [];
  activeTasks().forEach(t=>{
    if(t.status==='Hoàn thành') return;
    // A frozen task is deliberately parked, so it stops nagging until it thaws.
    if(isFrozen(t)) return;
    if(isOverdue(t)) list.push({id:'ov-'+t.id, type:'overdue', text:`Nhiệm vụ "${t.title}" đã quá hạn`, taskId:t.id, at:t.deadline});
    else if(isSameDay(t.deadline)) list.push({id:'td-'+t.id, type:'today', text:`Nhiệm vụ "${t.title}" đến hạn hôm nay`, taskId:t.id, at:t.deadline});
  });
  // Alarms that have gone off join the same feed, newest first.
  activeAlarms().forEach(a=> list.push({
    id:'al-'+a.id, type:'alarm', text:`⏰ Báo thức: ${a.text}`, taskId:a.taskId, at:a.firedAt, alarmId:a.id,
  }));
  return list.sort((a,b)=> new Date(a.at) - new Date(b.at));
}

/** Should motion be suppressed right now?
 *  The app setting is authoritative; the OS is consulted only when the user
 *  has expressed no preference here. Going through this instead of calling
 *  matchMedia directly is what lets an explicit "full" override a system-wide
 *  "animation effects: off", which was freezing the weather and the map.
 */
/** Interface language switch. Lived inside the character block once; it is
 *  used by the dashboard and by the AI action messages, so it is app-level. */
const TB_L = (vi,en)=> LANG==='en' ? en : vi;

function tbReduceMotion(){
  const m = document.documentElement.getAttribute('data-motion');
  if(m === 'full')    return false;
  if(m === 'reduced') return true;
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch(e){ return false; }
}
/** Persist the choice and apply it without a reload. */
function setMotionMode(mode){
  if(!['full','reduced','system'].includes(mode)) mode = 'full';
  document.documentElement.setAttribute('data-motion', mode);
  try{ localStorage.setItem('bachoffice.motion', mode); }catch(e){}
  try{ applyWeatherScene(WEATHER.kind); }catch(e){}
}

/* Floating ⋯ quick-capture: fixed to the viewport so it stays put while
   scrolling; click outside or Esc to dismiss. */
function wireComposerPopup(){
  const fab  = document.getElementById('fabComposer');
  const dock = document.getElementById('fabDock');
  const arc  = document.getElementById('fabArc');
  const pop  = document.getElementById('composerPop');
  const body = document.getElementById('composerPopBody');
  // The quick composer is still reachable from Tobby's panel even when the
  // old ⋯ dock is gone, so this exits quietly rather than failing.
  if(!pop || !body) return;
  window.openQuickComposer = ()=>{
    body.innerHTML = quickComposerHtml();
    pop.hidden = false;
    wireQuickComposer();
    applyLang(pop);
    const input = document.getElementById('composerInput');
    if(input) input.focus();
  };
  document.getElementById('composerPopClose').onclick = ()=>{ pop.hidden = true; };
  pop.onclick = (e)=> e.stopPropagation();
  if(!fab || !dock) return;

  function openArc(){ if(arc){ dock.classList.add('open'); arc.setAttribute('aria-hidden','false'); } }
  function closeArc(){ if(arc){ dock.classList.remove('open'); arc.setAttribute('aria-hidden','true'); } }
  function openComposer(){
    body.innerHTML = quickComposerHtml();
    pop.hidden = false;
    wireQuickComposer();
    applyLang(pop);
    const input = document.getElementById('composerInput');
    if(input) input.focus();
  }
  function closeComposer(){ pop.hidden = true; }
  function closeAll(){ closeArc(); closeComposer(); }
  window.closeComposerPopup = closeAll;

  fab.onclick = (e)=>{
    e.stopPropagation();
    if(dock.classList.contains('open') || !pop.hidden) closeAll();
    else openArc();
  };
  if(arc) arc.querySelectorAll('[data-orb]').forEach(orb=>{
    orb.onclick = (e)=>{
      e.stopPropagation();
      const key = orb.dataset.orb;
      if(key === 'today'){ closeArc(); openComposer(); }
      else { closeAll(); setActiveGroup(key); }   // setActiveGroup re-renders
    };
  });
  dock.onclick = (e)=> e.stopPropagation();
  document.addEventListener('click', ()=>{ if(dock.classList.contains('open')||!pop.hidden) closeAll(); });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeAll(); });
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('bachoffice.theme', next); }catch(e){}

}

/** Matches on title/description/project name AND hashtags.
 *  A leading "#" restricts the match to hashtags only. */
function taskMatches(t,q){
  q=q.trim().toLowerCase(); if(!q) return false;
  const tags = (t.hashtags||[]).map(x=>x.toLowerCase());
  if(q.startsWith('#')){
    const needle = q.slice(1).replace(/\s+/g,'-');
    if(!needle) return tags.length>0;
    return tags.some(tag=> tag.includes(needle));
  }
  const proj = projectById(t.projectId);
  const projTags = (proj && proj.hashtags||[]).map(x=>x.toLowerCase());
  return [t.title, t.description||"", proj?proj.name:""].some(v=>(v||"").toLowerCase().includes(q))
      || tags.some(tag=>tag.includes(q))
      || projTags.some(tag=>tag.includes(q));
}
function projectMatches(p,q){
  q=q.trim().toLowerCase(); if(!q) return false;
  const tags = (p.hashtags||[]).map(x=>x.toLowerCase());
  if(q.startsWith('#')){
    const needle = q.slice(1).replace(/\s+/g,'-');
    if(!needle) return tags.length>0;
    return tags.some(tag=> tag.includes(needle));
  }
  return [p.name, p.description||"", p.goal||""].some(v=>(v||"").toLowerCase().includes(q))
      || tags.some(tag=>tag.includes(q));
}

/** Fade+lift the page on navigation, and stagger the dashboard widgets so the
 *  board assembles rather than snapping in all at once. */
let lastMotionView = null;
function playViewMotion(el){
  const changedView = VIEW !== lastMotionView;
  lastMotionView = VIEW;
  if(changedView){
    el.classList.remove('view-enter');
    void el.offsetWidth;              // restart the animation
    el.classList.add('view-enter');

  const widgets = el.querySelectorAll('.dash-widget');
  widgets.forEach((w,i)=>{ w.style.animationDelay = (changedView ? i*50 : 0) + 'ms'; });

  el.querySelectorAll('.cal-pill').forEach((p,i)=>{ p.style.animationDelay = Math.min(i*18, 360) + 'ms'; });

/* =========================================================
   TASK CRUD (shared across Tasks / Kanban / Gantt / Calendar / Project detail)
   ========================================================= */
/** A task always inherits the work group of the project it belongs to. */
function resolveTaskGroup(partial, fallback){
  const proj = partial.projectId ? projectById(partial.projectId) : null;
  if(proj && proj.groupId) return proj.groupId;
  return partial.departmentId || fallback || null;
}
/** Re-home every task of a project when the project's group changes. */
function cascadeProjectGroup(projectId, groupId){
  if(!projectId || !groupId) return 0;
  let n = 0;
  STATE.tasks.forEach(t=>{ if(t.projectId===projectId && t.departmentId!==groupId){ t.departmentId = groupId; n++; } });
  if(n) persist();
  return n;
}
function addTask(partial){
  // Group follows the project; otherwise default into the group being viewed
  // so a new task doesn't vanish behind the active filter.
  partial = { ...partial, departmentId: resolveTaskGroup(partial, ACTIVE_GROUP) };
  const t = Object.assign({
    id: uid(), title:"Nhiệm vụ mới", description:"", projectId:null, workflowId:null, departmentId:null,
    assigneeId:null, executorIds:[], priority:"Trung bình", status:"Cần làm", deadline:null, start:null,
    estimateHours:1, actualHours:0, completion:0, checklist:[], hashtags:[], comments:[],
    activity:[{id:uid(), text:"Nhiệm vụ được tạo", createdAt: nowISO()}], timeLogs:[],
    creatorId: STATE.currentUserId, createdAt: nowISO(), updatedAt: nowISO(), completedAt:null, archived:false
  }, partial);
  t.completion = computeCompletion(t);
  STATE.tasks.unshift(t); persist();
  return t;
}
function logActivity(t, text){ t.activity = t.activity||[]; t.activity.unshift({id:uid(), text, createdAt: nowISO()}); }
function updateTask(id, patch, activityText){
  const t = STATE.tasks.find(x=>x.id===id); if(!t) return;
  Object.assign(t, patch, {updatedAt: nowISO()});
  // Keep the task in its project's group whenever the project link changes.
  if('projectId' in patch){
    const proj = t.projectId ? projectById(t.projectId) : null;
    if(proj && proj.groupId) t.departmentId = proj.groupId;
  }
  if(t.status==="Hoàn thành") t.completedAt = t.completedAt || nowISO();
  else if(patch.status && patch.status!=="Hoàn thành") t.completedAt = null;
  t.completion = computeCompletion(t);
  if(activityText) logActivity(t, activityText);
  persist();
  // A project is finished when its last task is — noticed here rather than
  // announced, so it fires once and only when it is actually true.
  try{ const _t = STATE.tasks.find(x=>x.id===id); if(_t) tobbyCheckProject(_t.projectId); }catch(e){}
}

/** A short, soft burst of dots at the checkbox — celebratory but not loud. */
function sparkBurst(el){
  if(!el || tbReduceMotion()) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const colors = ['var(--success)','var(--brand)','var(--warning)'];
  for(let i=0;i<8;i++){
    const a = (Math.PI*2*i)/8 + Math.random()*0.4;
    const dist = 16 + Math.random()*14;
    const s = document.createElement('span');
    s.className = 'spark';
    s.style.left = cx+'px'; s.style.top = cy+'px';
    s.style.background = colors[i%colors.length];
    s.style.setProperty('--dx', (Math.cos(a)*dist).toFixed(1)+'px');
    s.style.setProperty('--dy', (Math.sin(a)*dist).toFixed(1)+'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 500);
  }
}
function toggleTaskDone(id, srcEl){
  const t = STATE.tasks.find(x=>x.id===id); if(!t) return;
  const completing = t.status !== 'Hoàn thành';
  if(!completing){ updateTask(id, {status:'Cần làm', completedAt:null}, 'Mở lại nhiệm vụ'); renderView(); return; }

  if(activeTimer && activeTimer.taskId===id) stopTimer();
  registerCombo();
  try{ tobbyOnTaskDone(STATE.tasks.find(x=>x.id===id)); }catch(e){}
  // Let the tick draw + burst play, then re-render so counters and bars animate.
  if(srcEl){
    srcEl.classList.add('done','just-done');
    sparkBurst(srcEl);
    updateTask(id, {status:'Hoàn thành'}, 'Đánh dấu hoàn thành');

  }
}
/* =========================================================
   COMBO STREAK
   Consecutive completions inside one session of the day earn an escalating
   banner. The streak resets when the half-day turns over (morning → afternoon
   → evening) or when the gap between two completions gets long enough that
   they clearly are not the same push of work.
   ========================================================= */
const COMBO_TIERS = [
  { n:2, label:'DOUBLE KILL',  sub:'2 nhiệm vụ liên tiếp', notes:[523.25, 659.25],                 hue:'var(--sky)'     },
  { n:3, label:'TRIPLE KILL',  sub:'3 nhiệm vụ liên tiếp', notes:[523.25, 659.25, 783.99],         hue:'var(--brand)'   },
  { n:4, label:'QUADRA KILL',  sub:'4 nhiệm vụ liên tiếp', notes:[587.33, 739.99, 880, 1046.5],    hue:'var(--purple)'  },
  { n:5, label:'RAMPAGE!',     sub:'5 nhiệm vụ liên tiếp', notes:[659.25, 830.61, 987.77, 1318.5], hue:'var(--danger)'  },
];
/** Longest pause that still counts as "the same run". */
const COMBO_GAP_MS = 45*60*1000;
/** morning | afternoon | evening — the streak never crosses these. */
function daySession(d){
  const h = (d||new Date()).getHours();
  return h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening';
}
function comboState(){
  if(!STATE.settings.combo_state || typeof STATE.settings.combo_state !== 'object'){
    STATE.settings.combo_state = { count:0, at:0, session:'' };
  }
  return STATE.settings.combo_state;
}
function comboEnabled(){ return !STATE.settings || STATE.settings.combo !== false; }
/** Called on every completion. Advances or resets the streak, then fires. */
function registerCombo(){
  if(!comboEnabled()) return;
  const s = comboState();
  const now = Date.now();
  const session = daySession();
  const continues = s.session === session && (now - (s.at||0)) < COMBO_GAP_MS;
  s.count = continues ? (s.count||0) + 1 : 1;
  s.at = now;
  s.session = session;
  persist();
  if(s.count >= 2) showComboBanner(s.count);
}
/** Highest tier the count has reached; 5+ all read as RAMPAGE. */
function comboTier(count){
  let tier = null;
  COMBO_TIERS.forEach(t=>{ if(count >= t.n) tier = t; });
  return tier;
}
function showComboBanner(count){
  const tier = comboTier(count);
  if(!tier) return;
  document.getElementById('comboBanner')?.remove();

  const el = document.createElement('div');
  el.id = 'comboBanner';
  el.className = 'combo-banner';
  el.style.setProperty('--combo-hue', tier.hue);
  const streakNote = count > 5 ? `<div class="combo-streak">Chuỗi ${count} nhiệm vụ 🔥</div>` : '';
  el.innerHTML = `
    <div class="combo-rays"></div>
    <div class="combo-label" data-text="${tier.label}">${tier.label}</div>
    <div class="combo-sub">${count > 5 ? count + ' nhiệm vụ liên tiếp' : tier.sub}</div>
    ${streakNote}
    <div class="combo-sparks">${[...Array(10)].map((_,i)=>
      `<i style="--a:${i*36}deg; animation-delay:${(i%5)*40}ms;"></i>`).join('')}</div>
  `;
  document.body.appendChild(el);
  // Rising arpeggio — the higher the tier, the further the run climbs.
  tier.notes.forEach((f,i)=> playTone(f, 260, i*0.085, 'square', .09));
  setTimeout(()=> el.classList.add('out'), 1500);
  setTimeout(()=> el.remove(), 2100);
}

/** Collapse a row before removing it, so deletion reads as a transition. */
function animateRowOut(el, done){
  if(!el || tbReduceMotion()){ done(); return; }
  const wrap = el.closest('.task-row-wrap') || el.closest('tr') || el;
  wrap.classList.add('row-removing');

function toggleChecklistItem(taskId, itemId){
