/* =========================================================
   GEMINI — the model as a proposer, never as an author
   ---------------------------------------------------------
   Two layers, kept apart on purpose:
     geminiService — talks to the model. Knows nothing about Bach Office.
     the allowlist — Bach Office owns every task, note, project and minute.
                     The model never writes to it; it can only PROPOSE an
                     action from a fixed list, validated here before anything
                     happens.

   Two key paths, and the difference is stated plainly in Settings rather than
   blurred: the /api/gemini proxy keeps a deployment key server-side and is
   preferred whenever it answers; a key pasted into Settings lives in this
   browser's localStorage and is used only when the proxy is unavailable. A
   key in a browser is not secret and the UI says so.

   Nothing calls ask() any more — the character that used to do the asking is
   gone. What survives is the plumbing worth keeping: the transport, the
   settings, and the validation that stands between a model and the store.
   ========================================================= */
const AI_CONFIG = {
  provider: 'gemini',
  model: 'gemini-2.0-flash',
  models: [
    ['gemini-2.0-flash',      'Gemini Flash (nhanh, mặc định)'],
    ['gemini-2.0-flash-lite', 'Gemini Flash Lite (tiết kiệm)'],
    ['gemini-1.5-flash',      'Gemini 1.5 Flash'],
    ['gemini-1.5-pro',        'Gemini 1.5 Pro (sâu hơn, chậm hơn)'],
  ],
  proxyUrl: '/api/gemini',
  historyMax: 20,
};
function aiSettings(){
  const s = STATE.settings;
  if(!s.ai) s.ai = { enabled:false, apiKey:'', model:AI_CONFIG.model, personality:'friendly' };
  return s.ai;
}
/** Never true just because a key was typed — the whole feature has to be on. */
function aiEnabled(){ return !!aiSettings().enabled; }

const geminiService = {
  proxyReady: null,             // null = not probed yet

  /** Is the server-side proxy available AND configured? Probed once. */
  async probeProxy(){
    if(this.proxyReady !== null) return this.proxyReady;
    try{
      const r = await fetch(AI_CONFIG.proxyUrl, { method:'GET' });
      const j = await r.json().catch(()=>null);
      this.proxyReady = !!(r.ok && j && j.configured);
    }catch(e){ this.proxyReady = false; }
    return this.proxyReady;
  },

  buildRequest(systemText, history, userText){
    return {
      model: aiSettings().model || AI_CONFIG.model,
      systemInstruction: { parts:[{ text: systemText }] },
      contents: [
        ...history.map(m=>({ role: m.role === 'model' ? 'model' : 'user',
                             parts:[{ text: String(m.text||'').slice(0,4000) }] })),
        { role:'user', parts:[{ text: userText }] },
      ],
      generationConfig: { temperature:0.7, maxOutputTokens:1024, responseMimeType:'application/json' },
    };
  },

  /** Pull the model's JSON out of the envelope, tolerating a code fence. */
  parseResponse(data){
    const raw = (((data||{}).candidates||[])[0]||{}).content;
    const text = ((raw||{}).parts||[]).map(p=>p.text||'').join('').trim();
    if(!text) return null;
    let s = text.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
    try{ return JSON.parse(s); }
    catch(e){
      const a = s.indexOf('{'), b = s.lastIndexOf('}');
      if(a>=0 && b>a){ try{ return JSON.parse(s.slice(a,b+1)); }catch(_){} }
      return { reply: s };                     // prose is still an answer
    }
  },

  handleError(e){
    const code = (e && e.code) || 'unknown';
    const M = {
      not_configured:      TB_L('Gemini chưa được cấu hình.','Gemini is not configured.'),
      rate_limited:        TB_L('Gemini đang quá tải, thử lại sau một chút nhé.','Gemini is rate limited — try again shortly.'),
      upstream_error:      TB_L('Gemini trả về lỗi.','Gemini returned an error.'),
      upstream_unreachable:TB_L('Không kết nối được tới Gemini.','Could not reach Gemini.'),
      no_key:              TB_L('Chưa có API key.','No API key set.'),
    };
    // Deliberately never surfaces the upstream body — it can name the key's
    // project or quota.
    return M[code] || TB_L('Hmm, tớ không gọi được Gemini lúc này.',"Hmm, I can't reach Gemini right now.");
  },

  async sendMessage(systemText, history, userText){
    const req = this.buildRequest(systemText, history, userText);
    if(await this.probeProxy()){
      const r = await fetch(AI_CONFIG.proxyUrl, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(req) });
      const j = await r.json().catch(()=>null);
      if(!r.ok || !j || !j.ok){ const e=new Error('proxy'); e.code=(j&&j.error)||'upstream_error'; throw e; }
      return this.parseResponse(j.data);
    }
    // Local mode. The key is this browser's, and Settings says so.
    const key = (aiSettings().apiKey||'').trim();
    if(!key){ const e=new Error('nokey'); e.code='no_key'; throw e; }
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/'
      + encodeURIComponent(req.model) + ':generateContent';
    let r;
    try{
      r = await fetch(url, { method:'POST',
        headers:{'Content-Type':'application/json','x-goog-api-key':key},
        body: JSON.stringify({ contents:req.contents, systemInstruction:req.systemInstruction,
                               generationConfig:req.generationConfig }) });
    }catch(err){ const e=new Error('net'); e.code='upstream_unreachable'; throw e; }
    if(!r.ok){ const e=new Error('api'); e.code = r.status===429?'rate_limited':'upstream_error'; throw e; }
    return this.parseResponse(await r.json());
  },

  async testConnection(){
    try{
      const out = await this.sendMessage(
        'Reply with JSON only: {"reply":"ok"}', [], 'ping');
      return { ok: !!out, via: this.proxyReady ? 'proxy' : 'local' };
    }catch(e){ return { ok:false, message:this.handleError(e) }; }
  },
};

/* The only things Gemini is allowed to ask for. It can name an action from
   this list and nothing else: it never writes to STATE, never runs code, and
   every proposal is shape-checked below before it reaches the app. */
const AI_ACTIONS = {
  CREATE_TASK:       { destructive:false, needs:['title'] },
  UPDATE_TASK:       { destructive:false, needs:['id'] },
  COMPLETE_TASK:     { destructive:false, needs:['id'] },
  DELETE_TASK:       { destructive:true,  needs:['id'] },
  CREATE_NOTE:       { destructive:false, needs:['title'] },
  UPDATE_NOTE:       { destructive:false, needs:['id'] },
  OPEN_TASK:         { destructive:false, needs:['id'] },
  OPEN_PROJECT:      { destructive:false, needs:['id'] },
  OPEN_NOTE:         { destructive:false, needs:['id'] },
  OPEN_CALENDAR:     { destructive:false, needs:[] },
  START_FOCUS:       { destructive:false, needs:[] },
  SHOW_NOTIFICATIONS:{ destructive:false, needs:[] },
};
/** TASK_PRIORITIES is a list of [value, label] PAIRS, not plain strings —
 *  `.includes("Cao")` on it is always false, which silently dropped every
 *  priority. Compare against the values. */
function aiValidPriority(p){
  return !!p && TASK_PRIORITIES.some(x => (Array.isArray(x) ? x[0] : x) === p);
}
/** Shape-check an action before it is allowed anywhere near STATE.
 *  Anything not on the list, or missing a field, or naming a record that does
 *  not exist, is refused — the model cannot invent an id into existence. */
function validateAIAction(a){
  if(!a || typeof a !== 'object') return { ok:false, why:'no action' };
  const def = AI_ACTIONS[a.type];
  if(!def) return { ok:false, why:'unknown action '+a.type };
  const p = a.payload || {};
  for(const f of def.needs) if(!p[f]) return { ok:false, why:'missing '+f };
  if(p.id){
    const known =
      /TASK/.test(a.type)    ? STATE.tasks.some(t=>t.id===p.id) :
      /NOTE/.test(a.type)    ? (STATE.notes||[]).some(n=>n.id===p.id) :
      /PROJECT/.test(a.type) ? STATE.projects.some(x=>x.id===p.id) : true;
    if(!known) return { ok:false, why:'unknown id' };
  }
  if(p.title != null && String(p.title).trim().length < 1) return { ok:false, why:'empty title' };
  return { ok:true, destructive:def.destructive };
}
/** The one thing worth doing next: overdue first, then due soonest, then
 *  whatever is already furthest along — finishing beats starting. */
function aiPickNextTask(){
  const open = activeTasks().filter(t=> t.status!=='Hoàn thành' && !isFrozen(t));
  if(!open.length) return null;
  const score = (t)=>{
    let s = 0;
    if(isOverdue(t)) s += 1000;
    if(isSameDay(t.deadline)) s += 600;
    if(/ASAP/i.test(t.priority||'')) s += 400;
    if(/Cao/i.test(t.priority||'')) s += 250;
    if(t.deadline){
      const days = (new Date(t.deadline) - new Date())/86400000;
      s += Math.max(0, 200 - days*20);
    }
    s += computeCompletion(t) * 1.2;      // nearly-done work first
    if(t.pinned) s += 150;
    return s;
  };
  return open.slice().sort((a,b)=> score(b)-score(a))[0];
}
/** Run a validated action through the EXISTING Bach Office functions. No new
 *  task or note system — this only calls what the app already does. */
function executeAIAction(a){
  const v = validateAIAction(a);
  if(!v.ok) return { ok:false, message:v.why };
  const p = a.payload || {};
  const findTask = ()=> STATE.tasks.find(t=>t.id===p.id);
  switch(a.type){
    // Every one of these calls the function the app already uses. addTask()
    // resolves the work group and persists on its own — a parallel creation
    // path here would drift from the real one.
    case 'CREATE_TASK': {
      const okDate = (v)=>{ const d = v ? new Date(v) : null; return (d && !isNaN(d)) ? d.toISOString() : null; };
      const t = addTask({
        title: String(p.title).slice(0,200),
        deadline: okDate(p.dueDate),
        start: okDate(p.start),
        priority: aiValidPriority(p.priority) ? p.priority : 'Trung bình',
        status: TASK_STATUSES.includes(p.status) ? p.status : 'Cần làm',
        projectId: (p.projectId && STATE.projects.some(x=>x.id===p.projectId)) ? p.projectId : null,
        assigneeId: STATE.currentUserId,
      });
      return { ok:true, task:t, message:TB_L(`Đã thêm “${t.title}”.`, `Added “${t.title}”.`) };
    }
    case 'UPDATE_TASK': {
      const t = findTask(); if(!t) return { ok:false, message:'not found' };
      const patch = {};
      if(p.title) patch.title = String(p.title).slice(0,200);
      if(p.dueDate){ const d = new Date(p.dueDate); if(!isNaN(d)) patch.deadline = d.toISOString(); }
      if(aiValidPriority(p.priority)) patch.priority = p.priority;
      if(p.status && TASK_STATUSES.includes(p.status)) patch.status = p.status;
      if(!Object.keys(patch).length) return { ok:false, message:'nothing to change' };
      updateTask(t.id, patch, TB_L('AI cập nhật','Updated by AI'));
      return { ok:true, task:t, message:TB_L('Đã cập nhật.','Updated.') };
    }
    case 'COMPLETE_TASK': {
      const t = findTask(); if(!t) return { ok:false, message:'not found' };
      updateTask(t.id, { status:'Hoàn thành', completedAt: nowISO() }, TB_L('AI đánh dấu xong','Completed by AI'));
      return { ok:true, task:t, message:TB_L(`Xong “${t.title}”.`, `Marked “${t.title}” done.`) };
    }
    case 'DELETE_TASK': {
      const t = findTask(); if(!t) return { ok:false, message:'not found' };
      STATE.tasks = STATE.tasks.filter(x=>x.id!==p.id); persist();
      return { ok:true, message:TB_L(`Đã xoá “${t.title}”.`, `Deleted “${t.title}”.`) };
    }
    case 'CREATE_NOTE': {
      const mk = (typeof createNote === 'function') ? createNote
               : (typeof addNote === 'function')    ? addNote : null;
      if(!mk) return { ok:false, message:TB_L('Chưa mở được hệ thống ghi chú.','Notes system unavailable.') };
      const n = mk({ title:String(p.title).slice(0,200), content:String(p.content||'') });
      if(p.taskId && STATE.tasks.some(t=>t.id===p.taskId) && typeof linkNoteToTask === 'function'){
        try{ linkNoteToTask(n.id, p.taskId); }catch(e){}
      }
      persist();
      return { ok:true, note:n, message:TB_L(`Đã tạo ghi chú “${n.title}”.`, `Created note “${n.title}”.`) };
    }
    case 'UPDATE_NOTE': {
      const n = (STATE.notes||[]).find(x=>x.id===p.id); if(!n) return { ok:false, message:'not found' };
      if(p.title) n.title = String(p.title).slice(0,200);
      if(p.content != null) n.content = String(p.content);
      n.updatedAt = nowISO(); persist();
      return { ok:true, note:n, message:TB_L('Đã cập nhật ghi chú.','Note updated.') };
    }
    case 'OPEN_TASK':    openTaskModal(p.id); return { ok:true };
    case 'OPEN_PROJECT': VIEW='projects'; render();
                         if(typeof openProjectDetail==='function') openProjectDetail(p.id);
                         return { ok:true };
    case 'OPEN_NOTE':    if(typeof openNote==='function') openNote(p.id);
                         return { ok:true };
    case 'OPEN_CALENDAR':VIEW='calendar'; render(); return { ok:true };
    case 'START_FOCUS':  { const t = p.id ? findTask() : aiPickNextTask();
                           if(!t) return { ok:false, message:TB_L('Không có việc nào để tập trung.','Nothing to focus on.') };
                           toggleTimer(t.id); return { ok:true, task:t }; }
    case 'SHOW_NOTIFICATIONS': VIEW='notifications'; render(); return { ok:true };
  }
  return { ok:false, message:'unhandled' };
}

/* =========================================================
   TOBBY — the rig, and the three layers that drive it
   ---------------------------------------------------------
   Rebuilt from Tobby_Animated.glb. Two rules shape this file:

   1. NOTHING about the rig is hard-coded. The outfits, the face variants and
      the bowl are all discovered by reading node names at load time, using
      the conventions the model itself ships:

         wear_<item>__<bone>   one attachment group, hidden at scale 0
         eyevar_<variant>.L/R  one eye shape, siblings under eye.L / eye.R
         mouthvar_<variant>    one mouth shape, siblings under mouth
         bowl_root/bowl_food   the bowl, and the container its dinner goes in

      Add an outfit to the .glb and it appears here with no code change.

   2. Animation is LAYERED, not a single slot. The old build kept one clip in
      one variable and re-asserted it every frame, which meant the eating clip
      was overwritten by the walk cycle about two milliseconds after it
      started, and editing a task mid-meal threw him out of it. Layers make
      that class of bug impossible to write:

         base     looping posture — idle, sit, walk, run, sleep, working
         action   one-shot and exclusive — eat, celebrate, evolve, jump.
                  Holds for its own duration; base changes queue behind it.
         overlay  additive and cheap — blink, glances. Never cancels anything.

   The face is set independently of all three, so he can be worried WHILE
   walking — impossible before, because expression lived inside the clips.
   ========================================================= */
const TOBBY_GLB_URL = 'assets/tobby/Tobby_Animated.glb';
/* The three-quarter view: enough angle to read as a solid object, not so much
   that he looks away. Distance is computed from his measured size, not fixed,
   because a growth stage changes how big he is. */
const TB_VIEW_DIR = [0.30, 0.42, 1.00];
const TB_CORNER_PAD = 14;       // how far his corner sits from the window edge
/* Distance multiplier on the bounding-sphere fit. The sphere circumscribes the
   corners of his box, which are never his widest part on screen, so fitting it
   exactly leaves him using barely half a 76px viewport. Backing off fills about
   three quarters of it with margin still to spare. */
const TB_FRAME_FIT = 0.86;      // a sphere circumscribes corners; this trims it
const TB_FRAME_MAX = 0.99;      // how far out the furthest corner may sit
/* Where his paws land, in normalised device coordinates. Not quite -1: a few
   pixels of air stop him looking sawn off at the edge of his own canvas. */
const TB_FEET_NDC = -0.94;

const TobbyRig = {
  ready:false, failed:false, loading:false,
  THREE:null, renderer:null, scene:null, camera:null, root:null, mixer:null,
  container:null, clips:{},
  /* discovered at load — see scan() */
  wear:{}, slots:{}, face:{ eye:{}, mouth:{} }, bowl:{}, bones:{},

  supported(){
    try{
      const c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
    }catch(e){ return false; }
  },

  async init(container){
    if(this.ready || this.loading || this.failed || !container) return this.ready;
    if(!this.supported()){ this.failed = true; return false; }
    this.loading = true;
    try{
      const T = await import('three');
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
      this.THREE = T;
      const gltf = await new Promise((res, rej)=>
        new GLTFLoader().load(TOBBY_GLB_URL, res, undefined, rej));

      this.container = container;
      this.root = gltf.scene;
      this.scene = new T.Scene();
      this.scene.add(this.root);
      this.mixer = new T.AnimationMixer(this.root);
      gltf.animations.forEach(c=>{ this.clips[c.name] = c; });

      this.camera = new T.PerspectiveCamera(30, 1, 0.05, 12);
      this.camera.position.set(0.30, 0.55, 1.02);
      this.camera.lookAt(0, 0.25, 0);
      this.scene.add(new T.HemisphereLight(0xF2F6FF, 0x4A3826, 1.15));
      const key  = new T.DirectionalLight(0xFFF3E2, 1.35); key.position.set(1.4, 2.0, 1.6);
      const fill = new T.DirectionalLight(0xCFE2FF, 0.42); fill.position.set(-1.4, 0.6, 0.9);
      const rim  = new T.DirectionalLight(0x8FD4FF, 0.75); rim.position.set(-0.6, 1.0, -1.8);
      this.scene.add(key, fill, rim);

      this.renderer = new T.WebGLRenderer({ alpha:true, antialias:true, powerPreference:'low-power' });
      this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      this.renderer.setClearAlpha(0);
      container.appendChild(this.renderer.domElement);
      Object.assign(this.renderer.domElement.style, { width:'100%', height:'100%', display:'block' });

      this.scan();
      this.resize();
      this.ready = true; this.loading = false;
      return true;
    }catch(err){
      // A character that fails to arrive must never take the app with it.
      console.warn('[TobbyRig] load failed:', err && err.message);
      this.failed = true; this.loading = false;
      return false;
    }
  },

  /** Read the rig's own structure. Everything the rest of Tobby knows about
   *  outfits, expressions and the bowl comes from here — nothing is listed
   *  twice, so the model stays the single source of truth. */
  scan(){
    const wear = {}, slots = {}, eye = {}, mouth = {}, bones = {}, floof = [];
    // GLTFLoader sanitises node names on import and DOTS DO NOT SURVIVE it:
    // the file's `eyevar_open.L` arrives as `eyevar_openL`, `tail.01` as
    // `tail01`, `forearm.L` as `forearmL`. Every pattern below has to match
    // the sanitised form, not what the .glb literally contains — matching the
    // file's spelling silently found nothing, which is exactly how the eye
    // variants came back empty the first time.
    const BONE = /^(ROOT|pelvis|spine|chest|neck|head|jaw|tail\d*|thigh[LR]?|shin[LR]?|forearm[LR]?|paw|ear[LR])$/;
    this.root.traverse(o=>{
      const n = o.name || '';
      if(/^floof/.test(n)) floof.push(o);
      // wear_<item>__<bone>: one attachment group per item per bone. An item
      // like the santa suit owns five of these (hat, collar, two sleeves,
      // body) and they all have to move together.
      let m = n.match(/^wear_(.+?)__(.+)$/);
      if(m){
        const item = m[1], bone = m[2];
        (wear[item] = wear[item] || []).push(o);
        // The slot is the bone, except that sleeves belong to whatever is
        // being worn on the body — nobody wears sleeves on their own.
        const slot = /^forearm/.test(bone) ? 'spine' : bone;
        (slots[slot] = slots[slot] || new Set()).add(item);
        return;
      }
      m = n.match(/^eyevar_(.+?)\.?[LR]$/);  if(m){ (eye[m[1]]   = eye[m[1]]   || []).push(o); return; }
      m = n.match(/^mouthvar_(.+)$/);         if(m){ (mouth[m[1]] = mouth[m[1]] || []).push(o); return; }
      if(BONE.test(n)) bones[n] = o;
    });
    this.floof = floof;
    /* The model carries a contract in its own extras: the five stage names,
       which knobs a stage turns, the wardrobe slots, the Vietnamese item
       names, and a table of particle events with timings per clip. Reading it
       means the app follows the rig rather than a second copy of the same
       facts kept here — and I had been guessing at several of them. */
    const holder = this.root.getObjectByName('Tobby') || this.root;
    this.spec = (holder.userData && holder.userData.bachOffice) || null;
    this.wear  = wear;
    // Slots as the rig defines them. Deriving them from the attachment bones
    // was close but wrong in one telling way: it filed glasses under `head`
    // with the hats, so wearing a hat took his glasses off. The rig gives
    // eyes their own slot, which is obviously right.
    const specSlots = this.spec && this.spec.wardrobe && this.spec.wardrobe.slots;
    this.slots = specSlots
      ? Object.fromEntries(Object.entries(specSlots).map(([k,v])=>[k, v.filter(x=> wear[x])]))
      : Object.fromEntries(Object.entries(slots).map(([k,v])=>[k, [...v].sort()]));
    this.face  = { eye, mouth };
    this.bones = bones;
    this.bowl  = {
      root: this.root.getObjectByName('bowl_root'),
      food: this.root.getObjectByName('bowl_food'),
      prop: this.root.getObjectByName('prop_bowl'),
      rigKibble: [],
    };
    this.root.traverse(o=>{ if(o.isMesh && /^food_kibble/.test(o.name)) this.bowl.rigKibble.push(o); });
    return this;
  },

  /* ---------- wearables ---------- */
  /** Show exactly these items and hide every other. Hidden is scale 0, which
   *  is how the model itself ships them, so nothing here invents a convention
   *  the artist did not already use. */
  setWorn(items){
    if(!this.ready) return false;
    const on = new Set(items || []);
    for(const [item, groups] of Object.entries(this.wear)){
      const s = on.has(item) ? 1 : 0;
      groups.forEach(g=> g.scale.setScalar(s));
    }
    return true;
  },
  /** Items that can be worn at the same time: one per slot. */
  conflictsWith(item){
    const out = [];
    for(const [slot, list] of Object.entries(this.slots)){
      if(list.includes(item)) out.push(...list.filter(x=>x!==item));
    }
    return [...new Set(out)];
  },

  /* ---------- face ---------- */
  /** Expression, independent of whatever the body is doing. Five eye shapes
   *  by five mouth shapes is twenty-five faces, none of which needs its own
   *  animation clip. */
  wantEye:'open', wantMouth:'smile', blinkUntil:0,
  setFace(eye, mouth){
    if(!this.ready) return false;
    if(eye)   this.wantEye = eye;
    if(mouth) this.wantMouth = mouth;
    this.applyFace();
    return !!(this.face.eye[this.wantEye] && this.face.mouth[this.wantMouth]);
  },
  /** Write the chosen face onto the rig. Called every frame after the mixer,
   *  because the clips animate these same scales and would otherwise win. */
  applyFace(){
    if(!this.ready) return;
    const eye = performance.now() < this.blinkUntil ? 'closed' : this.wantEye;
    const one = (group, want)=>{
      if(!group[want]) return;
      for(const [k, nodes] of Object.entries(group)) nodes.forEach(n=> n.scale.setScalar(k===want ? 1 : 0));
    };
    one(this.face.eye, eye);
    one(this.face.mouth, this.wantMouth);
  },
  /** A blink is now a hundred milliseconds of closed eyes, not a whole clip —
   *  the clip version cannot survive the face being re-asserted each frame. */
  blink(ms){ this.blinkUntil = performance.now() + (ms || 120); },

  /** Just the dog: his props are not him.
   *
   *  bowl_root stands in front of him and prop_workstation behind, and both
   *  are in the model whether or not they are being shown — measuring the
   *  whole scene put the framing 0.68 units deep instead of his own 0.40 and
   *  pushed him two frustums wide. Box3.setFromObject does not skip invisible
   *  children either, so hiding the bowl is not enough. */
  /** His silhouette, measured ONCE and held.
   *
   *  Framing from the live pose meant the camera depended on which frame of
   *  which clip happened to be showing when it was computed — reframing just
   *  after a meal, while he was still uncurling from the crouch, aimed at the
   *  crouch and left a dozen blank rows under him once he stood up. The shape
   *  is cached in model units and rescaled with the growth stage, so the camera
   *  is steady and a stage change still re-aims correctly. */
  frameBox(){
    const T = this.THREE;
    const s = this.root.scale.x || 1;
    if(!this._restBox){
      const b = this.bodyBox(true);          // ignore the bowl for the cache
      if(b.isEmpty()) return b;
      this._restBox = { min:b.min.clone().divideScalar(s), max:b.max.clone().divideScalar(s) };
    }
    const box = new T.Box3(this._restBox.min.clone().multiplyScalar(s),
                           this._restBox.max.clone().multiplyScalar(s));
    // The bowl counts only while it is out, and it moves with the clips, so it
    // is measured live rather than cached.
    if(this.bowl.root && this.bowl.root.visible){
      this.root.updateMatrixWorld(true);
      box.union(new T.Box3().setFromObject(this.bowl.root));
    }
    return box;
  },

  bodyBox(dogOnly){
    const T = this.THREE, box = new T.Box3();
    // The bowl counts WHEN IT IS OUT. It stands on the floor in front of him,
    // so framing him alone put it entirely below the bottom of the frame —
    // NDC -2.08 to -1.01, not a pixel of it on screen. He played the eating
    // clip into thin air, which is exactly what "the eat rig doesn't work"
    // looks like from outside.
    //
    // prop_workstation deliberately does not count: it is scale-keyed by the
    // clips themselves, so including it would jog the camera on every change
    // between working and not.
    const skip = o=>{
      let p = o;
      while(p){
        if(p.name === 'prop_workstation') return true;
        if(p.name === 'bowl_root') return dogOnly ? true : !p.visible;
        p = p.parent;
      }
      return false;
    };
    this.root.updateMatrixWorld(true);
    this.root.traverse(o=>{
      if(!o.isMesh || !o.geometry || !o.visible || skip(o)) return;
      o.geometry.computeBoundingBox();
      box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
    });
    return box;
  },

  /** Point the camera at whatever size he currently is.
   *
   *  The old numbers were a fixed position tuned for a different rig at a
   *  different scale, so on this one his feet fell below the bottom of the
   *  frame (projected to y -1.21 against a -1..1 frustum) — and they moved
   *  again with every growth stage, because a stage changes his size. Framing
   *  from his measured bounds means it is right for every stage and every
   *  viewport shape without a table of magic numbers. */
  frame(){
    if(!this.ready && !this.camera) return;
    const T = this.THREE;
    const box = this.frameBox();
    if(box.isEmpty()) return;
    const centre = box.getCenter(new T.Vector3());
    const radius = box.getSize(new T.Vector3()).length() * 0.5;
    const a = this.camera.aspect || 1;
    const vr = (this.camera.fov * Math.PI/180) / 2;
    const hr = Math.atan(Math.tan(vr) * a);
    const dir = new T.Vector3(TB_VIEW_DIR[0], TB_VIEW_DIR[1], TB_VIEW_DIR[2]).normalize();
    const cx = (box.min.x + box.max.x) / 2, cz = (box.min.z + box.max.z) / 2;
    const corners = [];
    for(const x of [box.min.x, box.max.x])
      for(const y of [box.min.y, box.max.y])
        for(const z of [box.min.z, box.max.z]) corners.push(new T.Vector3(x,y,z));

    // Two things have to be true at once: his paws sit ON the bottom of the
    // frame, and nothing sticks out of it. Neither has a closed form worth
    // deriving, so both are measured — but they must not be allowed to chase
    // each other. `shift` is absolute, re-derived from the box centre on every
    // pass rather than accumulated, and clamped: letting it drift while the
    // distance was also changing sent the camera off into the far distance,
    // still satisfying the feet rule perfectly with a dog one pixel across.
    //
    // A bounding-sphere fit alone is not enough either. When the bowl is out it
    // stands well in front of him and close to the camera, so it projects far
    // larger than its size suggests — the sphere called it framed while it was
    // a frame and a half off to the left.
    const aim = (d, shift)=>{
      const target = centre.clone(); target.y += shift;
      this.camera.position.copy(target).add(dir.clone().multiplyScalar(d));
      this.camera.lookAt(target);
      this.camera.updateMatrixWorld(true);
      this.camera.updateProjectionMatrix();
    };
    /* Bias the aim so the floor line lands where we want it, at a FIXED
       distance. Distance is held still on purpose: the world shift needed for
       a given pixel shift scales with distance, so letting the two adjust each
       other is a positive feedback loop — it walked the camera out to three
       units from a dog less than half a unit tall, still satisfying the feet
       rule perfectly with nothing visible. */
    /* "Feet" means the LOWEST THING ON SCREEN, not the middle of his underside.
       Those are not the same point: the near-bottom corner of his box projects
       noticeably lower than its centre under a three-quarter view, so aiming by
       the centre always left something below the line — and the fit correction
       then doubled the camera distance trying to pull it back in. Driving the
       lowest projected corner means the two rules agree instead of fighting. */
    const lowest = ()=>{
      let lo = Infinity;
      for(const c of corners) lo = Math.min(lo, c.clone().project(this.camera).y);
      return lo;
    };
    const settle = (d)=>{
      let shift = 0;
      for(let i = 0; i < 5; i++){
        aim(d, shift);
        const err = lowest() - TB_FEET_NDC;
        if(Math.abs(err) < 0.004) break;
        shift += err * d * Math.tan(vr);
      }
      this._shift = shift;              // the pixel pass below refines this
      let worst = 0;
      for(const c of corners){
        const p = c.clone().project(this.camera);
        worst = Math.max(worst, Math.abs(p.x), Math.abs(p.y));
      }
      return worst;
    };

    // A sphere fit alone is not enough when the bowl is out: it stands in front
    // of him and close to the camera, so it projects far larger than its size
    // suggests, and the sphere called it framed while it was a frame and a half
    // off to the left. So fit, then correct ONCE against the real corners.
    /* Fit to the size he will EVENTUALLY be, not the size he is now.
       Fitting each stage to the frame made the camera undo the growth as fast
       as it happened: a puppy was pulled in close and an adult pushed back, so
       all five stages filled the dock identically and the only visible
       difference between a newborn and a grown dog was the shape of his ears.
       Holding the distance at the last stage's reach means a puppy really is
       small in his corner and really does grow into it.

       The bowl is the exception and is allowed to push further out: it stands
       in front of him, close to the camera, and would otherwise hang off the
       side of the frame. It never pulls the camera IN. */
    const stageMax = (typeof TOBBY_STAGES !== 'undefined')
      ? TOBBY_STAGES.reduce((m,x)=> Math.max(m, x.size), 0) : 0;
    let fitRadius = radius;
    if(this._restBox && stageMax){
      const rest = new T.Box3(this._restBox.min.clone(), this._restBox.max.clone());
      fitRadius = Math.max(radius, rest.getSize(new T.Vector3()).length() * 0.5 * stageMax);
    }
    let d = Math.max(fitRadius/Math.sin(vr), fitRadius/Math.sin(hr)) * TB_FRAME_FIT;
    let worst = settle(d);
    if(worst > TB_FRAME_MAX){ d = d * worst / TB_FRAME_MAX; settle(d); }

    /* Last, put the lowest PIXEL on the line rather than the lowest corner of
       his bounding box. A box is a cuboid and he is a dog: its bottom corners
       are empty air beside his paws, so aiming by them still left a dozen blank
       rows under him in an 88px viewport — which is exactly the gap that reads
       as "his feet are missing". One readback settles it exactly, and this runs
       only when he changes size or the bowl comes out, not per frame. */
    if(this.renderer && this.container){
      this.renderer.render(this.scene, this.camera);
      const c = this.renderer.domElement, gl = this.renderer.getContext();
      const px = new Uint8Array(c.width * c.height * 4);
      gl.readPixels(0, 0, c.width, c.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
      let lowRow = -1;
      for(let r = 0; r < c.height && lowRow < 0; r++)
        for(let col = 0; col < c.width; col++)
          if(px[(r*c.width + col)*4 + 3] > 16){ lowRow = r; break; }
      if(lowRow > 0){
        const ndcY = (lowRow + 0.5) / c.height * 2 - 1;   // row 0 is the bottom
        const err = ndcY - TB_FEET_NDC;
        if(Math.abs(err) > 0.004) aim(d, this._shift + err * d * Math.tan(vr));
      }
    }
  },

  resize(){
    if(!this.renderer || !this.container) return;
    const r = this.container.getBoundingClientRect();
    const w = Math.max(1, r.width), h = Math.max(1, r.height);
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w/h;
    this.camera.updateProjectionMatrix();
    this.frame();          // the aspect is only knowable once it is in the DOM
  },
  render(){ if(this.ready) this.renderer.render(this.scene, this.camera); },
};

/* ---------------------------------------------------------
   The three layers.
   --------------------------------------------------------- */
/** Clips that play once and hold, rather than looping. */
const TB_ONCE = new Set([
  'Tobby_Happy','Tobby_Excited','Tobby_Surprised','Tobby_Jump','Tobby_Celebrate',
  'Tobby_LevelUp','Tobby_Evolution','Tobby_TaskCompleted','Tobby_WakeUp',
  'Tobby_Yawn','Tobby_Stretch','Tobby_Play','Tobby_Blink','Tobby_Stand',
  'Tobby_LookAround','Tobby_LookAtUser','Tobby_LookAtNotification',
  'Tobby_UrgentNotification','Tobby_Angry','Tobby_Proud','Tobby_Typing',
]);

const TobbyAnim = {
  baseName:null, baseAction:null,
  actionName:null, actionAction:null, actionUntil:0, queuedBase:null,
  overlays:[],
  last:0, raf:0,

  _clip(name){ return TobbyRig.ready ? TobbyRig.clips[name] : null; },
  _act(name){
    const c = this._clip(name);
    if(!c) return null;
    const T = TobbyRig.THREE;
    const a = TobbyRig.mixer.clipAction(c);
    const once = TB_ONCE.has(name);
    a.setLoop(once ? T.LoopOnce : T.LoopRepeat, once ? 1 : Infinity);
    a.clampWhenFinished = once;
    return a;
  },

  /** The looping posture. Ignored while an action owns the body — the request
   *  is remembered and applied when the action ends, so a walk asked for
   *  mid-meal starts when the meal finishes instead of interrupting it. */
  setBase(name, fade){
    if(!TobbyRig.ready || !this._clip(name)) return false;
    if(this.actionName){ this.queuedBase = name; return true; }
    if(this.baseName === name) return true;
    const next = this._act(name);
    next.reset().setEffectiveWeight(1).play();
    if(this.baseAction && this.baseAction !== next) this.baseAction.crossFadeTo(next, fade == null ? 0.25 : fade, false);
    this.baseAction = next; this.baseName = name;
    return true;
  },

  /** A one-shot that owns the body for `ms`. Nothing short of another action
   *  can take it away — this is what the meal needed and never had. */
  playAction(name, ms){
    if(!TobbyRig.ready || !this._clip(name)) return false;
    const a = this._act(name);
    a.reset().setEffectiveWeight(1).play();
    if(this.baseAction) this.baseAction.crossFadeTo(a, 0.18, false);
    else if(this.actionAction) this.actionAction.crossFadeTo(a, 0.18, false);
    this.actionAction = a; this.actionName = name;
    const clip = this._clip(name);
    this.actionUntil = performance.now() + (ms || clip.duration*1000 || 1000);
    return true;
  },
  endAction(){
    if(!this.actionName) return;
    this.actionName = null; this.actionUntil = 0;
    const back = this.queuedBase || this.baseName || 'Tobby_Idle';
    this.queuedBase = null;
    const prev = this.actionAction;
    this.baseName = null;                       // force a real crossfade back
    this.setBase(back, 0.28);
    if(prev && this.baseAction) prev.crossFadeTo(this.baseAction, 0.28, false);
    this.actionAction = null;
  },

  /** Genuinely additive — not merely weak.
   *
   *  Blending an overlay at partial weight does not layer it, it AVERAGES it
   *  with the base, and every clip in this rig keys every prop. A blink at
   *  weight 0.5 therefore dragged prop_workstation halfway back to zero and
   *  left the desk hovering at half scale during Working. Making the clip
   *  additive turns it into a delta on top of whatever the base is doing,
   *  which is what an overlay was always supposed to be. */
  _additive:{},
  playOverlay(name, weight){
    if(!TobbyRig.ready || !this._clip(name)) return false;
    const T = TobbyRig.THREE;
    let clip = this._additive[name];
    if(!clip){
      clip = this._clip(name).clone();
      T.AnimationUtils.makeClipAdditive(clip);
      clip.name = name + '__additive';
      this._additive[name] = clip;
    }
    const a = TobbyRig.mixer.clipAction(clip);
    a.blendMode = T.AdditiveAnimationBlendMode;
    a.setLoop(T.LoopOnce, 1);
    a.clampWhenFinished = false;
    a.reset();
    a.setEffectiveWeight(weight == null ? 0.6 : weight);
    a.play();
    this.overlays.push({ a, until: performance.now() + clip.duration*1000 });
    return true;
  },

  update(now){
    if(!TobbyRig.ready) return;
    const dt = Math.min(0.1, (now - (this.last||now))/1000);
    this.last = now;
    TobbyRig.mixer.update(dt);
    this.fireClipEvents();
    // AFTER the mixer, every frame. The clips key eyevar/mouthvar scale
    // themselves, so a face set once is overwritten on the next update — which
    // is why the chosen expression silently vanished the moment any clip with
    // face keys took over. Re-asserting here is what makes the face genuinely
    // independent of what the body is doing.
    TobbyRig.applyFace();
    if(this.actionName && now >= this.actionUntil) this.endAction();
    this.overlays = this.overlays.filter(o=>{
      if(now < o.until) return true;
      o.a.stop();
      return false;
    });
    TobbyRig.render();
  },

  /** Fire the rig's own effect table against the clip that is running.
   *
   *  Tracked per action so a looping clip fires again each time round, and so
   *  a clip restarted from the top does not skip its first beat. */
  _fxSeen:{},
  fireClipEvents(){
    const spec = TobbyRig.spec && TobbyRig.spec.events;
    if(!spec) return;
    const a = this.actionAction || this.baseAction;
    const name = this.actionName || this.baseName;
    if(!a || !name || !spec[name]) return;
    const dur = a._clip ? a._clip.duration : 0;
    // Do not wrap a clip that plays once and holds. Tobby_Evolution is exactly
    // 4.0s long and its last beat is AT 4.0 — the modulo turned that into 0 and
    // the settle never fired, so the evolution ended on the transformation with
    // nothing to close it.
    const loops = dur && !TB_ONCE.has(name);
    const now = loops ? (a.time % dur) : a.time;
    const seen = this._fxSeen[name] || (this._fxSeen[name] = { last: -1 });
    if(now < seen.last) seen.last = -1;              // the clip looped round
    for(const ev of spec[name]){
      if(ev.t > seen.last && ev.t <= now){
        try{ tobbyFx(ev.e); }catch(e){}
      }
    }
    seen.last = now;
  },

  start(){
    if(this.raf) return;
    const loop = (ts)=>{
      this.raf = requestAnimationFrame(loop);
      this.update(ts);
      try{ TobbyBrain.tick(ts); }catch(e){}
    };
    this.raf = requestAnimationFrame(loop);
  },
  stop(){ if(this.raf) cancelAnimationFrame(this.raf); this.raf = 0; },
};
/* ---------------------------------------------------------
   What he does, and why.

   Every clip in the file is reachable from here. They are grouped the way the
   rig groups them, and each group talks to exactly one layer:

     CORE          base + overlay   how he is when nothing is happening
     MOVEMENT      base             going somewhere
     LIFE          base + action    sleeping, waking, stretching, playing
     PRODUCTIVITY  base + action    reacting to the board
     CELEBRATION   action           finishing something

   Emotion is a FACE, not a clip. That separation is the point: the old build
   spent a whole animation slot on 'worried', so he could not be worried while
   walking. Here the face is set independently and every combination is free.
   --------------------------------------------------------- */
const TB_FACE = {
  idle:      ['open',   'smile'],
  happy:     ['wide',   'smile'],
  excited:   ['wide',   'open' ],
  curious:   ['wide',   'flat' ],
  thinking:  ['half',   'flat' ],
  worried:   ['half',   'frown'],
  sad:       ['half',   'frown'],
  sleepy:    ['half',   'flat' ],
  sleeping:  ['closed', 'flat' ],
  surprised: ['wide',   'open' ],
  angry:     ['squint', 'frown'],
  proud:     ['squint', 'smile'],
  focused:   ['squint', 'flat' ],
  working:   ['open',   'flat' ],
  yawning:   ['closed', 'yawn' ],
};
/** Emotion -> the looping posture that carries it. */
const TB_MOOD_BASE = {
  idle:'Tobby_Idle', happy:'Tobby_Happy', excited:'Tobby_Excited',
  curious:'Tobby_Curious', thinking:'Tobby_Thinking', worried:'Tobby_Worried',
  sad:'Tobby_Sad', sleepy:'Tobby_Sleepy', sleeping:'Tobby_Sleep',
  angry:'Tobby_Angry', proud:'Tobby_Proud', focused:'Tobby_Focused',
  working:'Tobby_Working',
};
/** Ambient overlays — small signs of life, none of which may interrupt
 *  anything. Weighted so a blink during a meal reads as a blink and not as a
 *  glitch. */
const TB_AMBIENT = [
  { blink:true,              every:[3200, 7000] },
  { clip:'Tobby_LookAround', weight:0.6, every:[14000, 34000] },
  { clip:'Tobby_Breathe',    weight:0.4, every:[9000, 20000] },
];

/** Postures that are a JOB, not a feeling. A mood may not replace one of
 *  these — he can be worried while walking, but "worried" must not stop the
 *  walk. Everything outside this set is fair game for a mood to occupy. */
const TB_POSTURE = new Set([
  'Tobby_Walk','Tobby_Run','Tobby_Sleep','Tobby_Working','Tobby_Focused','Tobby_Sit',
]);

const TobbyBrain = {
  mood:'idle', moodUntil:0, ambientAt:{}, sleeping:false, x:null,

  /* ---------- CORE ---------- */
  /** Set how he feels. The face applies immediately and always; the posture
   *  only if nothing more important is running — which is why a worried face
   *  can arrive mid-walk without stopping the walk. */
  feel(mood, ms){
    if(!TobbyRig.ready) return false;
    const f = TB_FACE[mood] || TB_FACE.idle;
    TobbyRig.setFace(f[0], f[1]);
    this.mood = mood;
    // 0 means "hold until something else changes it". Writing `now + 0` made
    // every mood expire on the very next frame, which quietly undid the face
    // a few milliseconds after setting it.
    this.moodUntil = ms ? performance.now() + ms : 0;
    // The posture follows the mood ONLY when he is not otherwise occupied.
    // Walking, running, sleeping and working are things he is doing; being
    // worried is a way of doing them, not an alternative to them. Overriding
    // here is what made "worried" stop a walk — and the whole reason the face
    // was separated from the clips in the first place.
    const base = TB_MOOD_BASE[mood];
    const busy = TobbyAnim.actionName || this.moving || this.sleeping ||
                 TB_POSTURE.has(TobbyAnim.baseName);
    if(base && !busy) TobbyAnim.setBase(base);
    return true;
  },
  /** Back to whatever he would be feeling anyway, given the board. */
  relax(){
    if(this.sleeping) return this.feel('sleeping');
    this.feel(this.restingMood());
  },
  /** His resting face is the board's mood, not a random one. */
  restingMood(){
    try{
      const open = activeTasks().filter(t=> t.status!=='Hoàn thành' && !isFrozen(t));
      if(open.some(t=> isOverdue(t))) return 'worried';
      if(open.filter(t=> isSameDay(t.deadline)).length >= 3) return 'thinking';
    }catch(e){}
    return 'idle';
  },
  /** He looks where you are, but only while you are near him. */
  glanceAt(clientX){
    if(!TobbyRig.ready || this.sleeping || TobbyAnim.actionName) return;
    TobbyAnim.playOverlay('Tobby_LookAtUser', 0.55);
  },

  /* ---------- MOVEMENT ---------- */
  moving:false,
  /** Walk or run to a point on the bottom edge. Gait follows distance the way
   *  it would for a real animal: a few steps is a walk, across the room is a
   *  run. */
  goTo(x, done){
    const dock = document.getElementById('tobbyDock');
    if(!dock || !TobbyRig.ready) return false;
    const w = dock.offsetWidth || 76;
    const to = Math.max(6, Math.min(innerWidth - w - 6, x - w/2));
    const from = parseFloat(dock.style.left) || 0;
    const dist = Math.abs(to - from);
    if(dist < 8){ if(done) done(); return true; }
    const run = dist > 320;
    const secs = run ? Math.min(1.6, 0.5 + dist/700) : Math.min(2.0, 0.5 + dist/260);
    this.moving = true;
    this.face(to < from ? -1 : 1);
    TobbyAnim.setBase(run ? 'Tobby_Run' : 'Tobby_Walk');
    dock.style.transition = 'left ' + secs + 's cubic-bezier(.33,.02,.35,1)';
    dock.style.left = to + 'px';
    clearTimeout(this._moveTimer);
    this._moveTimer = setTimeout(()=>{
      dock.style.transition = '';
      this.moving = false;
      this.x = to;
      this.faceForward();
      this.relax();
      if(done) done();
    }, secs*1000 + 40);
    return true;
  },
  /** Turn the body in the scene rather than mirroring the element: flipping
   *  the element would flip his lighting with him and put the key light on
   *  the wrong side. */
  face(dir){
    if(!TobbyRig.ready) return;
    const dock = document.getElementById('tobbyDock');
    if(dock) dock.dataset.facing = dir < 0 ? 'left' : 'right';
    TobbyRig.root.rotation.y = dir < 0 ? -Math.PI/2 : Math.PI/2;
  },
  faceForward(){ if(TobbyRig.ready) TobbyRig.root.rotation.y = 0; },
  hop(){ TobbyAnim.playAction('Tobby_Jump'); },

  /* ---------- LIFE ---------- */
  sleep(){
    if(this.sleeping) return;
    this.sleeping = true;
    this.feel('sleepy', 1200);
    setTimeout(()=>{ if(this.sleeping){ TobbyAnim.setBase('Tobby_Sleep'); this.feel('sleeping'); } }, 1200);
  },
  wake(){
    if(!this.sleeping) return;
    this.sleeping = false;
    TobbyAnim.playAction('Tobby_WakeUp');
    setTimeout(()=> this.relax(), 2400);
  },
  yawn(){    this.feel('yawning', 1400); TobbyAnim.playAction('Tobby_Yawn'); },
  stretch(){ TobbyAnim.playAction('Tobby_Stretch'); },
  play(){    this.feel('excited', 1400); TobbyAnim.playAction('Tobby_Play');
             try{ tobbyBond(TB_BOND.PLAY, 'play'); }catch(e){} },

  /* ---------- PRODUCTIVITY ---------- */
  /** The desk is not managed here on purpose: prop_workstation is scale-keyed
   *  to 1 inside Working/Typing/Focused and to 0 everywhere else, so choosing
   *  the clip IS showing the desk. Anything this code did to the prop would be
   *  fighting the rig. */
  work(kind){
    if(kind === 'typing'){ this.feel('working'); TobbyAnim.playAction('Tobby_Typing', 1400); return; }
    if(kind === 'focused'){ this.feel('focused'); TobbyAnim.setBase('Tobby_Focused'); return; }
    this.feel('working'); TobbyAnim.setBase('Tobby_Working');
  },
  taskDone(){ this.feel('happy', 2000); TobbyAnim.playAction('Tobby_TaskCompleted'); },
  notice(urgent){
    if(this.sleeping) this.wake();
    if(urgent){ this.feel('surprised', 1800); TobbyAnim.playAction('Tobby_UrgentNotification'); }
    else TobbyAnim.playOverlay('Tobby_LookAtNotification', 0.7);
  },

  /* ---------- CELEBRATION ---------- */
  celebrate(){ this.feel('excited', 2400); TobbyAnim.playAction('Tobby_Celebrate'); },
  levelUp(){   this.feel('proud', 3000);   TobbyAnim.playAction('Tobby_LevelUp'); },
  evolve(){    this.feel('proud', 4200);   TobbyAnim.playAction('Tobby_Evolution'); },
  beProud(){   this.feel('proud', 2400);   TobbyAnim.setBase('Tobby_Proud'); },

  /** Where he was standing last time. Saved on arrival so a reload does not
   *  teleport him back to the corner. */
  /** Put him in his corner and stand him on the floor.
   *
   *  Always the bottom-right on open, never a remembered spot. Dragging moves
   *  him for as long as you are looking at the page and that is the whole of
   *  what it is for — persisting it meant one afternoon's experiment left him
   *  parked on the left for good, on a machine whose owner never chose that.
   *
   *  The floor is the bottom edge of the main content panel, not the bottom of
   *  the window: the panel is inset and rounded, so a dog aligned to the window
   *  hovers above the visible surface, which is precisely the gap by the
   *  rounded corner. Measured live, because that inset differs between the
   *  desktop rail and the mobile bar. */
  restorePlace(){
    const dock = document.getElementById('tobbyDock');
    if(!dock) return;
    const w = dock.offsetWidth || 76;
    dock.style.left = Math.max(6, innerWidth - w - TB_CORNER_PAD) + 'px';
    this.x = parseFloat(dock.style.left);
    // Older saves carry an x from when the spot was remembered. It is dead
    // data now and would only confuse the next person reading the state.
    if(STATE.tobby && STATE.tobby.x != null){ delete STATE.tobby.x; persist(); }

    const main = document.querySelector('.main') || document.getElementById('app');
    if(main){
      const floor = main.getBoundingClientRect().bottom;
      // His lowest pixel sits a hair above the dock's own bottom edge — that is
      // the air TB_FEET_NDC leaves — so the dock is dropped by exactly that
      // much to land the paws on the line rather than the box.
      const inset = (1 + TB_FEET_NDC) / 2 * (dock.offsetHeight || 88);
      dock.style.bottom = Math.max(0, Math.round(innerHeight - floor - inset)) + 'px';
    }
  },

  /* ---------- the ambient tick ---------- */
  /** Small signs of life on their own timers. Overlays only, so this can run
   *  during a meal or a walk without ever being the thing that breaks it. */
  tick(now){
    if(!TobbyRig.ready || document.hidden) return;
    if(this.moodUntil && now > this.moodUntil){ this.moodUntil = 0; this.relax(); }
    if(this.sleeping || this.moving) return;
    for(const a of TB_AMBIENT){
      const id = a.clip || 'blink';
      const next = this.ambientAt[id] || (this.ambientAt[id] = now + a.every[0]);
      if(now < next) continue;
      this.ambientAt[id] = now + a.every[0] + Math.random()*(a.every[1]-a.every[0]);
      // Blinking is allowed even mid-action — a dog that stops blinking to eat
      // looks stuffed. Everything else waits its turn.
      if(a.blink){ TobbyRig.blink(); continue; }
      if(!TobbyAnim.actionName) TobbyAnim.playOverlay(a.clip, a.weight);
    }
  },
};
/* ---------------------------------------------------------
   State. Small on purpose: everything else is read from the board or the rig.
   --------------------------------------------------------- */
function tobbyDefaults(){
  return {
    x:null, firstMetAt:nowISO(), ageDays:0, lastTick:Date.now(),
    stage:'tiny', worn:[], unlocked:['scarf'],
    bowl:{ kind:'empty', color:null, fedCount:0, lastFedAt:null },
    /* Growth is earned, not clocked. `xp` comes from finished work; `bond`
       from the relationship; `ageDays` is kept only so he can say how long he
       has known you, never to decide how grown he is. */
    xp:0, bond:0, bondLevel:1,
    stats:{ tasks:0, important:0, projects:0, goals:0, focusMinutes:0, reviews:0, days:0 },
    streak:{ days:0, lastDay:null },
    memories:[], milestones:[], lastSeenAt:nowISO(),
  };
}
function tobby(){
  if(!STATE.tobby || typeof STATE.tobby !== 'object') STATE.tobby = tobbyDefaults();
  const d = tobbyDefaults();
  Object.keys(d).forEach(k=>{ if(STATE.tobby[k] === undefined) STATE.tobby[k] = d[k]; });
  if(!STATE.tobby.bowl) STATE.tobby.bowl = d.bowl;
  if(!STATE.tobby.stats) STATE.tobby.stats = d.stats;
  if(!STATE.tobby.streak) STATE.tobby.streak = d.streak;
  if(!Array.isArray(STATE.tobby.memories)) STATE.tobby.memories = [];
  if(!Array.isArray(STATE.tobby.milestones)) STATE.tobby.milestones = [];
  return STATE.tobby;
}

/* =========================================================
   GROWING UP
   ---------------------------------------------------------
   The rig ships no per-stage meshes and does not key ROOT's scale, so a stage
   is a set of proportions applied to real bones — checked first that none of
   them has its scale animated, so this can be set once rather than fought for
   every frame the way the face has to be.

   Age is wall-clock. Thirty days away is thirty days older; no amount of
   finished work brings it forward, which is the whole point of a timeline.
   ========================================================= */
/* Five stages. The rig ships no per-stage meshes and does not key ROOT's
   scale, so a stage is a set of proportions on real bones plus how much of the
   coat has filled in — a puppy is mostly head and ears with no floof, and it
   narrows toward the adult's real proportions. `floof` is a fraction rather
   than a flag so the coat thickens gradually instead of appearing in one go. */
/* Five stages, named by the rig itself: its extras list
   evolutionStages = [Puppy, Baby, Young, Teen, Adult], in that order, and
   `rig` below is the name each of ours answers to.

   The rig also says WHICH knobs a stage turns — "uniform rig scale s,
   leg-chain scale leg (hip bones y-scale), ear bone scale earW/earL, head bone
   scale head, floof groups on/off" — but leaves the numbers to us. The leg
   chain is the one that matters most and the one I had been missing: without
   it a puppy is just a small adult, and the whole point of a stage is that the
   PROPORTIONS change. Short legs and a big head read as young; the same dog
   scaled down does not. */
/* YOUNG IS THE BASELINE, not the adult. The rig's own extras say
   growthStage: "Young", and the stage sheet calls Young "bản hiện tại" — the
   model as authored IS the middle stage. Everything is expressed relative to
   it: the two below are smaller, the two above are larger. Building the table
   the other way round, with the adult at 1.0, made every stage a shrunken
   version of a dog that never existed.

   The sheet also gives each stage its defining trait, and they are not all the
   same knob: Teen is "tai dài, to" and Adult is "to, lông xù". So the ears are
   two knobs, as the rig says (earW/earL) — measured, the ear hangs 0.22 along
   Y and is 0.05 x 0.12 across, so LENGTH is Y and WIDTH is X and Z. A teen
   gets longer ears, not merely bigger ones; an adult gets the coat. */
const TOBBY_STAGES = [
  { key:'tiny',  rig:'Puppy', vi:'Cún sơ sinh',        en:'Tiny Puppy',  xp:0,
    size:0.62, leg:0.72, head:1.30, earW:1.00, earL:0.80, floof:0    },
  { key:'baby',  rig:'Baby',  vi:'Cún nhỏ',            en:'Puppy',       xp:150,
    size:0.78, leg:0.85, head:1.16, earW:1.00, earL:0.88, floof:0.15 },
  { key:'young', rig:'Young', vi:'Cún lớn',            en:'Young Tobby', xp:600,
    size:1.00, leg:1.00, head:1.00, earW:1.00, earL:1.00, floof:0.45 },
  { key:'teen',  rig:'Teen',  vi:'Tobby thiếu niên',   en:'Teen Tobby',  xp:1800,
    size:1.10, leg:1.06, head:0.97, earW:1.05, earL:1.40, floof:0.70 },
  { key:'adult', rig:'Adult', vi:'Tobby trưởng thành', en:'Adult Tobby', xp:4000,
    size:1.20, leg:1.10, head:0.95, earW:1.10, earL:1.30, floof:1.00 },
];
const TOBBY_DAY_MS = 86400000;
const TobbyGrowth = {
  /** Days lived, banked on the wall clock so a machine left closed still ages. */
  tick(){
    const T = tobby();
    const last = T.lastTick || Date.now();
    const days = Math.floor((Date.now() - last) / TOBBY_DAY_MS);
    if(days > 0){ T.ageDays = (T.ageDays||0) + days; T.lastTick = last + days*TOBBY_DAY_MS; persist(); }
    return T.ageDays || 0;
  },
  ageDays(){ return tobby().ageDays || 0; },
  xp(){ return tobby().xp || 0; },
  /** Which stage a given amount of finished work earns. Deliberately NOT a
   *  function of days: time passing is not achievement, and a character who
   *  grows up while you ignore him is measuring the wrong thing. */
  stageFor(xp){
    let s = TOBBY_STAGES[0];
    for(const x of TOBBY_STAGES) if(xp >= x.xp) s = x;
    return s;
  },
  current(){ return this.stageFor(this.xp()); },
  next(){ return TOBBY_STAGES.find(s=> s.xp > this.xp()) || null; },
  progress(){
    const cur = this.current(), nx = this.next();
    if(!nx) return { pct:1, cur, next:null, xpLeft:0 };
    const span = nx.xp - cur.xp;
    return { pct: Math.min(1, (this.xp()-cur.xp)/span), cur, next:nx,
             xpLeft: Math.max(0, nx.xp - this.xp()) };
  },
  /** Put the proportions on the bones. */
  apply(){
    if(!TobbyRig.ready) return false;
    const s = this.current();
    TobbyRig.root.scale.setScalar(s.size);
    const head = TobbyRig.bones.head;   if(head) head.scale.setScalar(s.head);
    // Ears are two knobs, as the rig names them. Length runs down Y; width is
    // the other two. A teen's ears get long, not just large.
    ['earL','earR'].forEach(n=>{
      const e = TobbyRig.bones[n];
      if(e) e.scale.set(s.earW, s.earL, s.earW);
    });
    // The leg chain, on the vertical axis only: shortening the legs is what
    // makes a puppy read as a puppy rather than as a shrunken adult.
    //
    // Only the hips are scaled, which is what the rig means by "hip bones
    // y-scale". The shins hang UNDER the thighs, so scaling both multiplied the
    // knob by itself: a puppy asked for 0.72 stood on 0.51 legs and an adult
    // asked for 1.10 got 1.37. The shins inherit the hip's scale and now land
    // on exactly what the table says.
    ['thighL','thighR'].forEach(n=>{
      const b = TobbyRig.bones[n];
      if(b) b.scale.set(1, s.leg, 1);
    });
    ['shinL','shinR'].forEach(n=>{
      const b = TobbyRig.bones[n];
      if(b) b.scale.set(1, 1, 1);
    });
    // The extra coat only fills in once he is grown.
    TobbyRig.floof.forEach(g=> g.scale.setScalar(s.floof));
    tobby().stage = s.key;
    // A stage changes his SHAPE, not only his size — longer ears, shorter legs,
    // a thicker coat — so the cached silhouette no longer describes him and the
    // camera would frame the previous stage's outline.
    TobbyRig._restBox = null;
    TobbyRig.frame();
    return true;
  },
  /** Called on the clock. An actual change of stage is an event worth seeing. */
  check(){
    const T = tobby();
    const want = this.current().key;
    if(T.stage === want){ this.apply(); return null; }
    T.stage = want; persist();
    this.apply();
    const s = this.current();
    // A moment, not a fanfare: he jumps, a few sparks, one line. No modal, no
    // full-screen takeover — the brief is explicit that this must not feel
    // like a mobile game.
    // The sparks are not placed here: Tobby_Evolution carries its own table
    // (charge at 0.7s, transformation at 1.5, settle at 4.0) and the
    // dispatcher fires them on those beats as the clip plays.
    try{
      TobbyBrain.evolve();
      tobbySay(TB_L('Mình lớn rồi nè.','We grew up.'), 4200);
    }catch(e){}
    tobbyRemember('CHARACTER_EVENT', TB_L('Tiến hóa thành ' + s.vi, 'Evolved into ' + s.en), { stage:s.key });
    tobbyBond(TB_BOND.MILESTONE, 'evolution');
    return s;
  },
};

/* =========================================================
   XP — what finished work is worth
   ---------------------------------------------------------
   Only real progress counts. Opening the app is worth nothing, clicking about
   is worth nothing, and there is no reward for volume of activity: a character
   that grows when you fidget is measuring the wrong thing and teaches the wrong
   habit. Looking after him earns the RELATIONSHIP instead, which is a separate
   axis on purpose.
   ========================================================= */
const TB_XP = {
  TASK:            10,
  TASK_IMPORTANT:  20,      // ASAP or Cao
  PROJECT:        100,
  GOAL:           150,      // no goals feature yet; the hook is here for one
  REVIEW_WEEK:     30,
  DAY_ACTIVE:       5,      // one finished thing today, once a day
  FOCUS_PER_10MIN:  4,
  FOCUS_CAP:       40,      // per session, so a forgotten timer is not a jackpot
};

/* Relationship. Grows through being around him and through finishing things
   together — never through opening the app, and never on a schedule. */
const TOBBY_BONDS = [
  { lv:1, at:0,   vi:'Người lạ',        en:'Stranger' },
  { lv:2, at:40,  vi:'Người quen',       en:'Acquaintance' },
  { lv:3, at:140, vi:'Bạn đồng hành',  en:'Companion' },
  { lv:4, at:360, vi:'Cộng sự tin cậy', en:'Trusted Partner' },
  { lv:5, at:800, vi:'Bạn thân',          en:'Best Friend' },
];
const TB_BOND = {
  FEED:       3,   PLAY:      2,   ASK:        1,
  TASK:       1,   PROJECT:  15,   REVIEW:     5,
  STREAK_DAY: 4,   MILESTONE:10,   FOCUS_HOUR: 6,
  RETURN:     8,   // came back after a while away
};

/* Memory. Structured, capped, and deliberately thin: a title, a type, a date
   and a few numbers. Never raw user content, never anything private — he
   remembers THAT you finished the Amsterdam project, not what was in it. */
const TB_MEM_TYPES = ['MILESTONE','PROJECT','GOAL','STREAK','ACHIEVEMENT','INTERACTION','CHARACTER_EVENT'];
const TB_MEM_MAX = 60;
function tobbyRemember(type, title, metadata){
  if(!TB_MEM_TYPES.includes(type)) return null;
  const T = tobby();
  const m = { type, title: String(title||'').slice(0,120), date: nowISO(),
              metadata: metadata && typeof metadata === 'object' ? metadata : {} };
  T.memories.unshift(m);
  // Interactions are the chatty ones; they are trimmed first so a milestone is
  // never pushed out by a fortnight of feeding him.
  if(T.memories.length > TB_MEM_MAX){
    const keep = T.memories.filter(x=> x.type !== 'INTERACTION');
    const chat = T.memories.filter(x=> x.type === 'INTERACTION');
    T.memories = keep.concat(chat).slice(0, TB_MEM_MAX);
  }
  persist();
  return m;
}
function tobbyMemories(type){
  const all = tobby().memories || [];
  return type ? all.filter(m=> m.type === type) : all;
}

/** Bond points. Separate from XP because looking after him is not work, and
 *  work is not affection — conflating them makes both meaningless. */
function tobbyBond(amount, why){
  const T = tobby();
  if(!amount) return null;
  T.bond = Math.max(0, (T.bond||0) + amount);
  const lv = TOBBY_BONDS.filter(b=> T.bond >= b.at).pop() || TOBBY_BONDS[0];
  const rose = lv.lv !== (T.bondLevel||1);
  T.bondLevel = lv.lv;
  persist();
  if(rose){
    tobbyRemember('CHARACTER_EVENT', TB_L('Trở thành ' + lv.vi, 'Became your ' + lv.en), { level: lv.lv });
    try{ TobbyBrain.levelUp(); tobbySay(TB_L('Mình quý cậu hơn rồi.','We are closer now.')); }catch(e){}
  }
  return { level: lv, rose };
}
function tobbyBondLevel(){
  const T = tobby();
  return TOBBY_BONDS.find(b=> b.lv === (T.bondLevel||1)) || TOBBY_BONDS[0];
}

/** Award XP for something that was actually finished, and evolve if it is
 *  enough. Returns what happened so a caller can react. */
function tobbyGainXP(amount, why, meta){
  const T = tobby();
  if(!amount || amount <= 0) return null;
  const before = TobbyGrowth.current().key;
  T.xp = (T.xp||0) + amount;
  persist();
  const after = TobbyGrowth.current().key;
  if(after !== before){ TobbyGrowth.check(); return { xp:T.xp, evolved:true, stage:after }; }
  return { xp:T.xp, evolved:false, stage:after };
}

/* ---------- the things that count ---------- */
/** One finished task. Important ones are worth double — the app already knows
 *  which those are, so this does not need its own idea of importance. */
function tobbyOnTaskDone(task){
  const T = tobby();
  const important = task && /ASAP|Cao/i.test(task.priority || '');
  T.stats.tasks++; if(important) T.stats.important++;
  tobbyGainXP(important ? TB_XP.TASK_IMPORTANT : TB_XP.TASK, 'task');
  tobbyBond(TB_BOND.TASK, 'task');
  tobbyTouchDay();
  try{ TobbyBrain.taskDone(); }catch(e){}
}
/** A project whose tasks are all done. Checked rather than announced, so it
 *  fires once and only when it is actually true. */
function tobbyCheckProject(projectId){
  if(!projectId) return;
  const T = tobby();
  if((T.milestones||[]).some(m=> m.key === 'project:'+projectId)) return;
  const tasks = STATE.tasks.filter(x=> x.projectId === projectId && !x.archived);
  if(!tasks.length || !tasks.every(x=> x.status === 'Hoàn thành')) return;
  const p = STATE.projects.find(x=> x.id === projectId);
  T.milestones.push({ key:'project:'+projectId, at: nowISO() });
  T.stats.projects++;
  persist();
  tobbyGainXP(TB_XP.PROJECT, 'project');
  tobbyBond(TB_BOND.PROJECT, 'project');
  tobbyRemember('PROJECT', TB_L('Hoàn thành dự án ' + (p?p.name:''), 'Finished project ' + (p?p.name:'')),
                { projectId, tasks: tasks.length });
  try{ TobbyBrain.celebrate(); tobbySay(TB_L('Xong cả dự án rồi!','A whole project done!')); }catch(e){}
}
/** Focus, paid by the time actually spent. Capped, so a timer left running
 *  overnight is not worth more than a good afternoon. */
function tobbyOnFocus(minutes){
  const T = tobby();
  if(!minutes || minutes < 5) return;                 // a few seconds is not focus
  T.stats.focusMinutes += minutes;
  const xp = Math.min(TB_XP.FOCUS_CAP, Math.floor(minutes/10) * TB_XP.FOCUS_PER_10MIN);
  if(xp > 0) tobbyGainXP(xp, 'focus');
  if(minutes >= 60) tobbyBond(TB_BOND.FOCUS_HOUR, 'focus');
  tobbyTouchDay();
}
/** A week actually reviewed — once per week, not once per glance. */
function tobbyOnReview(range){
  if(range !== 'week') return;
  const T = tobby();
  const wk = new Date(); const key = 'review:' + wk.getFullYear() + ':' + Math.floor(dayOfYear(wk)/7);
  if((T.milestones||[]).some(m=> m.key === key)) return;
  T.milestones.push({ key, at: nowISO() });
  T.stats.reviews++;
  persist();
  tobbyGainXP(TB_XP.REVIEW_WEEK, 'review');
  tobbyBond(TB_BOND.REVIEW, 'review');
}
function dayOfYear(d){ return Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000); }
/** A day counts only if something was finished in it. Merely opening the app
 *  is not a day of work and does not move him an inch. */
function tobbyTouchDay(){
  const T = tobby();
  const today = new Date().toDateString();
  if(T.streak.lastDay === today) return;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  T.streak.days = (T.streak.lastDay === yesterday) ? (T.streak.days||0)+1 : 1;
  T.streak.lastDay = today;
  T.stats.days++;
  persist();
  tobbyGainXP(TB_XP.DAY_ACTIVE, 'day');
  tobbyBond(TB_BOND.STREAK_DAY, 'streak');
  if(T.streak.days === 7 || T.streak.days === 30 || T.streak.days === 100){
    tobbyRemember('STREAK', TB_L(T.streak.days + ' ngày liên tiếp', T.streak.days + ' days in a row'), { days:T.streak.days });
    tobbyBond(TB_BOND.MILESTONE, 'streak');
  }
}
/** Coming back after a while away is worth something — to him, not to the
 *  work. Checked once per load. */
function tobbyWelcomeBack(){
  const T = tobby();
  const last = Date.parse(T.lastSeenAt || '') || 0;
  const away = last ? (Date.now() - last) / 86400000 : 0;
  T.lastSeenAt = nowISO(); persist();
  if(away >= 3){
    tobbyBond(TB_BOND.RETURN, 'return');
    tobbyRemember('INTERACTION', TB_L('Quay lại sau ' + Math.round(away) + ' ngày', 'Back after ' + Math.round(away) + ' days'), { away: Math.round(away) });
    try{ TobbyBrain.feel('excited', 2600); tobbySay(TB_L('Cậu quay lại rồi!','You came back!')); }catch(e){}
  }
}
/* =========================================================
   THE WARDROBE
   ---------------------------------------------------------
   The slots come from the rig, not from a list here: TobbyRig.scan() read them
   out of the wear_<item>__<bone> markers. One item per slot, and the spine slot
   owns the sleeves too, because nobody wears sleeves on their own.
   ========================================================= */
/** The rig names its own clothes. These are the fallback for a model that does
 *  not, and are overridden by whatever the file says. */
const TB_WEAR_VI = {
  cap:'Mũ lưỡi trai', hat_brim:'Mũ vành', glasses:'Kính', sunglasses:'Kính râm',
  santa_hat:'Mũ Noel', scarf:'Khăn quàng', blazer:'Áo vest', sweater:'Áo len',
  puffer:'Áo phao', raincoat:'Áo mưa', aodai:'Áo dài', vn_flag:'Áo cờ Việt Nam',
  flower_shirt:'Áo hoa', santa_suit:'Bộ đồ Noel',
};
function tbWearName(item){
  const spec = TobbyRig.spec && TobbyRig.spec.wardrobe && TobbyRig.spec.wardrobe.items;
  return (spec && spec[item]) || TB_WEAR_VI[item] || item;
}
const TB_SLOT_VI = { head:'Đầu', eyes:'Mắt', neck:'Cổ', body:'Thân', spine:'Thân' };
/** Earned by staying, not by grinding. */
const TB_UNLOCK_DAY = {
  scarf:0, cap:3, glasses:10, sweater:25, hat_brim:45, sunglasses:70,
  blazer:110, flower_shirt:150, puffer:200, aodai:260, vn_flag:320,
  santa_hat:30, santa_suit:400, raincoat:60,
};
const TobbyWear = {
  unlocked(){
    const T = tobby(), age = TobbyGrowth.ageDays();
    let added = false;
    Object.entries(TB_UNLOCK_DAY).forEach(([k, day])=>{
      if(age >= day && !T.unlocked.includes(k)){ T.unlocked.push(k); added = true; }
    });
    if(added) persist();
    return T.unlocked;
  },
  /** Clothes the weather lends him.
   *
   *  Deliberately NOT filtered by the unlock list. The old build required the
   *  raincoat to be earned on day 60, so for two months it could rain as hard
   *  as it liked and he would stand in it bare — a weather feature that cannot
   *  fire is not a feature. Borrowed items are never added to `unlocked`; he
   *  gives them back when the sky clears. */
  borrowed(){
    const w = (typeof WEATHER === 'object' && WEATHER) ? WEATHER : null;
    if(!w || !w.kind) return null;
    if(w.kind === 'rain' || w.kind === 'storm') return 'raincoat';
    if(w.kind === 'snow') return 'puffer';
    if(w.temp != null && w.temp <= 12) return 'sweater';
    if(w.kind === 'clear' && w.temp != null && w.temp >= 34) return 'sunglasses';
    return null;
  },
  /** What he should be wearing right now: his own clothes, plus anything the
   *  weather has lent him, minus whatever that displaces from the same slot. */
  outfit(){
    const T = tobby();
    const worn = (T.worn||[]).filter(k=> TobbyRig.wear[k]);
    const lent = this.borrowed();
    if(!lent || !TobbyRig.wear[lent]) return worn;
    const clash = new Set(TobbyRig.conflictsWith(lent));
    return [...worn.filter(k=> !clash.has(k)), lent];
  },
  apply(){ return TobbyRig.ready ? TobbyRig.setWorn(this.outfit()) : false; },
  /** Wearing one thing takes off whatever shared its slot. */
  toggle(item){
    const T = tobby();
    if(!TobbyRig.wear[item]) return false;
    if((T.worn||[]).includes(item)) T.worn = T.worn.filter(k=>k!==item);
    else {
      const clash = new Set(TobbyRig.conflictsWith(item));
      T.worn = [...(T.worn||[]).filter(k=> !clash.has(k)), item];
    }
    persist(); this.apply();
    return true;
  },
};

/* =========================================================
   THE BOWL
   ---------------------------------------------------------
   bowl_root sits at scale 1 and no clip keys it, which is the change that made
   this simple: the bowl is an object the app owns, not a prop the animation
   lends out for four seconds. The previous rig keyed prop_bowl to zero in all
   35 clips, and working around that cost a second 45KB model in a second
   WebGL scene.

   The file ships exactly one dish — 36 kibble meshes. That one is shown as
   authored; the other seven are built as voxels into bowl_food, fitted to the
   volume the kibble occupies so they land where the eating animation expects
   food to be.
   ========================================================= */
const TB_BOWL_EAT_MS = 30000;
const TB_BOWL_XP = 5;
const TB_BOWL_CLAY = '#B4562C';
const TB_BOWL_FOODS = [
  ['empty',   '🍽️', 'Bát không', []],
