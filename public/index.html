/* =========================================================
   WORK WORLD MAP
   One floating island for the whole workspace, drawn as a topographic
   contour model: nested glowing loops whose radius comes from a smooth
   harmonic function, projected isometrically.

   Everything is a single inline SVG in screen space rather than a stack of
   CSS-3D layers. That was a deliberate reversal after the previous build:
   masks and filters silently force `transform-style` back to `flat`, which
   collapses a CSS 3D scene, and percentage margins resolve against width even
   when vertical. Projecting the geometry ourselves removes both traps and
   makes every coordinate testable.

   The map reads the workspace rather than decorating it:
     · elevation of a pin  → how far along its project is
     · pin colour          → task status (overdue / doing / done / to-do / frozen)
     · trails              → tasks belonging to one project, in deadline order
     · reactor brightness  → share of work completed
     · ring capacity       → overall completion
   ========================================================= */

/* ---------- deterministic noise ----------
   The island must look hand-drawn but must NOT reshuffle on every render, so
   every random-looking value is derived from a hash instead of Math.random. */
function wmHash(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/** Small xorshift PRNG; same seed always yields the same sequence. */
function wmRng(seed){
  let x = (seed >>> 0) || 123456789;
  return ()=>{ x ^= x<<13; x>>>=0; x ^= x>>>17; x ^= x<<5; x>>>=0; return x / 4294967296; };
}

/* ---------- camera ----------
   A real axonometric camera rather than a fixed isometric formula: yaw spins
   the world about its vertical axis, pitch tilts the ground plane toward the
   viewer, zoom scales the result. Because every point in the scene goes
   through wmProject, orbiting the map is just a matter of changing these three
   numbers and redrawing — no CSS 3D, so nothing can silently flatten.

   pitch is the angle between the ground plane and the line of sight:
     sin(pitch) squashes the ground, cos(pitch) is how much height shows.
   At 0° you are edge-on to the plane; at 90° straight down onto it. */
let wmYaw   = -0.42;                  // radians
let wmPitch = 0.50;                   // radians (~29°)
let wmZoom  = 1;
const WM_PITCH_MIN = 0.16, WM_PITCH_MAX = 1.24;
const WM_ZOOM_MIN = 0.55, WM_ZOOM_MAX = 2.4;

function wmProject(x, y, z){
  const c = Math.cos(wmYaw), s = Math.sin(wmYaw);
  const rx = x*c - y*s, ry = x*s + y*c;
  const sp = Math.sin(wmPitch), cp = Math.cos(wmPitch);
  return { x: rx * wmZoom, y: (ry * sp - (z||0) * cp) * wmZoom };
}
function wmPt(x, y, z){ const p = wmProject(x,y,z); return p.x.toFixed(1)+','+p.y.toFixed(1); }
/** Depth key for painter's-algorithm sorting: larger = nearer the viewer. */
function wmDepth(x, y){
  const c = Math.cos(wmYaw), s = Math.sin(wmYaw);
  return x*s + y*c;
}

/* ---------- island geometry ----------
   Contours are nested rings. Level 0 is the shoreline, level LEVELS-1 the
   summit. Radius per angle is a base radius shaped by three harmonics, so the
   outline wobbles organically while staying a closed loop. Each level's centre
   drifts toward the peak, which makes the mountain lean instead of being a
   perfect cone.

   Every shape parameter lives in `wmTerrain`, rebuilt from a hash of whatever
   is selected — so each project genuinely gets its own mountain rather than
   the same mountain with different labels. */
const WM_R = 168;              // shoreline radius in world units
const WM_LEVELS = 16;          // number of contour rings
const WM_PLATFORM_R = 292;     // compass ring radius; must clear the shoreline

let wmTerrain = null;
/** Rebuild the landscape for the current selection. Cheap and deterministic. */
function wmBuildTerrain(){
  const r = wmRng(wmHash('terrain|v2|' + (wmSelectedProject || 'all')));
  const TAU = Math.PI*2;
  const canyonFrom = r() * TAU;
  const forestFrom = (canyonFrom + 2.1 + r()*1.8) % TAU;
  wmTerrain = {
    peakZ: 150 + r() * 145,               // every project a different summit
    baseZ: 34 + r() * 26,                 // and a different float height
    peak:  { x: (r()-0.5) * 78, y: -18 - r() * 62 },
    // Harmonic amplitudes and phases: the outline's personality.
    a1: 0.055 + r()*0.06, p1: r()*TAU, k1: 3 + Math.floor(r()*2),
    a2: 0.028 + r()*0.04, p2: r()*TAU, k2: 5 + Math.floor(r()*3),
    a3: 0.012 + r()*0.03, p3: r()*TAU, k3: 8 + Math.floor(r()*4),
    taper: 0.86 + r()*0.08,               // how fast rings shrink upward
    canyon: { from: canyonFrom, to: canyonFrom + 0.8 + r()*0.5 },
    forest: { from: forestFrom, to: forestFrom + 0.7 + r()*0.4 },
    spin:   r()*TAU,                      // starting angle of the summit trail
  };
  return wmTerrain;
}
function wmTer(){ return wmTerrain || wmBuildTerrain(); }

function wmLevelZ(level){
  // Only slightly eased. A strong ease clusters the rings near the base and
  // the whole island flattens into a pancake of circles; near-linear spacing
  // is what makes the stack read as relief.
  const T = wmTer();
  const t = level / (WM_LEVELS - 1);
  return T.baseZ + Math.pow(t, 1.12) * T.peakZ;
}
function wmLevelCenter(level){
  const T = wmTer();
  const t = level / (WM_LEVELS - 1);
  return { x: T.peak.x * t, y: T.peak.y * t };
}
function wmRadius(theta, level){
  const T = wmTer();
  const t = level / (WM_LEVELS - 1);
  let r = WM_R * (1 - t * T.taper);
  r *= 1
    + T.a1 * Math.sin(theta * T.k1 + T.p1 + t * 2.1)
    + T.a2 * Math.sin(theta * T.k2 - T.p2 + t * 3.4)
    + T.a3 * Math.sin(theta * T.k3 + T.p3 + t * 1.3);
  // Canyon: a steep notch cut into the lower half only, so the ravine has
  // walls that close over as you climb.
  if(t < 0.62){
    const d = wmSectorDepth(theta, T.canyon);
    if(d > 0) r *= 1 - 0.42 * d * (1 - t/0.62);
  }
  // Forest shelf: a wide flat step on one flank.
  if(t > 0.1 && t < 0.45){
    const d = wmSectorDepth(theta, T.forest);
    if(d > 0) r *= 1 + 0.13 * d;
  }
  return r;
}
/** Widest the shoreline ever gets — used to keep it inside the compass ring. */
function wmMaxShoreline(){
  let max = 0;
  for(let i=0;i<72;i++) max = Math.max(max, wmRadius((i/72)*Math.PI*2, 0));
  return max;
}
/** 0 outside the sector, easing to 1 at its centre. */
function wmSectorDepth(theta, sector){
  const TAU = Math.PI*2;
  let a = ((theta - sector.from) % TAU + TAU) % TAU;
  const span = ((sector.to - sector.from) % TAU + TAU) % TAU;
  if(a > span) return 0;
  return Math.sin(Math.PI * (a / span));   // smooth in and out
}
/** A closed contour ring as an SVG path in projected screen space. */
function wmContourPath(level, steps){
  steps = steps || wmSteps(84);
  const c = wmLevelCenter(level), z = wmLevelZ(level);
  let d = '';
  for(let i=0;i<=steps;i++){
    const th = (i/steps) * Math.PI*2;
    const r = wmRadius(th, level);
    const x = c.x + Math.cos(th)*r, y = c.y + Math.sin(th)*r;
    d += (i ? 'L' : 'M') + wmPt(x, y, z);
  }
  return d + 'Z';
}
/** World position on the island surface at a given angle and level. */
function wmSurface(theta, level){
  const c = wmLevelCenter(level), r = wmRadius(theta, level);
  return { x: c.x + Math.cos(theta)*r, y: c.y + Math.sin(theta)*r, z: wmLevelZ(level) };
}

/* ---------- task → position ----------
   A task's angle is hashed from its id (stable), and its elevation comes from
   its project's progress: work nearer completion sits nearer the summit. That
   makes "climbing the mountain" mean something. */
function wmTaskStatus(t){
  if(isFrozen(t))                  return 'frozen';
  if(t.status === 'Hoàn thành')    return 'done';
  if(isOverdue(t))                 return 'overdue';
  if(t.status === 'Đang làm')      return 'doing';
  return 'todo';
}
const WM_STATUS = {
  overdue: { color:'var(--danger)',  glyph:'!',  name:'Quá hạn'      },
  doing:   { color:'var(--warning)', glyph:'▸',  name:'Đang làm'     },
  done:    { color:'var(--success)', glyph:'✓',  name:'Hoàn thành'   },
  todo:    { color:'#E8EEF7',        glyph:'○',  name:'Cần làm'      },
  frozen:  { color:'var(--sky)',     glyph:'❄',  name:'Đóng băng'    },
};
/** Two layouts, deliberately different so switching between them is legible:
 *   · whole workspace → tasks scattered over the island, height = how far
 *     along their project is. The map reads as a landscape of everything.
 *   · one project     → its tasks are strung along the summit trail in
 *     deadline order, so the route up the mountain IS the plan. */
function wmTaskPlacement(t, idx, total){
  const rnd = wmRng(wmHash(t.id + '|' + idx));
  if(wmSelectedProject){
    const T = wmTer();
    const f = total > 1 ? idx/(total-1) : 0.5;
    const theta = T.spin + f * Math.PI*2 * 2.15;
    const level = 0.9 + f * (WM_LEVELS - 2.3);
    const s = wmSurface(theta, level);
    // Sat just inside the trail, alternating sides so consecutive pins do not
    // stack on top of one another.
    const pull = 0.80 + (idx % 2) * 0.14;
    const c = wmLevelCenter(level);
    return { x: c.x + (s.x-c.x)*pull, y: c.y + (s.y-c.y)*pull, z: s.z, theta, level };
  }
  const theta = rnd() * Math.PI * 2;
  const proj = projectById(t.projectId);
  const climb = proj ? projectProgress(proj.id)/100 : (computeCompletion(t)/100);
  // Keep pins off the exact shoreline and off the exact summit.
  const lvl = 1.2 + climb * (WM_LEVELS - 4) + rnd() * 1.6;
  const level = Math.max(0.8, Math.min(WM_LEVELS - 1.4, lvl));
  const s = wmSurface(theta, level);
  const pull = 0.86 + rnd()*0.1;
  const c = wmLevelCenter(level);
  return { x: c.x + (s.x - c.x)*pull, y: c.y + (s.y - c.y)*pull, z: s.z, theta, level };
}

/* ---------- the widget ---------- */
/** Cap on drawn pins. Beyond this the map stops being readable and starts
 *  being a performance problem; the remainder is represented by the lattice. */
const WM_MAX_PINS = 46;
let wmSelectedProject = null;

/** Everything the current view of the map needs, gathered once so the SVG and
 *  the HUD can never disagree about what is on screen. */
function wmModel(){
  const projects = groupedProjects().filter(p=>!p.archived);
  const sel = wmSelectedProject ? projectById(wmSelectedProject) : null;
  // A selection that has since been deleted must not strand the map.
  if(wmSelectedProject && !sel) wmSelectedProject = null;
  const all = activeTasks();
  const tasks = wmSelectedProject ? all.filter(t=> t.projectId === wmSelectedProject) : all;

  const doneCount = tasks.filter(t=>t.status==='Hoàn thành').length;
  const overdue = tasks.filter(t=> isOverdue(t) && !isFrozen(t)).length;
  const lateRatio = tasks.length ? overdue/tasks.length : 0;

  return {
    projects, sel, tasks,
    conquered: projects.filter(p=> projectProgress(p.id) >= 100).length,
    doneCount,
    // Capacity = completion of whatever is currently in view.
    capacity: tasks.length ? Math.round(doneCount / tasks.length * 100) : 0,
    // Progress panel: the selected project, or the whole board averaged.
    progress: sel ? projectProgress(sel.id)
            : (projects.length ? Math.round(projects.reduce((a,p)=>a+projectProgress(p.id),0)/projects.length) : 0),
    stability: lateRatio < 0.08 ? {label:'CAO', pct:92, tone:'var(--success)'}
             : lateRatio < 0.22 ? {label:'TRUNG BÌNH', pct:58, tone:'var(--warning)'}
                                : {label:'THẤP', pct:24, tone:'var(--danger)'},
  };
}

/** The scene, in screen space, for the camera as it stands right now.
 *  Split out from the widget shell so orbiting only rebuilds this.
 *
 *  `animateCap` is true only on a full widget render — the capacity arc is
 *  drawn empty and filled on the next frame so the CSS transition runs. During
 *  a camera redraw it must stay false, or the ring would restart its sweep on
 *  every frame of the orbit. */
function wmSceneSvg(M, animateCap){
  const tasks = M.tasks;

  /* --- pins, far ones first so near ones overlap them --- */
  const ordered = [...tasks]
    .sort((a,b)=> new Date(a.deadline||'2999-12-31') - new Date(b.deadline||'2999-12-31'))
    .slice(0, WM_MAX_PINS);
  const placed = ordered.map((t,i)=>({ t, p: wmTaskPlacement(t, i, ordered.length), st: wmTaskStatus(t) }));
  const painted = [...placed].sort((a,b)=> wmDepth(a.p.x,a.p.y) - wmDepth(b.p.x,b.p.y));

  /* --- the implicit task lattice: a faint network suggesting the long tail --- */
  const rnd = wmRng(wmHash('lattice|' + (wmSelectedProject||'all')));
  const nodes = [];
  for(let i=0;i<54;i++){
    const th = rnd()*Math.PI*2;
    const s = wmSurface(th, 0.9 + rnd()*(WM_LEVELS-3));
    nodes.push(s);
  }
  const lattice = nodes.map((n,i)=>{
    const m = nodes[(i*7+3) % nodes.length];
    const a = wmProject(n.x,n.y,n.z), b = wmProject(m.x,m.y,m.z);
    return `<line class="wm-mesh" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"/>`;
  }).join('') + nodes.map(n=>{
    const p = wmProject(n.x,n.y,n.z);
    return `<circle class="wm-node" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="1.5"/>`;
  }).join('');

  return `
    ${wmPlatform(M.capacity, animateCap)}
    <g class="wm-island">
      ${wmContours()}
      ${lattice}
      ${wmReactor(M.capacity)}
      ${painted.map(x=> wmPin(x)).join('')}
    </g>`;
}

function wgIslands(){
  wmBuildTerrain();
  const M = wmModel();
  if(!M.projects.length && !M.tasks.length){
    return `<div class="empty-state" style="padding:26px;"><div class="glyph">🗺️</div>Chưa có dữ liệu để dựng bản đồ</div>`;
  }
  const progLabel = M.sel ? 'TIẾN ĐỘ DỰ ÁN' : 'TIẾN ĐỘ TRUNG BÌNH';

  return `
    <div class="wm" id="workMap">
      <div class="wm-space">
        ${wmStarfield()}
        ${wmConfetti(M.doneCount)}
      </div>

      <svg class="wm-svg" id="wmSvg" viewBox="-360 -330 720 600" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="wmCore">
            <stop offset="0%"   stop-color="#FFFFFF"/>
            <stop offset="34%"  stop-color="#8FE6FF"/>
            <stop offset="70%"  stop-color="#1E9BFF"/>
            <stop offset="100%" stop-color="#0B4C9E" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="wmGlow">
            <stop offset="0%"   stop-color="var(--wm-cyan)" stop-opacity=".55"/>
            <stop offset="100%" stop-color="var(--wm-cyan)" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <g id="wmScene">${wmSceneSvg(M, true)}</g>
      </svg>

      <!-- HUD is plain 2D on top: holographic panels never share the camera. -->
      <div class="wm-hud">
        <div class="wm-panel wm-tl">
          <span class="wm-panel-ico">${icon('folder',13)}</span>
          <span><b>DỰ ÁN CHINH PHỤC</b><em>${M.conquered}/${M.projects.length}</em></span>
        </div>
        <div class="wm-panel wm-tr">
          <span class="wm-panel-ico">${icon('activity',13)}</span>
          <span><b>${progLabel}</b><em>${M.progress}%</em></span>
        </div>
        <div class="wm-panel wm-side">
          <b>ĐỘ ỔN ĐỊNH MẠNG</b>
          <em style="color:${M.stability.tone};">${M.stability.label}</em>
          <span class="wm-meter"><i style="width:${M.stability.pct}%;background:${M.stability.tone};"></i></span>
        </div>
        <div class="wm-legend-panel" id="wmLegend">
          <b>Nhiệm vụ<br>hiện tại</b>
          ${Object.keys(WM_STATUS).map(k=>{
            const s = WM_STATUS[k];
            const n = M.tasks.filter(t=> wmTaskStatus(t)===k).length;
            return `<span class="wm-legend-row" data-wm-legend="${k}" title="${s.name}">
              <i class="wm-legend-dot" style="background:${s.color};color:${k==='todo'?'#0A1420':'#04121E'};">${s.glyph}</i>
              <em>${n}</em>
            </span>`;
          }).join('')}
        </div>
        <!-- Filled on hover, not up front: five lists of tasks built on every
             camera nudge is work nobody asked for. -->
        <div class="wm-legend-pop" id="wmLegendPop" hidden></div>

        <!-- Choosing a project reshapes the island and re-routes its tasks. -->
        <div class="wm-projects">
          <button class="wm-chip${!wmSelectedProject?' on':''}" data-wm-pick="">Tất cả</button>
          ${M.projects.map(p=>`<button class="wm-chip${wmSelectedProject===p.id?' on':''}"
            data-wm-pick="${p.id}" style="--wm-chip:${p.color};" title="${esc(p.name)} — ${projectProgress(p.id)}%">
            <i></i>${esc(p.name)}</button>`).join('')}
        </div>

        <div class="wm-capacity">${M.capacity}% CÔNG SUẤT</div>
        <button class="wm-reset" data-wm-reset title="Đưa góc nhìn về mặc định">${icon('refresh',13)}</button>
        <div class="wm-hint">Kéo để xoay · lăn chuột để phóng to</div>
      </div>
    </div>`;
}

/** Redraw only the projected geometry. Used by the camera, which changes where
 *  everything is but never what is there.
 *
 *  Coalesced onto an animation frame: a mouse can emit well over a hundred
 *  move events a second, and rebuilding several thousand path points for each
 *  one stalls the drag outright. One redraw per painted frame is all that can
 *  ever be seen anyway. */
let wmRaf = 0;
let wmDragging = false;
function wmDrawNow(){
  const g = document.getElementById('wmScene');
  if(!g) return;
  g.innerHTML = wmSceneSvg(wmModel(), false);
  wmWirePins(document.getElementById('workMap'));
}
function wmRedraw(){
  // Cancel-and-reschedule rather than latching a boolean. A "request pending"
  // flag that only the callback can clear stays stuck forever if the frame
  // never arrives — which is exactly what happens on a hidden tab — and the
  // map would then stay frozen even after coming back into view.
  if(wmRaf) cancelAnimationFrame(wmRaf);
  wmRaf = requestAnimationFrame(()=>{ wmRaf = 0; wmDrawNow(); });
}
/** Curve sampling density. Halved while orbiting: the difference is invisible
 *  in motion and it keeps the drag smooth on a slow machine. */
function wmSteps(full){ return wmDragging ? Math.max(16, Math.round(full/2)) : full; }

/** Fade everything that does not belong to `projId`. Passing null clears it.
 *  Done by toggling classes rather than re-rendering, so hovering the map
 *  never rebuilds several hundred SVG nodes. */
function wmHighlight(root, projId){
  root.querySelectorAll('.wm-pin').forEach(p=>
    p.classList.toggle('dim', !!projId && p.dataset.wmProj !== projId));
}

/** Pin handlers. Re-bound after every redraw, since the nodes are new. */
function wmWirePins(root){
  if(!root) return;
  root.querySelectorAll('[data-wm-task]').forEach(g=>{
    g.onclick = (e)=>{
      // A click that ends an orbit is part of the drag, not a selection.
      if(root.classList.contains('wm-dragged')) return;
      e.stopPropagation(); openTaskModal(g.dataset.wmTask);
    };
    g.oncontextmenu = (e)=>{
      e.preventDefault(); e.stopPropagation();
      openTaskContextMenu({taskId:g.dataset.wmTask, subId:null}, e.clientX, e.clientY);
    };
    g.onmouseenter = ()=> wmHighlight(root, g.dataset.wmProj);
    g.onmouseleave = ()=> wmHighlight(root, null);
  });
}

/** Release the capacity arc from empty to its real value on the next frame.
 *  Setting the final offset in the same paint as the element's creation gives
 *  the browser nothing to interpolate from, so the transition never runs. */
function wmFillCapacity(root){
  const arc = root.querySelector('.wm-ring-cap[data-cap-to]');
  if(!arc) return;
  const to = arc.getAttribute('data-cap-to');
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ arc.style.strokeDashoffset = to; }); });
  // Belt and braces: if frames are not being served (hidden tab), land on the
  // value anyway so the ring is never stuck reading zero when it comes back.
  setTimeout(()=>{ if(arc.isConnected) arc.style.strokeDashoffset = to; }, 2400);
}

/* ---------- idle auto-rotation ----------
   The map drifts clockwise on its own, and stops the moment the pointer is on
   it or a drag is under way. Deliberately not on requestAnimationFrame: a
   continuous 60fps rebuild of a few thousand SVG nodes is real, permanent CPU
   for a widget that may sit on screen all day. A slow interval at reduced
   sampling looks the same at this speed and costs a fraction. */
const WM_SPIN_MS = 70;                       // ~14 updates a second
const WM_SPIN_RATE = Math.PI*2 / 240;        // one full turn every four minutes
let wmSpinTimer = null;
let wmPointerOver = false;
let wmVisible = true;
function wmStopSpin(){
  if(wmSpinTimer){ clearInterval(wmSpinTimer); wmSpinTimer = null; }
}
function wmStartSpin(){
  wmStopSpin();
  if(window.matchMedia && tbReduceMotion()) return;
  wmSpinTimer = setInterval(()=>{
    const root = document.getElementById('workMap');
    if(!root){ wmStopSpin(); return; }        // widget navigated away from
    if(wmDragging || wmPointerOver || document.hidden || !wmVisible) return;
    wmYaw += WM_SPIN_RATE * (WM_SPIN_MS/1000);
    wmDragging = true;                        // borrow the low-detail sampling
    wmDrawNow();
    wmDragging = false;
  }, WM_SPIN_MS);
}

/** The document-level orbit listeners currently installed, so the next wire
 *  can take them down before putting its own up. */
let wmDocHandlers = null;
/** Camera controls and the project picker. */
/** The tasks behind one legend dot. Reads the same model the dots counted, so
 *  the list can never disagree with the number above it — including the current
 *  project selection. */
function wmLegendPopHtml(key){
  const s = WM_STATUS[key];
  const list = wmModel().tasks.filter(t=> wmTaskStatus(t)===key);
  if(!list.length){
    return `<b><i style="background:${s.color};color:${s.color};"></i>${esc(s.name)}</b>
      <i class="wm-pop-empty">Không có nhiệm vụ nào.</i>`;
  }
  // Soonest deadline first: if you are looking at "quá hạn", the oldest miss is
  // the one you need to see, not whichever task happened to be created first.
  const sorted = list.slice().sort((a,b)=> (a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  const shown = sorted.slice(0, 6);
  const rest = sorted.length - shown.length;
  return `<b><i style="background:${s.color};color:${s.color};"></i>${esc(s.name)}<span>${list.length}</span></b>
    ${shown.map(t=>{
      const p = projectById(t.projectId);
      return `<span class="wm-pop-item">
        <i style="background:${p ? p.color : 'var(--text-3)'};"></i>
        <u title="${esc(t.title)}">${esc(t.title)}</u>
        <s>${t.dueDate ? fmtDateShort(t.dueDate) : '—'}</s>
      </span>`;
    }).join('')}
    ${rest > 0 ? `<span class="wm-pop-more">+${rest} nhiệm vụ khác</span>` : ''}`;
}
/** Opens the popup beside the hovered row, then pulls it back inside the map.
 *  The map clips its own overflow, so a popup that runs past the bottom edge is
 *  a popup with its last two rows cut off. */
function wmLegendPopShow(root, pop, row, key){
  pop.innerHTML = wmLegendPopHtml(key);
  pop.hidden = false;
  const mapR = root.getBoundingClientRect();
  const rowR = row.getBoundingClientRect();
  const h = pop.offsetHeight;
  const wanted = rowR.top - mapR.top + rowR.height/2 - h/2;
  pop.style.top = Math.max(10, Math.min(wanted, mapR.height - h - 10)) + 'px';
}

function wmWire(){
  const root = document.getElementById('workMap');
  if(!root) return;
  wmWirePins(root);
  wmFillCapacity(root);
  wmStartSpin();

  /* --- legend hover: which tasks, not just how many --- */
  const pop = root.querySelector('.wm-legend-pop');
  const legend = root.querySelector('.wm-legend-panel');
  if(pop && legend){
    root.querySelectorAll('[data-wm-legend]').forEach(row=>{
      row.onmouseenter = ()=> wmLegendPopShow(root, pop, row, row.dataset.wmLegend);
    });
    // Closed on leaving the rail rather than the row: moving between two dots
    // would otherwise flicker the popup shut and open again.
    legend.onmouseleave = ()=>{ pop.hidden = true; };
  }

  // Picking a project reseeds the terrain, so the mountain itself changes
  // shape and height — not merely which pins are shown.
  root.querySelectorAll('[data-wm-pick]').forEach(btn=> btn.onclick = (e)=>{
    e.stopPropagation();
    const id = btn.dataset.wmPick || null;
    wmSelectedProject = (wmSelectedProject === id) ? null : id;
    wmBuildTerrain();
    renderView();
  });

  const svg = root.querySelector('.wm-svg');
  if(!svg) return;

  // The drift pauses under the pointer so a pin can actually be aimed at.
  root.onmouseenter = ()=>{ wmPointerOver = true; };
  root.onmouseleave = ()=>{ wmPointerOver = false; };
  // …and while the widget is scrolled out of sight, so an unwatched map costs
  // nothing at all.
  if(window.IntersectionObserver){
    new IntersectionObserver((e)=>{ wmVisible = e[0].isIntersecting; }, {threshold:0.05}).observe(root);
  }

  /* --- orbit --- */
  let drag = null;
  svg.onmousedown = (e)=>{
    if(e.button !== 0) return;
    e.preventDefault();
    drag = { x:e.clientX, y:e.clientY, yaw:wmYaw, pitch:wmPitch, moved:false };
    wmDragging = true;
    root.classList.add('wm-grabbing');
  };
  const onMove = (e)=>{
    if(!drag) return;
    // A mouseup delivered outside the document — released over browser chrome,
    // or lost to an alt-tab — never reaches onUp, and the map would then keep
    // orbiting with every idle mouse move. The button state is the truth.
    if(!(e.buttons & 1)){ onUp(); return; }
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(Math.abs(dx) + Math.abs(dy) > 4){ drag.moved = true; root.classList.add('wm-dragged'); }
    // Yaw: dragging right increases yaw. Verified by projection — a marker at
    // world angle 0 travels right → bottom → left as yaw grows, which is
    // clockwise on screen (SVG y points down). Dragging left runs it back
    // anti-clockwise.
    wmYaw   = drag.yaw + dx * 0.008;
    // Pitch: dragging down lowers the camera toward the horizon. It read
    // inverted before — dragging down was tilting the view further overhead,
    // which is the opposite of grabbing and pulling the horizon down.
    wmPitch = Math.max(WM_PITCH_MIN, Math.min(WM_PITCH_MAX, drag.pitch - dy * 0.005));
    wmRedraw();
  };
  const onUp = ()=>{
    if(!drag) return;
    drag = null;
    root.classList.remove('wm-grabbing');
    // Back to full detail once the map settles.
    if(wmDragging){ wmDragging = false; wmRedraw(); }
    // Cleared a tick later so the click that ends the drag still sees it.
    setTimeout(()=> root.classList.remove('wm-dragged'), 0);
  };
  // The orbit needs document-level listeners so the drag survives the cursor
  // leaving the map, but wmWire runs on every dashboard render — without
  // detaching the previous pair they would pile up for the life of the session.
  if(wmDocHandlers){
    document.removeEventListener('mousemove', wmDocHandlers.move);
    document.removeEventListener('mouseup', wmDocHandlers.up);
  }
  wmDocHandlers = { move:onMove, up:onUp };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  /* --- zoom --- */
  svg.addEventListener('wheel', (e)=>{
    e.preventDefault();
    wmZoom = Math.max(WM_ZOOM_MIN, Math.min(WM_ZOOM_MAX, wmZoom * (e.deltaY < 0 ? 1.12 : 1/1.12)));
    wmRedraw();
  }, {passive:false});

  /* --- touch: one finger orbits, two fingers pinch --- */
  let touch = null;
  const dist = (t)=> Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  svg.addEventListener('touchstart', (e)=>{
    const t = e.touches;
    touch = t.length >= 2
      ? { mode:'pinch', d:dist(t), zoom:wmZoom }
      : { mode:'orbit', x:t[0].clientX, y:t[0].clientY, yaw:wmYaw, pitch:wmPitch };
  }, {passive:true});
  svg.addEventListener('touchmove', (e)=>{
    if(!touch) return;
    const t = e.touches;
    if(touch.mode === 'pinch' && t.length >= 2){
      wmZoom = Math.max(WM_ZOOM_MIN, Math.min(WM_ZOOM_MAX, touch.zoom * (dist(t)/touch.d)));
    } else if(touch.mode === 'orbit'){
      wmYaw   = touch.yaw + (t[0].clientX - touch.x) * 0.008;
      wmPitch = Math.max(WM_PITCH_MIN, Math.min(WM_PITCH_MAX, touch.pitch + (t[0].clientY - touch.y) * 0.005));
    }
    e.preventDefault();
    wmRedraw();
  }, {passive:false});
  svg.addEventListener('touchend', ()=>{ touch = null; }, {passive:true});

  const reset = root.querySelector('[data-wm-reset]');
  if(reset) reset.onclick = (e)=>{
    e.stopPropagation();
    wmYaw = -0.42; wmPitch = 0.50; wmZoom = 1;
    wmRedraw();
  };
}

/** Star field behind the island. Positions are hashed, so they hold still. */
function wmStarfield(){
  const rnd = wmRng(wmHash('stars'));
  let out = '';
  for(let i=0;i<80;i++){
    const s = (0.6 + rnd()*1.7).toFixed(2);
    // Nearer (larger) stars drift faster — cheap parallax, and it is what sells
    // the sense of moving through the field rather than past a flat backdrop.
    const drift = (110 - parseFloat(s)*26 + rnd()*70).toFixed(1);
    out += `<i class="wm-star" style="left:${(rnd()*100).toFixed(1)}%;top:${(rnd()*100).toFixed(1)}%;
      width:${s}px;height:${s}px;
      animation-duration:${(6+rnd()*9).toFixed(1)}s, ${drift}s;
      animation-delay:-${(rnd()*14).toFixed(1)}s, -${(rnd()*parseFloat(drift)).toFixed(1)}s;"></i>`;
  }
  return out;
}
/** Victory confetti — one ribbon per completed task, capped. */
function wmConfetti(doneCount){
  const n = Math.min(26, doneCount * 2);
  const rnd = wmRng(wmHash('confetti'));
  const tones = ['var(--success)','var(--wm-cyan)','var(--warning)','#E8EEF7'];
  let out = '';
  for(let i=0;i<n;i++){
    out += `<i class="wm-bit" style="left:${(12+rnd()*76).toFixed(1)}%;top:${(6+rnd()*54).toFixed(1)}%;
      background:${tones[i%tones.length]};transform:rotate(${(rnd()*360).toFixed(0)}deg);
      animation-duration:${(4+rnd()*6).toFixed(1)}s;animation-delay:-${(rnd()*8).toFixed(1)}s;"></i>`;
  }
  return out;
}

/** The compass platform the island floats on.
 *  Its radius is derived from the terrain, never fixed: a project that happens
 *  to generate a wide shoreline would otherwise spill outside its own compass.
 *  The ring always clears the widest point of the coast by a clear margin. */
function wmPlatformR(){
  return Math.max(WM_PLATFORM_R, wmMaxShoreline() * 1.42);
}
function wmPlatform(capacity, animateCap){
  const R = wmPlatformR();
  const ticks = [];
  for(let i=0;i<72;i++){
    const th = (i/72)*Math.PI*2;
    const long = i % 9 === 0;
    const r0 = R * (long ? 0.90 : 0.945), r1 = R;
    const a = wmProject(Math.cos(th)*r0, Math.sin(th)*r0, 0);
    const b = wmProject(Math.cos(th)*r1, Math.sin(th)*r1, 0);
    ticks.push(`<line class="wm-tick${long?' long':''}" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"/>`);
  }
  // Cardinals ride the ring itself, so they turn with the compass as the
  // camera orbits — which is the point of having a compass at all.
  const card = (label, th)=>{
    const p = wmProject(Math.cos(th)*R*1.12, Math.sin(th)*R*1.12, 0);
    return `<text class="wm-card-dir" x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}">${label}</text>`;
  };
  // A ground circle stays an axis-aligned ellipse under this camera whatever
  // the yaw: rx = R·zoom, ry = R·sin(pitch)·zoom.
  const rxOf = (rr)=> rr * wmZoom;
  const ryOf = (rr)=> rr * Math.sin(wmPitch) * wmZoom;
  const ring = (rr, cls)=>`<ellipse class="${cls}" cx="0" cy="0" rx="${rxOf(rr).toFixed(1)}" ry="${ryOf(rr).toFixed(1)}"/>`;
  const capR = R*0.80, capRx = rxOf(capR), capRy = ryOf(capR);
  // Ramanujan's approximation — an ellipse has no closed-form perimeter, and
  // stroke-dasharray needs one to express "this fraction of the way round".
  const circ = Math.PI * (3*(capRx+capRy) - Math.sqrt((3*capRx+capRy)*(capRx+3*capRy)));
  return `<g class="wm-platform">
    ${ring(R*1.02,'wm-ring-outer')}
    ${ticks.join('')}
    ${ring(R*0.90,'wm-ring-mid')}
    <ellipse class="wm-ring-cap-track" cx="0" cy="0" rx="${capRx.toFixed(1)}" ry="${capRy.toFixed(1)}"/>
    <!-- On a fresh render the arc starts empty and is filled to its real value
         one frame later, which is what lets the CSS transition sweep it round.
         During a camera redraw it is painted at its final value directly. -->
    <ellipse class="wm-ring-cap" cx="0" cy="0" rx="${capRx.toFixed(1)}" ry="${capRy.toFixed(1)}"
      stroke-dasharray="${circ.toFixed(1)}"
      stroke-dashoffset="${(animateCap ? circ : circ*(1-capacity/100)).toFixed(1)}"
      data-cap-to="${(circ*(1-capacity/100)).toFixed(1)}"/>
    ${card('B', -Math.PI/2)}${card('N', Math.PI/2)}${card('T', Math.PI)}${card('Đ', 0)}
  </g>`;
}

/** The stack of contour rings, plus the rock underside that makes the island
 *  read as a floating chunk rather than a flat disc. */
function wmContours(){
  let out = '';
  for(let l=0;l<WM_LEVELS;l++){
    const t = l/(WM_LEVELS-1);
    out += `<path class="wm-contour" d="${wmContourPath(l)}"
      style="--wm-t:${t.toFixed(3)};opacity:${(0.32 + t*0.6).toFixed(2)};stroke-width:${(1.6 - t*0.55).toFixed(2)};"/>`;
  }
  // Underside: the shoreline ring repeated downward and pulled inward, ending
  // in a point. Drawn first so the island proper covers its top edge.
  let under = '';
  const UNDER = 7;
  const baseZ = wmTer().baseZ;
  for(let i=1;i<=UNDER;i++){
    const f = i/UNDER;
    const c = wmLevelCenter(0);
    const z = baseZ - f * baseZ * 1.6;
    const shrink = 1 - Math.pow(f, 0.72) * 0.94;
    const N = wmSteps(64);
    let d = '';
    for(let s=0;s<=N;s++){
      const th = (s/N)*Math.PI*2;
      const r = wmRadius(th, 0) * shrink;
      d += (s?'L':'M') + wmPt(c.x + Math.cos(th)*r, c.y + Math.sin(th)*r, z);
    }
    under += `<path class="wm-under" d="${d}Z" style="opacity:${(0.4 - f*0.32).toFixed(2)};"/>`;
  }
  return under
    + `<path class="wm-plate" d="${wmContourPath(0)}"/>`
    + out;
}
/** Core energy reactor, suspended in its crystal housing at the island heart. */
function wmReactor(capacity){
  // Seated inside the island body, not under it: anything below the base
  // renders beneath the shoreline plate and reads as a detached lamp.
  const p = wmProject(0, 0, wmTer().baseZ + 34);
  const r = 34;
  const facets = [];
  for(let i=0;i<6;i++){
    const a0 = (i/6)*Math.PI*2, a1 = ((i+1)/6)*Math.PI*2;
    facets.push(`<path class="wm-crystal" d="M${(Math.cos(a0)*r*1.55).toFixed(1)},${(Math.sin(a0)*r*0.95).toFixed(1)}
      L${(Math.cos(a1)*r*1.55).toFixed(1)},${(Math.sin(a1)*r*0.95).toFixed(1)} L0,${(-r*1.5).toFixed(1)}Z"/>`);
  }
  return `<g class="wm-reactor" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})"
      style="--wm-pulse:${(0.55 + capacity/220).toFixed(2)};">
    <circle class="wm-core-halo" cx="0" cy="0" r="${(r*2.6).toFixed(1)}" fill="url(#wmGlow)"/>
    ${facets.join('')}
    <circle class="wm-core" cx="0" cy="0" r="${r}" fill="url(#wmCore)"/>
    <circle class="wm-core-ring" cx="0" cy="0" r="${(r*1.28).toFixed(1)}"/>
    <circle class="wm-core-ring slow" cx="0" cy="0" r="${(r*1.62).toFixed(1)}"/>
  </g>`;
}
/** One task marker: a stem down to the ground and a badge facing the viewer. */
function wmPin({t, p, st}, i){
  const s = WM_STATUS[st];
  const top = wmProject(p.x, p.y, p.z + 38);
  const foot = wmProject(p.x, p.y, p.z);
  const proj = projectById(t.projectId);
  const label = `${t.title}${proj?' · '+proj.name:''} · ${s.name}`;
  return `<g class="wm-pin ${st}" data-wm-task="${t.id}"
      data-wm-proj="${t.projectId || '__none__'}" style="--wm-pin:${s.color};">
    <title>${esc(label)}</title>
    <line class="wm-pin-stem" x1="${foot.x.toFixed(1)}" y1="${foot.y.toFixed(1)}" x2="${top.x.toFixed(1)}" y2="${top.y.toFixed(1)}"/>
    <ellipse class="wm-pin-foot" cx="${foot.x.toFixed(1)}" cy="${foot.y.toFixed(1)}" rx="4.5" ry="2.4"/>
    <g transform="translate(${top.x.toFixed(1)},${top.y.toFixed(1)})">
      <circle class="wm-pin-badge" cx="0" cy="-10" r="10"/>
      <text class="wm-pin-glyph" x="0" y="-6">${s.glyph}</text>
    </g>
  </g>`;
}

/** Number of shades in the dashboard calendar heatmap (0 = empty day). */
const HEAT_STEPS = 4;
function wgMonthCal(){
  const base = new Date(); base.setMonth(base.getMonth()+dashMonthOffset); base.setDate(1);
  const monthStart = new Date(base.getFullYear(), base.getMonth(), 1);
  const gridStart = new Date(monthStart); gridStart.setDate(gridStart.getDate()-monthStart.getDay());
  const cells = [...Array(42)].map((_,i)=>{ const d=new Date(gridStart); d.setDate(d.getDate()+i); return d; });
  const today = new Date();
  // A day's load = everything that lands on it, whether it is due that day or
  // scheduled to be worked on that day. Counted once per task.
  const byDay = {};
  const put = (when, t)=>{ if(!when) return; const k=new Date(when).toDateString();
    const bucket = byDay[k] = byDay[k] || [];
    if(!bucket.includes(t)) bucket.push(t); };
  activeTasks().forEach(t=>{ put(t.deadline, t); put(timetableSlotDate(t), t); });

  // The scale is relative to the busiest day on screen, so a light month still
  // shows contrast instead of six shades of nearly-nothing.
  const counts = cells.map(d=> (byDay[d.toDateString()]||[]).length);
  const peak = Math.max(1, ...counts);
  const heatLevel = (n)=> n===0 ? 0 : Math.min(HEAT_STEPS, Math.max(1, Math.ceil(n/peak*HEAT_STEPS)));

  return `
    <div class="dash-cal-nav">
      <button class="btn-icon" data-dashmonth="-1" style="width:24px;height:24px;font-size:11px;">←</button>
      <b>Tháng ${base.getMonth()+1}/${base.getFullYear()}</b>
      <button class="btn-icon" data-dashmonth="1" style="width:24px;height:24px;font-size:11px;">→</button>
      <button class="btn btn-ghost btn-sm" data-dashmonth="0" style="margin-left:auto;">Hôm nay</button>
    </div>
    <div class="dash-cal">
      ${["CN","T2","T3","T4","T5","T6","T7"].map(d=>`<div class="dash-cal-head">${d}</div>`).join("")}
      ${cells.map((d,i)=>{
        const inMonth = d.getMonth()===base.getMonth();
        const isToday = d.toDateString()===today.toDateString();
        const list = byDay[d.toDateString()]||[];
        const n = counts[i];
        const overdueDay = list.some(isOverdue);
        const lvl = heatLevel(n);
        const label = n ? `${n} việc trong ngày${overdueDay?' · có việc quá hạn':''}` : 'Không có việc';
        return `<div class="dash-cal-cell ${inMonth?'':'dim'} ${isToday?'today':''} heat-${lvl}${overdueDay?' heat-late':''}"
          data-open-day="${ymdLocal(d)}" title="${d.toLocaleDateString(loc())} — ${label}">
          <span>${d.getDate()}</span>
        </div>`;
      }).join("")}
    </div>
    <div class="dash-cal-legend">
      <span>Ít việc</span>
      ${[0,1,2,3,4].map(l=>`<i class="dash-cal-key heat-${l}"></i>`).join("")}
      <span>Nhiều việc</span>
      <i class="dash-cal-key heat-late" title="Có việc quá hạn"></i><span>Quá hạn</span>
    </div>`;
}
function wgTimetableToday(){
  const d = new Date();
  const list = tasksForDay(d);
  if(!list.length) return `<div class="empty-state" style="padding:24px;"><div class="glyph">🌤️</div>Hôm nay chưa có việc nào đặt giờ</div>`;
  return `<div style="display:flex;flex-direction:column;gap:7px;max-height:100%;overflow-y:auto;">
    ${list.map(t=>{
      const s = timetableSlotDate(t);
      const proj = projectById(t.projectId);

      const done = t.status==='Hoàn thành';
      return `<div class="task-row-wrap"><div class="task-row" data-open="${t.id}" style="border-left:3px solid ${color};${done?'opacity:.6;':''}">
        <span style="font-weight:800;font-size:12.5px;color:${color};width:46px;flex-shrink:0;">${s.toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'})}</span>

        ${dueBadgeHtml(t)}

    }).join("")}
  </div>`;
}

function wireDashboard(){
  document.querySelectorAll('[data-open]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); openTaskModal(el.dataset.open); });
  document.querySelectorAll('[data-goto]').forEach(el=> el.onclick = (e)=>{ e.preventDefault(); VIEW = el.dataset.goto; render(); });
  document.querySelectorAll('[data-goto-note]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); openNote(el.dataset.gotoNote); });
  const notifBtn = document.getElementById('notifBtn'); if(notifBtn) notifBtn.onclick = ()=>{ VIEW='notifications'; render(); };
  wmWire();
  document.querySelectorAll('[data-standup]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    standupRange = el.dataset.standup;
    renderView();
  });
  const suCopy = document.getElementById('standupCopy');
  if(suCopy) suCopy.onclick = (e)=>{
    e.stopPropagation();
    const text = standupPlainText();
    if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast('Đã copy báo cáo'), ()=>prompt('Copy báo cáo:', text));
    else prompt('Copy báo cáo:', text);
  };
  document.querySelectorAll('[data-dashmonth]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    const v = parseInt(el.dataset.dashmonth);
    dashMonthOffset = v===0 ? 0 : dashMonthOffset + v;
    renderView();
  });
  document.querySelectorAll('.dash-cal-cell[data-open-day]').forEach(el=> el.onclick = ()=> openDayScheduleModal(el.dataset.openDay));
  wireQuickComposer();
  wireHoverSubtasks();
  startDashClock();

  document.getElementById('dashEditToggle').onclick = ()=>{ dashEditMode = !dashEditMode; renderView(); };
  const resetBtn = document.getElementById('dashResetLayout');
  if(resetBtn) resetBtn.onclick = ()=>{
    STATE.settings.dashboardLayout = JSON.parse(JSON.stringify(DEFAULT_DASH_LAYOUT));
    STATE.settings.dashboardHidden = [];
    persist(); renderView(); toast('Đã khôi phục bố cục mặc định');
  };
  document.querySelectorAll('[data-hide-widget]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    const id = el.dataset.hideWidget;
    const hidden = dashHidden();
    if(!hidden.includes(id)) hidden.push(id);
    STATE.settings.dashboardLayout = STATE.settings.dashboardLayout.filter(w=>w.id!==id);
    persist(); renderView(); toast('Đã ẩn ô — bật lại ở mục "Ô đã ẩn"');
  });
  document.querySelectorAll('[data-show-widget]').forEach(el=> el.onclick = ()=>{
    const id = el.dataset.showWidget;
    STATE.settings.dashboardHidden = dashHidden().filter(x=>x!==id);
    const d = DEFAULT_DASH_LAYOUT.find(x=>x.id===id) || {id, w:6, h:280};
    STATE.settings.dashboardLayout = [...STATE.settings.dashboardLayout, {...d}];
    persist(); renderView();
  });

  if(!dashEditMode) return;

  // --- drag to reorder ---
  let dragId = null;
  document.querySelectorAll('.dash-widget').forEach(el=>{
    el.ondragstart = (e)=>{ dragId = el.dataset.widget; e.dataTransfer.effectAllowed='move'; el.classList.add('dragging'); };
    el.ondragend = ()=>{ el.classList.remove('dragging'); document.querySelectorAll('.dash-widget').forEach(x=>x.classList.remove('drop-target')); };
    el.ondragover = (e)=>{ if(dragId && dragId!==el.dataset.widget){ e.preventDefault(); el.classList.add('drop-target'); } };
    el.ondragleave = ()=> el.classList.remove('drop-target');
    el.ondrop = (e)=>{
      e.preventDefault(); el.classList.remove('drop-target');
      const targetId = el.dataset.widget;
      if(!dragId || dragId===targetId) return;
      const L = dashLayout();
      const from = L.findIndex(w=>w.id===dragId);
      const to = L.findIndex(w=>w.id===targetId);
      const [moved] = L.splice(from,1);
      L.splice(to,0,moved);
      STATE.settings.dashboardLayout = L;
      persist(); renderView(); toast('Đã đổi vị trí ô');
    };
  });

  // --- resize (width in grid columns + pixel height) ---
  document.querySelectorAll('[data-resize-widget]').forEach(handle=>{
    handle.onmousedown = (e)=>{
      e.preventDefault(); e.stopPropagation();
      const id = handle.dataset.resizeWidget;
      const L = dashLayout();
      const wdef = L.find(x=>x.id===id);
      const widgetEl = handle.closest('.dash-widget');
      const grid = document.getElementById('dashGrid');
      const colW = (grid.getBoundingClientRect().width + 16) / 12;   // incl. gap
      const startX = e.clientX, startY = e.clientY;
      const startCols = wdef.w;
      const startH = wdef.h || widgetEl.getBoundingClientRect().height;
      function onMove(ev){
        const cols = Math.max(3, Math.min(12, startCols + Math.round((ev.clientX-startX)/colW)));
        const h = Math.max(140, Math.round(startH + (ev.clientY-startY)));
        wdef.w = cols; wdef.h = h;
        widgetEl.style.gridColumn = `span ${cols}`;
        const card = widgetEl.querySelector('.dash-card') || widgetEl.querySelector('.card');
        if(card) card.style.height = h+'px'; else widgetEl.style.height = h+'px';
        const badge = widgetEl.querySelector('.dash-handle span:nth-child(2)');
        if(badge) badge.textContent = `${cols}/12`;
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        STATE.settings.dashboardLayout = L;
        persist(); renderView();
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
  });
}
/* One shared interval keeps the clock ticking without stacking timers. */
let dashClockTimer = null;
function startDashClock(){
  if(dashClockTimer) clearInterval(dashClockTimer);
  const paint = ()=>{
    const el = document.getElementById('dashClock');
    if(!el){ clearInterval(dashClockTimer); dashClockTimer = null; return; }
    const now = new Date();
    el.querySelector('.dash-clock-time').textContent = now.toLocaleTimeString(loc(),{hour12:false});
    el.querySelector('.dash-clock-date').textContent = now.toLocaleDateString(loc(),{weekday:'short', day:'2-digit', month:'2-digit'});
    // Live weather rides under the clock: both answer "what is it like right now".
    const wx = el.querySelector('.dash-weather');
    if(wx){
      const k = weatherEnabled() && WEATHER.kind ? WEATHER_KINDS[WEATHER.kind] : null;
      wx.hidden = !k;
      if(k) wx.innerHTML = `<b>${k.icon}</b><span>${esc(LANG==='en'?weatherNameEn(WEATHER.kind):k.name)}${
        WEATHER.temp!=null ? ` · ${WEATHER.temp}°` : ''}</span>`;
    }
  };
  paint();
  dashClockTimer = setInterval(paint, 1000);
}

function wireQuickComposer(){
  const input = document.getElementById('composerInput');
  if(!input) return;
  const cs = composerState;
  /** Redraw just the composer (it lives in a popup, not the page body). */
  function refreshComposer(focusId){
    const body = document.getElementById('composerPopBody');
    if(!body) { renderViewKeepFocus(focusId); return; }
    body.innerHTML = quickComposerHtml();
    wireQuickComposer();
    applyLang(body);
    const el = document.getElementById(focusId);
    if(el){ el.focus(); if(el.setSelectionRange){ try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} } }
  }
  document.getElementById('composerNewNote').onclick = ()=>{
    // Carry whatever was typed across as the note's title.
    const note = addNote({ title: (cs.title||input.value||'').trim() });
    composerState = { title:"", startDate:"", startTime:"", due:"", time:"", assigneeId:"", priority:"Trung bình", projectId:"", workflowId:"", departmentId:"", addingProject:false, newProjectName:"" };
    if(window.closeComposerPopup) window.closeComposerPopup();
    toast('Đã tạo ghi chú mới');
    openNote(note.id);
  };
  input.oninput = (e)=>{ cs.title = e.target.value; };
  document.getElementById('composerStart').onchange = (e)=>{ cs.startDate = e.target.value; };
  document.getElementById('composerStartTime').onchange = (e)=>{ cs.startTime = e.target.value; };
  document.getElementById('composerDue').onchange = (e)=>{ cs.due = e.target.value; };
  document.getElementById('composerTime').onchange = (e)=>{ cs.time = e.target.value; };
  document.getElementById('composerAssignee').onchange = (e)=>{ cs.assigneeId = e.target.value; };
  document.getElementById('composerPriority').onchange = (e)=>{ cs.priority = e.target.value; };
  document.getElementById('composerWorkflow').onchange = (e)=>{ cs.workflowId = e.target.value; };
  document.getElementById('composerDept').onchange = (e)=>{ cs.departmentId = e.target.value; };

  const projSel = document.getElementById('composerProject');
  if(projSel) projSel.onchange = (e)=>{
    if(e.target.value === '__new__'){ cs.addingProject = true; refreshComposer('composerNewProject'); }
    else cs.projectId = e.target.value;
  };
  const addProjBtn = document.getElementById('composerAddProjectBtn');
  if(addProjBtn){
    const nameInput = document.getElementById('composerNewProject');
    nameInput.oninput = (e)=>{ cs.newProjectName = e.target.value; };
    nameInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addProjBtn.click(); } };
    addProjBtn.onclick = ()=>{
      const name = (cs.newProjectName||'').trim();
      if(!name){ toast('Nhập tên dự án'); return; }
      const p = {
        id:uid(), groupId: ACTIVE_GROUP || 'work', name, description:"", icon:PROJECT_ICONS[STATE.projects.length % PROJECT_ICONS.length],
        color:WORKFLOW_COLORS[STATE.projects.length % WORKFLOW_COLORS.length],
        startDate: nowISO(), endDate:null, goal:"", status:"Đang thực hiện", priority:"Trung bình",
        ownerId: STATE.currentUserId, creatorId: STATE.currentUserId, driveFiles:[], createdAt: nowISO()
      };
      STATE.projects.push(p); persist();
      cs.projectId = p.id; cs.addingProject = false; cs.newProjectName = "";
      toast(`Đã tạo dự án "${name}"`);
      refreshComposer('composerInput');
    };
    document.getElementById('composerCancelProjectBtn').onclick = ()=>{
      cs.addingProject = false; cs.newProjectName = ""; refreshComposer('composerInput');
    };
  }

  function submit(){
    const title = (cs.title||input.value).trim();
    if(!title){ toast('Nhập nội dung công việc trước'); return; }
    // Deadline can be date-only. `start` is set only when a clock time is
    // given — that is what puts the task on the timetable.
    let deadline = null, start = null;
    if(cs.due) deadline = new Date(cs.due + "T" + (cs.time || "18:00") + ":00").toISOString();
    if(cs.startDate) start = new Date(cs.startDate + "T" + (cs.startTime || "09:00") + ":00").toISOString();
    else if(cs.startTime){
      const today = new Date();
      start = new Date(`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}T${cs.startTime}:00`).toISOString();
    }
    addTask({
      title, deadline, start, priority: cs.priority,
      assigneeId: cs.assigneeId||null, projectId: cs.projectId||null,
      workflowId: cs.workflowId||null, departmentId: cs.departmentId||null,
      status:'Cần làm',
    });
    composerState = { title:"", startDate:"", startTime:"", due:"", time:"", assigneeId:"", priority:"Trung bình", projectId:"", workflowId:"", departmentId:"", addingProject:false, newProjectName:"" };
    toast(start ? 'Đã tạo nhiệm vụ và xếp vào thời gian biểu' : 'Đã tạo nhiệm vụ mới');
    if(window.closeComposerPopup) window.closeComposerPopup();
    renderView();
  }
  input.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  document.getElementById('composerSubmit').onclick = submit;
}

function openDeptModal(id){
  const existing = id? deptById(id): null;
  let icon = existing?existing.icon:DEPT_ICONS[0];
  let color = existing?existing.color:WORKFLOW_COLORS[0];
  let draftName = existing?existing.name:"";
  const overlay = document.createElement('div'); overlay.className='overlay';
  function html(){ return `<div class="modal">
    <div class="modal-header"><div class="modal-title">🏢 ${existing?'Sửa nhóm công việc':'Thêm nhóm công việc'}</div><button class="close-x" id="closeModal">✕</button></div>
    <div class="field"><label>Tên nhóm công việc</label><input id="d_name" type="text" value="${esc(draftName)}" placeholder="VD: Ban Kỹ thuật"></div>
    <div class="field"><label>Icon</label><div class="icon-picker">${DEPT_ICONS.map(i=>`<span class="${icon===i?'selected':''}" data-icon="${i}">${i}</span>`).join("")}</div></div>
    <div class="field"><label>Màu sắc</label><div class="color-swatch-row">${WORKFLOW_COLORS.map(c=>`<span class="color-swatch ${color===c?'selected':''}" data-color="${c}" style="background:${c};"></span>`).join("")}</div></div>
    <div style="display:flex;justify-content:flex-end;margin-top:16px;"><button class="btn btn-primary" id="saveDept">${existing?'Lưu thay đổi':'Tạo nhóm công việc'}</button></div>
  </div>`; }
  /** Capture what the user typed so a redraw (icon/colour click) never wipes it. */
  function syncFromDom(){
    const el = document.getElementById('d_name');
    if(el) draftName = el.value;
  }
  function draw(){ overlay.innerHTML=html(); wire(); }
  function wire(){
    document.getElementById('closeModal').onclick = ()=>overlay.remove();
    overlay.onclick=(e)=>{ if(e.target===overlay) overlay.remove(); };
    document.getElementById('d_name').oninput = (e)=>{ draftName = e.target.value; };
    overlay.querySelectorAll('[data-icon]').forEach(el=> el.onclick=()=>{ syncFromDom(); icon=el.dataset.icon; draw(); });
    overlay.querySelectorAll('[data-color]').forEach(el=> el.onclick=()=>{ syncFromDom(); color=el.dataset.color; draw(); });
    document.getElementById('saveDept').onclick = ()=>{
      syncFromDom();
      const name = draftName.trim();
      if(!name){ toast('Nhập tên nhóm công việc'); return; }
      if(existing){ Object.assign(existing, {name, icon, color}); }
      else { STATE.departments.push({id:uid(), name, icon, color}); }
      persist(); overlay.remove(); renderView(); toast(existing?'Đã cập nhật':'Đã thêm nhóm công việc');
    };
  }
  document.body.appendChild(overlay); draw();
}
function wireDepartments(){
  document.getElementById('newDeptBtn').onclick = ()=> openDeptModal(null);
  document.querySelectorAll('[data-edit-dept]').forEach(el=> el.onclick = ()=> openDeptModal(el.dataset.editDept));

    STATE.departments = STATE.departments.filter(d=>d.id!==el.dataset.delDept);

}

    </div>

  </div>`; }
  async function onAvatarChange(e){
    const f = e.target.files[0]; if(!f) return;

    avatarData = await readFileAsDataUrl(f);
    bindModal();
  }
  function bindModal(){
    overlay.innerHTML = html();
    document.getElementById('closeModal').onclick = ()=>overlay.remove();
    document.getElementById('cancelEmp').onclick = ()=>overlay.remove();
    document.getElementById('e_avatarInput').onchange = onAvatarChange;

  }

  overlay.onclick=(e)=>{ if(e.target===overlay) overlay.remove(); };
  bindModal();
  function saveHandler(){
    const name = document.getElementById('e_name').value.trim();
    const username = document.getElementById('e_username').value.trim();
    const departmentId = document.getElementById('e_dept').value;
    if(!name || !username || !departmentId){ toast('Vui lòng nhập đủ Họ tên, Tên đăng nhập, Nhóm công việc'); return; }
    const pwField = document.getElementById('e_password').value;
    const data = {
      name, username,
      password: pwField ? pwField : (existing? existing.password : Math.random().toString(36).slice(2,8)),
      email: document.getElementById('e_email').value.trim(),
      phone: document.getElementById('e_phone').value.trim(),

      avatarUrl: avatarData,

  }
  document.getElementById('saveEmp').onclick = saveHandler;

function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
}
function wireEmployees(){
  document.getElementById('newEmpBtn').onclick = ()=> openEmpModal(null);

  if(searchInput) searchInput.oninput = ()=>{
    const q = searchInput.value.trim().toLowerCase();
    document.querySelectorAll('#empTableBody tr').forEach(row=>{ row.style.display = (!q || row.dataset.empKeyword.includes(q)) ? '' : 'none'; });
  };
  document.querySelectorAll('[data-view-emp],[data-edit-emp]').forEach(el=> el.onclick = ()=> openEmpModal(el.dataset.viewEmp||el.dataset.editEmp));
  document.querySelectorAll('[data-del-emp]').forEach(el=> el.onclick = ()=>{
    const id = el.dataset.delEmp;
    if(id===STATE.currentUserId){ toast('Không thể xoá tài khoản chủ sở hữu hiện tại'); return; }
    if(!confirm('Xoá người thực hiện này?')) return;
    STATE.employees = STATE.employees.filter(x=>x.id!==id);
    STATE.tasks.forEach(t=>{ if(t.assigneeId===id) t.assigneeId=null; t.executorIds=(t.executorIds||[]).filter(x=>x!==id); });

  function syncFromDom(){ const el=document.getElementById('w_name'); if(el) draftName = el.value; }

function statusBadgeClass(s){ return s==='Hoàn tất' ? 'badge success' : s==='Đang thực hiện' ? 'badge purple' : 'badge'; }
/* ---------- Pinning: pinned rows float to the top of their list ---------- */
function togglePinTask(id){
  const t = STATE.tasks.find(x=>x.id===id); if(!t) return;
  t.pinned = !t.pinned; persist(); renderView();
  toast(t.pinned ? 'Đã ghim lên đầu' : 'Đã bỏ ghim');
}
function togglePinProject(id){
  const p = projectById(id); if(!p) return;
  p.pinned = !p.pinned; persist(); renderView();
  toast(p.pinned ? 'Đã ghim lên đầu' : 'Đã bỏ ghim');
}
/** Stable sort that always lifts pinned items above the rest. */
function pinnedFirst(list){
  return [...list].sort((a,b)=> (b.pinned?1:0) - (a.pinned?1:0));
}
/** Compact deadline chip for a subtask row (date, plus time when set). */
function subDeadlineHtml(c){
  if(!c.deadline && !c.start) return '';
  const when = c.deadline || c.start;
  const over = c.deadline && !c.done && new Date(c.deadline) < new Date();
  return `<span class="sub-due ${over?'over':''}">${icon('calendar',10)}${fmtDDMMM(when)}${c.start?` <b>${fmtHM(c.start)}</b>`:''}</span>`;
}
function pinButtonHtml(id, pinned, kind){
  return `<button class="btn-icon pin-btn ${pinned?'pinned':''}" data-pin-${kind}="${id}"
    title="${pinned?'Bỏ ghim':'Ghim lên đầu'}">${icon(pinned?'star-filled':'star',14)}</button>`;
}
function groupName(key){ const g = WORK_GROUPS.find(x=>x.key===key); return g?g.name:''; }
function groupColor(key){ const g = WORK_GROUPS.find(x=>x.key===key); return g?g.color:'var(--text-3)'; }

/* =========================================================
   TASKS (list + modal)
   ========================================================= */
const TASK_SORTS = [["deadline","Hạn chót gần nhất"],["priority","Độ ưu tiên"],["created","Mới tạo trước"],["title","Tên (A-Z)"],["progress","Tiến độ cao nhất"]];
function sortTasks(list, sortBy){
  const arr = [...list];
  if(sortBy==='priority') arr.sort((a,b)=> priorityRank(a.priority)-priorityRank(b.priority));
  else if(sortBy==='created') arr.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  else if(sortBy==='title') arr.sort((a,b)=> a.title.localeCompare(b.title,'vi'));
  else if(sortBy==='progress') arr.sort((a,b)=> (b.status==='Hoàn thành'?100:b.completion) - (a.status==='Hoàn thành'?100:a.completion));
  else arr.sort((a,b)=> new Date(a.deadline||'2999-12-31') - new Date(b.deadline||'2999-12-31'));
  // Pinned on top, then finished work, then frozen work — both kinds of
  // "not right now" sink below whatever still needs attention.
  return frozenLast(doneLast(pinnedFirst(arr)));
}
/** Frozen tasks drop out of the priority order until they thaw. */
function frozenLast(list){
  return [...list.filter(t=>!isFrozen(t)), ...list.filter(isFrozen)];
}
/** Finished tasks sink to the end of every list, whatever the sort is — the
 *  table should open on the work that still needs doing. `filter` is stable,
 *  so the chosen sort still decides the order inside each half. */
function doneLast(list){
  const done = t=> t.status==='Hoàn thành';
  return [...list.filter(t=>!done(t)), ...list.filter(done)];
}
/** Days-left pill, shaded on the red scale — nearer deadline = deeper red. */
function dueBadgeHtml(t){
  if(!t.deadline || t.status==='Hoàn thành') return '';
  const ms = new Date(t.deadline) - new Date();
  if(ms < 0){
    const days = Math.max(1, Math.ceil(Math.abs(ms)/86400000));
    const s = dueScaleFor(0);
    return `<span class="due-pill" style="background:${s.bg};color:${s.fg};">Quá hạn ${days} ngày</span>`;
  }
  const days = Math.ceil(ms/86400000);
  const s = dueScaleFor(days);
  if(days<=0) return `<span class="due-pill" style="background:${DUE_SCALE[0].bg};color:${DUE_SCALE[0].fg};">Đến hạn hôm nay</span>`;
  return `<span class="due-pill" style="background:${s.bg};color:${s.fg};">Còn ${days} ngày</span>`;
}
/** Deadline date shown in its own cell (DD-MMM), next to the days-left pill. */
function deadlineDateCellHtml(t){
  if(!t.deadline) return `<span class="due-date muted">—</span>`;
  const overdue = isOverdue(t);
  const timed = hasExplicitTime(t);
  return `<span class="due-date ${overdue?'overdue':''}" title="${fmtDateTimeFull(t.deadline)}">${icon('calendar',12)}${fmtDDMMM(t.deadline)}${timed?`<b class="due-time">${fmtHM(t.deadline)}</b>`:''}</span>`;
}
function fmtHM(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDateTimeFull(iso){ return new Date(iso).toLocaleString(loc(),{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
/** A task/subtask is "timed" only when it carries an explicit clock time. */
function hasExplicitTime(item){ return !!item.start; }
function viewTasks(){
  let list = activeTasks();
  if(taskFilters.workflowId){ list = list.filter(t=>t.workflowId===taskFilters.workflowId); }
  if(taskFilters.projectId){
    list = taskFilters.projectId==='__none__'

      : list.filter(t=>t.projectId===taskFilters.projectId);

  if(taskFilters.query){ list = list.filter(t=> taskMatches(t, taskFilters.query)); }
  list = sortTasks(list, taskFilters.sortBy);
  const activeWf = taskFilters.workflowId ? workflowById(taskFilters.workflowId) : null;
  return `
    ${topbarHtml('Nhiệm vụ', icon('check',20), activeWf?`Đang lọc theo Workflow: <b>${esc(activeWf.name)}</b> <a href="#" id="clearWfFilter" style="color:var(--brand);">(bỏ lọc)</a>`:'', `
      <div class="search-box"><div class="search-input-wrap"><span class="srch-ico">${icon('search',15)}</span><input type="text" id="taskSearchInput" placeholder="Tìm kiếm nhiệm vụ…" value="${esc(taskFilters.query||'')}"></div></div>

        ${hashtagChipsHtml(t.hashtags, 3)}
      </div>
      ${hasSubtasks ? `<div class="task-progress">

        <span style="font-size:10.5px;font-weight:700;color:${progressGradientColor(pct)};">${t.checklist.filter(c=>c.done).length}/${t.checklist.length} · ${pct}%</span>

    </span>
    <span class="col-project">${proj
        ? `<span class="badge" style="background:color-mix(in srgb, ${proj.color} 14%, transparent);color:${proj.color};max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-block;" title="${esc(proj.name)}">${esc(proj.name)}</span>`
        : (wf ? `<span class="badge" style="background:color-mix(in srgb, ${wf.color} 14%, transparent);color:${wf.color};" title="Workflow">${esc(wf.name)}</span>` : '')}</span>
    <span class="col-deadline">${deadlineDateCellHtml(t)}</span>
    <span class="col-due">${dueBadgeHtml(t)}</span>
    <span class="col-status"><select class="status-select ${statusClassFor(t.status)}" data-status-select="${t.id}" style="width:100%;">${TASK_STATUSES.map(s=>`<option value="${esc(s)}" ${t.status===s?"selected":""}>${s}</option>`).join("")}</select></span>
    <button class="btn-icon" data-open="${t.id}" title="Sửa">${icon('edit',14)}</button>
    <button class="btn-icon danger" data-del-task="${t.id}" title="Xoá">${icon('trash',14)}</button>
  </div>
  ${overdue? `<div style="position:absolute;left:-3px;top:8px;bottom:8px;width:3px;background:var(--danger);border-radius:2px;"></div>`:''}
  ${expanded && hasSubtasks ? `<div style="padding:6px 14px 10px 60px; display:flex; flex-direction:column; gap:6px;">

/** One expandable subtask line. Shared by every list that expands a task, so
 *  the right-click menu, colour tint and frost behave identically everywhere. */
function subRowHtml(t, c){
  return `<div class="sub-row ${c.done?'done':''} ${c.color?'tinted':''} ${isFrozen(c)?'frozen':''}"
    data-task-ctx="${t.id}" data-sub-ctx="${c.id}"${taskColorStyle(c)}>
    ${frostHtml(c)}
    <button class="hover-sub-check ${c.done?'done':''}" data-inline-sub-toggle="${t.id}|${c.id}">${c.done?'✓':''}</button>
    <span class="sub-row-text">${esc(c.text||"(chưa đặt tên)")}</span>
    ${alarmChipHtml(c)}
    ${subDeadlineHtml(c)}
  </div>`;
}
/** The frost sheet laid over a frozen row, plus its countdown. */
function frostHtml(item){
  if(!isFrozen(item)) return '';
  return `<span class="frost" aria-hidden="true">
    <span class="frost-label">🧊 ${esc(freezeRemaining(item))}</span>
  </span>`;
}
/** Small bell shown while an alarm is pending on this item. */
function alarmChipHtml(item){
  if(!isFiniteDate(item.alarmAt) || item.alarmFiredAt) return '';
  return `<span class="alarm-chip" title="Báo thức lúc ${fmtDateTimeFull(item.alarmAt)}">${icon('bell',11)}${fmtHM(item.alarmAt)}</span>`;
}
function exportTasksCsv(){
  const rows = [["Tiêu đề","Dự án","Workflow","Người phụ trách","Ưu tiên","Trạng thái","Hạn chót","Tiến độ %"]];
  activeTasks().forEach(t=>{
    rows.push([t.title, projectById(t.projectId)?.name||"", workflowById(t.workflowId)?.name||"", empById(t.assigneeId)?.name||"", t.priority, t.status, t.deadline?fmtDDMMM(t.deadline):"", t.status==='Hoàn thành'?100:t.completion]);
  });
  const csv = rows.map(r=> r.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download="nhiem-vu-bach-office.csv"; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function wireTasks(){
  const searchInput = document.getElementById('taskSearchInput');
  if(searchInput) searchInput.oninput = ()=>{ taskFilters.query = searchInput.value; renderViewKeepFocus('taskSearchInput'); };
  const clearWf = document.getElementById('clearWfFilter');
  if(clearWf) clearWf.onclick = (e)=>{ e.preventDefault(); taskFilters.workflowId=null; renderView(); };
  document.getElementById('createTaskBtn').onclick = ()=> openTaskModal(null, {});
  document.getElementById('exportCsvBtn').onclick = exportTasksCsv;
  document.getElementById('taskSortSelect').onchange = (e)=>{ taskFilters.sortBy = e.target.value; renderView(); };
  document.getElementById('taskProjectFilter').onchange = (e)=>{ taskFilters.projectId = e.target.value; renderView(); };
  document.getElementById('taskStatusFilter').onchange = (e)=>{ taskFilters.status = e.target.value; renderView(); };
  document.getElementById('taskFilterReset').onclick = ()=>{
    taskFilters = { query:"", sortBy:"deadline", projectId:"", status:"", workflowId:null };
    renderView(); toast('Đã xoá bộ lọc');
  };
  // Clicking the row expands/collapses its subtasks; the pencil opens the editor.
  document.querySelectorAll('[data-row-toggle]').forEach(el=> el.onclick = ()=>{
    const id = el.dataset.rowToggle;
    const t = STATE.tasks.find(x=>x.id===id);
    if(!t || !(t.checklist||[]).length){ openTaskModal(id); return; }
    if(expandedTaskIds.has(id)) expandedTaskIds.delete(id); else expandedTaskIds.add(id);
    renderView();
  });
  document.querySelectorAll('[data-open]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); openTaskModal(el.dataset.open); });
  document.querySelectorAll('[data-status-select]').forEach(el=>{
    el.onclick = (e)=> e.stopPropagation();
    el.onchange = (e)=>{ e.stopPropagation(); updateTask(el.dataset.statusSelect, {status:el.value}, `Chuyển trạng thái sang "${el.value}"`); renderView(); };
  });
  document.querySelectorAll('[data-del-task]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    if(!confirm('Xoá nhiệm vụ này?')) return;
    animateRowOut(el, ()=>{ deleteTaskById(el.dataset.delTask); renderView(); toast("Đã xoá nhiệm vụ"); });
  });
  document.querySelectorAll('[data-toggle-task]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); toggleTaskDone(el.dataset.toggleTask, el); });
  document.querySelectorAll('[data-pin-task]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); togglePinTask(el.dataset.pinTask); });
  // Right-click a row as a shortcut to pin/unpin.
  document.querySelectorAll('[data-row-toggle]').forEach(el=> el.oncontextmenu = (e)=>{
    e.preventDefault(); togglePinTask(el.dataset.rowToggle);
  });
  document.querySelectorAll('[data-inline-sub-toggle]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    const [taskId, subId] = el.dataset.inlineSubToggle.split('|');
    toggleChecklistItem(taskId, subId);
  });
  wireHoverSubtasks();
}

function openTaskModal(id, prefill){

        <div class="field"><label>Workflow</label><select id="tm_workflow"><option value="">— Chọn Workflow —</option>${STATE.workflows.map(w=>`<option value="${w.id}" ${t.workflowId===w.id?'selected':''}>${w.icon} ${esc(w.name)}</option>`).join("")}</select></div>

        <div class="field"><label data-tm-deadline-label>${isEvent(t)?'Kết thúc sự kiện':'Hạn chót'}</label><input id="tm_deadline" type="datetime-local" value="${toLocalInput(t.deadline)}"></div>
        <div class="field"><label data-tm-start-label>${isEvent(t)?'Bắt đầu sự kiện':'Bắt đầu'}</label><input id="tm_start" type="datetime-local" value="${toLocalInput(t.start)}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Ước tính (giờ)</label><input id="tm_estimate" type="number" min="0" step="0.5" value="${t.estimateHours||1}"></div>
        <div class="field"><label>Tiến độ ${auto!==null?'(tự động theo công việc con)':'(%)'}</label><input id="tm_completion" type="number" min="0" max="100" value="${auto!==null?auto:(t.completion||0)}" ${auto!==null?'disabled style="opacity:.7"':''}></div>

      <div class="field">
        <label>Công việc con (${checklist.filter(c=>c.done).length}/${checklist.length}) <span style="font-weight:500;color:var(--text-3);">— đặt giờ để lên thời gian biểu</span></label>
        <div id="checklistWrap">${checklist.map(c=>`<div class="sub-edit-row">
          ${checkboxHtml(c.done, `data-sub-toggle="${c.id}"`, 18)}

          <label class="sub-edit-when" title="Hạn công việc con">${icon('flag',11)}<input type="date" data-sub-due="${c.id}" value="${toLocalDateInput(c.deadline)}"></label>
          <label class="sub-edit-when" title="Giờ bắt đầu — có giờ mới lên thời gian biểu">${icon('clock',11)}<input type="time" data-sub-time="${c.id}" value="${c.start?fmtHM(c.start):''}"></label>

      <div class="field"><label>${icon("user",12)} NGƯỜI PHỤ TRÁCH</label><select id="tm_assignee"><option value="">Chưa giao</option>${STATE.employees.map(e=>`<option value="${e.id}" ${t.assigneeId===e.id?'selected':''}>${esc(e.name)}</option>`).join("")}</select></div>
      <div class="field">
        <label>${icon("people",12)} NGƯỜI THỰC HIỆN</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${STATE.employees.map(e=>`<button type="button" class="pill-toggle ${executorIds.includes(e.id)?'active':''}" data-executor-toggle="${e.id}">${avatarHtml(e,16)} ${esc(e.name)}</button>`).join("")}
        </div>
      </div>

      ${existing ? `
      <div class="pill-toggle-row" style="margin-top:16px;margin-bottom:10px;">
        <button class="pill-toggle ${activeTab==='comments'?'active':''}" data-tab="comments">💬 Bình luận (${(t.comments||[]).length})</button>
        <button class="pill-toggle ${activeTab==='activity'?'active':''}" data-tab="activity">📜 Lịch sử hoạt động (${(t.activity||[]).length})</button>
      </div>
      ${activeTab==='comments' ? `
        <div style="max-height:160px;overflow-y:auto;margin-bottom:10px;">
          ${(t.comments||[]).length ? t.comments.map(c=>{ const author=empById(c.authorId); return `<div style="display:flex;gap:8px;margin-bottom:10px;">${avatarHtml(author,26)}<div><b style="font-size:12.5px;">${author?esc(author.name):'—'}</b><div style="font-size:12.5px;color:var(--text-2);">${esc(c.text)}</div><div style="font-size:10.5px;color:var(--text-3);">${fmtDate(c.createdAt)}</div></div></div>`; }).join("") : `<div style="font-size:12.5px;color:var(--text-3);">Chưa có bình luận nào</div>`}
        </div>
        <div style="display:flex;gap:8px;"><input id="tm_comment" type="text" placeholder="Viết bình luận…" style="flex:1;border:1px solid var(--border);border-radius:9px;padding:8px 11px;background:var(--surface-2);outline:none;"><button class="btn btn-primary btn-sm" id="sendComment">Gửi</button></div>
      ` : `
        <div style="max-height:200px;overflow-y:auto;">
          ${(t.activity||[]).map(a=>`<div style="font-size:12px;color:var(--text-2);padding:5px 0;border-bottom:1px solid var(--border);">${esc(a.text)} <span style="color:var(--text-3);">· ${fmtDate(a.createdAt)}</span></div>`).join("")}
        </div>
      `}` : ''}

      ${existing ? `
      <div class="modal-section-label">${icon('edit',12)} GHI CHÚ LIÊN QUAN</div>

      <div class="action-grid">

        <button class="action-item" id="timerBtn">${activeTimer&&activeTimer.taskId===t.id?icon('stop',15)+' Dừng tính giờ':icon('play',15)+' Bắt đầu tính giờ'}</button>
