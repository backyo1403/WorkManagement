/* ---------- editor ---------- */
/* Each tool knows how to apply itself in both modes: `cmd` drives the rich
   editor through execCommand, `wrap`/`prefix`/`insert` edit raw Markdown when
   the source view is open. */
const MD_TOOLS = [
  {key:'bold',   label:'B',  title:'Đậm (Ctrl+B)',      cmd:'bold',                wrap:['**','**'], sc:'b'},
  {key:'italic', label:'I',  title:'Nghiêng (Ctrl+I)',  cmd:'italic',              wrap:['*','*'],   sc:'i'},
  {key:'under',  label:'U',  title:'Gạch chân (Ctrl+U)',cmd:'underline',           wrap:['++','++'], sc:'u'},
  {key:'strike', label:'S',  title:'Gạch ngang',        cmd:'strikeThrough',       wrap:['~~','~~']},
  {key:'h1',     label:'H1', title:'Tiêu đề 1',         block:'H1',                prefix:'# '},
  {key:'h2',     label:'H2', title:'Tiêu đề 2',         block:'H2',                prefix:'## '},
  {key:'h3',     label:'H3', title:'Tiêu đề 3',         block:'H3',                prefix:'### '},
  {key:'ul',     label:'•',  title:'Danh sách',         cmd:'insertUnorderedList', prefix:'- '},
  {key:'ol',     label:'1.', title:'Danh sách đánh số', cmd:'insertOrderedList',   prefix:'1. '},
  {key:'task',   ico:'check',title:'Checklist',         task:true,                 prefix:'- [ ] '},
  {key:'quote',  label:'❝',  title:'Trích dẫn',         block:'BLOCKQUOTE',        prefix:'> '},
  {key:'code',   ico:'board',title:'Khối mã',           block:'PRE',               wrap:['\n```\n','\n```\n']},
  {key:'fg',     label:'A',  title:'Màu chữ',           palette:'fg'},
  {key:'bg',     ico:'tag',  title:'Màu nền chữ',       palette:'bg'},
  {key:'link',   ico:'link', title:'Liên kết (Ctrl+K)', link:true,                 wrap:['[','](https://)'], sc:'k'},
  {key:'hr',     ico:'minus',title:'Đường kẻ ngang',    cmd:'insertHorizontalRule',insert:'\n\n---\n\n'},
];

function noteEditorHtml(n){
  const saveLabel = {idle:'Sửa '+relTime(n.updatedAt), dirty:'Chưa lưu…', saving:'Đang lưu…', saved:'Đã lưu'}[noteSaveState];
  const checklist = mdChecklist(n.content);
  const pending = unconvertedChecklist(n).length;
  return `<div class="note-editor-layout">
    <div class="note-editor-main">
      <div class="note-editor-head">
        <button class="btn btn-ghost btn-sm" id="noteBack">← Ghi chú</button>
        <div class="note-editor-actions">
          <span class="note-save-state ${noteSaveState}">${noteSaveState==='saved'?icon('check',12):''}${saveLabel}</span>
          <button class="btn-icon ${n.favorite?'pinned':''}" id="noteFav" title="${n.favorite?'Bỏ yêu thích':'Yêu thích'}">${icon(n.favorite?'star-filled':'star',15)}</button>
          <div class="note-menu-wrap">
            <button class="btn-icon" id="noteMenuBtn" title="Hành động">${icon('dots',15)}</button>
            <div class="note-menu" id="noteMenu" hidden>
              ${[
                ['rename','edit','Đổi tên'],
                ['duplicate','archive','Nhân bản'],
                ['favorite', n.favorite?'star-filled':'star', n.favorite?'Bỏ yêu thích':'Yêu thích'],
                ['versions','clock','Lịch sử phiên bản'],
                ['copylink','link','Copy link'],
                ['export','download','Xuất Markdown'],
                ['print','upload','In / Lưu PDF'],
                ['archive','archive', n.archived?'Bỏ lưu trữ':'Lưu trữ'],
              ].map(([k,ic,label])=>`<button class="note-menu-item" data-note-action="${k}">${icon(ic,14)} ${label}</button>`).join("")}
              ${n.deletedAt
                ? `<button class="note-menu-item" data-note-action="restore">${icon('refresh',14)} Khôi phục</button>
                   <button class="note-menu-item danger" data-note-action="purge">${icon('trash',14)} Xoá vĩnh viễn</button>`
                : `<button class="note-menu-item danger" data-note-action="trash">${icon('trash',14)} Chuyển vào thùng rác</button>`}
            </div>
          </div>
        </div>
      </div>

      ${n.deletedAt ? `<div class="badge overdue" style="display:block;padding:9px 12px;margin-bottom:12px;">
        🗑️ Ghi chú này đang ở thùng rác.
        <button class="btn btn-ghost btn-sm" style="margin-left:8px;" data-note-action="restore">Khôi phục</button></div>` : ''}

      <input id="noteTitle" class="note-title-input" value="${esc(n.title)}" placeholder="Tiêu đề ghi chú">

      <div class="md-editor">
        <div class="md-toolbar">
          ${MD_TOOLS.map(t=> t.palette ? `<span class="md-swatch-wrap">
              <button class="md-tool md-tool-color" data-md-palette="${t.palette}" title="${esc(t.title)}">
                ${t.ico?icon(t.ico,14):t.label}<i class="md-swatch-bar" data-swatch-preview="${t.palette}"></i>
              </button>
              <div class="md-palette" data-palette-for="${t.palette}" hidden>
                ${(t.palette==='fg'?NOTE_TEXT_COLORS:NOTE_HIGHLIGHTS).map(c=>`
                  <button class="md-swatch ${c.value?'':'none'}" title="${esc(c.name)}"
                    data-apply-color="${t.palette}|${c.value}"
                    style="${c.value ? (t.palette==='fg'?`background:${c.value};`:`background:${c.value};`) : ''}"></button>`).join("")}
              </div>
            </span>`
            : `<button class="md-tool" data-md-tool="${t.key}" title="${esc(t.title)}"
            >${t.ico?icon(t.ico,14):t.label}</button>`).join("")}
          <div class="md-mode">
            <button data-md-mode="rich" class="${noteEditorMode==='rich'?'active':''}">Soạn</button>
            <button data-md-mode="source" class="${noteEditorMode==='source'?'active':''}">Markdown</button>
          </div>
        </div>
        ${noteEditorMode==='rich'
          ? `<div id="noteRich" class="md-rich" contenteditable="true" spellcheck="false"
               data-placeholder="Bắt đầu viết…">${mdRenderInner(n.content, true) || '<p><br></p>'}</div>`
          : `<textarea id="noteBody" class="md-input" spellcheck="false" placeholder="Bắt đầu viết… hỗ trợ Markdown">${esc(n.content)}</textarea>`}
      </div>

      <div class="note-quick-actions">
        <button class="btn btn-ghost btn-sm" id="noteTaskFromSel">${icon('plus',13)} Tạo nhiệm vụ từ đoạn đã chọn</button>
        ${checklist.length ? `<button class="btn btn-ghost btn-sm" id="noteConvert" ${pending?'':'disabled title="Mọi mục checklist đã được tạo thành nhiệm vụ"'}>
          ${icon('check',13)} ${pending?`Chuyển checklist thành nhiệm vụ (${pending})`:'Checklist đã chuyển hết'}</button>` : ''}
      </div>

      <div class="note-mobile-panels">
        <button class="note-panel-toggle" data-note-panel="tasks">${icon('link',14)} Nhiệm vụ liên kết
          <em>${(n.linkedTaskIds||[]).length}</em>${icon('chevron',13,noteMobilePanel==='tasks'?'transform:rotate(90deg);':'')}</button>
        ${noteMobilePanel==='tasks'?linkedTasksHtml(n):''}
        <button class="note-panel-toggle" data-note-panel="details">${icon('settings',14)} Thông tin
          ${icon('chevron',13,noteMobilePanel==='details'?'transform:rotate(90deg);':'')}</button>
        ${noteMobilePanel==='details'?noteDetailsHtml(n):''}
      </div>
    </div>

    <aside class="note-side">
      ${linkedTasksHtml(n)}
      ${noteDetailsHtml(n)}
    </aside>
  </div>`;
}

/* ---------- notes wiring ---------- */
function openNote(id){
  openNoteId = id;
  noteEditorMode = 'rich';
  noteMobilePanel = 'none';
  noteSaveState = 'idle';
  VIEW = 'notes';
  render();
}
function createNoteFromTemplate(key){
  const tpl = noteTemplate(key) || noteTemplate('blank');
  const note = addNote({
    title: tpl.title,
    content: tpl.content,
    templateKey: key==='blank' ? null : key,
    notebookId: noteView==='notebook' ? noteViewArg : null,
    hashtags: noteView==='tag' && noteViewArg ? [noteViewArg] : [],
  });
  toast('Đã tạo ghi chú mới');
  openNote(note.id);
}

/** Debounced autosave. Redraws only the status chip so typing never re-renders
 *  the textarea underneath the caret. */
function paintSaveState(){
  const el = document.querySelector('.note-save-state');
  if(!el) return;
  const n = noteById(openNoteId);
  const label = {idle: n?'Sửa '+relTime(n.updatedAt):'', dirty:'Chưa lưu…', saving:'Đang lưu…', saved:'Đã lưu'}[noteSaveState];
  el.className = 'note-save-state ' + noteSaveState;
  el.innerHTML = (noteSaveState==='saved'?icon('check',12):'') + label;
  applyLang(el);
}
function queueNoteSave(){
  noteSaveState = 'dirty'; paintSaveState();
  if(noteSaveTimer) clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(flushNoteSave, 500);
}
function flushNoteSave(){
  if(noteSaveTimer){ clearTimeout(noteSaveTimer); noteSaveTimer = null; }
  const n = noteById(openNoteId);
  if(!n) return;
  const titleEl = document.getElementById('noteTitle');
  const bodyEl = document.getElementById('noteBody');
  const richEl = document.getElementById('noteRich');
  const patch = {};
  if(titleEl) patch.title = titleEl.value;
  // Whichever editor is on screen is the source of truth for this save.
  if(richEl) patch.content = mdFromHtml(richEl);
  else if(bodyEl) patch.content = bodyEl.value;
  if(!Object.keys(patch).length) return;
  if(patch.title === n.title && patch.content === n.content){ noteSaveState='idle'; paintSaveState(); return; }
  noteSaveState = 'saving'; paintSaveState();
  updateNote(n.id, patch);
  noteSaveState = 'saved'; paintSaveState();
  if(noteSaveClear) clearTimeout(noteSaveClear);
  noteSaveClear = setTimeout(()=>{ if(noteSaveState==='saved'){ noteSaveState='idle'; paintSaveState(); } }, 1600);
}

/** Toolbar action in the WYSIWYG editor. */
function applyRichTool(tool){
  const el = document.getElementById('noteRich');
  if(!el) return;
  el.focus();

  if(tool.link){
    const sel = window.getSelection();
    const text = sel ? sel.toString() : '';
    const url = prompt('Địa chỉ liên kết:', 'https://');
    if(!url) return;
    if(text) document.execCommand('createLink', false, url);
    else document.execCommand('insertHTML', false,
      `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`);
  } else if(tool.task){
    // execCommand has no checklist; build the item and let the serialiser
    // turn it back into `- [ ]`.
    const text = (window.getSelection() || {toString:()=>''}).toString();
    document.execCommand('insertHTML', false,
      `<ul class="md-tasklist"><li class="md-task"><button type="button" class="md-checkbox" contenteditable="false"></button><span>${esc(text)||'&nbsp;'}</span></li></ul>`);
  } else if(tool.block){
    document.execCommand('formatBlock', false, tool.block);
  } else if(tool.cmd){
    document.execCommand(tool.cmd, false, null);
  }

  wireRichCheckboxes();
  queueNoteSave();
}

/**
 * Text colour / highlight in the WYSIWYG editor.
 *
 * These are the only commands run with `styleWithCSS` on, so they produce a
 * styled <span> the serialiser can map to `{c:…}` / `{h:…}`; bold and the rest
 * stay tag-based. An empty value strips the colour instead of painting one.
 */
function applyRichColor(kind, value){
  const el = document.getElementById('noteRich');
  if(!el) return;
  el.focus();
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed){ toast('Bôi đen đoạn chữ muốn đổi màu'); return; }

  try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
  if(kind === 'fg'){
    document.execCommand('foreColor', false, value || 'inherit');
    if(!value) stripInlineStyle(el, 'color');
  } else {
    // Firefox only honours hiliteColor; Safari only backColor.
    if(!document.execCommand('hiliteColor', false, value || 'transparent')){
      document.execCommand('backColor', false, value || 'transparent');
    }
    if(!value) stripInlineStyle(el, 'backgroundColor');
  }
  try{ document.execCommand('styleWithCSS', false, false); }catch(e){}

  queueNoteSave();
}
/**
 * Clearing a colour: drop the property wherever it sits — execCommand may have
 * put it on a <span> of its own or on an existing <strong>/<em> — then unwrap
 * any span left with nothing to say.
 */
function stripInlineStyle(root, prop){
  root.querySelectorAll('[style]').forEach(el=>{
    el.style[prop] = '';
    if(!el.getAttribute('style')){
      el.removeAttribute('style');
      if(el.nodeName === 'SPAN'){
        const parent = el.parentNode;
        while(el.firstChild) parent.insertBefore(el.firstChild, el);
        parent.removeChild(el);
      }
    }
  });
  root.normalize();
}

/** The same colour action, written straight into the raw Markdown. */
function applyMdColor(kind, value){
  const el = document.getElementById('noteBody');
  if(!el) return;
  const start = el.selectionStart, end = el.selectionEnd;
  if(start === end){ toast('Bôi đen đoạn chữ muốn đổi màu'); return; }
  const text = el.value;
  const selected = text.slice(start, end);
  // Clearing means unwrapping whatever marker is already around the selection.
  const marker = kind === 'fg' ? 'c' : 'h';
  const stripped = selected.replace(new RegExp(`\\{${marker}:#[0-9a-fA-F]{3,8}\\|([\\s\\S]*?)\\}`,'g'), '$1');
  const next = value ? `{${marker}:${value}|${stripped}}` : stripped;
  el.value = text.slice(0,start) + next + text.slice(end);
  el.focus();
  el.setSelectionRange(start, start + next.length);
  queueNoteSave();
}

/** Apply a toolbar action to the raw-Markdown textarea, restoring the caret. */
function applyMdTool(tool){
  const el = document.getElementById('noteBody');
  if(!el) return;
  const start = el.selectionStart, end = el.selectionEnd, text = el.value;
  let next, caret;
  if(tool.insert){
    next = text.slice(0,start) + tool.insert + text.slice(end);
    const pos = start + tool.insert.length; caret = [pos,pos];
  } else if(tool.prefix){
    // Line prefixes toggle on every line the selection touches.
    const lineStart = text.lastIndexOf('\n', start-1) + 1;
    const nl = text.indexOf('\n', end);
    const lineEnd = nl === -1 ? text.length : nl;
    const block = text.slice(lineStart, lineEnd).split('\n')
      .map(l=> l.startsWith(tool.prefix) ? l.slice(tool.prefix.length) : tool.prefix + l).join('\n');
    next = text.slice(0,lineStart) + block + text.slice(lineEnd);
    caret = [lineStart, lineStart + block.length];
  } else {
    const [before, after] = tool.wrap;
    const sel = text.slice(start,end);
    next = text.slice(0,start) + before + sel + after + text.slice(end);
    caret = [start + before.length, start + before.length + sel.length];
  }
  el.value = next;
  el.focus();
  el.setSelectionRange(caret[0], caret[1]);
  queueNoteSave();
}

function wireNotes(){
  /* --- rail --- */
  document.querySelectorAll('[data-note-view]').forEach(el=> el.onclick = ()=>{
    flushNoteSave();
    noteView = el.dataset.noteView; noteViewArg = null; openNoteId = null; noteQuery = '';
    renderView();
  });
  document.querySelectorAll('[data-note-notebook]').forEach(el=> el.onclick = ()=>{
    flushNoteSave();
    noteView = 'notebook'; noteViewArg = el.dataset.noteNotebook; openNoteId = null;
    renderView();
  });
  const nbNew = document.querySelector('[data-new-notebook]');
  if(nbNew) nbNew.onclick = ()=> openNotebookModal(null);

  /* --- list --- */
  const search = document.getElementById('noteSearchInput');
  if(search) search.oninput = ()=>{ noteQuery = search.value; renderViewKeepFocus('noteSearchInput'); };
  document.querySelectorAll('[data-new-note]').forEach(el=> el.onclick = ()=> createNoteFromTemplate('blank'));
  document.querySelectorAll('[data-open-note]').forEach(el=> el.onclick = ()=> openNote(el.dataset.openNote));
  // Right-click a card for the same actions without opening it first.
  document.querySelectorAll('[data-note-ctx]').forEach(el=> el.oncontextmenu = (e)=>{
    e.preventDefault();
    openNoteContextMenu(el.dataset.noteCtx, e.clientX, e.clientY);
  });
  document.querySelectorAll('[data-note-template]').forEach(el=> el.onclick = ()=> createNoteFromTemplate(el.dataset.noteTemplate));

  /* --- notebook unlock gate --- */
  const unlockBtn = document.getElementById('nbUnlock');
  if(unlockBtn){
    const pin = document.getElementById('nbPin');
    const err = document.getElementById('nbPinError');
    const nb = openNoteId ? notebookById(noteById(openNoteId).notebookId) : notebookById(noteViewArg);
    const submit = ()=>{
      if(hashPin(pin.value, nb.pinSalt) !== nb.pinHash){
        err.innerHTML = `<div class="login-error" style="margin-top:10px;">⚠️ PIN không đúng</div>`;
        pin.value = ''; pin.focus();
        return;
      }
      markNotebookUnlocked(nb.id);
      toast(`Đã mở khoá "${nb.name}"`);
      renderView();
    };
    unlockBtn.onclick = submit;
    pin.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
    pin.focus();
  }

  wireNoteEditor();
}

function wireNoteEditor(){
  const n = openNoteId ? noteById(openNoteId) : null;
  // A note whose notebook is locked renders the PIN gate instead of the editor,
  // so there is nothing here to wire.
  if(!n || !document.getElementById('noteBack')) return;

  document.getElementById('noteBack').onclick = ()=>{ flushNoteSave(); openNoteId = null; renderView(); };

  const title = document.getElementById('noteTitle');
  title.oninput = queueNoteSave;

  /* Returns nothing on purpose: an inline `onkeydown` that returns false
     cancels the event, which would swallow every ordinary keystroke. */
  const shortcut = (e, apply)=>{
    if(!(e.ctrlKey || e.metaKey)) return;
    const key = e.key.toLowerCase();
    if(key === 's'){ e.preventDefault(); flushNoteSave(); toast('Đã lưu ghi chú'); return; }
    const tool = MD_TOOLS.find(t=> t.sc === key);
    if(tool){ e.preventDefault(); apply(tool); }
  };

  const rich = document.getElementById('noteRich');
  if(rich){
    // Tag-based markup (<b>/<i>/<u>) instead of inline styles, so the
    // serialiser has something it can map back to Markdown.
    try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
    rich.oninput = queueNoteSave;
    rich.onkeydown = (e)=>{ shortcut(e, applyRichTool); };
    // Paste as plain text: pasted HTML from elsewhere would carry styles and
    // tags the Markdown serialiser has no meaning for.
    rich.onpaste = (e)=>{
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    };
    wireRichCheckboxes();
  }

  const body = document.getElementById('noteBody');
  if(body){
    body.oninput = queueNoteSave;
    body.onkeydown = (e)=>{ shortcut(e, applyMdTool); };
  }

  document.querySelectorAll('[data-md-tool]').forEach(el=> el.onmousedown = (e)=>{
    e.preventDefault();                       // keep the editor's selection alive
    const tool = MD_TOOLS.find(t=>t.key===el.dataset.mdTool);
    if(!tool) return;
    if(document.getElementById('noteRich')) applyRichTool(tool);
    else applyMdTool(tool);
  });

  /* --- colour pickers --- */
  const closePalettes = ()=> document.querySelectorAll('.md-palette').forEach(p=> p.hidden = true);
  document.querySelectorAll('[data-md-palette]').forEach(el=> el.onmousedown = (e)=>{
    e.preventDefault();                       // the selection must survive the click
    e.stopPropagation();
    const box = document.querySelector(`[data-palette-for="${el.dataset.mdPalette}"]`);
    const wasOpen = !box.hidden;
    closePalettes();
    box.hidden = wasOpen;
  });
  document.querySelectorAll('[data-apply-color]').forEach(el=> el.onmousedown = (e)=>{
    e.preventDefault();
    e.stopPropagation();
    const [kind, value] = el.dataset.applyColor.split('|');
    closePalettes();
    if(document.getElementById('noteRich')) applyRichColor(kind, value);
    else applyMdColor(kind, value);
    // Remember the last pick so the button's bar previews it.
    const bar = document.querySelector(`[data-swatch-preview="${kind}"]`);
    if(bar) bar.style.background = value || 'var(--text-3)';
  });
  document.addEventListener('click', closePalettes, {once:true});
  document.querySelectorAll('[data-md-mode]').forEach(el=> el.onclick = ()=>{
    flushNoteSave();
    noteEditorMode = el.dataset.mdMode;
    renderView();
  });

  document.getElementById('noteFav').onclick = ()=>{
    updateNote(n.id, {favorite: !n.favorite});
    toast(n.favorite ? 'Đã thêm vào yêu thích' : 'Đã bỏ yêu thích');
    renderView();
  };

  /* --- ••• menu --- */
  const menuBtn = document.getElementById('noteMenuBtn');
  const menu = document.getElementById('noteMenu');
  menuBtn.onclick = (e)=>{ e.stopPropagation(); menu.hidden = !menu.hidden; };
  document.addEventListener('click', ()=>{ if(menu) menu.hidden = true; }, {once:true});
  document.querySelectorAll('[data-note-action]').forEach(el=> el.onclick = ()=> runNoteAction(n, el.dataset.noteAction));

  /* --- quick actions --- */
  document.getElementById('noteTaskFromSel').onclick = ()=>{
    const el = document.getElementById('noteBody');
    const sel = el ? el.value.slice(el.selectionStart, el.selectionEnd).trim() : '';
    if(!sel){ toast('Bôi đen đoạn văn bản muốn biến thành nhiệm vụ'); return; }
    const taskTitle = sel.split('\n')[0].replace(/^\s*[-*+]\s*(\[[ xX]\])?\s*/,'').slice(0,120);
    const task = addTask({ title: taskTitle, status:'Cần làm', projectId: n.projectId||null, departmentId: n.departmentId });
    logActivity(task, `Tạo từ ghi chú "${noteTitleOf(n)}"`);
    setNoteTaskLink(n.id, task.id, true);
    toast(`Đã tạo nhiệm vụ "${taskTitle}"`);
    renderView();
  };
  const convert = document.getElementById('noteConvert');
  if(convert) convert.onclick = ()=>{
    const r = convertChecklistToTasks(n.id);
    toast(r.skipped ? `Đã tạo ${r.created} nhiệm vụ · bỏ qua ${r.skipped} mục đã có`
                    : `Đã tạo ${r.created} nhiệm vụ từ checklist`);
    renderView();
  };

  /* --- linked tasks --- */
  document.querySelectorAll('[data-pick-task]').forEach(el=> el.onclick = ()=> openTaskPicker(n.id));
  // Clicking a linked row opens the real task modal; the checkbox completes it.
  document.querySelectorAll('.linked-row [data-open]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation(); flushNoteSave(); openTaskModal(el.dataset.open);
  });
  document.querySelectorAll('.linked-row [data-toggle-task]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation(); toggleTaskDone(el.dataset.toggleTask, el); renderView();
  });
  document.querySelectorAll('[data-unlink-task]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    const taskId = el.dataset.unlinkTask;
    const task = STATE.tasks.find(t=>t.id===taskId);
    // Nothing to protect when the task is already gone — clear the stale row.
    if(task && !confirm(`Gỡ "${task.title}" khỏi ghi chú này?\n\nNhiệm vụ vẫn được giữ nguyên.`)) return;
    const row = document.querySelector(`[data-linked-row="${taskId}"]`);
    const finish = ()=>{ setNoteTaskLink(n.id, taskId, false); toast('Đã gỡ liên kết nhiệm vụ'); renderView(); };
    if(row){ row.classList.add('removing'); setTimeout(finish, 200); } else finish();
  });

  /* --- details --- */
  const nbSel = document.getElementById('nd_notebook');
  if(nbSel) nbSel.onchange = ()=>{ updateNote(n.id, {notebookId: nbSel.value||null}); toast('Đã chuyển sổ tay'); renderView(); };
  const projSel = document.getElementById('nd_project');
  if(projSel) projSel.onchange = ()=>{
    updateNote(n.id, {projectId: projSel.value||null});
    toast(projSel.value ? 'Đã gắn vào dự án' : 'Đã bỏ khỏi dự án');
    renderView();
  };
  const grpSel = document.getElementById('nd_group');
  if(grpSel) grpSel.onchange = ()=>{ updateNote(n.id, {departmentId: grpSel.value}); renderView(); };
  wireHashtagField('nd', n.hashtags, ()=>{ updateNote(n.id, {hashtags:n.hashtags}); renderView(); });

  const file = document.getElementById('nd_file');
  if(file) file.onchange = async ()=>{
    const f = file.files[0];
    if(!f) return;
    if(f.size > NOTE_ATTACH_MAX_BYTES){ toast('Tệp cần dưới 1.5MB — bản này lưu tệp ngay trong trình duyệt'); return; }
    const dataUrl = await readFileAsDataUrl(f);
    n.attachments.push({id:uid(), name:f.name, mimeType:f.type, size:f.size, dataUrl, createdAt: nowISO()});
    updateNote(n.id, {}, {snapshot:false});
    toast('Đã đính kèm tệp');
    renderView();
  };
  document.querySelectorAll('[data-del-attach]').forEach(el=> el.onclick = ()=>{
    const a = n.attachments.find(x=>x.id===el.dataset.delAttach);
    if(!confirm(`Xoá tệp "${a.name}"?`)) return;
    n.attachments = n.attachments.filter(x=>x.id!==el.dataset.delAttach);
    updateNote(n.id, {}, {snapshot:false});
    toast('Đã xoá tệp đính kèm');
    renderView();
  });

  /* --- mobile collapsibles --- */
  document.querySelectorAll('[data-note-panel]').forEach(el=> el.onclick = ()=>{
    flushNoteSave();
    const which = el.dataset.notePanel;
    noteMobilePanel = noteMobilePanel === which ? 'none' : which;
    renderView();
  });
}

/** Checkboxes live inside the contenteditable, so they are re-wired after every
 *  edit that can create one. `contenteditable=false` keeps the caret out. */
function wireRichCheckboxes(){
  const rich = document.getElementById('noteRich');
  if(!rich) return;
  rich.querySelectorAll('.md-checkbox').forEach(box=>{
    box.setAttribute('contenteditable','false');
    box.disabled = false;
    box.onclick = (e)=>{
      e.preventDefault();
      const done = box.classList.toggle('done');
      box.textContent = done ? '✓' : '';
      const li = box.closest('li');
      if(li){
        const span = li.querySelector('span');
        if(span) span.className = done ? 'md-task-done' : '';
      }
      queueNoteSave();
    };
  });
}

function runNoteAction(n, action){
  switch(action){
    case 'rename': {
      const el = document.getElementById('noteTitle');
      if(el){ el.focus(); el.select(); }
      break;
    }
    case 'duplicate': {
      const copy = addNote({
        title: noteTitleOf(n) + ' (bản sao)', content: n.content,
        notebookId: n.notebookId, projectId: n.projectId, departmentId: n.departmentId,
        templateKey: n.templateKey, hashtags: n.hashtags.slice(),
        // The copy is about the same work, so it keeps the same task links.
        linkedTaskIds: (n.linkedTaskIds||[]).slice(),
      });
      toast('Đã nhân bản ghi chú');
      openNote(copy.id);
      return;
    }
    case 'favorite':
      updateNote(n.id, {favorite: !n.favorite});
      toast(n.favorite ? 'Đã thêm vào yêu thích' : 'Đã bỏ yêu thích');
      break;
    case 'versions': openVersionModal(n.id); return;
    case 'copylink': {
      const url = location.origin + location.pathname + '#note/' + n.id;
      if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast('Đã copy link ghi chú'), ()=>prompt('Copy link ghi chú:', url));
      else prompt('Copy link ghi chú:', url);
      return;
    }
    case 'export': {
      const head = ['# ' + noteTitleOf(n), (n.hashtags||[]).map(h=>'#'+h).join(' ')].filter(Boolean).join('\n');
      const blob = new Blob([head + '\n\n' + n.content], {type:'text/markdown;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = noteTitleOf(n).replace(/[\\/:*?"<>|]/g,'-') + '.md';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      toast('Đã xuất Markdown');
      return;
    }
    // The browser's print dialog is the PDF export — same styles as the preview.
    case 'print': window.print(); return;
    case 'archive':
      updateNote(n.id, {archived: !n.archived}, {snapshot:false});
      toast(n.archived ? 'Đã bỏ lưu trữ' : 'Đã lưu trữ ghi chú');
      break;
    case 'trash':
      updateNote(n.id, {deletedAt: nowISO()}, {snapshot:false});
      toast('Đã chuyển vào thùng rác');
      openNoteId = null;
      break;
    case 'restore':
      updateNote(n.id, {deletedAt: null}, {snapshot:false});
      toast('Đã khôi phục ghi chú');
      break;
    case 'purge':
      if(!confirm(`Xoá vĩnh viễn "${noteTitleOf(n)}"? Không thể hoàn tác.`)) return;
      STATE.notes = STATE.notes.filter(x=>x.id!==n.id);
      persist();
      toast('Đã xoá ghi chú');
      openNoteId = null;
      noteView = 'trash';
      break;
  }
  renderView();
}

/* ---------- pickers ---------- */
/** Choose existing tasks to link. Returns ids only — nothing is duplicated. */
function openTaskPicker(noteId){
  let q = '', fProject = '', fStatus = '', fPriority = '', fDue = '';
  const overlay = document.createElement('div'); overlay.className = 'overlay';

  function results(){
    let list = activeTasks();
    if(fProject) list = list.filter(t=>t.projectId===fProject);
    if(fStatus) list = list.filter(t=>t.status===fStatus);
    if(fPriority) list = list.filter(t=>t.priority===fPriority);
    if(fDue){
      list = list.filter(t=>{
        if(fDue==='none') return !t.deadline;
        if(!t.deadline) return false;
        const days = Math.ceil((new Date(t.deadline) - new Date())/86400000);
        if(fDue==='overdue') return days < 0 && t.status!=='Hoàn thành';
        if(fDue==='today') return isSameDay(t.deadline);
        return days >= 0 && days <= 7;
      });
    }
    if(q.trim()) list = list.filter(t=> t.title.toLowerCase().includes(q.trim().toLowerCase()));
    const n = noteById(noteId);
    // Already-linked tasks float up so the current set is obvious.
    return list.slice().sort((a,b)=> Number(n.linkedTaskIds.includes(b.id)) - Number(n.linkedTaskIds.includes(a.id))).slice(0,60);
  }

  function html(){
    const n = noteById(noteId);
    const list = results();
    return `<div class="modal wide">
      <div class="modal-header"><div class="modal-title">${icon('link',18)} Liên kết nhiệm vụ</div>
        <button class="close-x" id="closeModal">✕</button></div>
      <div class="search-input-wrap" style="margin-bottom:12px;">
        <span class="srch-ico">${icon('search',15)}</span>
        <input type="text" id="tp_q" placeholder="Tìm nhiệm vụ…" value="${esc(q)}">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
        <select class="filter-select" id="tp_proj"><option value="">Tất cả dự án</option>
          ${groupedProjects().map(p=>`<option value="${p.id}" ${fProject===p.id?'selected':''}>${esc(p.name)}</option>`).join("")}</select>
        <select class="filter-select" id="tp_status"><option value="">Tất cả trạng thái</option>
          ${TASK_STATUSES.map(s=>`<option value="${esc(s)}" ${fStatus===s?'selected':''}>${s}</option>`).join("")}</select>
        <select class="filter-select" id="tp_prio"><option value="">Mọi độ ưu tiên</option>
          ${TASK_PRIORITIES.map(([full])=>`<option value="${esc(full)}" ${fPriority===full?'selected':''}>${full}</option>`).join("")}</select>
        <select class="filter-select" id="tp_due">
          <option value="">Mọi hạn chót</option>
          <option value="overdue" ${fDue==='overdue'?'selected':''}>Quá hạn</option>
          <option value="today" ${fDue==='today'?'selected':''}>Đến hạn hôm nay</option>
          <option value="week" ${fDue==='week'?'selected':''}>Trong 7 ngày</option>
          <option value="none" ${fDue==='none'?'selected':''}>Không có hạn</option>
        </select>
      </div>
      <div class="picker-list">
        ${list.length ? list.map(t=>{
          const linked = n.linkedTaskIds.includes(t.id);
          const proj = projectById(t.projectId);
          return `<button class="picker-row ${linked?'linked':''}" data-pick="${t.id}">
            <span class="picker-check ${linked?'on':''}">${linked?'✓':''}</span>
            ${priorityPill(t.priority)}
            <span class="picker-title">${esc(t.title)}</span>
            ${proj?`<span class="badge" style="background:${proj.color}1A;color:${proj.color};">${esc(proj.name)}</span>`:''}
            <span class="col-deadline">${deadlineDateCellHtml(t)}</span>
          </button>`;
        }).join("") : `<div class="picker-empty">Không có nhiệm vụ nào khớp bộ lọc</div>`}
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:16px;">
        <button class="btn btn-primary" id="tp_done">Xong</button>
      </div>
    </div>`;
  }
  function draw(focusId){
    overlay.innerHTML = html();
    document.getElementById('closeModal').onclick = close;
    document.getElementById('tp_done').onclick = close;
    document.getElementById('tp_q').oninput = (e)=>{ q = e.target.value; draw('tp_q'); };
    document.getElementById('tp_proj').onchange = (e)=>{ fProject = e.target.value; draw(); };
    document.getElementById('tp_status').onchange = (e)=>{ fStatus = e.target.value; draw(); };
    document.getElementById('tp_prio').onchange = (e)=>{ fPriority = e.target.value; draw(); };
    document.getElementById('tp_due').onchange = (e)=>{ fDue = e.target.value; draw(); };
    overlay.querySelectorAll('[data-pick]').forEach(el=> el.onclick = ()=>{
      const n = noteById(noteId);
      const linked = n.linkedTaskIds.includes(el.dataset.pick);
      setNoteTaskLink(noteId, el.dataset.pick, !linked);
      toast(linked ? 'Đã gỡ liên kết nhiệm vụ' : 'Đã liên kết nhiệm vụ');
      draw();
    });
    applyLang(overlay);
    if(focusId){
      const el = document.getElementById(focusId);
      if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} }
    }
  }
  function close(){ overlay.remove(); renderView(); }
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  document.body.appendChild(overlay);
  draw('tp_q');
}

/** The mirror of the task picker, for "Ghi chú liên quan". */

      .sort((a,b)=> Number(linked.includes(b.id)) - Number(linked.includes(a.id)))

  function draw(focus){
    overlay.innerHTML = html();
    document.getElementById('closeModal').onclick = close;

  draw(true);
}

/** Repaint any "Ghi chú liên quan" block in place — the task modal lives
 *  outside the view, so a full renderView would close it. */
function refreshRelatedHosts(){
  document.querySelectorAll('[data-related]').forEach(host=>{
    const [mode, id] = host.dataset.related.split('|');
    host.outerHTML = relatedNotesHtml(mode, id);
  });
  wireRelatedNotes();
  applyLang(document.body);
}
function wireRelatedNotes(){
  document.querySelectorAll('[data-pick-note]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    const [mode, id] = el.dataset.pickNote.split('|');
    openNotePicker(mode, id);
  });
  document.querySelectorAll('[data-goto-note]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    const ov = document.querySelector('.overlay');
    if(ov) ov.remove();
    openNote(el.dataset.gotoNote);
  });
  document.querySelectorAll('[data-unlink-note]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    const [mode, id, noteId] = el.dataset.unlinkNote.split('|');

    if(!confirm(`Gỡ "${noteTitleOf(n)}" khỏi mục này?\n\nGhi chú vẫn được giữ nguyên.`)) return;

    else updateNote(noteId, {projectId:null}, {snapshot:false});
    toast('Đã gỡ liên kết ghi chú');
    refreshRelatedHosts();
  });
}

/* ---------- notebook modal ---------- */
function openNotebookModal(id){
  const existing = id ? notebookById(id) : null;
  let draft = existing
    ? {name:existing.name, icon:existing.icon, color:existing.color}
    : {name:'', icon:'folder', color:WORKFLOW_COLORS[0]};
  let changingPin = !existing;
  const overlay = document.createElement('div'); overlay.className = 'overlay';

  function html(){
    const noteCount = existing ? STATE.notes.filter(n=>n.notebookId===existing.id).length : 0;
    return `<div class="modal">
      <div class="modal-header"><div class="modal-title">${icon('folder',18)} ${existing?'Sửa sổ tay':'Thêm sổ tay'}</div>
        <button class="close-x" id="closeModal">✕</button></div>
      <div class="field"><label>Tên *</label><input id="nb_name" type="text" value="${esc(draft.name)}"></div>
      <div class="field"><label>Icon</label><div class="icon-picker">
        ${NOTEBOOK_ICONS.map(ic=>`<span class="${draft.icon===ic?'selected':''}" data-nb-icon="${ic}">${icon(ic,16)}</span>`).join("")}
      </div></div>
      <div class="field"><label>Màu sắc</label><div class="color-swatch-row">
        ${WORKFLOW_COLORS.map(c=>`<span class="color-swatch ${draft.color===c?'selected':''}" style="background:${c};" data-nb-color="${c}"></span>`).join("")}
      </div></div>
      <div class="modal-section-label">${icon('lock',12)} KHOÁ BẰNG PIN</div>
      <div style="font-size:11.5px;color:var(--text-3);margin-bottom:10px;">
        PIN che nội dung sổ tay khỏi giao diện và kết quả tìm kiếm. Đây <b>không phải mã hoá</b> —
        nội dung vẫn nằm dạng văn bản trong bộ nhớ trình duyệt.
      </div>
      ${existing && !changingPin
        ? `<button class="btn btn-ghost btn-sm" id="nb_changePin">${icon('lock',13)} ${existing.pinHash?'Đổi hoặc gỡ PIN':'Đặt PIN'}</button>`
        : `${existing && existing.pinHash ? `<div class="field"><label>PIN hiện tại</label><input id="nb_curPin" type="password" inputmode="numeric"></div>`:''}
           <div class="field"><label>PIN mới — 4–8 chữ số, để trống để gỡ khoá</label>
             <input id="nb_pin" type="password" inputmode="numeric" placeholder="••••"></div>`}
      <div style="display:flex;justify-content:space-between;gap:8px;margin-top:18px;">
        ${existing?`<button class="btn btn-danger-ghost btn-sm" id="nb_del">${icon('trash',14)} Xoá</button>`:'<span></span>'}
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" id="nb_cancel">Huỷ</button>
          <button class="btn btn-primary" id="nb_save">${icon('check',15)} Lưu</button>
        </div>
      </div>
      ${existing && noteCount ? `<div style="font-size:11px;color:var(--text-3);margin-top:8px;">Sổ tay này đang chứa ${noteCount} ghi chú.</div>`:''}
    </div>`;
  }
  function sync(){
    const g = (x)=>document.getElementById(x);
    if(g('nb_name')) draft.name = g('nb_name').value;
  }
  function draw(){
    overlay.innerHTML = html();
    const g = (x)=>document.getElementById(x);
    g('closeModal').onclick = close;
    g('nb_cancel').onclick = close;
    overlay.querySelectorAll('[data-nb-icon]').forEach(el=> el.onclick = ()=>{ sync(); draft.icon = el.dataset.nbIcon; draw(); });
    overlay.querySelectorAll('[data-nb-color]').forEach(el=> el.onclick = ()=>{ sync(); draft.color = el.dataset.nbColor; draw(); });
    if(g('nb_changePin')) g('nb_changePin').onclick = ()=>{ sync(); changingPin = true; draw(); };
    if(g('nb_del')) g('nb_del').onclick = ()=>{
      const n = STATE.notes.filter(x=>x.notebookId===existing.id).length;
      const warn = n ? `Xoá sổ tay "${existing.name}"? ${n} ghi chú sẽ được giữ lại nhưng không còn thuộc sổ tay nào.`
                     : `Xoá sổ tay "${existing.name}"?`;
      if(!confirm(warn)) return;
      // Notes survive — they simply lose their notebook.
      STATE.notes.forEach(x=>{ if(x.notebookId===existing.id) x.notebookId = null; });
      STATE.notebooks = STATE.notebooks.filter(x=>x.id!==existing.id);
      lockNotebook(existing.id);
      persist();
      toast('Đã xoá sổ tay');
      if(noteView==='notebook' && noteViewArg===existing.id){ noteView='all'; noteViewArg=null; }
      close();
    };
    g('nb_save').onclick = save;
    applyLang(overlay);
    const name = g('nb_name'); if(name && !existing) name.focus();
  }
  function save(){
    sync();
    if(!draft.name.trim()){ toast('Sổ tay cần có tên'); return; }
    const g = (x)=>document.getElementById(x);
    let pinPatch = null;
    if(changingPin && g('nb_pin')){
      const next = g('nb_pin').value.trim();
      if(existing && existing.pinHash){
        const cur = g('nb_curPin') ? g('nb_curPin').value : '';
        if(hashPin(cur, existing.pinSalt) !== existing.pinHash){ toast('PIN hiện tại không đúng'); return; }
      }
      if(!next) pinPatch = {pinHash:null, pinSalt:null};
      else if(!/^\d{4,8}$/.test(next)){ toast('PIN phải gồm 4–8 chữ số'); return; }
      else { const salt = newSalt(); pinPatch = {pinSalt:salt, pinHash:hashPin(next, salt)}; }
    }
    if(existing){
      Object.assign(existing, {name:draft.name.trim(), icon:draft.icon, color:draft.color}, pinPatch||{});
      // Removing or changing the PIN drops any live unlock for it.
      if(pinPatch) lockNotebook(existing.id);
      toast('Đã cập nhật sổ tay');
    } else {
      STATE.notebooks.push(Object.assign({
        id:uid(), name:draft.name.trim(), icon:draft.icon, color:draft.color,
        sortOrder:STATE.notebooks.length, pinHash:null, pinSalt:null, createdAt:nowISO(),
      }, pinPatch||{}));
      toast('Đã tạo sổ tay');
    }
    persist();
    close();
  }
  function close(){ overlay.remove(); renderView(); }
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  document.body.appendChild(overlay);
  draw();
}

/* ---------- version history ---------- */
function openVersionModal(noteId){
  let selected = null;   // null = the current text
  const overlay = document.createElement('div'); overlay.className = 'overlay';

  function dayLabel(iso){
    const d = new Date(iso), today = new Date();
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
    if(d.toDateString()===today.toDateString()) return 'Hôm nay';
    if(d.toDateString()===yesterday.toDateString()) return 'Hôm qua';
    return d.toLocaleDateString(loc(),{day:'2-digit',month:'short',year:'numeric'});
  }
  function html(){
    const n = noteById(noteId);
    const versions = n.versions || [];
    const groups = [];
    versions.forEach(v=>{
      const label = dayLabel(v.createdAt);
      const last = groups[groups.length-1];
      if(last && last[0]===label) last[1].push(v); else groups.push([label,[v]]);
    });
    const shown = selected ? versions.find(v=>v.id===selected) : null;
    return `<div class="modal wide">
      <div class="modal-header"><div class="modal-title">${icon('clock',18)} Lịch sử phiên bản</div>
        <button class="close-x" id="closeModal">✕</button></div>
      <div class="version-layout">
        <div class="version-list">
          <button class="version-row ${selected===null?'active':''}" data-ver="">
            <span class="version-time">Hiện tại</span>
            <span class="version-title">${esc(n.title||'Chưa đặt tên')}</span></button>
          ${versions.length ? groups.map(([label,items])=>`
            <div class="version-day">${esc(label)}</div>
            ${items.map(v=>`<button class="version-row ${selected===v.id?'active':''}" data-ver="${v.id}">
              <span class="version-time">${new Date(v.createdAt).toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'})}</span>
              <span class="version-title">${esc(v.title||'Chưa đặt tên')}</span></button>`).join("")}
          `).join("") : `<div class="picker-empty">Chưa có phiên bản nào được lưu</div>`}
        </div>
        <div class="version-preview">${mdRender(shown ? shown.content : n.content, false)}</div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
        <button class="btn btn-ghost" id="ver_close">Đóng</button>
        ${shown?`<button class="btn btn-primary" id="ver_restore">${icon('refresh',15)} Khôi phục phiên bản</button>`:''}
      </div>
      <div style="font-size:11px;color:var(--text-3);margin-top:10px;">
        Giữ tối đa ${MAX_NOTE_VERSIONS} phiên bản gần nhất cho mỗi ghi chú; ảnh chụp mới chỉ được tạo khi
        lần sửa cách lần trước ít nhất 5 phút, để autosave không làm ngập lịch sử.
      </div>
    </div>`;
  }
  function draw(){
    overlay.innerHTML = html();
    document.getElementById('closeModal').onclick = close;
    document.getElementById('ver_close').onclick = close;
    overlay.querySelectorAll('[data-ver]').forEach(el=> el.onclick = ()=>{ selected = el.dataset.ver || null; draw(); });
    const restore = document.getElementById('ver_restore');
    if(restore) restore.onclick = ()=>{
      if(!confirm('Khôi phục phiên bản này? Nội dung hiện tại sẽ được lưu lại thành một phiên bản mới.')) return;
      const n = noteById(noteId);
      const v = n.versions.find(x=>x.id===selected);
      // Snapshot first, so restoring is itself undoable.
      snapshotNote(n);
      Object.assign(n, {title:v.title, content:v.content, updatedAt:nowISO()});
      persist();
      toast('Đã khôi phục phiên bản');
      close();
    };
    applyLang(overlay);
  }
  function close(){ overlay.remove(); renderView(); }
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  document.body.appendChild(overlay);
  draw();
}

let aiStatus = { state:'idle' };
function wireSettingsAI(){
  const a = aiSettings();
  const key = document.getElementById('ai_key');
  const out = document.getElementById('ai_test_out');
  const en  = document.getElementById('ai_enabled');
  if(en) en.onchange = ()=>{ a.enabled = en.checked; persist(); };
  const md = document.getElementById('ai_model');
  if(md) md.onchange = ()=>{ a.model = md.value; persist(); };
  const tg = document.getElementById('ai_toggle_key');
  if(tg && key) tg.onclick = ()=>{
    key.type = key.type === 'password' ? 'text' : 'password';
    tg.textContent = key.type === 'password' ? 'Hiện' : 'Ẩn';
  };
  const sv = document.getElementById('ai_save');
  if(sv && key) sv.onclick = ()=>{ a.apiKey = key.value.trim(); persist(); toast('Đã lưu API key trong trình duyệt này'); };
  const cl = document.getElementById('ai_clear_key');
  if(cl) cl.onclick = ()=>{ a.apiKey = ''; persist(); renderView(); toast('Đã xoá key'); };
  const ts = document.getElementById('ai_test');
  if(ts) ts.onclick = async ()=>{
    if(key) a.apiKey = key.value.trim();
    persist();
    ts.disabled = true; out.textContent = 'Đang kiểm tra…';
    geminiService.proxyReady = null;                 // re-probe on every test
    const r = await geminiService.testConnection();
    aiStatus.state = r.ok ? 'ok' : 'fail';
    // Never echoes the key or the upstream body — only what the user can act on.
    out.textContent = r.ok
      ? ('✓ Gemini đã kết nối' + (r.via==='proxy' ? ' (qua máy chủ)' : ' (chế độ cục bộ)'))
      : ('✕ Không kết nối được — ' + r.message);
    ts.disabled = false;
  };
}

async function sendTelegramTest(){
  const token = document.getElementById('ntf_tgToken').value.trim();
  const chatId = document.getElementById('ntf_tgChat').value.trim();
  const result = document.getElementById('tgTestResult');
  if(!token || !chatId){ result.innerHTML = `<span style="color:var(--danger);">Nhập đủ Bot Token và Chat ID</span>`; return; }
  result.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  try{
    const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: chatId, text: `✅ Tin nhắn test từ ${STATE.company.name}` })
    });
    const data = await res.json();
    if(data.ok){ result.innerHTML = `<span style="color:var(--success);">✅ Đã gửi thành công!</span>`; toast('Đã gửi tin nhắn Telegram test'); }
    else { result.innerHTML = `<span style="color:var(--danger);">❌ Lỗi: ${esc(data.description||'không xác định')}</span>`; }
  }catch(e){ result.innerHTML = `<span style="color:var(--danger);">❌ Không thể kết nối (${esc(e.message)})</span>`; }
}
async function testZaloConnection(){
  const token = document.getElementById('ntf_zaloToken').value.trim();
  const result = document.getElementById('zaloTestResult');
  if(!token){ result.innerHTML = `<span style="color:var(--danger);">Nhập Zalo Bot Token trước</span>`; return; }
  result.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  try{
    const res = await fetch('https://openapi.zalo.me/v3.0/oa/getoa', { headers: { 'access_token': token } });
    const data = await res.json().catch(()=>null);
    if(data && data.error===0){ result.innerHTML = `<span style="color:var(--success);">✅ Kết nối thành công: ${esc(data.data?.name||'')}</span>`; }
    else { result.innerHTML = `<span style="color:var(--danger);">❌ Zalo phản hồi lỗi: ${esc(data? (data.message||JSON.stringify(data)) : 'không đọc được phản hồi')}</span>`; }
  }catch(e){ result.innerHTML = `<span style="color:var(--danger);">❌ Trình duyệt bị chặn gọi thẳng API Zalo (CORS): ${esc(e.message)}. Cần proxy qua server.</span>`; }
}
