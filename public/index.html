/* =========================================================
   WEATHER AMBIENCE
   A decorative layer behind the whole app that mirrors the real sky where the
   machine is. Three deliberate constraints:
     · it sits at z-index 0 under the panels and never takes pointer events,
       so it can never obscure or block a working area;
     · the network call is optional — refuse location, go offline, or turn the
       setting off and the app simply runs without it;
     · particle counts are small and CSS-animated, so the cost is a handful of
       composited layers rather than a per-frame script.
   The forecast comes from Open-Meteo, which needs no API key. Coordinates are
   rounded to ~11km before they are sent — enough for weather, not enough to
   locate a person.
   ========================================================= */
const WEATHER_KINDS = {
  clear:  { name:'Nắng',        icon:'☀️' },
  cloudy: { name:'Nhiều mây',   icon:'☁️' },
  wind:   { name:'Gió',         icon:'🍃' },
  rain:   { name:'Mưa nhẹ',     icon:'🌦️' },
  storm:  { name:'Bão',         icon:'⛈️' },
  snow:   { name:'Tuyết',       icon:'❄️' },
  night:  { name:'Đêm quang',   icon:'🌙' },
};
function weatherNameEn(kind){
  return { clear:'Clear', cloudy:'Cloudy', wind:'Windy', rain:'Light rain',
           storm:'Storm', snow:'Snow', night:'Clear night' }[kind] || '';
}
/** WMO weather codes → our scene names. */
function weatherKindFromCode(code, windKmh, isNight){
  if(code >= 95) return 'storm';
  if(code >= 71 && code <= 77) return 'snow';
  if(code === 85 || code === 86) return 'snow';
  if((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
  if(windKmh >= 28) return 'wind';
  if(code >= 2) return 'cloudy';
  return isNight ? 'night' : 'clear';
}
let WEATHER = { kind:null, temp:null, place:'', at:0, source:'' };
const WEATHER_CACHE_KEY = 'bachoffice.weather.v1';
const WEATHER_TTL_MS = 30*60*1000;   // half an hour is plenty for ambience

function weatherEnabled(){
  return !STATE.settings || STATE.settings.weather !== false;
}
function startWeather(){
  if(!weatherEnabled()){ applyWeatherScene(null); return; }
  // Show the cached scene immediately so there is no blank first paint, then
  // refresh in the background if it has gone stale.
  try{
    const c = JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY) || 'null');
    if(c && c.kind){ WEATHER = c; applyWeatherScene(c.kind); }
  }catch(e){}
  // The timer is armed FIRST, and unconditionally. It used to sit after the
  // freshness check below, so any reload within half an hour of the last fetch
  // returned before reaching it — and that session then never refreshed again,
  // however long it stayed open. A tab left open through an afternoon kept
  // showing the weather from whenever it was loaded.
  if(!wxTimer) wxTimer = setInterval(()=>{ if(weatherEnabled()) refreshWeather(); }, WEATHER_TTL_MS);
  if(Date.now() - (WEATHER.at||0) < WEATHER_TTL_MS) return;   // cache still good
  refreshWeather();
}
let wxTimer = 0;
function refreshWeather(){
  locateCoarse().then(pos=>{
    if(!pos) throw new Error('no-position');
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${pos.lat}&longitude=${pos.lon}`
      + `&current=temperature_2m,weather_code,wind_speed_10m,is_day&timezone=auto`;
    return fetch(url).then(r=>{
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    }).then(j=>{
      const cur = j.current || {};
      const kind = weatherKindFromCode(cur.weather_code|0, cur.wind_speed_10m||0, cur.is_day===0);
      const manual = weatherPlace();
      WEATHER = {
        kind, temp: Math.round(cur.temperature_2m),
        place: manual ? manual.name : `${pos.lat.toFixed(1)}, ${pos.lon.toFixed(1)}`,
        at: Date.now(), source: pos.source,
      };
      try{ localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(WEATHER)); }catch(e){}
      applyWeatherScene(kind);
      try{ TobbyWear.apply(); }catch(e){}    // rain means he puts a coat on
      if(VIEW==='settings') renderView();
    });
  }).catch(()=>{
    // No location, no network, or a blocked request: fall back to a scene
    // driven purely by the clock so the app still feels alive.
    const h = new Date().getHours();
    const kind = (h < 6 || h >= 19) ? 'night' : 'clear';
    WEATHER = { kind, temp:null, place:'', at:Date.now(), source:'fallback' };
    applyWeatherScene(kind);
  });
}
/** A place the user typed, if they have set one. Checked BEFORE geolocation.
 *
 *  This exists because geolocation is the kind of permission people dismiss
 *  without reading, and dismissing it used to mean the weather silently became
 *  a clock: `clear` by day, `night` after dusk, and rain that could never
 *  appear however hard it was raining outside. A typed city is the difference
 *  between a feature that quietly does nothing and one that works. */
function weatherPlace(){
  const p = STATE.settings && STATE.settings.weatherPlace;
  return (p && typeof p.lat === 'number' && typeof p.lon === 'number') ? p : null;
}
/** Open-Meteo's geocoder — same family as the forecast, also key-free. */
function weatherSearchPlace(q){
  const url = 'https://geocoding-api.open-meteo.com/v1/search?count=5&language=vi&format=json'
            + '&name=' + encodeURIComponent(String(q||'').trim());
  return fetch(url).then(r=>{
    if(!r.ok) throw new Error('http '+r.status);
    return r.json();
  }).then(j=> (j.results||[]).map(r=>({
    name: [r.name, r.admin1, r.country].filter(Boolean).join(', '),
    lat: Math.round(r.latitude*100)/100,
    lon: Math.round(r.longitude*100)/100,
  })));
}
/** Browser geolocation, rounded down to two decimals (~1.1km) before use. */
function locateCoarse(){
  return new Promise((resolve)=>{
    // A place the user chose outranks the browser: they said where they are,
    // and no permission prompt can be more accurate than that.
    const manual = weatherPlace();
    if(manual) return resolve({ lat:manual.lat, lon:manual.lon, source:'manual' });
    if(!navigator.geolocation) return resolve(null);
    let settled = false;
    const done = (v)=>{ if(!settled){ settled = true; resolve(v); } };
    // Never leave the app waiting on a prompt the user ignores.
    setTimeout(()=>done(null), 8000);
    navigator.geolocation.getCurrentPosition(
      p => done({ lat: Math.round(p.coords.latitude*100)/100,
                  lon: Math.round(p.coords.longitude*100)/100, source:'gps' }),
      () => done(null),
      { enableHighAccuracy:false, timeout:7000, maximumAge:30*60*1000 }
    );
  });
}
/* =========================================================
   VOXEL SKY BODY — the sun and moon, from voxel-sun.glb
   ---------------------------------------------------------
   Two separate models now, one per body, each used for what it actually is.

   voxel-sun.glb  — a voxel sphere carrying a six-tone warm ramp (cream, gold,
     amber, orange, deep, core) plus ten rays radiating in the XY plane. The
     ramp is the artist's, so the hour-of-day versions MODULATE it rather than
     flattening every layer to one colour: a temperature multiplier and an
     emissive level, which keeps cream reading paler than core at every hour.
     It spins about Z, which sweeps the rays around the disc like a pinwheel —
     spinning about Y would swing them toward and away from the camera instead.

   voxel-moon.glb — the crescent, four meshes on four materials. Its lit voxels
     occupy the left limb and its shadow voxels the right; together they tile
     one sphere. So phase here is a MATERIAL problem, not a geometry one:
     relighting moon_shadow fills the disc out to full, and leaving it dark
     gives the crescent as authored.
   ========================================================= */
const SKY_URLS = { sun:'assets/sky/voxel-sun.glb', moon:'assets/sky/voxel-moon.glb' };
const SKY_SIZE = 1.2;        // standing size, 20% over the original tuning
const SKY_BOOST = 1.3;       // double-click swell, 30% over standard
const SKY_BOOST_MS = 10000;  // …held for ten seconds
let tbSkyFrame = 0, tbSkyHour = -1;
const SkyBody = {
  THREE:null, renderer:null, scene:null, camera:null,
  models:{}, mats:{sun:{},moon:{}}, base:{sun:{},moon:{}},
  ready:false, loading:false, failed:false,
  mode:null, root:null, spin:0, baseYaw:0,

  async load(container){
    if(this.ready || this.loading || this.failed) return;
    this.loading = true;
    try{
      const THREE = await import('three');
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
      this.THREE = THREE;

      this.scene  = new THREE.Scene();
      this.camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
      this.camera.position.set(0, 0.25, 3.6);
      this.camera.lookAt(0, 0, 0);
      this.scene.add(new THREE.AmbientLight(0xffffff, 1.15));
      this.key = new THREE.DirectionalLight(0xffffff, 1.9);
      this.key.position.set(-2, 1.4, 2.2);
      this.scene.add(this.key);

      this.renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
      this.renderer.setClearAlpha(0);
      this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));

      const loader = new GLTFLoader();
      // Only the body that belongs in the sky right now is fetched; the other
      // arrives the first time the clock calls for it. Two 300KB models for a
      // 34px decoration is not a download to make twice over up front.
      const first = (new Date().getHours() >= 6 && new Date().getHours() < 18) ? 'sun' : 'moon';
      this._loader = loader;
      await this.ensure(first);
      this.ready = true; this.loading = false;
      this.attach(container);
      this.apply();
      this.ensureLater(first === 'sun' ? 'moon' : 'sun');
    }catch(e){
      this.failed = true; this.loading = false;   // the CSS sun/moon stands in
    }
  },

  /** Fetch one model, clone its materials and bank the authored colours so a
   *  re-skin is always a restore rather than a guess at what it used to be. */
  async ensure(kind){
    if(this.models[kind]) return this.models[kind];
    const gltf = await new Promise((res, rej)=> this._loader.load(SKY_URLS[kind], res, undefined, rej));
    const root = gltf.scene;
    root.scale.setScalar(kind === 'sun' ? 1.05 : 1.55);   // the sun carries rays, so it needs the room
    root.visible = false;
    root.traverse(o=>{
      if(!o.isMesh || !o.material) return;
      o.material = o.material.clone();
      const m = o.material, n = m.name || o.name;
      this.mats[kind][n] = m;
      this.base[kind][n] = {
        color: m.color ? m.color.clone() : null,
        emissive: m.emissive ? m.emissive.clone() : null,
        emissiveIntensity: m.emissiveIntensity != null ? m.emissiveIntensity : 1
      };
    });
    this.scene.add(root);
    this.models[kind] = root;
    return root;
  },
  /** Warm the other model in the background; a failure here is silent because
   *  the body it would draw is not wanted for hours yet. */
  ensureLater(kind){
    setTimeout(()=>{ this.ensure(kind).catch(()=>{}); }, 4000);
  },

  /** Exactly one body is ever visible. */
  show(kind){
    const m = this.models[kind];
    if(!m) return false;
    Object.keys(this.models).forEach(k=>{ if(this.models[k]) this.models[k].visible = (k === kind); });
    this.root = m; this.mode = kind;
    return true;
  },

  attach(container){
    if(!this.ready || !container) return;
    this.container = container;
    container.appendChild(this.renderer.domElement);
    const s = container.getBoundingClientRect();
    const px = Math.max(32, Math.round(s.width||44));
    this.renderer.setSize(px, px, false);
    Object.assign(this.renderer.domElement.style, {width:'100%', height:'100%', display:'block'});
    // Retire the CSS stand-in HERE, not at the call site. The load is async, so
    // on the very first scene `ready` is still false when applyWeatherScene
    // checks it — the class never got added and both suns sat in the corner
    // together until some later scene change happened to re-run it. Doing it
    // at the moment the canvas actually goes in is true whenever it is true.
    const layer = document.getElementById('weatherLayer');
    if(layer) layer.classList.add('has-3d-body');
  },

  /** Tint every material warm and self-lit. The whole sphere becomes the
   *  light source, which is what makes a voxel ball read as a sun. */
  setSun(hour){
    if(!this.ready || !this.show('sun')) return;
    // Versions across the day. `t` is a temperature multiplier applied ON TOP
    // of the model's own cream→core ramp, so dawn goes red without cream and
    // core collapsing to the same colour — flattening every layer to one hex
    // is what would throw away the shading the model was authored with.
    const V = hour < 6  ? { t:[1.00,0.52,0.38], e:0.55, top:26, size:34, glow:'rgba(255,110,50,.34)' }
            : hour < 8  ? { t:[1.00,0.64,0.44], e:0.80, top:22, size:38, glow:'rgba(255,140,60,.34)' }
            : hour < 11 ? { t:[1.00,0.82,0.60], e:1.10, top:16, size:40, glow:'rgba(255,175,70,.32)' }
            : hour < 14 ? { t:[1.00,0.98,0.86], e:1.45, top:10, size:44, glow:'rgba(255,220,110,.34)' }
            : hour < 16 ? { t:[1.00,0.88,0.66], e:1.20, top:14, size:41, glow:'rgba(255,195,80,.32)' }
            : hour < 18 ? { t:[1.00,0.70,0.48], e:0.90, top:20, size:38, glow:'rgba(255,150,60,.32)' }
            :             { t:[1.00,0.50,0.36], e:0.58, top:26, size:34, glow:'rgba(255,105,48,.34)' };
    const M = this.mats.sun, B = this.base.sun;
    Object.keys(M).forEach(n=>{
      const m = M[n], b = B[n];
      if(!b) return;
      if(b.color && m.color) m.color.copy(b.color).multiply({r:V.t[0], g:V.t[1], b:V.t[2]});
      if(b.emissive && m.emissive){
        m.emissive.copy(b.emissive).multiply({r:V.t[0], g:V.t[1], b:V.t[2]});
        m.emissiveIntensity = b.emissiveIntensity * V.e;
      }
    });
    this.baseYaw = 0;
    this.root.rotation.set(0, 0, this.root.rotation.z || 0);
    this.style(V.top, V.size, V.glow);
    this.render();
  },

  /** Restore the authored moon, then decide the phase. */
  setMoon(phase){
    if(!this.ready || !this.show('moon')) return;
    const M = this.mats.moon, B = this.base.moon;
    Object.keys(M).forEach(n=>{
      const m = M[n], b = B[n];
      if(!b) return;
      if(b.color && m.color) m.color.copy(b.color);
      if(b.emissive && m.emissive){ m.emissive.copy(b.emissive); m.emissiveIntensity = b.emissiveIntensity; }
    });
    const shadow = M['moon_shadow'];
    const lit    = B['moon_white'];
    if(phase.full && shadow && lit){
      // Light the shadowed limb and the crescent becomes a full disc. This is
      // the whole reason the phase is done in materials: the file has one
      // mesh set, and it already covers the entire sphere.
      if(shadow.color) shadow.color.copy(lit.color).multiplyScalar(0.93);
      if(shadow.emissive){ shadow.emissive.copy(lit.emissive); shadow.emissiveIntensity = 0.9; }
    }
    // Waning moons are lit from the other limb. Flipped about the VIEW axis,
    // not about Y: a half-turn on Y swings the unmodelled back of the sphere
    // into shot and reads as a gibbous — measured rgb(173,180,191) against the
    // waxing crescent's rgb(60,62,68). Spinning about Z keeps the same face
    // toward the camera and simply moves the lit limb across, which is what
    // waxing-to-waning actually looks like. Negative scale would mirror it too
    // but inverts the winding and lights the model inside-out.
    this.baseYaw = 0;
    this.root.rotation.set(0, 0, phase.waning ? Math.PI : 0);
    this.style(14, phase.full ? 38 : 34,
      phase.full ? 'rgba(150,190,255,.30)' : 'rgba(150,190,255,.20)');
    this.render();
  },

  /** Sizes from setSun/setMoon are the AUTHORED numbers; the two multipliers
   *  live here so every caller stays in one vocabulary.
   *    SKY_SIZE  — the standing 20% enlargement over the original tuning
   *    boost     — a temporary swell while the user is looking at it
   *  The last call is remembered so a boost can restyle without the caller
   *  having to hand back the hour or the phase it was derived from. */
  style(top, size, glow){
    if(!this.container) return;
    this._lastStyle = { top, size, glow };
    const px = Math.round(size * SKY_SIZE * (this.boost || 1));
    Object.assign(this.container.style, {
      top: top+'px', width: px+'px', height: px+'px',
      filter: `drop-shadow(0 0 ${Math.round(px*0.45)}px ${glow})`
    });
    if(this.renderer) this.renderer.setSize(px, px, false);
  },
  restyle(){ const s = this._lastStyle; if(s) this.style(s.top, s.size, s.glow); },

  /** Double-clicked: swell to 30% over standard, hold, then settle back.
   *  Re-triggering restarts the hold rather than stacking, so leaning on the
   *  mouse cannot leave it stuck large. */
  pulse(){
    if(!this.ready) return;
    this.boost = SKY_BOOST;
    this.restyle();
    clearTimeout(this._boostTimer);
    this._boostTimer = setTimeout(()=>{ this.boost = 1; this.restyle(); }, SKY_BOOST_MS);
  },

  /** Re-read the clock and paint whichever body belongs in the sky. */
  apply(){
    if(!this.ready) return;
    const h = new Date().getHours();
    tbSkyHour = h;
    const day = h >= 6 && h < 18;
    if(day) this.setSun(h); else this.setMoon(moonPhaseToday());
  },
  /** Cheap enough to poll: re-skins only when the hour actually rolls over, so
   *  the sun reddens into the evening on its own without a reload. */
  applyIfHourChanged(){
    if(this.ready && new Date().getHours() !== tbSkyHour) this.apply();
  },

  render(){ if(this.ready) this.renderer.render(this.scene, this.camera); },

  /** A very slow turn, and only while it is on screen. A sky body does not
   *  need 60fps; this costs one small draw every other frame at most. */
  tick(){
    if(!this.ready || document.hidden || !this.container || !this.container.isConnected) return;
    if(tbReduceMotion()) return;
    if(this.mode === 'sun'){
      // About Z, so the ten rays sweep around the disc like a pinwheel.
      // Spinning about Y would swing them toward and away from the camera and
      // read as a wobble instead of a turn. Roughly one revolution a minute.
      this.root.rotation.z += 0.0055;
    }else{
      // The moon does NOT spin. A turning crescent would walk its own shadow
      // around the disc and cycle through phases that contradict tonight's —
      // and a real moon keeps one face to us anyway. It gets a slow tilt
      // instead: enough parallax to read as 3D, no change of phase.
      this.spin += 0.0042;
      this.root.rotation.y = (this.baseYaw || 0) + Math.sin(this.spin) * 0.30;
      this.root.rotation.x = Math.sin(this.spin * 0.6) * 0.10;
    }
    this.render();
  }
};

/* =========================================================
   ÂM LỊCH — Vietnamese lunar date
   Hồ Ngọc Đức's algorithm, the standard one for the Vietnamese calendar.
   Needed because the brief asks for a full moon on lunar 13–17, and "days
   since some new moon" drifts: the synodic month is 29.53 days, so a fixed
   average is a day out within a year and two days out within three. This
   computes the actual new-moon instant and localises it to UTC+7, which is
   what decides the date on a Vietnamese calendar.
   ========================================================= */
function lunarJD(dd, mm, yy){
  const a = Math.floor((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12*a - 3;
  let jd = dd + Math.floor((153*m + 2)/5) + 365*y + Math.floor(y/4) - Math.floor(y/100) + Math.floor(y/400) - 32045;
  if(jd < 2299161) jd = dd + Math.floor((153*m + 2)/5) + 365*y + Math.floor(y/4) - 32083;
  return jd;
}
/** Julian day of the k-th new moon since 1900-01, in the given time zone. */
function lunarNewMoonDay(k, tz){
  const T = k/1236.85, T2 = T*T, T3 = T2*T, dr = Math.PI/180;
  let jd1 = 2415020.75933 + 29.53058868*k + 0.0001178*T2 - 0.000000155*T3;
  jd1 += 0.00033 * Math.sin((166.56 + 132.87*T - 0.009173*T2) * dr);
  const M   = 359.2242 + 29.10535608*k - 0.0000333*T2 - 0.00000347*T3;
  const Mpr = 306.0253 + 385.81691806*k + 0.0107306*T2 + 0.00001236*T3;
  const F   = 21.2964 + 390.67050646*k - 0.0016528*T2 - 0.00000239*T3;
  let c1 = (0.1734 - 0.000393*T)*Math.sin(M*dr) + 0.0021*Math.sin(2*dr*M);
  c1 = c1 - 0.4068*Math.sin(Mpr*dr) + 0.0161*Math.sin(dr*2*Mpr);
  c1 = c1 - 0.0004*Math.sin(dr*3*Mpr);
  c1 = c1 + 0.0104*Math.sin(dr*2*F) - 0.0051*Math.sin(dr*(M+Mpr));
  c1 = c1 - 0.0074*Math.sin(dr*(M-Mpr)) + 0.0004*Math.sin(dr*(2*F+M));
  c1 = c1 - 0.0004*Math.sin(dr*(2*F-M)) - 0.0006*Math.sin(dr*(2*F+Mpr));
  c1 = c1 + 0.0010*Math.sin(dr*(2*F-Mpr)) + 0.0005*Math.sin(dr*(2*Mpr+M));
  const deltat = T < -11
    ? 0.001 + 0.000839*T + 0.0002261*T2 - 0.00000845*T3 - 0.000000081*T*T3
    : -0.000278 + 0.000265*T + 0.000262*T2;
  return Math.floor(jd1 + c1 - deltat + 0.5 + tz/24);
}
/** Day of the lunar month, 1–30. Day 1 is the new moon; ~15 is the full moon. */
function lunarDayOfMonth(date){
  const d  = date || new Date();
  const tz = 7;                                  // Vietnam, and the calendar the brief means
  const jd = lunarJD(d.getDate(), d.getMonth()+1, d.getFullYear());
  const k  = Math.floor((jd - 2415021.076998695) / 29.530588853);
  let nm = lunarNewMoonDay(k + 1, tz);
  if(nm > jd) nm = lunarNewMoonDay(k, tz);
  return jd - nm + 1;
}
/** The brief's rule: 13–17 is a full moon, everything else a crescent, and the
 *  crescent leans the other way once past full — waxing before, waning after. */
function moonPhaseToday(date){
  const day = lunarDayOfMonth(date);
  return { day, full: day >= 13 && day <= 17, waning: day > 17 || day < 1 };
}

/** Builds the particle layer for a scene. Called only when the scene changes. */
function applyWeatherScene(kind){
  let layer = document.getElementById('weatherLayer');
  document.documentElement.removeAttribute('data-weather');
  if(!kind || !weatherEnabled()){ if(layer) layer.remove(); return; }
  if(!layer){
    layer = document.createElement('div');
    layer.id = 'weatherLayer'; layer.className = 'weather-layer';
    layer.setAttribute('aria-hidden','true');
    document.body.insertBefore(layer, document.body.firstChild);
  }
  document.documentElement.setAttribute('data-weather', kind);

  const bits = [];
  const rnd = (a,b)=> (a + Math.random()*(b-a));
  const many = (n, build)=>{ for(let i=0;i<n;i++) bits.push(build(i)); };
  // Rain, snow and gusts all start off-screen and are carried in by their
  // animation. With motion reduced that animation never runs, so they would sit
  // parked outside the viewport and the weather would look broken rather than
  // calm. Scatter them across the screen instead and let them hold still.
  const still = window.matchMedia && tbReduceMotion();
  const park = ()=> still ? `top:${rnd(2,94).toFixed(1)}%;` : '';
  /** One pixel cloud: a row of blocks with a shorter row stacked on top, all on
   *  a single pixel unit so the steps line up. Bigger clouds simply use a
   *  bigger unit, which keeps every edge on the same grid. */
  const pixelCloud = (u)=>{
    const rows = [
      { y:-2*u, x:1.6*u, w:3.4*u },
      { y:-1*u, x:0.6*u, w:5.4*u },
      { y:0,    x:0,     w:7*u   },
    ];
    return rows.map(r=>`<i style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${u}px;"></i>`).join('');
  };
  const clouds = (n, tone)=> many(n, ()=>{
    const u = Math.round(rnd(7, 15));
    return `<span class="wx-cloud" style="
      top:${rnd(2,58).toFixed(1)}%;
      ${still ? `left:${rnd(2,72).toFixed(1)}%;` : ''}
      animation-duration:${rnd(60,140).toFixed(0)}s; animation-delay:-${rnd(0,120).toFixed(0)}s;
      opacity:${tone.toFixed(2)};">${pixelCloud(u)}</span>`;
  });

  if(kind==='rain' || kind==='storm'){
    clouds(kind==='storm' ? 5 : 3, kind==='storm' ? 0.5 : 0.34);
    many(kind==='storm' ? 70 : 44, ()=>`<i class="wx-drop" style="left:${rnd(-5,105).toFixed(1)}%;${park()}
      animation-duration:${rnd(0.5,1.0).toFixed(2)}s; animation-delay:-${rnd(0,2).toFixed(2)}s;
      height:${rnd(16,32).toFixed(0)}px; opacity:${rnd(.3,.62).toFixed(2)};"></i>`);
    if(kind==='storm') bits.push(`<i class="wx-flash"></i>`);
  }
  if(kind==='snow'){
    clouds(3, 0.28);
    // Whole-pixel sizes only — a 6.3px flake is a smudge, a 6px one is a flake.
    many(52, ()=>{ const s = Math.round(rnd(4,9));
      return `<i class="wx-flake" style="left:${rnd(-5,105).toFixed(1)}%;${park()}
      animation-duration:${rnd(6,13).toFixed(1)}s; animation-delay:-${rnd(0,12).toFixed(1)}s;
      width:${s}px; height:${s}px; opacity:${rnd(.5,.95).toFixed(2)};"></i>`; });
  }
  if(kind==='cloudy'){
    clouds(7, 0.4);
  }
  if(kind==='wind'){
    clouds(4, 0.3);
    many(18, ()=>`<i class="wx-gust" style="top:${rnd(4,92).toFixed(1)}%;
      ${still ? `left:${rnd(0,85).toFixed(1)}%;` : ''}
      animation-duration:${rnd(5,11).toFixed(1)}s; animation-delay:-${rnd(0,10).toFixed(1)}s;
      width:${rnd(70,220).toFixed(0)}px; opacity:${rnd(.22,.5).toFixed(2)};"></i>`);
  }
  if(kind==='clear'){
    // The voxel body goes in front; the CSS sun stays behind it as the
    // fallback for no-WebGL and for the seconds before the GLB arrives.
    bits.push(`<div class="wx-body" id="wxBody"></div>`);
    bits.push(`<i class="wx-sun"></i>`);
    clouds(2, 0.18);
    many(20, ()=>`<i class="wx-mote" style="left:${rnd(0,100).toFixed(1)}%;
      top:${rnd(0,100).toFixed(1)}%; animation-duration:${rnd(14,30).toFixed(1)}s;
      animation-delay:-${rnd(0,20).toFixed(1)}s; opacity:${rnd(.2,.45).toFixed(2)};"></i>`);
  }
  if(kind==='night'){
    bits.push(`<div class="wx-body" id="wxBody"></div>`);
    bits.push(`<i class="wx-moon"></i>`);
    many(46, ()=>{ const s = Math.round(rnd(2,4));
      return `<i class="wx-star" style="left:${rnd(0,100).toFixed(1)}%;
      top:${rnd(0,80).toFixed(1)}%; animation-duration:${rnd(2.4,6).toFixed(1)}s;
      animation-delay:-${rnd(0,5).toFixed(1)}s; width:${s}px; height:${s}px;"></i>`; });
  }
  layer.innerHTML = `<div class="wx-tint"></div>${bits.join('')}`;

  // Hand the voxel sun/moon its slot. Loaded once, then re-attached on every
  // scene change — the layer's innerHTML was just replaced, so the canvas from
  // the previous scene is gone even though the renderer behind it is fine.
  // The layer element is reused across scenes, so the previous scene's class
  // would otherwise linger and hide a CSS sun that has no 3D one behind it.
  layer.classList.remove('has-3d-body');
  const slot = document.getElementById('wxBody');
  if(slot && !SkyBody.failed){
    // Bound per scene because the slot is a fresh element each time the layer's
    // innerHTML is rebuilt; nothing to unbind, it went with the old node.
    slot.addEventListener('dblclick', (e)=>{ e.stopPropagation(); SkyBody.pulse(); });
    if(SkyBody.ready){ SkyBody.attach(slot); SkyBody.apply(); }
    else SkyBody.load(slot);   // attach() adds the class when it lands
  }
}
/** Small readout for the settings panel and the dashboard clock area. */
function weatherLabel(){
  if(!weatherEnabled()) return 'Đang tắt';
  if(!WEATHER.kind) return 'Đang lấy dữ liệu…';
  const k = WEATHER_KINDS[WEATHER.kind];
  const t = WEATHER.temp != null ? ` · ${WEATHER.temp}°C` : '';
  const src = WEATHER.source==='fallback' ? ' (theo giờ trong ngày)'
            : WEATHER.place ? ` · ${WEATHER.place}` : '';
  return `${k.icon} ${k.name}${t}${src}`;
}
/** Is the scene invented from the clock rather than measured?
 *  Worth its own question because the answer decides whether the user is
 *  looking at the weather or at a guess, and the old build said so only in a
 *  four-word aside that nobody would read as "this is not real". */
function weatherIsGuess(){
  return weatherEnabled() && WEATHER.kind && WEATHER.source === 'fallback';
}

/* =========================================================
   TASK / SUBTASK CONTEXT MENU, ALARMS, FREEZE
   One reference shape — {taskId, subId} — addresses either a task or one of
   its subtasks, so every action below is written once and works for both.
   ========================================================= */
function resolveItem(ref){
  const task = STATE.tasks.find(x=>x.id===ref.taskId) || null;
  if(!task) return {task:null, item:null, isSub:false};
  if(!ref.subId) return {task, item:task, isSub:false};
  const sub = (task.checklist||[]).find(c=>c.id===ref.subId) || null;
  return {task, item:sub, isSub:true};
}
function itemLabel(ref){
  const {item, isSub} = resolveItem(ref);
  if(!item) return '';
  return isSub ? (item.text || '(chưa đặt tên)') : item.title;
}
/** Writes through the task so persistence and activity logging stay in one place. */
function patchItem(ref, patch, activityText){
  const {task, item} = resolveItem(ref);
  if(!task || !item) return null;
  Object.assign(item, patch);
  updateTask(task.id, {checklist: task.checklist}, activityText);
  return item;
}

/* ---------- alarms ---------- */
const ALARM_PRESETS = [
  ['+5m',   5,    'Sau 5 phút'],
  ['+15m',  15,   'Sau 15 phút'],
  ['+30m',  30,   'Sau 30 phút'],
  ['+1h',   60,   'Sau 1 giờ'],
  ['+3h',   180,  'Sau 3 giờ'],
];
function alarmFeed(){
  if(!Array.isArray(STATE.alarmFeed)) STATE.alarmFeed = [];
  return STATE.alarmFeed;
}
/** Alarms still waiting to be acknowledged — what the floating badge shows. */
function activeAlarms(){ return alarmFeed().filter(a=>!a.dismissed); }

function openAlarmModal(ref){
  const {task, item, isSub} = resolveItem(ref);
  if(!task || !item) return;
  const overlay = document.createElement('div'); overlay.className='overlay';
  const close = ()=> overlay.remove();

  const existing = isFiniteDate(item.alarmAt) ? new Date(item.alarmAt) : null;
  const deadline = isFiniteDate(item.deadline) ? new Date(item.deadline) : null;
  const localValue = (d)=>{
    const p = (n)=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const tomorrow9 = ()=>{ const d=new Date(); d.setDate(d.getDate()+1); d.setHours(9,0,0,0); return d; };

  overlay.innerHTML = `<div class="modal" style="max-width:440px;">
    <div class="modal-header">
      <div class="modal-title">⏰ Đặt báo thức</div>
      <button class="close-x" data-alarm-close>✕</button>
    </div>
    <div style="font-size:12.5px;color:var(--text-2);margin-bottom:14px;">
      ${isSub?'Công việc con':'Nhiệm vụ'}: <b>${esc(itemLabel(ref))}</b>
    </div>
    ${existing?`<div class="badge today" style="display:block;padding:9px 12px;margin-bottom:14px;">
      Đang hẹn lúc <b>${fmtDateTimeFull(item.alarmAt)}</b>
    </div>`:''}
    <div class="modal-section-label" style="margin-top:0;padding-top:0;border-top:none;">Nhanh</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;">
      ${ALARM_PRESETS.map(([k,mins,label])=>`<button class="pill-toggle" data-alarm-preset="${mins}">${label}</button>`).join("")}
      <button class="pill-toggle" data-alarm-abs="${localValue(tomorrow9())}">9:00 sáng mai</button>
      ${deadline && deadline > new Date() ? `<button class="pill-toggle" data-alarm-abs="${localValue(deadline)}">Đúng hạn chót</button>`:''}
    </div>
    <div class="field">
      <label>Hoặc chọn thời điểm cụ thể</label>
      <input type="datetime-local" id="alarmWhen" value="${localValue(existing || new Date(Date.now()+15*60000))}">
    </div>
    <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:18px;">
      ${existing?`<button class="btn btn-ghost" data-alarm-clear>${icon('trash',14)} Huỷ báo thức</button>`:''}
      <button class="btn btn-primary" data-alarm-save>${icon('check',14)} Đặt báo thức</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };

  const commit = (date)=>{
    if(!date || isNaN(date.getTime())){ toast('Thời điểm không hợp lệ'); return; }
    if(date <= new Date()){ toast('Hãy chọn một thời điểm trong tương lai'); return; }
    // Clearing firedAt lets a re-set alarm ring again.
    patchItem(ref, {alarmAt: date.toISOString(), alarmFiredAt: null});
    toast(`Đã đặt báo thức lúc ${fmtDateTimeFull(date.toISOString())}`);
    close(); renderView(); renderAlarmDock();
  };
  overlay.querySelectorAll('[data-alarm-preset]').forEach(el=> el.onclick = ()=>
    commit(new Date(Date.now() + parseInt(el.dataset.alarmPreset)*60000)));
  overlay.querySelectorAll('[data-alarm-abs]').forEach(el=> el.onclick = ()=>
    commit(new Date(el.dataset.alarmAbs)));
  overlay.querySelector('[data-alarm-save]').onclick = ()=>
    commit(new Date(document.getElementById('alarmWhen').value));
  const clr = overlay.querySelector('[data-alarm-clear]');
  if(clr) clr.onclick = ()=>{
    patchItem(ref, {alarmAt:null, alarmFiredAt:null});
    // Drop any unacknowledged ring for this item too.
    STATE.alarmFeed = alarmFeed().filter(a=> !(a.taskId===ref.taskId && a.subId===(ref.subId||null)));
    persist();
    toast('Đã huỷ báo thức'); close(); renderView(); renderAlarmDock();
  };
  overlay.querySelector('[data-alarm-close]').onclick = close;
  applyLang(overlay);
}

/** Ticks once a minute; also on load, so alarms that came due while the tab
 *  was closed still surface instead of being silently lost. */
let alarmTimer = null;
function startAlarmEngine(){
  if(alarmTimer) clearInterval(alarmTimer);
  checkAlarms();
  alarmTimer = setInterval(checkAlarms, 20000);
}
function checkAlarms(){
  const now = Date.now();
  let fired = 0;
  STATE.tasks.forEach(t=>{
    const consider = (item, subId)=>{
      if(!isFiniteDate(item.alarmAt) || item.alarmFiredAt) return;
      if(new Date(item.alarmAt).getTime() > now) return;
      item.alarmFiredAt = nowISO();
      alarmFeed().unshift({
        id: uid(), taskId: t.id, subId: subId || null,
        text: subId ? `${item.text || '(chưa đặt tên)'} — trong "${t.title}"` : t.title,
        at: item.alarmAt, firedAt: nowISO(), dismissed:false,
      });
      fired++;
    };
    consider(t, null);
    (t.checklist||[]).forEach(c=> consider(c, c.id));
  });
  // A thawed task should quietly rejoin the lists without waiting for a click.
  let thawed = 0;
  STATE.tasks.forEach(t=>{
    if(t.frozenUntil && new Date(t.frozenUntil) <= new Date()){ t.frozenUntil = null; thawed++; }
    (t.checklist||[]).forEach(c=>{
      if(c.frozenUntil && new Date(c.frozenUntil) <= new Date()){ c.frozenUntil = null; thawed++; }
    });
  });
  if(fired || thawed){
    persist();
    renderAlarmDock();
    if(fired){ playChime(); renderView(); }
    else renderView();
  }
}
function dismissAlarm(id){
  const a = alarmFeed().find(x=>x.id===id);
  if(a) a.dismissed = true;
  persist(); renderAlarmDock(); renderView();
}
function dismissAllAlarms(){
  alarmFeed().forEach(a=> a.dismissed = true);
  persist(); renderAlarmDock(); renderView();
}
/** The floating badge. Lives on <body>, so a view re-render never clears it —
 *  it stays put until the user actually acknowledges the alarm. */
function renderAlarmDock(){
  let dock = document.getElementById('alarmDock');
  const list = activeAlarms();
  if(!list.length){ if(dock) dock.remove(); return; }
  if(!dock){
    dock = document.createElement('div');
    dock.id = 'alarmDock'; dock.className = 'alarm-dock';
    document.body.appendChild(dock);
  }
  dock.innerHTML = `
    <div class="alarm-dock-head">
      <span class="alarm-bell">${icon('bell',15)}</span>
      <b>Báo thức</b>
      <span class="alarm-count">${list.length}</span>
      ${list.length>1?`<button class="alarm-all" data-alarm-dismiss-all>Tắt tất cả</button>`:''}
    </div>
    ${list.slice(0,4).map(a=>`<div class="alarm-item">
      <div class="alarm-item-main">
        <div class="alarm-item-title">${esc(a.text)}</div>
        <div class="alarm-item-time">Hẹn lúc ${fmtHM(a.at)} · ${relTime(a.firedAt)}</div>
      </div>
      <button class="btn btn-ghost btn-sm" data-alarm-open="${a.taskId}">Mở</button>
      <button class="alarm-x" data-alarm-dismiss="${a.id}" title="Tắt báo thức">✕</button>
    </div>`).join("")}
    ${list.length>4?`<div class="alarm-more">… và ${list.length-4} báo thức khác</div>`:''}
  `;
  dock.querySelectorAll('[data-alarm-dismiss]').forEach(el=> el.onclick = ()=> dismissAlarm(el.dataset.alarmDismiss));
  const all = dock.querySelector('[data-alarm-dismiss-all]');
  if(all) all.onclick = dismissAllAlarms;
  dock.querySelectorAll('[data-alarm-open]').forEach(el=> el.onclick = ()=> openTaskModal(el.dataset.alarmOpen));
  applyLang(dock);
}

/* ---------- freeze ---------- */
function freezeItem(ref, hours){
  const until = new Date(Date.now() + hours*3600000);
  patchItem(ref, {frozenUntil: until.toISOString()},
    `Đóng băng ${FREEZE_OPTIONS.find(o=>o[1]===hours)[2]}`);
  toast(`🧊 Đã đóng băng "${itemLabel(ref)}" trong ${FREEZE_OPTIONS.find(o=>o[1]===hours)[2]}`);
  renderView();
}
function unfreezeItem(ref){
  patchItem(ref, {frozenUntil:null}, 'Bỏ đóng băng');
  toast(`Đã bỏ đóng băng "${itemLabel(ref)}"`);
  renderView();
}

/* ---------- the menu itself ---------- */
let openTaskCtxMenu = null;
function closeTaskCtxMenu(){
  if(!openTaskCtxMenu) return;
  if(openTaskCtxMenu._cleanup) openTaskCtxMenu._cleanup();
  openTaskCtxMenu.remove();
  openTaskCtxMenu = null;
}
function openTaskContextMenu(ref, x, y){
  closeTaskCtxMenu();
  const {task, item, isSub} = resolveItem(ref);
  if(!task || !item) return;

  const frozen = isFrozen(item);
  const hasAlarm = isFiniteDate(item.alarmAt) && !item.alarmFiredAt;
  const menu = document.createElement('div');
  menu.className = 'note-ctx task-ctx';
  menu.innerHTML = `
    <div class="note-ctx-title">${isSub?'☑️ ':''}${esc(itemLabel(ref))}</div>
    <button class="note-menu-item" data-tctx="edit">${icon('edit',14)} ${isSub?'Sửa trong nhiệm vụ':'Sửa nhiệm vụ'}</button>
    <button class="note-menu-item" data-tctx="alarm">${icon('clock',14)} ${hasAlarm?'Đổi báo thức':'Đặt báo thức'}</button>
    ${hasAlarm?`<button class="note-menu-item" data-tctx="alarm-clear">${icon('close',14)} Huỷ báo thức</button>`:''}
    <div class="note-ctx-sep"></div>
    <div class="note-ctx-label">Màu</div>
    <div class="note-ctx-swatches">
      ${TASK_COLORS.map(c=>{
        const v = c.varName ? `var(${c.varName})` : '';
        const on = (item.color||null) === c.key;
        return `<button class="note-swatch${on?' on':''}${c.varName?'':' none'}"
          data-tctx-color="${c.key||''}" title="${esc(c.name)}" ${v?`style="background:${v};"`:''}></button>`;
      }).join("")}
    </div>
    <div class="note-ctx-sep"></div>
    ${frozen
      ? `<div class="note-ctx-label">🧊 Đang đóng băng — còn ${esc(freezeRemaining(item))}</div>
         <button class="note-menu-item" data-tctx="unfreeze">${icon('refresh',14)} Bỏ đóng băng</button>`
      : `<div class="note-ctx-label">🧊 Đóng băng trong</div>
         <div class="freeze-grid">
           ${FREEZE_OPTIONS.map(([k,h,label])=>`<button class="freeze-opt" data-tctx-freeze="${h}">${label}</button>`).join("")}
         </div>`}
    <div class="note-ctx-sep"></div>
    <button class="note-menu-item danger" data-tctx="delete">${icon('trash',14)} ${isSub?'Xoá công việc con':'Xoá nhiệm vụ'}</button>
  `;
  document.body.appendChild(menu);
  openTaskCtxMenu = menu;

  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(x, innerWidth  - r.width  - 8)) + 'px';
  menu.style.top  = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';

  menu.querySelectorAll('[data-tctx-color]').forEach(el=> el.onclick = ()=>{
    const key = el.dataset.tctxColor || null;
    patchItem(ref, {color:key});
    const c = TASK_COLORS.find(x=>x.key===key);
    toast(key ? `Đã đổi màu — ${c.name}` : 'Đã bỏ màu');
    closeTaskCtxMenu(); renderView();
  });
  menu.querySelectorAll('[data-tctx-freeze]').forEach(el=> el.onclick = ()=>{
    const h = parseInt(el.dataset.tctxFreeze);
    closeTaskCtxMenu(); freezeItem(ref, h);
  });
  menu.querySelectorAll('[data-tctx]').forEach(el=> el.onclick = ()=>{
    const action = el.dataset.tctx;
    closeTaskCtxMenu();
    if(action==='edit'){ openTaskModal(task.id); return; }
    if(action==='alarm'){ openAlarmModal(ref); return; }
    if(action==='alarm-clear'){
      patchItem(ref, {alarmAt:null, alarmFiredAt:null});
      toast('Đã huỷ báo thức'); renderView(); renderAlarmDock(); return;
    }
    if(action==='unfreeze'){ unfreezeItem(ref); return; }
    if(action==='delete'){
      if(!confirm(`Xoá "${itemLabel(ref)}"? Không thể hoàn tác.`)) return;
      if(isSub){
        task.checklist = task.checklist.filter(c=>c.id!==ref.subId);
        updateTask(task.id, {checklist: task.checklist}, `Xoá công việc con "${item.text||''}"`);
      } else {
        STATE.tasks = STATE.tasks.filter(x=>x.id!==task.id);
        // A note must never keep a link to a task that no longer exists.
        STATE.notes.forEach(n=>{ n.linkedTaskIds = (n.linkedTaskIds||[]).filter(id=>id!==task.id); });
        persist();
      }
      toast('Đã xoá'); renderView();
    }
  });

  const away = (e)=>{ if(!menu.contains(e.target)) closeTaskCtxMenu(); };
  const onEsc = (e)=>{ if(e.key==='Escape') closeTaskCtxMenu(); };
  setTimeout(()=>{
    document.addEventListener('mousedown', away, true);
    document.addEventListener('keydown', onEsc);
    document.addEventListener('scroll', closeTaskCtxMenu, true);
  }, 0);
  menu._cleanup = ()=>{
    document.removeEventListener('mousedown', away, true);
    document.removeEventListener('keydown', onEsc);
    document.removeEventListener('scroll', closeTaskCtxMenu, true);
  };
}
/** Called from every wire* that renders task or subtask rows. */
function wireTaskContextMenus(root){
  (root||document).querySelectorAll('[data-task-ctx]').forEach(el=> el.oncontextmenu = (e)=>{
    e.preventDefault(); e.stopPropagation();
    openTaskContextMenu({taskId: el.dataset.taskCtx, subId: el.dataset.subCtx || null}, e.clientX, e.clientY);
  });
}

function toggleTimer(id){
  if(activeTimer && activeTimer.taskId===id) stopTimer();
  else {
    if(activeTimer) stopTimer();
    activeTimer = {taskId:id, startedAt:Date.now()};
    // Focus is a posture he holds for as long as the timer runs, not a
    // one-shot — and Tobby_Focused is one of the three clips that bring the
    // desk with them, so the workstation appears without being managed.
    try{ TobbyBrain.work('focused'); }catch(e){}
    toast('Đã bắt đầu tính giờ'); renderView();
  }
}
function stopTimer(){
  if(!activeTimer) return;
  const t = STATE.tasks.find(x=>x.id===activeTimer.taskId);
  const minutes = Math.max(1, Math.round((Date.now()-activeTimer.startedAt)/60000));
  if(t){ t.timeLogs=t.timeLogs||[]; t.timeLogs.push({start:new Date(activeTimer.startedAt).toISOString(), end:nowISO(), minutes});
    t.actualHours = +((( t.actualHours||0) + minutes/60).toFixed(2)); t.updatedAt=nowISO(); persist(); }
  toast(`Đã ghi nhận ${minutes} phút`);
  activeTimer = null;
  try{ tobbyOnFocus(minutes); TobbyBrain.beProud(); }catch(e){}
  renderView();
}
function weekTimeLogged(){

function autoArchiveSweep(){
  const days = STATE.settings.autoArchiveDays;
  if(!days) return 0;
  let count=0;
  const cutoff = Date.now() - days*86400000;
  STATE.tasks.forEach(t=>{
    if(!t.archived && t.status==='Hoàn thành' && t.completedAt && new Date(t.completedAt).getTime() < cutoff){

function svgDonut(segments, size){
  size = size||120; const r=size*0.42, cx=size/2, cy=size/2;
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  let cum=0;
  const paths = segments.filter(s=>s.value>0).map(s=>{
    const frac = s.value/total;
    const a0=cum*2*Math.PI; cum+=frac; const a1=cum*2*Math.PI;
    const x1=cx+r*Math.sin(a0), y1=cy-r*Math.cos(a0);
    const x2=cx+r*Math.sin(a1), y2=cy-r*Math.cos(a1);
    const large = frac>0.5?1:0;
    const d = frac>=0.999 ? `M${cx},${cy-r} A${r},${r} 0 1 1 ${cx-0.01},${cy-r} Z` : `M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
    return `<path d="${d}" fill="${s.color}"></path>`;
  }).join("");
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim();
  const fg = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${r*0.58}" fill="${bg}"></circle><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="16" font-weight="800" fill="${fg}">${total}</text></svg>`;
}
function svgLineChart(seriesA, seriesB, labels, colorA, colorB){
  const w=520, h=140, pad=8;
  const max = Math.max(1, ...seriesA, ...seriesB);
  const stepX = (w-pad*2)/(labels.length-1||1);
  const pt = (arr,i)=> `${(pad+i*stepX).toFixed(1)},${(h-pad-(arr[i]/max)*(h-pad*2)).toFixed(1)}`;
  const lineA = seriesA.map((_,i)=>pt(seriesA,i)).join(" ");
  const lineB = seriesB.map((_,i)=>pt(seriesB,i)).join(" ");
  const areaA = `${pad},${h-pad} ${lineA} ${w-pad},${h-pad}`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <polygon points="${areaA}" fill="${colorA}" opacity="0.12"></polygon>
    <polyline points="${lineA}" fill="none" stroke="${colorA}" stroke-width="2.5"></polyline>
    <polyline points="${lineB}" fill="none" stroke="${colorB}" stroke-width="2.5"></polyline>
  </svg>`;
}

/* =========================================================
   AUTO SUMMARY / STANDUP REPORT
   Reads the same task and subtask records every other view uses — nothing is
   stored, so the report can never go stale or disagree with the board.
   ========================================================= */
let standupRange = 'day';   // day | week | month
const STANDUP_RANGES = [['day','Ngày'],['week','Tuần'],['month','Tháng']];

/** Inclusive window for the chosen range, anchored on today. */
function standupWindow(range){
  const now = new Date();
  const start = new Date(now);
  if(range === 'week'){
    // Week starts Monday; Sunday (getDay 0) belongs to the week that just ended.
    const dow = (now.getDay() + 6) % 7;
    start.setDate(start.getDate() - dow);
  } else if(range === 'month'){
    start.setDate(1);
  }
  start.setHours(0,0,0,0);
  return {start, end: now};
}
/** Everything the report needs, gathered in one pass over the active tasks. */
function standupData(range){
  const {start, end} = standupWindow(range);
  const inWindow = (iso)=> isFiniteDate(iso) && new Date(iso) >= start && new Date(iso) <= end;

  const done = [], doing = [], blocked = [], frozen = [], subsDone = [];
  activeTasks().forEach(t=>{
    if(t.status === 'Hoàn thành'){
      if(inWindow(t.completedAt)) done.push(t);
    } else if(isFrozen(t)){
      frozen.push(t);
    } else if(isOverdue(t)){
      blocked.push(t);
    } else if(t.status === 'Đang làm'){
      doing.push(t);
    }
    // Subtasks ticked inside the window are counted even when the parent is
    // still open — that is the part a standup usually leaves out.
    (t.checklist||[]).forEach(c=>{
      if(c.done && inWindow(c.doneAt)) subsDone.push({task:t, sub:c});
    });
  });

  const created = activeTasks().filter(t=> inWindow(t.createdAt));
  const hours = activeTasks().reduce((a,t)=>{
    if(t.status==='Hoàn thành' && inWindow(t.completedAt)) return a + (t.actualHours || t.estimateHours || 0);
    return a;
  }, 0);
  const byProject = {};
  done.forEach(t=>{
    const k = t.projectId || '__none__';
    (byProject[k] = byProject[k] || []).push(t);
  });
  return {start, end, done, doing, blocked, frozen, subsDone, created, hours, byProject};
}

  if(lines.length <= 2) lines.push('Khong co hoat dong nao trong ky nay.');
