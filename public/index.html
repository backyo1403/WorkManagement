  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.picker-empty{padding:18px; text-align:center; font-size:12.5px; color:var(--text-3);}

.notebook-lock{display:flex; flex-direction:column; align-items:center; text-align:center;
  gap:6px; padding:52px 20px; animation:lockIn 220ms cubic-bezier(.22,.61,.36,1) both;}
@keyframes lockIn{ from{opacity:0; transform:scale(.97);} to{opacity:1; transform:none;} }
.notebook-lock-icon{width:58px; height:58px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; background:var(--surface-2); border:1px solid var(--border);
  color:var(--text-2); margin-bottom:6px;}
.notebook-lock-title{font-size:16px; font-weight:750;}
.notebook-lock-name{font-size:13px; font-weight:700;}
.notebook-pin{width:170px; text-align:center; letter-spacing:.5em; font-size:19px; margin-top:14px;
  border:1px solid var(--border); border-radius:11px; padding:11px 12px; outline:none;
  background:var(--surface-2); color:var(--text);}
.notebook-pin:focus{border-color:var(--brand); background:var(--surface);}
.notebook-lock-note{font-size:11px; color:var(--text-3); margin-top:14px; max-width:300px;}

.version-layout{display:flex; gap:16px; align-items:flex-start;}
.version-list{width:210px; flex-shrink:0; max-height:min(400px,52vh); overflow-y:auto;
  display:flex; flex-direction:column; gap:2px;}
.version-day{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--text-3); padding:10px 8px 4px;}
.version-row{display:flex; flex-direction:column; gap:1px; text-align:left; cursor:pointer;
  border:none; background:none; border-radius:9px; padding:7px 9px;}
.version-row:hover{background:var(--surface-2);}
.version-row.active{background:var(--brand-soft);}
.version-time{font-size:12px; font-weight:700; color:var(--text);}
.version-title{font-size:11px; color:var(--text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.version-preview{flex:1; min-width:0; max-height:min(400px,52vh); overflow-y:auto;
  border:1px solid var(--border); border-radius:12px; padding:14px 16px; background:var(--surface-2);}

.note-menu-wrap{position:relative;}
.note-menu{position:absolute; right:0; top:100%; margin-top:6px; z-index:70; min-width:206px;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  box-shadow:var(--shadow-lg); padding:5px; animation:popIn .14s ease;}
.note-menu[hidden]{display:none;}
.note-menu-item{display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  border:none; background:none; cursor:pointer; padding:8px 10px; border-radius:8px;
  font-size:12.8px; font-weight:600; color:var(--text);}
.note-menu-item:hover{background:var(--surface-2);}
.note-menu-item.danger{color:var(--danger);}
.note-menu-item.danger:hover{background:var(--danger-soft);}

/* ---------- note card colour ----------
   --note-tint is set inline from a theme variable, so a tinted card washes the
   whole surface lightly and keeps a solid edge for scanning at a glance. */
.note-card.tinted{
  background:color-mix(in srgb, var(--note-tint) 9%, var(--surface));
  border-color:color-mix(in srgb, var(--note-tint) 34%, var(--border));
  border-left:3px solid var(--note-tint);
}
.note-card.tinted:hover{
  background:color-mix(in srgb, var(--note-tint) 15%, var(--surface));
  border-color:color-mix(in srgb, var(--note-tint) 52%, var(--border));
}
.note-card.tinted .note-card-title{color:var(--text);}

/* ---------- right-click menu ---------- */
.note-ctx{position:fixed; z-index:200; min-width:224px; padding:6px;
  background:var(--surface); border:1px solid var(--border); border-radius:13px;
  box-shadow:var(--shadow-lg); animation:popIn .12s ease;}
.note-ctx-title{font-size:11px; font-weight:700; color:var(--text-3); padding:6px 10px 7px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.note-ctx-sep{height:1px; background:var(--border); margin:5px 4px;}
.note-ctx-label{font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--text-3); padding:3px 10px 6px;}
.note-ctx-swatches{display:flex; flex-wrap:wrap; gap:6px; padding:0 8px 4px;}
.note-swatch{width:22px; height:22px; border-radius:7px; border:1px solid var(--border);
  cursor:pointer; padding:0; position:relative; transition:transform .12s ease;}
.note-swatch:hover{transform:scale(1.12);}
.note-swatch.on{box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--text-2);}
/* "No colour" reads as an empty slot with a diagonal strike. */
.note-swatch.none{background:var(--surface-2);}
.note-swatch.none::after{content:''; position:absolute; inset:3px;
  background:linear-gradient(to top right, transparent 45%, var(--text-3) 45%, var(--text-3) 55%, transparent 55%);}

/* =========================================================
   COMBO STREAK BANNER
   Centre-screen, non-interactive, gone in under two seconds.
   ========================================================= */
.combo-banner{
  position:fixed; left:50%; top:38%; transform:translate(-50%,-50%);
  z-index:400; pointer-events:none; text-align:center;
  animation:comboIn 420ms cubic-bezier(.2,1.5,.4,1) both;
}
.combo-banner.out{animation:comboOut 560ms ease-in forwards;}
@keyframes comboIn{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.35) rotate(-7deg);}
  60%{opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(2deg);}
  100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0);}
}
@keyframes comboOut{
  to{opacity:0; transform:translate(-50%,-50%) scale(1.5); filter:blur(7px);}
}
.combo-label{
  font-size:clamp(30px, 7vw, 62px); font-weight:900; letter-spacing:.055em;
  line-height:1; text-transform:uppercase; position:relative;
  color:var(--combo-hue);
  /* Layered shadows stand in for a stroke — no SVG, and it stays crisp on
     whatever the banner happens to be sitting over. */
  text-shadow:
    0 0 1px var(--surface), 0 2px 0 color-mix(in srgb, var(--combo-hue) 45%, #000),
    0 0 26px color-mix(in srgb, var(--combo-hue) 60%, transparent),
    0 0 60px color-mix(in srgb, var(--combo-hue) 35%, transparent);
  animation:comboPulse 520ms ease-in-out 2;
}
@keyframes comboPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.045);} }
.combo-sub{margin-top:9px; font-size:13px; font-weight:750; letter-spacing:.16em;
  text-transform:uppercase; color:var(--text-2);
  text-shadow:0 1px 3px var(--bg), 0 0 12px var(--bg);}
.combo-streak{margin-top:5px; font-size:12px; font-weight:800; color:var(--warning);
  text-shadow:0 1px 3px var(--bg);}

.combo-rays{
  position:absolute; left:50%; top:50%; width:520px; height:520px;
  transform:translate(-50%,-50%); pointer-events:none; z-index:-1;
  background:
    conic-gradient(from 0deg, color-mix(in srgb, var(--combo-hue) 22%, transparent) 0 6deg, transparent 6deg 30deg);
  mask-image:radial-gradient(circle, #000 12%, transparent 62%);
  -webkit-mask-image:radial-gradient(circle, #000 12%, transparent 62%);
  animation:comboSpin 3.4s linear infinite;
}
@keyframes comboSpin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }

.combo-sparks{position:absolute; left:50%; top:50%; width:0; height:0;}
.combo-sparks i{
  position:absolute; left:0; top:0; width:7px; height:7px; border-radius:50%;
  background:var(--combo-hue); transform:rotate(var(--a)) translateY(0);
  animation:comboSpark 760ms cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes comboSpark{
  0%{opacity:1; transform:rotate(var(--a)) translateY(0) scale(1);}
  100%{opacity:0; transform:rotate(var(--a)) translateY(-165px) scale(.25);}
}
@media (prefers-reduced-motion: reduce){
  .combo-banner,.combo-label,.combo-rays,.combo-sparks i{animation-duration:.01ms !important; animation-iteration-count:1 !important;}
  .combo-sparks{display:none;}
}

/* =========================================================
   WEATHER AMBIENCE
   Sits behind everything (#app panels are opaque and paint on top), takes no
   pointer events, and is capped at low opacity so it reads as atmosphere
   rather than as content. Nothing in here can cover a working area.
   ========================================================= */
/* The layer sits ABOVE the interface, not behind it.
   Behind was the obvious place and it was wrong: .sidebar and .main are opaque
   and together cover the whole viewport, so a sky at z-index 0 was painted over
   everywhere except a 10px gutter — the weather was running the entire time and
   could not be seen. Sitting on top, it takes no pointer events and is held at
   low opacity, so it reads as atmosphere across the app without hiding a
   single control. Interactive layers (Tobby 130, menus 200, alarms 300) all
   stay above it. */
.weather-layer{
  position:fixed; inset:0; z-index:90; pointer-events:none; overflow:hidden;
  contain:strict;                    /* keep repaints inside the layer */
  opacity:.9;
  /* A halo on every particle is what makes rain and snow legible over both a
     white card and a dark panel — without it the light theme swallows them. */
  --wx-drop-col:#3E8FD0;
  /* Not white: the light theme's cards are white, and white snow on a white
     card is snow you cannot see. */
  --wx-flake-col:#A9D4EE;
  --wx-halo:rgba(20,60,105,.5);
  --wx-cloud-col:#C9D8E8;
  --wx-cloud-edge:#9FB4CA;
}
:root[data-theme="dark"] .weather-layer{
  --wx-drop-col:#8FD4FF;
  --wx-flake-col:#FFFFFF;
  --wx-halo:rgba(0,0,0,.5);
  --wx-cloud-col:#35506E;
  --wx-cloud-edge:#4E739B;
}
#app{position:relative; z-index:1;}
.wx-tint{position:absolute; inset:0; transition:background 1.2s ease;}

/* Each scene gets one broad wash, built from theme variables. */
:root[data-weather="clear"]  .wx-tint{background:radial-gradient(900px 520px at 82% -8%, color-mix(in srgb, var(--warning) 13%, transparent), transparent 62%);}
:root[data-weather="cloudy"] .wx-tint{background:radial-gradient(1000px 560px at 30% -10%, color-mix(in srgb, var(--text-3) 12%, transparent), transparent 64%);}
:root[data-weather="wind"]   .wx-tint{background:radial-gradient(1000px 560px at 20% 0%, color-mix(in srgb, var(--success) 9%, transparent), transparent 60%);}
:root[data-weather="rain"]   .wx-tint{background:radial-gradient(1000px 620px at 50% -12%, color-mix(in srgb, var(--sky) 15%, transparent), transparent 66%);}
:root[data-weather="storm"]  .wx-tint{background:radial-gradient(1000px 620px at 50% -12%, color-mix(in srgb, var(--purple) 17%, transparent), transparent 66%);}
:root[data-weather="snow"]   .wx-tint{background:radial-gradient(1000px 620px at 50% -12%, color-mix(in srgb, var(--sky) 12%, transparent), transparent 68%);}
:root[data-weather="night"]  .wx-tint{background:radial-gradient(1000px 620px at 70% -10%, color-mix(in srgb, var(--purple) 14%, transparent), transparent 64%);}

/* rain — a hard 3px-wide streak, no gradient, no rounding: a pixel raindrop */
.wx-drop{position:absolute; top:-40px; width:3px;
  background:var(--wx-drop-col);
  box-shadow:0 0 0 1px var(--wx-halo);
  animation:wxFall linear infinite;}
@keyframes wxFall{ to{ transform:translateY(118vh); } }
.wx-flash{position:absolute; inset:0; background:#fff; opacity:0;
  animation:wxFlash 9s ease-out infinite;}
@keyframes wxFlash{ 0%,92%,100%{opacity:0;} 93%{opacity:.16;} 94%{opacity:0;} 95.5%{opacity:.10;} 96.5%{opacity:0;} }

/* snow — square flakes with a pixel cross, drawn with box-shadow so one
   element carries the whole shape */
.wx-flake{position:absolute; top:-16px; background:var(--wx-flake-col);
  box-shadow:0 0 0 1px var(--wx-halo);
  animation:wxDrift linear infinite;}
@keyframes wxDrift{
  0%{transform:translate(0,0);} 50%{transform:translate(26px,55vh);}
  100%{transform:translate(-14px,118vh);}
}

/* wind — a dashed pixel streak rather than a soft smear */
.wx-gust{position:absolute; left:-240px; height:3px;
  background:repeating-linear-gradient(90deg,
    var(--wx-drop-col) 0 12px, transparent 12px 20px);
  animation:wxSweep linear infinite;}
@keyframes wxSweep{ to{ transform:translateX(calc(100vw + 280px)); } }

/* The voxel sun/moon from the GLB. Same corner the CSS one occupied, same
   fixed anchoring, so it holds still while the page scrolls under it. Its
   `top` and size are set per hour and per moon phase from script. */
/* The one part of the weather layer that takes clicks. The layer itself stays
   pointer-events:none so it never intercepts the app; this is a ~44px target
   in a corner that holds nothing else (checked: only .main is under it).
   The transition is what makes the double-click swell read as a swell rather
   than a jump. */
.wx-body{
  position:fixed; top:12px; right:38px; width:34px; height:34px; z-index:3;
  pointer-events:auto; cursor:pointer;
  transition:top .8s ease, width .5s cubic-bezier(.34,1.4,.5,1),
             height .5s cubic-bezier(.34,1.4,.5,1), filter .5s ease;
}
.wx-body canvas{display:block; width:100%; height:100%;}
/* Once the model is drawing, the CSS bodies are redundant — but they stay in
   the markup so a WebGL failure still leaves a sun in the sky. */
.weather-layer.has-3d-body .wx-sun,
.weather-layer.has-3d-body .wx-moon{display:none;}
@media (max-width:699px){ .wx-body{right:14px; transform:scale(.82); transform-origin:100% 0;} }

/* clear sky — a stepped pixel sun: a square core, chamfered corners, and a
   soft corona behind it */
/* Fixed, not absolute, and pinned near the top edge: it is the sun, so it
   belongs to the sky rather than to the page, and it must hold still while
   the content scrolls beneath it. It also breathes with opacity only — the
   old `scale()` pulse pushed a 60px glow in and out, which read as the sun
   sliding around whenever the view moved. */
.wx-sun{position:fixed; top:12px; right:38px; width:30px; height:30px;
  z-index:2;
  background:#FFD75E;
  box-shadow:
    0 0 0 4px rgba(255,215,94,.30),
    -8px 0 0 0 #FFD75E,  8px 0 0 0 #FFD75E,
    0 -8px 0 0 #FFD75E,  0 8px 0 0 #FFD75E,
    0 0 32px 14px rgba(255,196,60,.22);
  animation:wxSkyBreathe 9s ease-in-out infinite;}
@keyframes wxSkyBreathe{ 0%,100%{opacity:.8;} 50%{opacity:1;} }
.wx-mote{position:absolute; width:4px; height:4px; background:#FFD75E;
  box-shadow:0 0 0 1px rgba(180,130,20,.4);
  animation:wxFloat ease-in-out infinite alternate;}
@keyframes wxFloat{ from{transform:translate(0,0);} to{transform:translate(28px,-38px);} }

/* night — square stars with a pixel twinkle cross */
.wx-star{position:absolute; background:#FFFFFF;
  box-shadow:0 0 0 1px rgba(120,160,230,.45), 0 0 8px 2px rgba(150,190,255,.35);
  animation:wxTwinkle ease-in-out infinite alternate;}
@keyframes wxTwinkle{ from{opacity:.2;} to{opacity:.95;} }

/* ---------- pixel clouds ----------
   Built from stacked hard-edged blocks rather than a blurred gradient. Blurred
   blobs were the thing that read as fake: they had no shape of their own and
   simply dimmed the page. A stepped silhouette matches Tobby's pixel language
   and is unmistakably a cloud even at low opacity. */
.wx-cloud{
  position:absolute; height:0; width:0;
  animation:wxSweep linear infinite;
}
.wx-cloud i{
  position:absolute; display:block;
  background:var(--wx-cloud-col);
  box-shadow:0 0 0 2px var(--wx-cloud-edge);
}
/* Pixel moon: a square with stepped corners and a bite taken out, the way a
   crescent is drawn on a tile grid. */
.wx-moon{
  position:fixed; top:14px; right:44px; width:28px; height:28px; z-index:2;
  background:#EEF3FF;
  box-shadow:
    -7px 0 0 0 #EEF3FF, 7px 0 0 0 #EEF3FF,
    0 -7px 0 0 #EEF3FF, 0 7px 0 0 #EEF3FF,
    0 0 30px 10px rgba(150,190,255,.28);
  animation:wxSkyBreathe 12s ease-in-out infinite;
}
/* Two craters, drawn as blocks — a plain disc reads as a ball, these read as
   a moon. (A crescent would need to punch a hole through a transparent layer,
   which cannot be done with a solid overlay.) */
.wx-moon::after{
  content:''; position:absolute; left:6px; top:8px; width:6px; height:6px;
  background:#D2DCF0;
  box-shadow:10px 8px 0 0 #D2DCF0, 3px 15px 0 0 #D2DCF0;
}
/* Reduced motion keeps the sky, loses the movement. The wash alone still tells
   you what it is doing outside. */
@media (prefers-reduced-motion: reduce){
  /* Motion stops; the scene stays. Particles are placed statically by the
     renderer in this mode so nothing ends up parked off-screen. */
  :root:not([data-motion="full"]) .weather-layer *{animation:none !important;}
  :root:not([data-motion="full"]) .wx-drop{transform:none !important;}
}
/* Phones keep a lighter version rather than none: the scene is half the point
   of the feature, and a dozen composited dots is not what drains a battery. */
@media (max-width:699px){
  .weather-layer{opacity:.7;}
  .wx-mote,.wx-gust{display:none;}
}

/* =========================================================
   TASK CONTEXT MENU · COLOUR · ALARM · FREEZE
   ========================================================= */
/* The bowl's menu. Its own rules rather than a borrowed class — `.ctx-menu`
   does not exist in this sheet, and a menu styled by a selector nothing
   defines is an invisible menu. Built from the same tokens as every popover. */
  padding:6px 11px 3px; font-size:11px; color:var(--text-3);
  border-top:1px solid var(--border); margin-top:3px;
}
.task-ctx{min-width:250px;}
.freeze-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:0 8px 4px;}
.freeze-opt{border:1px solid var(--border); background:var(--surface-2); color:var(--text-2);
  border-radius:8px; padding:6px 4px; font-size:11px; font-weight:650; cursor:pointer;
  transition:background .13s, color .13s, border-color .13s;}
.freeze-opt:hover{background:var(--sky-soft, color-mix(in srgb, var(--sky) 16%, transparent));
  color:var(--sky); border-color:var(--sky);}

/* Coloured rows use the same --item-tint contract as coloured notes. */
.task-row.tinted{
  background:color-mix(in srgb, var(--item-tint) 8%, var(--surface));
  border-color:color-mix(in srgb, var(--item-tint) 32%, var(--border));
  border-left:3px solid var(--item-tint);
}
.task-row.tinted:hover{background:color-mix(in srgb, var(--item-tint) 14%, var(--surface));}
.sub-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-2);
  position:relative; border-radius:9px; padding:3px 7px; min-width:0;}
.sub-row.done{color:var(--text-3); text-decoration:line-through;}
.sub-row-text{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sub-row.tinted{background:color-mix(in srgb, var(--item-tint) 10%, transparent);
  box-shadow:inset 2px 0 0 var(--item-tint);}

/* Pending-alarm chip */
.alarm-chip{display:inline-flex; align-items:center; gap:3px; flex-shrink:0;
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px;
  background:color-mix(in srgb, var(--purple) 15%, transparent); color:var(--purple);}

/* ---------- frost ----------
   A sheet of ice laid over the row: frozen work stays readable but visibly
   parked. pointer-events stay off so the row underneath is still clickable.

   These are literal ice tones rather than --sky, which follows the palette and
   turns green in the WORK group — ice that is not ice-coloured stops reading
   as ice at all. Only the frost uses them; everything else still themes. */
:root{
  --ice-pale:#EAF9FF;
  --ice:#A8E4F5;
  --ice-deep:#5FC2E0;
  --ice-shadow:#2B7C99;
}
:root[data-theme="dark"]{
  --ice-pale:#D6F2FB;
  --ice:#7FD4EC;
  --ice-deep:#3DA6C9;
  --ice-shadow:#16536B;
}
.task-row.frozen,.sub-row.frozen,.cal-pill.frozen{position:relative; overflow:hidden;}
.task-row.frozen > *:not(.frost),
.sub-row.frozen > *:not(.frost){opacity:.5; filter:saturate(.3);}
.cal-pill.frozen{filter:saturate(.25) brightness(1.15);}
.frost{
  position:absolute; inset:0; z-index:4; pointer-events:none; border-radius:inherit;
  background:
    /* two crossed frost-crystal fans, then a pale glaze */
    linear-gradient(118deg, color-mix(in srgb, var(--ice-pale) 62%, transparent) 0%, transparent 34%),
    linear-gradient(242deg, color-mix(in srgb, var(--ice-pale) 48%, transparent) 0%, transparent 30%),
    repeating-linear-gradient(58deg,  color-mix(in srgb, var(--ice) 34%, transparent) 0 1.5px, transparent 1.5px 8px),
    repeating-linear-gradient(-58deg, color-mix(in srgb, var(--ice) 26%, transparent) 0 1.5px, transparent 1.5px 11px),
    linear-gradient(180deg, color-mix(in srgb, var(--ice) 30%, transparent), color-mix(in srgb, var(--ice-deep) 24%, transparent));
  backdrop-filter:blur(.8px) saturate(.6);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--ice-deep) 62%, transparent),
             inset 0 1px 5px color-mix(in srgb, var(--ice-pale) 55%, transparent);
  display:flex; align-items:center; justify-content:flex-end; padding-right:12px;
}
.frost-label{font-size:10.5px; font-weight:750; color:var(--ice-shadow);
  background:var(--ice-pale); border:1px solid color-mix(in srgb, var(--ice-deep) 50%, transparent);
  border-radius:20px; padding:2px 9px; white-space:nowrap;}
:root[data-theme="dark"] .frost-label{color:#06222E; background:var(--ice);}
.sub-row .frost{justify-content:flex-end; padding-right:6px;}
.sub-row .frost-label{font-size:9px; padding:1px 6px;}

/* ---------- floating alarm badge ----------
   Anchored to <body>, above everything, and it stays until acknowledged —
   a re-render of the view never clears it. */
.alarm-dock{
  position:fixed; right:20px; top:20px; z-index:300; width:min(340px, calc(100vw - 32px));
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  box-shadow:var(--shadow-lg); padding:11px; animation:alarmIn .28s cubic-bezier(.34,1.4,.64,1) both;
}
@keyframes alarmIn{ from{opacity:0; transform:translateY(-14px) scale(.96);} to{opacity:1; transform:none;} }
.alarm-dock-head{display:flex; align-items:center; gap:8px; padding:2px 4px 9px;
  font-size:12.5px; color:var(--text);}
.alarm-bell{display:inline-flex; color:var(--purple); animation:bellRing 1.6s ease-in-out infinite;}
@keyframes bellRing{ 0%,72%,100%{transform:rotate(0);} 78%{transform:rotate(13deg);} 84%{transform:rotate(-11deg);} 90%{transform:rotate(7deg);} }
.alarm-count{background:var(--danger); color:#fff; font-size:10px; font-weight:800;
  border-radius:20px; padding:1px 7px;}
.alarm-all{margin-left:auto; border:none; background:none; color:var(--text-3);
  font-size:11px; font-weight:650; cursor:pointer; text-decoration:underline;}
.alarm-all:hover{color:var(--text);}
.alarm-item{display:flex; align-items:center; gap:8px; padding:8px 8px; border-radius:11px;
  background:var(--surface-2); margin-bottom:6px;}
.alarm-item:last-child{margin-bottom:0;}
.alarm-item-main{flex:1; min-width:0;}
.alarm-item-title{font-size:12.5px; font-weight:650; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.alarm-item-time{font-size:10.5px; color:var(--text-3); margin-top:1px;}
.alarm-x{width:24px; height:24px; flex-shrink:0; border:none; background:none; cursor:pointer;
  color:var(--text-3); font-size:12px; border-radius:7px;}
.alarm-x:hover{background:var(--danger-soft); color:var(--danger);}
.alarm-more{font-size:10.5px; color:var(--text-3); text-align:center; padding-top:4px;}
@media (max-width:699px){
  .alarm-dock{right:12px; left:12px; top:12px; width:auto;}
}

.composer-kinds{display:flex; gap:6px; margin-bottom:11px;}
.composer-kind{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);
  background:var(--surface-2); border-radius:20px; padding:5px 13px; font-size:12px;
  font-weight:700; color:var(--text-2); cursor:pointer;}
.composer-kind:hover{border-color:var(--brand); color:var(--brand);}
.composer-kind.active{background:var(--brand); color:var(--on-brand); border-color:transparent; cursor:default;}

.dash-notes{display:flex; flex-direction:column; gap:6px;}
.dash-note-row{display:flex; align-items:center; gap:9px; text-align:left; cursor:pointer;
  border:1px solid var(--border); background:var(--surface-2); border-radius:11px; padding:9px 11px;
  color:var(--text-2); transition:border-color .12s, transform .12s;}
.dash-note-row:hover{border-color:var(--brand); transform:translateY(-1px);}
.dash-note-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
.dash-note-title{font-size:12.8px; font-weight:650; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dash-note-main em{font-style:normal; font-size:10.5px; color:var(--text-3);}

/* Below 1100px the side column collapses into these sections. */
.note-mobile-panels{display:none; flex-direction:column; gap:10px; margin-top:16px;}
.note-panel-toggle{display:flex; align-items:center; gap:9px; width:100%; cursor:pointer;
  border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:12px 14px;
  font-size:13px; font-weight:700; color:var(--text); box-shadow:var(--shadow);}
.note-panel-toggle em{font-style:normal; margin-left:auto; font-size:11px; color:var(--text-3);}
.note-panel-toggle .ico{transition:transform .18s ease;}

@media (max-width:1099px){
  .note-side{display:none;}
  .note-mobile-panels{display:flex;}
  .notes-rail{width:170px;}
}
@media (max-width:699px){
  .notes-layout{flex-direction:column;}
  .notes-rail{width:100%; display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:4px;}
  .notes-rail-group{flex-direction:row; gap:6px; margin-bottom:0;}
  .notes-rail-item{width:auto; white-space:nowrap; background:var(--surface-2);}
  .notes-rail-label,.notes-rail-hint{display:none;}
  .note-grid,.template-grid{grid-template-columns:1fr;}
  .note-title-input{font-size:21px;}
  .md-input,.md-preview{min-height:300px;}
  .version-layout{flex-direction:column;}
  .version-list{width:100%; max-height:200px;}
  .version-preview{width:100%;}
  .note-menu{right:auto; left:0;}
}

/* Print / Save as PDF: just the note, no shell. Switch to Xem trước first
   for formatted output — the raw editor still prints its text. */
@media print{
  .sidebar,.fab-dock,.composer-pop,.note-side,.note-mobile-panels,
  .note-editor-head,.note-quick-actions,.md-toolbar,.toast-wrap{display:none !important;}
  #app{display:block; height:auto; overflow:visible;}
  .main{overflow:visible; padding:0;}
  .md-editor{border:none; box-shadow:none;}
  .md-input{height:auto; min-height:0; overflow:visible; resize:none;}
  .md-preview{min-height:0; padding:0;}
}

/* =========================================================
   MOTION
   Short, purposeful transitions. Everything here is disabled
   for users who ask for reduced motion.
   ========================================================= */
@keyframes viewIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
.view-enter{animation:viewIn 200ms cubic-bezier(.22,.61,.36,1) both;}

/* dashboard widgets assemble one after another */
@keyframes widgetIn{ from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:none;} }
.dash-widget{animation:widgetIn 260ms cubic-bezier(.22,.61,.36,1) both;}

/* task completion */
@keyframes checkPop{ 0%{transform:scale(.8);} 55%{transform:scale(1.15);} 100%{transform:scale(1);} }
.task-check.just-done{animation:checkPop 320ms cubic-bezier(.34,1.56,.64,1);}
.task-check svg{display:block;}
.task-check .tick{stroke-dasharray:18; stroke-dashoffset:18; }
.task-check.done .tick{animation:tickDraw 260ms 60ms ease forwards;}
@keyframes tickDraw{ to{stroke-dashoffset:0;} }
@keyframes burst{ 0%{opacity:1; transform:translate(0,0) scale(1);} 100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.3);} }
.spark{position:fixed; width:5px; height:5px; border-radius:50%; pointer-events:none; z-index:400;
  animation:burst 460ms cubic-bezier(.2,.7,.4,1) forwards;}
.task-title{transition:color .2s ease;}
.progress-fill{transition:width .35s cubic-bezier(.22,.61,.36,1), background .3s ease;}

/* row removal collapses instead of vanishing */
.row-removing{overflow:hidden; animation:rowOut 230ms cubic-bezier(.4,0,1,1) forwards;}
@keyframes rowOut{
  0%{opacity:1; max-height:140px;}
  35%{opacity:.4;}
  100%{opacity:0; max-height:0; margin:0; padding-top:0; padding-bottom:0; transform:translateX(-8px);}
}

/* calendar month slide */
@keyframes monthInR{ from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:none;} }
@keyframes monthInL{ from{opacity:0; transform:translateX(-20px);} to{opacity:1; transform:none;} }
.month-next{animation:monthInR 220ms cubic-bezier(.22,.61,.36,1) both;}
.month-prev{animation:monthInL 220ms cubic-bezier(.22,.61,.36,1) both;}
@keyframes todayPulse{ 0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--brand) 45%, transparent);} 50%{box-shadow:0 0 0 6px transparent;} }
.cal-month-cell.today .cal-day-num{animation:todayPulse 2.4s ease-in-out infinite;}
@keyframes dotIn{ from{opacity:0; transform:scale(.4);} to{opacity:1; transform:none;} }
.cal-pill{animation:dotIn 220ms cubic-bezier(.34,1.4,.64,1) both;}

/* Every reduced-motion block below is scoped to :not([data-motion="full"]).
   The OS preference still wins for anyone who has not chosen in-app, but a
   user who has explicitly asked this app for full motion gets it — the blanket
   rule here was overriding the weather, the star field and the map easing with
   a 0.001ms duration, which is why they looked frozen rather than calm. */
@media (prefers-reduced-motion: reduce){
  :root:not([data-motion="full"]) *,
  :root:not([data-motion="full"]) *::before,
  :root:not([data-motion="full"]) *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* Lifted clear of Tobby, who stands on the same edge. Toasts used to land on
   top of him, hiding both the message and the character reacting to it. The
   clearance covers his dock *and* a speech bubble above it, since the two
   frequently appear together — a completed task raises both at once. */
.toast-wrap{position:fixed; bottom:196px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:200;}
.toast{background:var(--text); color:var(--bg); padding:10px 16px; border-radius:11px; font-size:13px; box-shadow:var(--shadow-lg); animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:24px;
  background:radial-gradient(1200px 600px at 20% -10%, var(--brand-soft), transparent 60%), var(--bg);}
.login-card{width:100%; max-width:390px; background:var(--surface); border:1px solid var(--border);
  border-radius:20px; box-shadow:var(--shadow-lg); padding:28px 26px;}
.login-brand{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.login-error{background:var(--danger-soft); color:var(--danger); border-radius:9px; padding:9px 12px;
  font-size:12.5px; font-weight:600; margin-bottom:12px;}
.login-hint{margin-top:14px; text-align:center; font-size:11.5px; color:var(--text-3);}

/* =========================================================
   RESPONSIVE — desktop ≥1100, tablet 700-1099, mobile <700.
   Layout primitives (grids, tables, nav) adapt at each step so the
   same markup works on every device.
   ========================================================= */

/* --- Tablet --- */
@media (max-width:1099px){
  .sidebar{width:74px; padding:14px 8px;}
  .sidebar .brand-name,.sidebar .brand-sub,.nav-group-label,.sidebar-user-name,.sidebar-user-role{display:none;}
  .brand{justify-content:center; padding:6px 0 14px;}
  .theme-toggle{margin-left:0;}
  .nav-item{justify-content:center; padding:11px 6px;}
  .nav-item span:not(.dot){display:none;}
  .nav-item .dot{font-size:18px;}
  .nav-badge{position:absolute;}
  .sidebar-user{justify-content:center;}
  .main{padding:20px 18px 60px;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-2,.grid-2e{grid-template-columns:1fr;}
  .dash-grid .dash-widget{grid-column:span 12 !important;}
  .kanban-wrap{grid-template-columns:1fr 1fr;}
  .settings-layout{flex-direction:column;}
  .settings-nav{width:100%; flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:4px;}
  .settings-nav button{white-space:nowrap;}
  .col-project{display:none;}
}

/* --- Mobile --- */
@media (max-width:699px){
  body{font-size:14.5px;}
  #app{flex-direction:column;}
  .sidebar{position:fixed; bottom:0; left:0; right:0; top:auto; width:100%; height:62px; flex-direction:row;
    padding:0 4px; border-right:none; border-top:1px solid var(--border); justify-content:space-around;
    align-items:center; z-index:100; overflow-x:auto; overflow-y:hidden;}
  /* The theme toggle used to live inside .brand, and .brand was hidden here —
     so on a phone there was simply no way to reach dark mode. `display:contents`
     dissolves the brand block so its children join the bottom bar directly;
     the logo and wordmark stay hidden, the toggle becomes a nav-sized button. */
  .sidebar-user,.nav-group-label{display:none;}
  .brand{display:contents;}
  .brand-mark,.brand > div{display:none;}
  .theme-toggle{
    order:99; flex-shrink:0; width:44px; height:44px; min-width:44px;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:19px; border-radius:12px; margin:0;
    /* Sticky, because the bottom bar scrolls horizontally once there are more
       nav items than fit — a toggle parked at the end would sit off-screen at
       x=628 on a 390px phone and never be found. Pinned right, it is always
       on screen no matter how far the bar is scrolled. */
    position:sticky; right:0;
    background:var(--surface); box-shadow:-8px 0 10px -6px rgba(0,0,0,.28);
  }
  .nav-item{flex-direction:column; font-size:9px; padding:6px 4px; gap:2px; border-radius:9px; min-width:52px;}
  .nav-item span:not(.dot){display:block; font-size:8.5px; line-height:1.1; text-align:center;}
  .nav-item .dot{font-size:16px;}
  .nav-item.active{box-shadow:none;}
  .main{padding:14px 12px 84px;}
  .page-header{flex-direction:column; align-items:stretch; gap:10px;}
  .page-actions{flex-wrap:wrap;}
  .page-title{font-size:19px;}
  .search-box{max-width:none;}
  .grid-4,.grid-3,.grid-2,.grid-2e,.stat-row{grid-template-columns:1fr;}
  .kanban-wrap{grid-template-columns:1fr;}
  .card{padding:14px 14px; border-radius:14px;}
  .modal{padding:20px 16px; border-radius:16px; max-height:92vh;}
  .field-row{flex-direction:column; gap:0;}
  .btn{padding:11px 15px;}          /* larger touch targets */
  .btn-icon{width:38px; height:38px;}
  .task-check,.hover-sub-check{min-width:20px; min-height:20px;}
  .fab-composer{left:auto; right:16px; bottom:76px; width:56px; height:56px;}
  .composer-pop{left:12px; right:12px; bottom:140px; width:auto; max-height:70vh; overflow-y:auto;}
  /* A task row on a phone is a two-line card, not a squeezed desktop table.
     Every metadata column kept its fixed width and only the title was allowed
     to shrink, so on a 390px screen the name of the task got 56px — the one
     thing you actually need to read. Now the title takes the whole first line
     and the metadata wraps underneath it. */
  .col-project,.col-due{display:none;}
  .task-row{flex-wrap:wrap; gap:6px 8px; align-items:center;}
  /* !important because the title span carries an inline `flex:1`, and an
     inline style outranks any stylesheet rule — without this the override is
     simply ignored and the title stays crushed. */
  .task-row > .col-title{ flex:1 1 100% !important; order:2; min-width:0; }
  .task-row > .row-caret,
  .task-row > .task-check{ order:1; }
  .task-row > .pill{ order:3; }
  .col-deadline{ order:4; width:auto; min-width:0; flex:0 0 auto; }
  .col-status{ order:5; width:auto; flex:1 1 120px; min-width:110px; }
  .task-row > .btn-icon{ order:6; }
  .task-row > .btn-icon.danger{ order:7; }
  /* After .btn-icon, or the generic rule above would win on source order and
     drag the pin down to the action row. */
  .task-row > .btn-icon.pin-btn{ order:1; }
  /* The title itself must be allowed to run to two lines rather than clip. */
  .task-title{ white-space:normal; overflow-wrap:anywhere; line-height:1.35; }
  .task-progress{ order:8; flex:1 1 100%; }
  .task-progress{max-width:none;}
  /* tables become stacked cards */
  .data-table thead{display:none;}
  .data-table,.data-table tbody,.data-table tr,.data-table td{display:block; width:100%;}
  .data-table tr{border:1px solid var(--border); border-radius:12px; margin-bottom:10px; padding:6px 4px; background:var(--surface);}
  .data-table td{border-bottom:none; padding:7px 10px;}
  .data-table tr:hover td{background:transparent;}
  .tt-corner,.tt-hours{width:46px;}
  .tt-dayhead{padding:6px 2px; font-size:10px;}
  .cal-month-cell{min-height:74px; padding:4px;}
  .cal-pill{font-size:9px; padding:2px 4px;}
  .gantt-side{width:130px;}
  .settings-nav{gap:4px;}
  .toast-wrap{left:12px; right:12px; bottom:200px;}   /* nav bar + Tobby + bubble */
  .toast{width:100%;}
  .hover-card{display:none !important;}   /* no hover on touch — use tap to open */
  .dash-clock{padding:3px 9px;}
  .dash-clock-time{font-size:15px;}
}
@media (max-width:699px) and (orientation:landscape){
  .sidebar{height:54px;}
  .main{padding-bottom:70px;}
}

/* =========================================================
   VISUAL REDESIGN — 2026
   A presentation-only pass over everything above: softer
   elevation, rounder surfaces, more whitespace, quieter
   borders and typography.

   Rules of this layer:
     · it only ever restates colour through the existing
       variables, so light/dark and the WORK/SPORT/LIFE
       palettes keep their own identity untouched;
     · it changes no selector names, so nothing the script
       queries can go missing;
     · it sits last so it wins on order rather than by
       piling on specificity.
   ========================================================= */

:root{
  /* Elevation ladder. Every step is the same hue as before, just spread
     wider and carried lighter so panels read as floating rather than
     outlined. `--shadow`/`--shadow-lg` keep their names because the markup
     above already references them. */
  --shadow:0 1px 2px rgba(16,24,54,.04), 0 4px 16px rgba(16,24,54,.045);
  --shadow-lg:0 4px 12px rgba(16,24,54,.05), 0 18px 44px rgba(16,24,54,.09);
  --shadow-sm:0 1px 2px rgba(16,24,54,.04);
  --shadow-pop:0 6px 16px rgba(16,24,54,.07), 0 24px 56px rgba(16,24,54,.13);
  --shadow-modal:0 12px 28px rgba(16,24,54,.10), 0 44px 96px rgba(16,24,54,.20);

  --radius:18px; --radius-sm:12px;
  --r-panel:22px;   /* shell panels */
  --r-card:18px;    /* cards, widgets */
  --r-item:13px;    /* rows, list items */
  --r-control:11px; /* buttons, inputs */

  /* A border that separates without drawing a box around everything. */
  --hairline:color-mix(in srgb, var(--border) 62%, transparent);
}
:root[data-theme="dark"]{
  --shadow:0 1px 2px rgba(0,0,0,.34), 0 4px 16px rgba(0,0,0,.30);
  --shadow-lg:0 4px 14px rgba(0,0,0,.40), 0 20px 48px rgba(0,0,0,.46);
  --shadow-sm:0 1px 2px rgba(0,0,0,.32);
  --shadow-pop:0 6px 18px rgba(0,0,0,.45), 0 26px 60px rgba(0,0,0,.55);
  --shadow-modal:0 14px 32px rgba(0,0,0,.5), 0 48px 100px rgba(0,0,0,.62);
  --hairline:color-mix(in srgb, var(--border) 78%, transparent);
}

/* ---------- shell: two floating panels ----------
   The WORK group already proved this layout; the other palettes now share it.
   WORK's own rules are more specific, so its 26px corners still win. */
body{
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--brand) 7%, transparent), transparent 62%),
    radial-gradient(900px 520px at 100% 4%, color-mix(in srgb, var(--purple) 5%, transparent), transparent 58%),
    var(--bg);
  background-attachment:fixed;
}
#app{padding:14px; gap:14px;}
.sidebar{
  border-radius:var(--r-panel); border:1px solid var(--hairline);
  background:var(--surface); box-shadow:var(--shadow);
  padding:18px 12px 14px; border-right:1px solid var(--hairline);
}
.main{
  border-radius:var(--r-panel); border:1px solid var(--hairline);
  background:var(--surface-2); box-shadow:var(--shadow);
  padding:30px 34px 56px;
}
.view{max-width:1320px;}

/* ---------- sidebar ---------- */
.brand{padding:6px 8px 14px; gap:11px;}
.brand-mark{width:36px; height:36px; border-radius:12px; box-shadow:var(--shadow-sm);}
.brand-name{font-size:15px; font-weight:700; letter-spacing:-.015em;}
.brand-sub{font-size:10.5px; color:var(--text-3); letter-spacing:.005em;}
.theme-toggle{
  width:32px; height:32px; border-radius:11px; border:1px solid var(--hairline);
  background:var(--surface-2); color:var(--text-2);
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .14s ease, color .14s ease, border-color .14s ease;
}
.theme-toggle:hover{background:var(--surface-3); color:var(--text);}

.nav-group-label{
  font-size:10px; font-weight:700; letter-spacing:.09em;
  color:var(--text-3); padding:16px 12px 7px; opacity:.85;
}
.nav-item{
  padding:9px 12px; border-radius:var(--r-item); gap:11px;
  font-size:13.5px; font-weight:550; color:var(--text-2);
  transition:background .14s ease, color .14s ease;
}
.nav-item:hover{background:color-mix(in srgb, var(--brand) 7%, transparent); color:var(--text);}
.nav-item.active{
  background:var(--brand); color:var(--on-brand, #fff); font-weight:620;
  box-shadow:0 2px 10px color-mix(in srgb, var(--brand) 28%, transparent);
}
.nav-item .dot{opacity:.9;}
.nav-item.active .dot{opacity:1;}
.nav-badge{font-size:9.5px; padding:2px 7px; border-radius:20px; font-weight:700;}

.group-chip{
  margin:6px 4px 2px; padding:8px 11px; border-radius:var(--r-item);
  font-size:11px; letter-spacing:.05em;
  background:color-mix(in srgb, var(--brand) 12%, transparent); color:var(--brand-dark);
}
.sidebar-user{
  padding-top:14px; margin-top:auto; gap:10px;
  border-top:1px solid var(--hairline);
}
.sidebar-user-name{font-size:12.5px; font-weight:650;}
.sidebar-user-role{font-size:10.5px; color:var(--text-3);}

/* ---------- page header ---------- */
.page-header{margin-bottom:26px; gap:20px;}
.page-title{font-size:25px; font-weight:720; letter-spacing:-.025em; gap:11px;}
.page-title-icon{
  width:34px; height:34px; border-radius:11px; justify-content:center;
  background:color-mix(in srgb, var(--brand) 11%, transparent); color:var(--brand);
}
.page-sub{font-size:12.5px; color:var(--text-3); margin-top:5px;}
.list-meta{font-size:11.5px; color:var(--text-3); margin:0 2px 12px; letter-spacing:.01em;}

/* ---------- cards ---------- */
.card{
  border-radius:var(--r-card); border:1px solid var(--hairline);
  padding:22px 24px; box-shadow:var(--shadow);
}
.card h3{
  font-size:13.5px; font-weight:680; margin-bottom:16px;
  letter-spacing:-.005em; color:var(--text);
}
.grid{gap:18px;}

/* ---------- stat cards: the number is the subject ---------- */
.stat-row{gap:18px;}
.stat-card{
  border-radius:var(--r-card); padding:20px 22px; gap:12px;
  border:1px solid var(--hairline); box-shadow:var(--shadow);
}
.stat-card .stat-icon{width:36px; height:36px; border-radius:11px; box-shadow:none;}
.stat-card .stat-num{font-size:32px; font-weight:700; letter-spacing:-.035em; line-height:1.05;}
.stat-card .stat-label{font-size:12px; font-weight:550; opacity:.72; letter-spacing:.005em;}
.stat-card .stat-link{font-size:11px; font-weight:600; opacity:.62;}
.stat-card .stat-link:hover{opacity:.95;}
.mini-progress{height:4px; background:color-mix(in srgb, var(--text-3) 22%, transparent);}
.progress-bar{height:5px; background:color-mix(in srgb, var(--text-3) 18%, transparent);}

/* ---------- dashboard ---------- */
.dash-grid{gap:18px;}
.dash-card{border-radius:var(--r-card);}
.dash-handle{border-radius:var(--r-control); font-size:11px; padding:6px 11px;}
.dash-cal-cell{border-radius:7px; font-size:10.5px;}
.dash-cal-head{font-size:9.5px; letter-spacing:.05em;}
.dash-clock{border-radius:var(--r-control); border:1px solid var(--hairline); padding:5px 13px;}
.dash-clock-time{font-size:16px; font-weight:700; letter-spacing:.4px;}

/* ---------- tables: airy, not spreadsheet ---------- */
.data-table{border-radius:var(--r-card); border:1px solid var(--hairline); box-shadow:var(--shadow);}
.data-table th{
  font-size:10px; font-weight:700; letter-spacing:.07em; color:var(--text-3);
  background:transparent; padding:15px 18px 11px; border-bottom:1px solid var(--hairline);
}
.data-table td{padding:16px 18px; border-bottom:1px solid var(--hairline); font-size:13px;}
.data-table tr:hover td{background:color-mix(in srgb, var(--brand) 4%, transparent);}
.table-wrap{border-radius:var(--r-card);}
/* An action cell holds nothing but buttons, so it should never break them
   onto a second line — it just makes the row taller for no information. */
.data-table td:has(.btn-icon + .btn-icon){white-space:nowrap;}
.data-table td:has(.btn-icon + .btn-icon) .btn-icon{width:30px; height:30px; border-radius:9px;}

/* ---------- task rows ----------
   The floating shell costs ~48px of row width, and the metadata columns are
   all `flex-shrink:0`, so every pixel came out of the one flexible cell — the
   title. Trimming the fixed columns hands that space back and matches the
   reference, where the row's subject is the widest thing in it. */
.task-list{gap:9px;}
.task-row{
  border-radius:var(--r-item); padding:13px 15px; gap:11px;
  border:1px solid var(--hairline); box-shadow:var(--shadow-sm);
  transition:box-shadow .16s ease, border-color .16s ease, transform .16s ease;
}
.col-project{width:142px;}
.col-deadline{width:92px;}
.col-due{width:112px;}
.col-status{width:104px;}
/* Last to yield: the project chip already ellipses, the title cannot. */
.col-project{flex-shrink:1; min-width:74px;}
.task-row > span:has(> .task-title){min-width:0;}
.task-row:hover{
  box-shadow:var(--shadow); border-color:color-mix(in srgb, var(--brand) 32%, var(--hairline));
  transform:translateY(-1px);
}
.task-title{font-size:13.5px; font-weight:600;}
.task-check{width:19px; height:19px; border:1.8px solid color-mix(in srgb, var(--text-3) 70%, transparent);}
.task-check:hover{border-color:var(--brand);}
.due-pill{padding:3px 10px; border-radius:20px; font-size:10.5px; font-weight:700;}
.badge{border-radius:20px; padding:3px 10px; font-size:10.5px; font-weight:650;}
.pill{border-radius:20px; padding:4px 12px; font-size:11px; font-weight:640;}
.status-select{border-radius:20px; padding:5px 11px; font-size:11px; font-weight:650;}
.hashtag-mini{border-radius:20px; padding:2px 8px; font-size:10px;}

/* ---------- kanban ---------- */
.kanban-wrap{gap:18px;}
.kanban-col{
  border-radius:var(--r-card); padding:14px 13px; border:1px solid transparent;
  background:color-mix(in srgb, var(--surface-3) 55%, transparent);
}
.kanban-col-head{padding:5px 8px 14px; font-size:12.5px; font-weight:680;}
.kanban-col-count{border-radius:20px; padding:2px 9px; font-size:11px; border:1px solid var(--hairline);}
.kanban-card{
  border-radius:var(--r-item); padding:14px 15px; margin-bottom:10px;
  border:1px solid var(--hairline); box-shadow:var(--shadow-sm);
  transition:box-shadow .16s ease, transform .16s ease, border-color .16s ease;
}
.kanban-card:hover{box-shadow:var(--shadow); transform:translateY(-2px);}
.kanban-card-title{font-size:13px; font-weight:620; margin:9px 0;}

/* ---------- timetable ---------- */
.tt-wrap{border-radius:var(--r-card); border:1px solid var(--hairline); box-shadow:var(--shadow);}
/* Opaque, not transparent: it is sticky now, and the hour rows scroll beneath
   it. A see-through header would let them read straight through the day names. */
.tt-headrow{background:var(--surface); border-bottom:1px solid var(--hairline);}
.tt-corner,.tt-hours{border-right:1px solid var(--hairline);}
.tt-dayhead{border-right:1px solid var(--hairline); padding:13px 6px 12px;}
.tt-dayname{font-size:11px; font-weight:550; color:var(--text-3); letter-spacing:.02em;}
.tt-daydate{font-size:13px; font-weight:700; margin-top:2px;}
.tt-hourlabel{font-size:10px; color:var(--text-3); border-bottom:1px solid var(--hairline); padding-right:9px;}
.tt-hourcell{border-bottom:1px solid var(--hairline);}
.tt-daycol{border-right:1px solid var(--hairline);}
.tt-block{border-radius:13px; padding:8px 10px 11px;}
.tt-day-badge{border-radius:20px; font-size:9px;}

/* ---------- calendar ---------- */
.cal-month-grid{border-radius:var(--r-card); border:1px solid var(--hairline); box-shadow:var(--shadow);}
.cal-month-head{
  font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--text-3);
  background:transparent; padding:12px 4px; border-bottom:1px solid var(--hairline);
}
.cal-month-cell{border-top:1px solid var(--hairline); border-left:1px solid var(--hairline); padding:8px;}
.cal-day-num{font-size:11.5px; font-weight:650; color:var(--text-2);}
.cal-pill{border-radius:8px; padding:4px 8px; font-size:10px; font-weight:600;}

/* ---------- gantt ---------- */
.gantt-wrap{border-radius:var(--r-card); border:1px solid var(--hairline); box-shadow:var(--shadow);}
.gantt-side{border-right:1px solid var(--hairline);}
.gantt-side-head{
  font-size:10px; letter-spacing:.07em; color:var(--text-3);
  border-bottom:1px solid var(--hairline);
}
.gantt-side-row{border-bottom:1px solid var(--hairline);}
.gantt-side-row:hover{background:color-mix(in srgb, var(--brand) 5%, transparent);}
.gantt-day-head{border-bottom:1px solid var(--hairline);}
.gantt-day{border-right:1px solid var(--hairline); font-size:9.5px;}
.gantt-row{border-bottom:1px solid var(--hairline);}
.gantt-bar{border-radius:8px; font-size:10px; font-weight:650;}

/* ---------- controls: one height, one radius family ---------- */
.btn{border-radius:var(--r-control); padding:10px 17px; font-size:13px; font-weight:620;}
.btn-primary{box-shadow:0 2px 10px color-mix(in srgb, var(--brand) 26%, transparent);}
.btn-primary:hover{box-shadow:0 4px 14px color-mix(in srgb, var(--brand) 32%, transparent);}
.btn-ghost{border:1px solid var(--hairline); background:var(--surface);}
.btn-ghost:hover{background:var(--surface-3); border-color:var(--border);}
.btn-sm{padding:7px 13px; font-size:12px; border-radius:10px;}
.btn-icon{
  width:34px; height:34px; border-radius:11px;
  border:1px solid var(--hairline); background:var(--surface);
}
.btn-add{
  width:36px; height:36px; border-radius:11px;
  box-shadow:0 3px 12px color-mix(in srgb, var(--brand) 30%, transparent);
}
.icon-circle-btn{border:1px solid var(--hairline); background:var(--surface);}

.search-input-wrap{
  border-radius:var(--r-control); padding:9px 14px; gap:9px;
  border:1px solid var(--hairline); background:var(--surface);
  transition:border-color .14s ease, box-shadow .14s ease;
}
.search-input-wrap:focus-within{
  border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
}
.filter-select{
  border-radius:var(--r-control); padding:9px 13px; font-size:12.5px;
  border:1px solid var(--hairline); background:var(--surface);
}
.filter-select:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
}
.page-actions .filter-select,.page-actions .search-input-wrap{height:38px;}
.page-actions .btn-icon{width:38px; height:38px;}
.page-actions .btn-add{width:38px; height:38px;}
.page-actions{gap:11px;}

.field label{font-size:11.5px; font-weight:620; color:var(--text-3); margin-bottom:7px; letter-spacing:.01em;}
.field input,.field select,.field textarea{
  border-radius:var(--r-control); padding:11px 14px;
  border:1px solid var(--hairline); background:var(--surface-2);
  transition:border-color .14s ease, box-shadow .14s ease, background .14s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--brand); background:var(--surface);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
}
.field{margin-bottom:16px;}
.composer-chip{border-radius:20px; padding:7px 13px; border:1px solid var(--hairline);}
.pill-toggle{border-radius:20px; padding:7px 14px; border:1px solid var(--hairline); font-size:12px;}
.pill-toggle.active{box-shadow:0 2px 8px color-mix(in srgb, var(--brand) 24%, transparent);}

/* ---------- modal ---------- */
.overlay{background:rgba(12,14,28,.42); backdrop-filter:blur(6px); padding:24px;}
.modal{
  border-radius:24px; padding:30px 32px; box-shadow:var(--shadow-modal);
  border:1px solid var(--hairline);
}
.modal-header{margin-bottom:22px;}
.modal-title{font-size:18px; font-weight:700; letter-spacing:-.02em;}
.close-x{
  width:32px; height:32px; border-radius:11px; color:var(--text-3);
  background:var(--surface-2); border:1px solid var(--hairline);
  transition:background .14s ease, color .14s ease;
}
.close-x:hover{background:var(--surface-3); color:var(--text);}
.modal-section-label{
  font-size:10px; letter-spacing:.08em; margin:22px 0 11px;
  padding-top:18px; border-top:1px solid var(--hairline);
}
.action-item{border-radius:var(--r-control); padding:11px 13px; font-size:12.8px;}

/* ---------- popovers ---------- */
.search-results{border-radius:var(--r-card); border:1px solid var(--hairline); box-shadow:var(--shadow-pop);}
.search-result-row{padding:12px 14px; border-bottom:1px solid var(--hairline);}
.search-group{
  font-size:9.5px; letter-spacing:.08em; background:transparent;
  border-bottom:1px solid var(--hairline); padding:10px 14px 5px;
}
.hover-card{border-radius:var(--r-card); border:1px solid var(--hairline); box-shadow:var(--shadow-pop); padding:14px;}
.note-menu,.md-palette,.hashtag-suggest{border:1px solid var(--hairline); box-shadow:var(--shadow-pop);}
.toast{border-radius:var(--r-control); padding:11px 17px; box-shadow:var(--shadow-pop);}

/* ---------- settings ---------- */
.settings-layout{gap:26px;}
.settings-nav button{border-radius:var(--r-item); padding:10px 13px; font-size:13px;}
.settings-nav button:hover{background:var(--surface-2);}

/* ---------- notes ---------- */
.note-card,.template-card{border-radius:var(--r-card); border:1px solid var(--hairline); padding:18px 19px;}
.note-panel{border-radius:var(--r-card); border:1px solid var(--hairline); padding:18px 20px;}
.md-editor{border-radius:var(--r-card); border:1px solid var(--hairline);}
.md-toolbar{background:transparent; border-bottom:1px solid var(--hairline); padding:9px 11px;}
.md-rich,.md-input,.md-preview{padding:22px 24px;}
.notes-rail-item{border-radius:var(--r-item); padding:9px 12px;}
.linked-row{border-radius:var(--r-item); padding:11px 12px;}
.picker-list{border-radius:var(--r-card); border:1px solid var(--hairline); padding:8px;}
.picker-row{border-radius:var(--r-item); padding:11px 13px; border:1px solid transparent;}
.note-title-input{font-size:27px; font-weight:720; letter-spacing:-.025em;}

/* ---------- floating action dock ---------- */
.fab-composer{box-shadow:0 6px 20px color-mix(in srgb, var(--brand) 38%, transparent), var(--shadow-lg);}
.fab-orb{box-shadow:var(--shadow-pop); border:1px solid var(--hairline);}
.composer-pop{border-radius:22px; border:1px solid var(--hairline); box-shadow:var(--shadow-modal); padding:18px 20px 20px;}

/* ---------- login ---------- */
.login-card{border-radius:24px; border:1px solid var(--hairline); padding:32px 30px; box-shadow:var(--shadow-modal);}

/* ---------- empty states ---------- */
.empty-state{padding:52px 20px; color:var(--text-3);}

/* =========================================================
   RESPONSIVE — the floating shell only exists where there is
   room for it. Below 700px the sidebar becomes the bottom bar
   again and both panels go back to edge-to-edge.
   ========================================================= */
/* Between roughly a laptop and a large monitor the frame has to earn its keep:
   keep the floating look but stop spending 100px on margins. */
@media (max-width:1399px){
  #app{padding:10px; gap:10px;}
  .main{padding:26px 24px 52px;}
}
@media (max-width:1099px){
  .main{padding:24px 18px 52px;}
  .sidebar{padding:14px 8px 10px;}
  .page-title{font-size:22px;}
}
@media (max-width:699px){
  #app{padding:0; gap:0;}
  .sidebar{
    border-radius:0; box-shadow:none; border:none;
    border-top:1px solid var(--border); padding:0 4px;
  }
  .main{
    border-radius:0; box-shadow:none; border:none;
    background:transparent; padding:16px 14px 84px;
  }
  .page-title{font-size:20px;}
  .card{padding:16px 16px;}
  .modal{padding:22px 18px; border-radius:20px;}
  .data-table td{padding:12px 14px;}
  .task-row{padding:12px 13px;}
}

/* =========================================================
   WORK WORLD MAP
   The map is a self-illuminated instrument panel, so it keeps its own dark
   cosmic ground in every theme rather than following --surface — a glowing
   contour model on a light card would read as a mistake. Status colours still
   come from the app's tokens, so a pin on the map and a badge in the task list
   are the same red.
   ========================================================= */
.wm{
  --wm-cyan:#3FD8FF;
  --wm-ice:#A8E4F5;
  --wm-deep:#04101C;
  /* No min-height. The widget is resizable down to 140px, and a map that
     insists on 300 simply hangs 160px over the cell below it. The scene scales
     with its viewBox and the HUD scales with the container queries underneath,
     so honouring the cell costs nothing. */
  position:relative; width:100%; height:100%; overflow:hidden;
  border-radius:var(--r-card);
  /* The HUD measures itself against the cell, not against the page. The widget
     is resizable, so anything sized in px is right at exactly one height and
     wrong everywhere else — cqh lets the rails shrink with the cell instead of
     spilling out of it. */
  container-type:size; container-name:wm;
  background:
    radial-gradient(120% 90% at 50% 8%,  rgba(29,120,190,.30) 0%, transparent 56%),
    radial-gradient(80% 60% at 15% 88%, rgba(63,216,255,.12) 0%, transparent 60%),
    radial-gradient(70% 50% at 88% 24%, rgba(120,80,220,.16) 0%, transparent 62%),
    linear-gradient(180deg, #061524 0%, var(--wm-deep) 62%, #020A12 100%);
  color:#CFE9F7;
  isolation:isolate;
}
.wm-space{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
/* Two independent animations per star: a slow drift so the field reads as
   moving through space, and a faster twinkle on top of it. Compositing them on
   one element would need a single keyframe track, so the drift lives on a
   wrapper transform and the twinkle on opacity. */
.wm-star{position:absolute; border-radius:50%; background:#DFF4FF;
  animation:wmTwinkle ease-in-out infinite alternate, wmStarDrift linear infinite;}
/* A gentle breathe rather than a hard blink — the field should feel alive,
   not flicker. */
@keyframes wmTwinkle{ from{opacity:.34;} to{opacity:.78;} }
@keyframes wmStarDrift{
  from{ transform:translate3d(0,0,0); }
  to{ transform:translate3d(46px,-30px,0); }
}
.wm-bit{position:absolute; width:4px; height:9px; border-radius:1px; opacity:.5;
  animation:wmDrift ease-in-out infinite alternate;}
@keyframes wmDrift{ from{transform:translate(0,0) rotate(0);} to{transform:translate(10px,-16px) rotate(140deg);} }

.wm-svg{position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible;}
.wm-svg text{font-family:'Inter',sans-serif;}

/* ---------- platform ---------- */
.wm-platform{fill:none;}
.wm-ring-outer{stroke:rgba(63,216,255,.28); stroke-width:1.2;}
.wm-ring-mid{stroke:rgba(63,216,255,.16); stroke-width:1;}
.wm-tick{stroke:rgba(63,216,255,.30); stroke-width:1;}
.wm-tick.long{stroke:rgba(63,216,255,.62); stroke-width:1.6;}
.wm-ring-cap-track{fill:none; stroke:rgba(63,216,255,.14); stroke-width:6;}
/* The capacity arc is the one place a hard glow is worth the cost. */
.wm-ring-cap{fill:none; stroke:var(--wm-cyan); stroke-width:6; stroke-linecap:round;
  filter:drop-shadow(0 0 7px rgba(63,216,255,.85));
  /* 2.2s, and eased so it decelerates into place. At .9s the arc had finished
     sweeping before the eye had found it — the number changed but the motion
     that was supposed to make the change legible never registered. */
  transition:stroke-dashoffset 2.2s cubic-bezier(.16,.84,.32,1);}
.wm-card-dir{fill:rgba(207,233,247,.72); font-size:19px; font-weight:800; letter-spacing:.1em;
  text-anchor:middle; dominant-baseline:middle;}

/* ---------- island ---------- */
.wm-plate{fill:rgba(6,28,48,.86); stroke:none;}
.wm-under{fill:none; stroke:var(--wm-cyan); stroke-width:.9;}
.wm-contour{
  fill:none; stroke:var(--wm-cyan); stroke-linejoin:round;
  /* Higher rings glow harder, which is what gives the stack its sense of relief. */
  filter:drop-shadow(0 0 calc(1px + var(--wm-t) * 4px) rgba(63,216,255,.55));
  /* A brightness wave climbs the mountain once every 30 seconds.
     A negative delay starts a ring part-way through its cycle, and a larger
     delay makes it peak sooner — so scaling the delay by (t - 1) has the
     shoreline light first and the summit last. */
  animation:wmClimb 30s linear infinite;
  animation-delay:calc((var(--wm-t) - 1) * 30s);
}
@keyframes wmClimb{
  0%   { stroke:var(--wm-cyan); }
  6%   { stroke:#EAFBFF; }
  14%  { stroke:var(--wm-cyan); }
  100% { stroke:var(--wm-cyan); }
}

.wm-mesh{stroke:rgba(63,216,255,.13); stroke-width:.6;}
.wm-node{fill:rgba(160,235,255,.4);}

/* ---------- reactor ---------- */
.wm-core{filter:drop-shadow(0 0 26px rgba(63,216,255,.9));
  animation:wmPulse 2.8s ease-in-out infinite;}
@keyframes wmPulse{ 0%,100%{transform:scale(1); opacity:.94;} 50%{transform:scale(1.07); opacity:1;} }
.wm-core-halo{animation:wmHalo 2.8s ease-in-out infinite;}
@keyframes wmHalo{ 0%,100%{opacity:.5; transform:scale(1);} 50%{opacity:.9; transform:scale(1.12);} }
.wm-crystal{fill:rgba(63,216,255,.07); stroke:rgba(150,235,255,.42); stroke-width:1;}
.wm-core-ring{fill:none; stroke:rgba(180,240,255,.5); stroke-width:1;
  stroke-dasharray:9 13; animation:wmSpin 7s linear infinite; transform-origin:0 0;}
.wm-core-ring.slow{stroke:rgba(120,200,255,.3); animation-duration:13s; animation-direction:reverse;}
@keyframes wmSpin{ to{ transform:rotate(360deg); } }


/* ---------- pins ---------- */
.wm-pin{cursor:pointer; transition:opacity .25s ease;}
.wm-pin.dim{opacity:.18;}
.wm-pin-stem{stroke:var(--wm-pin); stroke-width:1.1; opacity:.6;}
.wm-pin-foot{fill:var(--wm-pin); opacity:.45;}
.wm-pin-badge{fill:var(--wm-pin); stroke:rgba(4,16,28,.55); stroke-width:1;
  filter:drop-shadow(0 0 5px var(--wm-pin));}
.wm-pin-glyph{fill:#06121E; font-size:11px; font-weight:900; text-anchor:middle;}
.wm-pin.todo .wm-pin-glyph{fill:#0A1420;}
.wm-pin:hover .wm-pin-badge{stroke:#FFFFFF; stroke-width:1.4;}
.wm-pin:hover{opacity:1;}
/* Overdue pins are the only thing on the map allowed to move on their own. */
.wm-pin.overdue .wm-pin-badge{animation:wmAlert 1.7s ease-in-out infinite;}
@keyframes wmAlert{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

/* ---------- HUD ----------
   Flat 2D over the scene: holographic panels never share the camera, which is
   what keeps their numbers legible at any island angle. */
.wm-hud{position:absolute; inset:0; pointer-events:none;}
.wm-panel{
  position:absolute; display:flex; align-items:center; gap:8px;
  padding:8px 13px; pointer-events:auto;
  background:linear-gradient(135deg, rgba(10,34,56,.9), rgba(6,20,36,.78));
  border:1px solid rgba(63,216,255,.34);
  /* Clipped corners read as a HUD chip rather than a card. */
  clip-path:polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
  box-shadow:0 0 18px rgba(20,120,190,.28), inset 0 0 20px rgba(63,216,255,.06);
}
.wm-panel-ico{color:var(--wm-cyan); display:inline-flex; opacity:.85;}
.wm-panel b{display:block; font-size:8.5px; font-weight:700; letter-spacing:.12em;
  color:rgba(190,225,245,.72); white-space:nowrap;}
.wm-panel em{display:block; font-style:normal; font-size:18px; font-weight:800; line-height:1.15;
  color:var(--wm-cyan); text-shadow:0 0 12px rgba(63,216,255,.6);}
/* Cleared past the legend rail, which is pinned to the same edge. */
.wm-tl{left:86px; top:12px;}
.wm-tr{right:14px; top:12px;}
.wm-side{right:14px; top:74px; flex-direction:column; align-items:flex-start; gap:3px; min-width:126px;}
.wm-side em{font-size:15px;}
.wm-meter{display:block; width:100%; height:4px; border-radius:3px; margin-top:3px;
  background:rgba(63,216,255,.16); overflow:hidden;}
.wm-meter i{display:block; height:100%; border-radius:3px; transition:width .7s ease;}

/* Anchored to both edges rather than centred: on a short widget a centred rail
   grows into the chip row below it, and no amount of nudging the midpoint
   fixes that. Bounded top and bottom, it simply cannot collide. */
/* Every measurement here is a clamp against the cell's own height, so the rail
   fits a 240px cell and a 560px one without a media query for each. The px
   values are the ceiling — it never grows past the size it was designed at,
   it only gives ground when the cell is short. */
.wm-legend-panel{
  position:absolute; left:14px; pointer-events:auto;
  top:clamp(38px, 15cqh, 62px); bottom:clamp(40px, 15cqh, 54px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(2px, 1.4cqh, 6px);
  padding:clamp(5px, 2.2cqh, 10px) 8px; border-radius:22px;
  background:linear-gradient(180deg, rgba(10,34,56,.86), rgba(6,20,36,.7));
  border:1px solid rgba(63,216,255,.24);
}
.wm-legend-panel > b{font-size:clamp(6.5px, 2cqh, 8px); font-weight:700; letter-spacing:.1em; line-height:1.3;
  color:rgba(190,225,245,.66); text-align:center; margin-bottom:2px;}
.wm-legend-row{display:flex; flex-direction:column; align-items:center; gap:2px; cursor:default;}
.wm-legend-dot{
  width:clamp(15px, 6cqh, 24px); height:clamp(15px, 6cqh, 24px);
  border-radius:50%; display:flex;
  align-items:center; justify-content:center;
  font-size:clamp(8px, 3cqh, 12px); font-weight:900; font-style:normal;
  box-shadow:0 0 9px currentColor;
  transition:transform .14s ease;}
.wm-legend-row:hover .wm-legend-dot{transform:scale(1.14);}
.wm-legend-row em{font-style:normal; font-size:clamp(7px, 2.4cqh, 9px); font-weight:800; color:rgba(207,233,247,.8);}
/* Below this the caption is the first thing to go: five legible dots beat a
   label plus five dots you cannot tell apart. */
@container wm (max-height: 250px){ .wm-legend-panel > b{display:none;} }
/* And below THIS the rail goes too. Same call the phone layout makes: at this
   size the panel would cover the island it is annotating, and an island you
   cannot see is worth less than a count you can read on the Tasks page. */
@container wm (max-height: 205px){ .wm-legend-panel,.wm-legend-pop{display:none;} }

/* ---------- legend hover popup ----------
   The counts alone say how many; this says which. It opens inside the map
   because the map is `overflow:hidden` — a popup escaping the cell would be
   clipped in half, so it is sized and clamped to live within the scene. */
.wm-legend-pop{
  position:absolute; z-index:6; pointer-events:none;
  left:clamp(52px, 14cqw, 60px); width:min(240px, 62cqw);
  max-height:min(230px, 72cqh); overflow:hidden;
  padding:9px 10px; border-radius:14px;
  background:linear-gradient(180deg, rgba(9,32,54,.97), rgba(5,18,32,.97));
  border:1px solid rgba(63,216,255,.34);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:wmPopIn .14s ease both;
}
@keyframes wmPopIn{ from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:none;} }
.wm-legend-pop > b{
  display:flex; align-items:center; gap:6px;
  font-size:9px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:rgba(200,232,250,.8); margin-bottom:7px;}
.wm-legend-pop > b i{width:8px; height:8px; border-radius:50%; flex-shrink:0; box-shadow:0 0 7px currentColor;}
.wm-legend-pop > b span{margin-left:auto; font-size:9px; color:var(--wm-cyan); letter-spacing:0;}
.wm-pop-item{display:flex; gap:7px; align-items:baseline; padding:3px 0; min-width:0;}
.wm-pop-item i{width:5px; height:5px; border-radius:50%; flex-shrink:0; transform:translateY(-1px);}
.wm-pop-item u{
  text-decoration:none; flex:1; min-width:0;
  font-size:11px; font-weight:600; color:#DCEEFA;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.wm-pop-item s{text-decoration:none; flex-shrink:0; font-size:9.5px; color:rgba(160,200,225,.72);}
.wm-pop-more{display:block; margin-top:5px; font-size:9.5px; color:rgba(160,200,225,.6);}
.wm-pop-empty{display:block; font-style:normal; font-size:10.5px; color:rgba(160,200,225,.6);}

.wm-capacity{
  position:absolute; left:50%; bottom:38px; transform:translateX(-50%);
  font-size:11px; font-weight:800; letter-spacing:.2em; white-space:nowrap;
  color:rgba(215,240,252,.9); text-shadow:0 0 14px rgba(63,216,255,.75);
}

/* ---------- project picker ---------- */
.wm-projects{
  position:absolute; left:0; right:0; bottom:12px; pointer-events:auto;
  display:flex; gap:5px; flex-wrap:nowrap;
  overflow-x:auto; padding:0 12px 2px;
  scrollbar-width:none;
  /* `safe` keeps the row centred while it fits and falls back to start-aligned
     once it overflows — plain `center` would push the first chip out of the
     scroll box where it can never be reached. */
  justify-content:safe center;
}
.wm-projects::-webkit-scrollbar{display:none;}
.wm-chip{
  display:inline-flex; align-items:center; gap:5px; flex-shrink:0;
  border:1px solid rgba(63,216,255,.26); border-radius:20px; padding:4px 11px;
  background:rgba(8,26,44,.78); color:rgba(207,233,247,.82);
  font-size:10.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  max-width:150px; overflow:hidden; text-overflow:ellipsis;
  transition:background .16s ease, color .16s ease, border-color .16s ease;
}
.wm-chip i{width:7px; height:7px; border-radius:50%; background:var(--wm-chip, var(--wm-cyan)); flex-shrink:0;}
.wm-chip:hover{border-color:var(--wm-cyan); color:#EAF8FF;}
.wm-chip.on{
  background:color-mix(in srgb, var(--wm-chip, var(--wm-cyan)) 26%, rgba(8,26,44,.9));
  border-color:var(--wm-chip, var(--wm-cyan)); color:#FFFFFF;
  box-shadow:0 0 12px color-mix(in srgb, var(--wm-chip, var(--wm-cyan)) 45%, transparent);
}

.wm-reset{
  position:absolute; right:14px; bottom:52px; pointer-events:auto;
  width:28px; height:28px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  background:rgba(8,26,44,.8); border:1px solid rgba(63,216,255,.3); color:var(--wm-cyan);
}
.wm-reset:hover{background:rgba(63,216,255,.2);}
/* Top-centre: the bottom-left corner belongs to the legend rail. */
.wm-hint{
  position:absolute; left:50%; top:15px; transform:translateX(-50%); pointer-events:none;
  font-size:9px; letter-spacing:.05em; color:rgba(160,200,225,.45); white-space:nowrap;
}
/* Grabbing the map should feel like grabbing it. */
.wm-svg{cursor:grab; touch-action:none;}
.wm.wm-grabbing .wm-svg{cursor:grabbing;}

@media (max-width:699px){
  /* Phone: keep the island, drop the panels that would cover it. */
  .wm-legend-panel,.wm-legend-pop,.wm-side,.wm-hint,.wm-reset{display:none;}
  .wm-tl{left:14px;}          /* the rail is gone, so reclaim the edge */
  .wm-panel{padding:6px 9px;}
  .wm-panel em{font-size:14px;}
  .wm-capacity{font-size:9.5px; letter-spacing:.14em; bottom:36px;}
  .wm-projects{justify-content:flex-start;}
}
@media (prefers-reduced-motion: reduce){
  :root:not([data-motion="full"]) .wm-star,
  :root:not([data-motion="full"]) .wm-bit,
  :root:not([data-motion="full"]) .wm-core,
  :root:not([data-motion="full"]) .wm-core-halo,
  :root:not([data-motion="full"]) .wm-core-ring,
  :root:not([data-motion="full"]) .wm-contour,
  :root:not([data-motion="full"]) .wm-pin.overdue .wm-pin-badge{animation:none;}
  :root:not([data-motion="full"]) .wm-star{opacity:.45;}   /* the twinkle carried their visibility */
}

/* =========================================================
   NOTES AS PAPER ON A BOARD
   The note list becomes a pin board: a cork-toned surface, and each note a
   slightly crooked sheet of paper held by a pushpin. Everything is drawn with
   gradients — no images, so the file stays self-contained and it recolours
   itself for every theme.

   Placed last so it wins on order over the generic card styling above.
   ========================================================= */
.note-grid{
  gap:26px 20px;
  padding:30px 22px 26px;
  border-radius:var(--r-card);
  /* Cork: warm noise built from three offset dot grids, kept faint enough
     that note text is what the eye lands on. */
  background:
    radial-gradient(circle at 12% 22%, color-mix(in srgb, var(--warning) 9%, transparent) 0 2px, transparent 3px),
    radial-gradient(circle at 63% 71%, color-mix(in srgb, var(--warning) 7%, transparent) 0 2px, transparent 3px),
    radial-gradient(circle at 88% 34%, color-mix(in srgb, var(--danger) 5%, transparent) 0 1.5px, transparent 3px),
    color-mix(in srgb, var(--warning) 7%, var(--surface-2));
  background-size:38px 38px, 52px 52px, 44px 44px, auto;
  box-shadow:inset 0 2px 12px color-mix(in srgb, #000 8%, transparent);
}
:root[data-theme="dark"] .note-grid{
  background:
    radial-gradient(circle at 12% 22%, color-mix(in srgb, var(--warning) 7%, transparent) 0 2px, transparent 3px),
    radial-gradient(circle at 63% 71%, color-mix(in srgb, var(--warning) 5%, transparent) 0 2px, transparent 3px),
    color-mix(in srgb, var(--warning) 4%, var(--surface-2));
  background-size:38px 38px, 52px 52px, auto;
}

.note-card{
  position:relative;
  padding:26px 18px 15px;          /* room at the top for the pin */
  border-radius:2px 2px 3px 3px;   /* paper, not a card */
  border:none;
  background:
    repeating-linear-gradient(transparent 0 25px,
      color-mix(in srgb, var(--brand) 7%, transparent) 25px 26px),
    linear-gradient(160deg,
      color-mix(in srgb, var(--warning) 5%, var(--surface)) 0%,
      var(--surface) 46%,
      color-mix(in srgb, var(--text-3) 4%, var(--surface)) 100%);
  /* A near-contact shadow plus a longer soft one reads as a sheet lying on
     the board rather than a floating panel. */
  box-shadow:
    0 1px 1px color-mix(in srgb, #000 14%, transparent),
    0 8px 18px -6px color-mix(in srgb, #000 22%, transparent);
  transition:transform .2s cubic-bezier(.22,.61,.36,1), box-shadow .2s ease;
}
/* Every sheet hangs at its own angle, cycling every five cards so a long
   board never falls into a visible pattern. */
.note-card:nth-child(5n+1){transform:rotate(-1.5deg);}
.note-card:nth-child(5n+2){transform:rotate(1.1deg);}
.note-card:nth-child(5n+3){transform:rotate(-0.5deg);}
.note-card:nth-child(5n+4){transform:rotate(1.8deg);}
.note-card:nth-child(5n+5){transform:rotate(-1.1deg);}
/* Picking one up straightens it. */
.note-card:hover{
  transform:rotate(0deg) translateY(-5px) scale(1.015);
  box-shadow:
    0 2px 3px color-mix(in srgb, #000 16%, transparent),
    0 20px 34px -10px color-mix(in srgb, #000 32%, transparent);
  z-index:2;
  border-color:transparent;
}

/* The pushpin: a domed head with a highlight, over its own small shadow. */
.note-card::before{
  content:''; position:absolute; left:50%; top:7px; width:15px; height:15px;
  transform:translateX(-50%); border-radius:50%; z-index:3;
  background:
    radial-gradient(circle at 34% 30%, rgba(255,255,255,.92) 0 12%, transparent 42%),
    radial-gradient(circle at 60% 68%, color-mix(in srgb, #000 34%, transparent) 0 30%, transparent 62%),
    var(--pin-color, var(--danger));
  box-shadow:0 2px 4px color-mix(in srgb, #000 42%, transparent),
             inset 0 -1px 2px color-mix(in srgb, #000 30%, transparent);
}
/* The needle's shadow, falling onto the paper below the head. */
.note-card::after{
  content:''; position:absolute; left:50%; top:19px; width:2px; height:7px;
  transform:translateX(-30%) rotate(6deg); border-radius:0 0 2px 2px; z-index:2;
  background:linear-gradient(to bottom, color-mix(in srgb, #000 30%, transparent), transparent);
}
/* Pins come in a few colours so the board does not look mass-produced. */
.note-card:nth-child(4n+1){--pin-color:var(--danger);}
.note-card:nth-child(4n+2){--pin-color:var(--brand);}
.note-card:nth-child(4n+3){--pin-color:var(--success);}
.note-card:nth-child(4n+4){--pin-color:var(--warning);}

/* A coloured note becomes coloured paper — tint the sheet, keep the rules. */
.note-card.tinted{
  border:none;
  background:
    repeating-linear-gradient(transparent 0 25px,
      color-mix(in srgb, var(--note-tint) 16%, transparent) 25px 26px),
    linear-gradient(160deg,
      color-mix(in srgb, var(--note-tint) 16%, var(--surface)) 0%,
      color-mix(in srgb, var(--note-tint) 9%, var(--surface)) 55%,
      color-mix(in srgb, var(--note-tint) 15%, var(--surface)) 100%);
}
.note-card.tinted:hover{
  background:
    repeating-linear-gradient(transparent 0 25px,
      color-mix(in srgb, var(--note-tint) 18%, transparent) 25px 26px),
    linear-gradient(160deg,
      color-mix(in srgb, var(--note-tint) 21%, var(--surface)) 0%,
      color-mix(in srgb, var(--note-tint) 13%, var(--surface)) 55%,
      color-mix(in srgb, var(--note-tint) 20%, var(--surface)) 100%);
}
/* A favourite is worth a dog-eared corner. */
.note-card:has(.note-fav){
  clip-path:polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
}
.note-card-meta{border-top:1px dashed color-mix(in srgb, var(--text-3) 34%, transparent);}
.note-card-title{font-weight:750;}

/* Templates share the paper language but stay flat — they are stationery,
   not something already pinned up. */
.template-card{border-radius:3px; background:
  linear-gradient(160deg, color-mix(in srgb, var(--warning) 4%, var(--surface)), var(--surface));}

@media (max-width:699px){
  /* Crooked sheets waste horizontal room on a phone, and the board texture
     competes with a single-column list. Straighten everything out. */
  .note-grid{padding:16px 10px; gap:16px; background:none; box-shadow:none;}
  .note-card{transform:none !important; padding-top:24px;}
  .note-card:hover{transform:translateY(-2px) !important;}
}
@media (prefers-reduced-motion: reduce){
  /* The tilt is a static property of the layout, not an animation — reducing
     motion should stop the sheet from moving, not flatten the board. */
  .note-card{transition:none;}
  .note-card:hover{transform:rotate(0deg);}
}

/* An explicit in-app choice of "reduced" has to work even on a machine whose
   OS says nothing — otherwise the setting would only do something for people
   who had already turned motion down elsewhere. */
:root[data-motion="reduced"] *,
:root[data-motion="reduced"] *::before,
:root[data-motion="reduced"] *::after{
  animation-duration:.001ms !important; animation-iteration-count:1 !important;
  transition-duration:.001ms !important;
}
:root[data-motion="reduced"] .weather-layer *{animation:none !important;}

/* A popup beside him, not a sheet over the app.
   He lives in a corner and everything he does is about the board behind him,
   so covering that board to talk to him was backwards. No backdrop either:
   the app stays readable and stays clickable, and a click anywhere else just
   closes this. */
.tb-pop{
  position:fixed; z-index:200; width:min(330px, calc(100vw - 20px));
  max-height:min(74vh, 560px); overflow-y:auto;
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  box-shadow:var(--shadow-lg); padding:12px 13px 14px;
  animation:tbPopIn .16s cubic-bezier(.34,1.3,.64,1) both;
}
@keyframes tbPopIn{ from{opacity:0; transform:translateY(6px) scale(.97);} to{opacity:1; transform:none;} }
:root:not([data-motion="full"]) .tb-pop{ animation:none; }
.tb-pop-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.tb-pop-head .tb-title{flex:1; min-width:0; font-size:14px; font-weight:750;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tb-pop-head button{
  border:none; background:none; color:var(--text-3); cursor:pointer;
  font-size:17px; line-height:1; padding:2px 4px; border-radius:7px;
}
.tb-pop-head button:hover{background:var(--surface-2); color:var(--text);}

/* A small bubble over his head. Short-lived and never modal: he is commenting,
