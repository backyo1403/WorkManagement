  /** Pull every live field into the draft so redraws never lose input. */
  function syncFromDom(){
    const g = (id)=> document.getElementById(id);
    if(g('tm_title')) t.title = g('tm_title').value;
    if(g('tm_desc')) t.description = g('tm_desc').value;
    if(g('tm_project')) t.projectId = g('tm_project').value || null;
    if(g('tm_workflow')) t.workflowId = g('tm_workflow').value || null;
    if(g('tm_dept')) t.departmentId = g('tm_dept').value || null;
    if(g('tm_priority')) t.priority = g('tm_priority').value;
    if(g('tm_deadline')) t.deadline = fromLocalInput(g('tm_deadline').value);
    if(g('tm_start')) t.start = fromLocalInput(g('tm_start').value);
    if(g('tm_estimate')) t.estimateHours = parseFloat(g('tm_estimate').value)||1;
    if(g('tm_completion') && !g('tm_completion').disabled) t.completion = Math.max(0,Math.min(100, parseInt(g('tm_completion').value)||0));
    if(g('tm_assignee')) t.assigneeId = g('tm_assignee').value || null;
  }
  function draw(){ overlay.innerHTML = html(); wire(); }
  function redraw(){ syncFromDom(); draw(); }
  function wire(){
    document.getElementById('closeModal').onclick = ()=> overlay.remove();
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelectorAll('[data-set-status]').forEach(el=> el.onclick=()=>{ syncFromDom(); t.status = el.dataset.setStatus; draw(); });
    overlay.querySelectorAll('[data-sub-toggle]').forEach(el=> el.onclick=()=>{ syncFromDom(); const c=checklist.find(x=>x.id===el.dataset.subToggle); c.done=!c.done; draw(); });
    overlay.querySelectorAll('[data-sub-text]').forEach(el=> el.oninput=()=>{ const c=checklist.find(x=>x.id===el.dataset.subText); c.text=el.value; });
    overlay.querySelectorAll('[data-sub-due]').forEach(el=> el.onchange=()=>{
      const c=checklist.find(x=>x.id===el.dataset.subDue);
      c.deadline = el.value ? new Date(el.value+"T18:00:00").toISOString() : null;
    });
    overlay.querySelectorAll('[data-sub-time]').forEach(el=> el.onchange=()=>{
      const c=checklist.find(x=>x.id===el.dataset.subTime);
      if(!el.value){ c.start = null; return; }
      // Anchor the time to the subtask's own date, else the parent's, else today.
      const baseIso = c.deadline || t.start || t.deadline || nowISO();
      const base = new Date(baseIso);
      const [hh,mm] = el.value.split(':').map(Number);
      base.setHours(hh, mm, 0, 0);
      c.start = base.toISOString();
    });
    overlay.querySelectorAll('[data-sub-del]').forEach(el=> el.onclick=()=>{ syncFromDom(); checklist=checklist.filter(x=>x.id!==el.dataset.subDel); draw(); });
    document.getElementById('addSubtask').onclick = ()=>{ syncFromDom(); checklist.push({id:uid(), text:"", done:false, deadline:null, start:null}); draw(); };
    overlay.querySelectorAll('[data-executor-toggle]').forEach(el=> el.onclick=()=>{
      syncFromDom();
      const id2 = el.dataset.executorToggle;
      executorIds = executorIds.includes(id2) ? executorIds.filter(x=>x!==id2) : [...executorIds, id2];
      draw();
    });
    wireHashtagField('tm', hashtags, redraw);
    // "Ghi chú liên quan" reads note.linkedTaskIds — the same array the note
    // editor writes — so a link made on either side shows up on both.
    wireRelatedNotes();
    overlay.querySelectorAll('[data-tab]').forEach(el=> el.onclick=()=>{ syncFromDom(); activeTab=el.dataset.tab; draw(); });
    const sendBtn = document.getElementById('sendComment');
    if(sendBtn) sendBtn.onclick = ()=>{
      const input = document.getElementById('tm_comment');
      if(!input.value.trim()) return;
      syncFromDom();
      t.comments = t.comments||[];
      t.comments.push({id:uid(), authorId: STATE.currentUserId, text: input.value.trim(), createdAt: nowISO()});
      if(existing) updateTask(t.id, {comments:t.comments}, 'Đã thêm bình luận');
      draw();
    };
    const timerBtn = document.getElementById('timerBtn');
    if(timerBtn) timerBtn.onclick = ()=>{ syncFromDom(); toggleTimer(t.id); draw(); };
    const markDone = document.getElementById('markDoneBtn');
    if(markDone) markDone.onclick = ()=>{
      syncFromDom();
      t.status = t.status==='Hoàn thành' ? 'Cần làm' : 'Hoàn thành';
      draw();
    };
    const dupBtn = document.getElementById('duplicateBtn');
    if(dupBtn) dupBtn.onclick = ()=>{
      syncFromDom();
      addTask({
        title: t.title + ' (bản sao)', description: t.description,
        projectId: t.projectId, workflowId: t.workflowId, departmentId: t.departmentId,
        priority: t.priority, status: 'Cần làm', deadline: t.deadline, start: t.start,
        estimateHours: t.estimateHours, assigneeId: t.assigneeId,
        checklist: JSON.parse(JSON.stringify(checklist)), hashtags:[...hashtags], executorIds:[...executorIds],
      });
      overlay.remove(); renderView(); toast('Đã nhân bản nhiệm vụ');
    };
    const pinModalBtn = document.getElementById('pinModalBtn');
    if(pinModalBtn) pinModalBtn.onclick = ()=>{
      const real = STATE.tasks.find(x=>x.id===t.id);
      if(real){ real.pinned = !real.pinned; t.pinned = real.pinned; persist(); }
      draw();
    };
    document.getElementById('saveTaskBtn').onclick = ()=>{
      syncFromDom();
      const title = (t.title||'').trim();
      if(!title){ toast('Nhập tên nhiệm vụ'); return; }
      registerHashtags(hashtags);
      const auto = completionFromChecklist(checklist);
      const data = {
        title, description: t.description,
        projectId: t.projectId, workflowId: t.workflowId, departmentId: t.departmentId,
        priority: t.priority, status: t.status,
        deadline: t.deadline, start: t.start,
        estimateHours: t.estimateHours,
        completion: auto!==null ? auto : t.completion,
        checklist, hashtags, executorIds,
        assigneeId: t.assigneeId,
      };
      if(existing){ updateTask(t.id, data, 'Đã cập nhật thông tin nhiệm vụ'); }
      else { addTask(data); }
      overlay.remove(); renderView(); toast(existing?'Đã lưu thay đổi':'Đã tạo nhiệm vụ');
    };
    const delBtn = document.getElementById('deleteTaskBtn');
    if(delBtn) delBtn.onclick = ()=>{
      if(!confirm('Xoá nhiệm vụ này?')) return;
      deleteTaskById(t.id); overlay.remove(); renderView(); toast('Đã xoá nhiệm vụ');
    };
  }
  document.body.appendChild(overlay);
  draw();
}

/* =========================================================
   GANTT
   ========================================================= */
/* Zoom levels change BOTH the pixel width of a day and how many days fit on
   screen, so zooming really changes the date scale (quý → tuần → ngày). */
const GANTT_ZOOMS = [
  {w:12,  before:14, after:104, unit:'quarter'},
  {w:18,  before:10, after:70,  unit:'month'},
  {w:26,  before:7,  after:45,  unit:'month'},
  {w:42,  before:4,  after:24,  unit:'week'},
  {w:64,  before:3,  after:15,  unit:'week'},
  {w:92,  before:2,  after:10,  unit:'day'},
  {w:130, before:1,  after:6,   unit:'day'},
];
let ganttZoomIdx = 3;
let ganttSideWidth = 220;
/** Ids of the tasks whose subtasks are currently shown as their own bars. */
let ganttOpenRows = new Set();
function ganttZoom(){ return GANTT_ZOOMS[ganttZoomIdx]; }
function ganttDaysBetween(a,b){ return (new Date(b.toDateString()).getTime()-new Date(a.toDateString()).getTime())/86400000; }
/** Tasks that pass the current Gantt filters, with their resolved span. */
function ganttFilteredTasks(){
  let ts = activeTasks().filter(t=>t.start||t.deadline);
  if(ganttFilters.projectId) ts = ts.filter(t=>t.projectId===ganttFilters.projectId);
  if(ganttFilters.departmentId) ts = ts.filter(t=>t.departmentId===ganttFilters.departmentId);
  if(ganttFilters.employeeId) ts = ts.filter(t=>t.assigneeId===ganttFilters.employeeId || (t.executorIds||[]).includes(ganttFilters.employeeId));
  if(ganttFilters.status) ts = ts.filter(t=>t.status===ganttFilters.status);
  return ts.map(t=>{
    let s=t.start?new Date(t.start):null, e=t.deadline?new Date(t.deadline):null;
    if(!s&&e){ s=new Date(e); s.setDate(s.getDate()-1); }
    if(!e&&s){ e=new Date(s); e.setHours(e.getHours()+Math.max(2,t.estimateHours||1)); }
    if(!s||!e) return null;
    if(e<s) e=new Date(s.getTime()+3600000);
    return {t, s, e};
  }).filter(Boolean);
}
/** The visible window always covers every bar, so scrolling reaches them all
 *  instead of stopping at a fixed window around today. */
function ganttRange(){
  const Z = ganttZoom();
  const today = new Date(); today.setHours(0,0,0,0);
  let start = new Date(today); start.setDate(start.getDate()-Z.before);
  let end   = new Date(today); end.setDate(end.getDate()+Z.after);
  ganttFilteredTasks().forEach(({s,e})=>{
    const s0 = new Date(s); s0.setHours(0,0,0,0);
    const e0 = new Date(e); e0.setHours(0,0,0,0);
    if(s0 < start) start = s0;
    if(e0 > end)   end   = e0;
  });
  start.setDate(start.getDate()-1);          // a day of breathing room each side
  end.setDate(end.getDate()+1);
  return { start, dayCount: Math.max(1, Math.round(ganttDaysBetween(start,end)) + 1) };
}
function ganttRangeStart(){ return ganttRange().start; }
function ganttRows(){
  const rangeStart = ganttRangeStart();
  const parents = ganttFilteredTasks().map(({t,s,e})=>({
    t, s, e, kind:'task',
    hasSubs: (t.checklist||[]).length > 0,
    offset: ganttDaysBetween(rangeStart, s),
    width:  Math.max(0.35, ganttDaysBetween(s,e) || 0.35),
  })).sort((a,b)=>a.offset-b.offset);

  // Expanded parents are followed by one row per subtask, in the parent's own
  // order, so the indented block reads as a continuation of the row above it.
  const out = [];
  parents.forEach(p=>{
    out.push(p);
    if(!p.hasSubs || !ganttOpenRows.has(p.t.id)) return;
    p.t.checklist.forEach(c=>{
      // A subtask with no dates of its own inherits the parent's span — it is
      // still part of that work, it just has not been scheduled separately.
      let s = c.start ? new Date(c.start) : (c.deadline ? new Date(c.deadline) : new Date(p.s));
      let e = c.deadline ? new Date(c.deadline) : (c.start ? new Date(c.start) : new Date(p.e));
      if(e < s) e = new Date(s.getTime() + 3600000);
      out.push({
        t: p.t, sub: c, kind:'sub', parentId: p.t.id,
        dated: !!(c.start || c.deadline),
        offset: ganttDaysBetween(rangeStart, s),
        width:  Math.max(0.35, ganttDaysBetween(s,e) || 0.35),
      });
    });
  });
  return out;
}
function viewGantt(){
  const Z = ganttZoom();
  const DAY_W = Z.w;
  const today = new Date(); today.setHours(0,0,0,0);
  const R = ganttRange();
  const rangeStart = R.start;
  const dayCount = R.dayCount;
  const days = [...Array(dayCount)].map((_,i)=>{ const d=new Date(rangeStart); d.setDate(d.getDate()+i); return d; });
  const rows = ganttRows();
  const todayOffset = ganttDaysBetween(rangeStart, today);
  const compact = DAY_W < 30;   // hide day numbers when columns get tiny
  const showMonthBand = DAY_W < 46;

  return `
    ${topbarHtml('Sơ đồ Gantt', icon('gantt',20), 'Kéo thanh để đổi lịch · cuộn chuột trên bảng để zoom ngày · kéo vạch dọc để mở rộng cột tên', `
      <button class="btn-icon" id="ganttZoomOut" title="Thu nhỏ (xem xa hơn)">🔍−</button>

      <button class="btn btn-ghost" id="ganttFilterReset">${icon('refresh',15)} Đặt lại bộ lọc</button>
    `)}
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <select class="filter-select" id="gf_project"><option value="">Tất cả Dự án</option>${groupedProjects().map(p=>`<option value="${p.id}" ${ganttFilters.projectId===p.id?'selected':''}>${p.icon} ${esc(p.name)}</option>`).join("")}</select>
        <select class="filter-select" id="gf_dept"><option value="">Tất cả Nhóm công việc</option>${STATE.departments.map(d=>`<option value="${d.id}" ${ganttFilters.departmentId===d.id?'selected':''}>${d.icon} ${esc(d.name)}</option>`).join("")}</select>
        <select class="filter-select" id="gf_emp"><option value="">Tất cả Người thực hiện phụ trách</option>${STATE.employees.map(e=>`<option value="${e.id}" ${ganttFilters.employeeId===e.id?'selected':''}>${esc(e.name)}</option>`).join("")}</select>
        <select class="filter-select" id="gf_status"><option value="">Tất cả Trạng thái</option>${TASK_STATUSES.map(s=>`<option value="${esc(s)}" ${ganttFilters.status===s?"selected":""}>${s}</option>`).join("")}</select>
      </div>
    </div>
    <div class="gantt-wrap">
      <div class="gantt-side" id="ganttSide" style="width:${ganttSideWidth}px;">
        <div class="gantt-side-head">Nhiệm vụ / Người thực hiện</div>
        ${rows.length? rows.map(r=>{
          if(r.kind==='sub'){
            const done = r.sub.done;
            return `<div class="gantt-side-row sub ${done?'done':''}" data-open="${r.t.id}" title="${esc(r.sub.text||'(chưa đặt tên)')}">
              <span class="gantt-sub-tick ${done?'on':''}">${done?'✓':''}</span>
              <span class="gantt-sub-name">${esc(r.sub.text||'(chưa đặt tên)')}</span>
              ${r.dated?'':`<span class="gantt-sub-hint" title="Chưa đặt lịch riêng — dùng khung thời gian của nhiệm vụ cha">~</span>`}
            </div>`;
          }
          const a = empById(r.t.assigneeId);
          const subs = r.t.checklist||[];
          const open = ganttOpenRows.has(r.t.id);
          return `<div class="gantt-side-row" title="${esc(r.t.title)}">
            ${r.hasSubs
              ? `<button class="gantt-caret ${open?'open':''}" data-gantt-toggle="${r.t.id}"
                   title="${open?'Thu gọn công việc con':'Xem công việc con'}">▸</button>`
              : `<span class="gantt-caret placeholder"></span>`}
            <span style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:${r.t.priority==='Cao'?'var(--danger)':r.t.priority==='Trung bình'?'var(--warning)':'var(--text-3)'};"></span>
            <span data-open="${r.t.id}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:600;cursor:pointer;">${esc(r.t.title)}</span>
            ${subs.length?`<span class="gantt-sub-count" title="Công việc con đã xong">${subs.filter(c=>c.done).length}/${subs.length}</span>`:''}
            ${a?avatarHtml(a,18):''}
          </div>`;
        }).join("") : `<div style="padding:14px;font-size:12.5px;color:var(--text-3);">Không có nhiệm vụ trong bộ lọc hiện tại</div>`}
      </div>
      <div id="ganttResizeHandle" style="width:5px;flex-shrink:0;cursor:col-resize;background:var(--border);"></div>
      <div class="gantt-scroll" id="ganttScroll">
        <div style="width:${dayCount*DAY_W}px;position:relative;">
          ${showMonthBand ? `<div style="display:flex;height:20px;border-bottom:1px solid var(--border);">${(function(){
            const groups=[]; days.forEach(d=>{ const k=d.getFullYear()+'-'+d.getMonth(); const g=groups[groups.length-1];
              if(g && g.key===k) g.n++; else groups.push({key:k, n:1, label:'Tháng '+(d.getMonth()+1)+'/'+d.getFullYear()}); });
            return groups.map(g=>`<div style="width:${g.n*DAY_W}px;flex-shrink:0;border-right:1px solid var(--border);font-size:10px;font-weight:700;color:var(--text-2);text-align:center;overflow:hidden;white-space:nowrap;">${g.n*DAY_W>60?g.label:''}</div>`).join("");
          })()}</div>` : ''}
          <div class="gantt-day-head">${days.map(d=>{
            const isToday = d.toDateString()===today.toDateString();
            const weekend = d.getDay()===0||d.getDay()===6;
            if(compact) return `<div class="gantt-day ${isToday?'today':''}" style="width:${DAY_W}px;${weekend&&!isToday?'background:var(--surface-2);':''}" title="${d.toLocaleDateString(loc())}">${isToday?'▾':(d.getDate()===1?d.getDate():'')}</div>`;
            return `<div class="gantt-day ${isToday?'today':''}" style="width:${DAY_W}px;${weekend&&!isToday?'background:var(--surface-2);':''}">${d.getDate()}${showMonthBand?'':`<div class="sub">Th${d.getMonth()+1}</div>`}</div>`;
          }).join("")}</div>
          <div class="gantt-rows">
            ${rows.map(r=>{
              const barColor = priorityColorHex(r.t.priority);
              if(r.kind==='sub'){
                const name = r.sub.text || '(chưa đặt tên)';
                const when = r.sub.deadline ? fmtDateTimeFull(r.sub.deadline) : 'chưa đặt hạn';
                const late = r.sub.deadline && !r.sub.done && new Date(r.sub.deadline) < new Date();
                return `<div class="gantt-row sub"><div class="gantt-bar sub ${r.sub.done?'done':''} ${late?'late':''} ${r.dated?'':'undated'}"
                  data-gantt-sub="${r.parentId}"
                  style="left:${r.offset*DAY_W+3}px;width:${Math.max(12,r.width*DAY_W-6)}px;background:${barColor};"
                  title="${esc(name)} · hạn: ${when}${late?' · quá hạn':''}${r.dated?'':' · theo lịch nhiệm vụ cha'}">
                  <span style="overflow:hidden;text-overflow:ellipsis;">${esc(name)}</span>
                  <span style="opacity:.9;flex-shrink:0;">${r.sub.done?'✓':(r.sub.deadline?fmtDDMMM(r.sub.deadline):'')}</span>
                </div></div>`;
              }
              const pct = r.t.status==='Hoàn thành'?100:(r.t.completion||0);
              return `<div class="gantt-row"><div class="gantt-bar" data-gantt-bar="${r.t.id}" data-offset="${r.offset}" data-width="${r.width}" style="left:${r.offset*DAY_W+3}px;width:${Math.max(14,r.width*DAY_W-6)}px;background:${barColor};" title="${esc(r.t.title)} · ${pct}%">
                <span style="overflow:hidden;text-overflow:ellipsis;">${esc(r.t.title)}</span><span style="opacity:.85;flex-shrink:0;">${pct}%</span>
                ${r.hasSubs?`<i class="gantt-bar-fill" style="width:${pct}%;"></i>`:''}
              </div></div>`;
            }).join("")}
            <div class="gantt-today-line" style="left:${todayOffset*DAY_W}px;"></div>
          </div>
        </div>
      </div>
    </div>
  `;
}
function wireGantt(){
  document.getElementById('gf_project').onchange = (e)=>{ ganttFilters.projectId=e.target.value; renderView(); };
  document.getElementById('gf_dept').onchange = (e)=>{ ganttFilters.departmentId=e.target.value; renderView(); };
  document.getElementById('gf_emp').onchange = (e)=>{ ganttFilters.employeeId=e.target.value; renderView(); };
  document.getElementById('gf_status').onchange = (e)=>{ ganttFilters.status=e.target.value; renderView(); };
  document.getElementById('ganttFilterReset').onclick = ()=>{ ganttFilters={projectId:"",departmentId:"",employeeId:"",status:""}; renderView(); };
  document.querySelectorAll('.gantt-side [data-open]').forEach(el=> el.onclick = ()=> openTaskModal(el.dataset.open));
  // Caret expands the task into its subtasks. Scroll position is preserved so
  // the row you clicked does not jump out from under the cursor.
  document.querySelectorAll('[data-gantt-toggle]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    const id = el.dataset.ganttToggle;
    if(ganttOpenRows.has(id)) ganttOpenRows.delete(id); else ganttOpenRows.add(id);
    const keepX = (document.getElementById('ganttScroll')||{}).scrollLeft || 0;
    renderView();
    const sc = document.getElementById('ganttScroll'); if(sc) sc.scrollLeft = keepX;
  });
  // A subtask bar opens its parent task, where the subtask can be edited.
  document.querySelectorAll('[data-gantt-sub]').forEach(el=> el.onclick = ()=> openTaskModal(el.dataset.ganttSub));

  function applyZoom(delta){
    const next = Math.max(0, Math.min(GANTT_ZOOMS.length-1, ganttZoomIdx + delta));
    if(next === ganttZoomIdx) return;
    ganttZoomIdx = next;
    renderView();
  }
  document.getElementById('ganttZoomIn').onclick = ()=> applyZoom(1);
  document.getElementById('ganttZoomOut').onclick = ()=> applyZoom(-1);
  // Wheel over the chart zooms the date scale (no modifier needed).
  const scrollEl = document.getElementById('ganttScroll');
  let wheelLock = false;
  scrollEl.addEventListener('wheel', (e)=>{
    if(e.shiftKey) return;                 // shift+wheel = normal horizontal scroll
    e.preventDefault();
    if(wheelLock) return;
    wheelLock = true; setTimeout(()=>{ wheelLock = false; }, 90);
    applyZoom(e.deltaY < 0 ? 1 : -1);
  }, {passive:false});

  // resizable side column
  const handle = document.getElementById('ganttResizeHandle');
  const sideEl = document.getElementById('ganttSide');
  handle.onmousedown = (e)=>{
    e.preventDefault();
    const startX = e.clientX, startWidth = ganttSideWidth;
    function onMove(ev){
      ganttSideWidth = Math.max(140, Math.min(460, startWidth + (ev.clientX-startX)));
      sideEl.style.width = ganttSideWidth+'px';
    }
    function onUp(){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };

  // drag-to-reschedule bars
  document.querySelectorAll('[data-gantt-bar]').forEach(bar=>{
    bar.onmousedown = (e)=>{
      e.preventDefault();
      const taskId = bar.dataset.ganttBar;
      const startX = e.clientX;
      const startLeft = parseFloat(bar.style.left);
      let dragged = false;
      function onMove(ev){
        const dx = ev.clientX - startX;
        if(Math.abs(dx) > 4) dragged = true;
        bar.style.left = (startLeft + dx) + 'px';
      }
      function onUp(ev){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if(!dragged){ openTaskModal(taskId); return; }
        const dx = ev.clientX - startX;
        const deltaDays = Math.round(dx / ganttZoom().w);
        if(deltaDays !== 0){
          const t = STATE.tasks.find(x=>x.id===taskId);
          const patch = {};
          if(t.start){ const s=new Date(t.start); s.setDate(s.getDate()+deltaDays); patch.start = s.toISOString(); }
          if(t.deadline){ const dl=new Date(t.deadline); dl.setDate(dl.getDate()+deltaDays); patch.deadline = dl.toISOString(); }
          updateTask(taskId, patch, `Dời lịch ${deltaDays>0?'+':''}${deltaDays} ngày (kéo thả Gantt)`);
          toast(`Đã dời "${t.title}" ${deltaDays>0?'+':''}${deltaDays} ngày`);
        }
        renderView();
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
  });
}

/* =========================================================
   KANBAN (Tiến độ)
   ========================================================= */
const KANBAN_PERIODS = [["all","Tất cả"],["today","Hôm nay"],["week","Tuần này"],["lastweek","Tuần trước"],["month","Tháng này"],["lastmonth","Tháng trước"],["quarter","Quý này"]];
function inPeriod(t, period){
  if(period==='all') return true;
  const d = t.deadline? new Date(t.deadline) : new Date(t.createdAt);
  const now = new Date();
  if(period==='today') return d.toDateString()===now.toDateString();
  if(period==='week'){ const s=new Date(now); s.setDate(s.getDate()-s.getDay()); s.setHours(0,0,0,0); const e=new Date(s); e.setDate(e.getDate()+7); return d>=s&&d<e; }
  if(period==='lastweek'){ const s=new Date(now); s.setDate(s.getDate()-s.getDay()-7); s.setHours(0,0,0,0); const e=new Date(s); e.setDate(e.getDate()+7); return d>=s&&d<e; }
  if(period==='month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  if(period==='lastmonth'){ const m=new Date(now.getFullYear(),now.getMonth()-1,1); return d.getMonth()===m.getMonth() && d.getFullYear()===m.getFullYear(); }
  if(period==='quarter'){ const q=Math.floor(now.getMonth()/3); return Math.floor(d.getMonth()/3)===q && d.getFullYear()===now.getFullYear(); }
  return true;
}
function viewKanban(){
  let ts = activeTasks();
  ts = ts.filter(t=> inPeriod(t, kanbanFilters.period));
  if(kanbanFilters.employeeId) ts = ts.filter(t=>t.assigneeId===kanbanFilters.employeeId);
  if(kanbanFilters.projectId) ts = ts.filter(t=>t.projectId===kanbanFilters.projectId);
  // Derived from TASK_STATUSES, not a second hand-written list — a status that
  // exists everywhere else but has no column here is a task you cannot find.
  const KANBAN_ICONS = {"Cần làm":"⬜","Đang làm":"🟧","Hoàn thành":"✅",[TASK_STATUS_EVENT]:"🎀"};
  const cols = TASK_STATUSES.map(s=>[s, KANBAN_ICONS[s] || "•"]);
  return `
    ${topbarHtml('Tiến độ', icon('board',20), '', '')}
    <div class="card" style="margin-bottom:16px;">
      <div style="margin-bottom:10px;"><b style="font-size:12px;color:var(--text-2);">⏱ THỜI GIAN</b></div>
      <div class="pill-toggle-row" style="margin-bottom:14px;">${KANBAN_PERIODS.map(([k,l])=>`<button class="pill-toggle ${kanbanFilters.period===k?'active':''}" data-period="${k}">${l}</button>`).join("")}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <select class="filter-select" id="kf_emp"><option value="">Tất cả người thực hiện</option>${STATE.employees.map(e=>`<option value="${e.id}" ${kanbanFilters.employeeId===e.id?'selected':''}>${esc(e.name)}</option>`).join("")}</select>
        <select class="filter-select" id="kf_proj"><option value="">Tất cả dự án</option>${groupedProjects().map(p=>`<option value="${p.id}" ${kanbanFilters.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join("")}</select>
      </div>
    </div>
    <div class="kanban-wrap">
      ${cols.map(([status,icon])=>{
        const colTasks = ts.filter(t=>t.status===status);
        return `<div class="kanban-col" data-drop-status="${status}">
          <div class="kanban-col-head">${icon} ${status}<span class="kanban-col-count">${colTasks.length}</span></div>
          ${colTasks.map(t=>{
            const a = empById(t.assigneeId); const proj = projectById(t.projectId); const overdue = isOverdue(t);
            return `<div class="task-row-wrap" style="margin-bottom:9px;">
            <div class="kanban-card" draggable="true" data-kanban-drag="${t.id}" data-open="${t.id}" style="margin-bottom:0;">
              ${priorityPill(t.priority)}
              <div class="kanban-card-title">${esc(t.title)}</div>
              ${proj?`<span class="badge" style="background:${proj.color}1A;color:${proj.color};">${esc(proj.name)}</span>`:''}
              <div class="kanban-card-foot">
                ${a?avatarHtml(a,24):'<span></span>'}
                ${dueBadgeHtml(t)}
              </div>
            </div>
            ${subtaskHoverCardHtml(t)}
            </div>`;
          }).join("") || `<div style="padding:16px;text-align:center;font-size:12px;color:var(--text-3);">Trống</div>`}
        </div>`;
      }).join("")}
    </div>
  `;
}
function wireKanban(){
  document.querySelectorAll('[data-period]').forEach(el=> el.onclick = ()=>{ kanbanFilters.period=el.dataset.period; renderView(); });
  document.getElementById('kf_emp').onchange = (e)=>{ kanbanFilters.employeeId=e.target.value; renderView(); };
  document.getElementById('kf_proj').onchange = (e)=>{ kanbanFilters.projectId=e.target.value; renderView(); };
  document.querySelectorAll('[data-open]').forEach(el=> el.onclick = ()=> openTaskModal(el.dataset.open));
  document.querySelectorAll('[data-kanban-drag]').forEach(el=>{
    el.ondragstart = (e)=>{ e.dataTransfer.setData('text/plain', el.dataset.kanbanDrag); };
  });
  document.querySelectorAll('[data-drop-status]').forEach(col=>{
    col.ondragover = (e)=> e.preventDefault();
    col.ondrop = (e)=>{
      e.preventDefault();
      const taskId = e.dataTransfer.getData('text/plain');
      const status = col.dataset.dropStatus;
      updateTask(taskId, {status}, `Chuyển trạng thái sang "${status}"`);
      renderView(); toast('Đã cập nhật trạng thái');
    };
  });
  wireHoverSubtasks();
}

/* =========================================================
   TIMETABLE (Thời gian biểu — theo ngày / theo tuần)
   ========================================================= */
let timetableMode = "day";      // day | week
let timetableOffset = 0;        // days (day mode) or weeks (week mode)
const TT_START_HOUR = 6, TT_END_HOUR = 22, TT_HOUR_H = 52;

/** Only items with an explicit clock time (`start`) appear on the timetable. */
function timetableSlotDate(t){ return t.start ? new Date(t.start) : null; }
/** Timed subtasks surface on the timetable as their own blocks. */
function timedSubtaskEntries(){
  const out = [];
  activeTasks().forEach(t=>{
    (t.checklist||[]).forEach(c=>{
      if(!c.start) return;
      out.push({
        id: t.id + '|' + c.id, parentId: t.id, subId: c.id,
        title: c.text || '(chưa đặt tên)', start: c.start, deadline: c.deadline || null,
        estimateHours: c.estimateHours || 0.5,
        priority: t.priority, projectId: t.projectId, assigneeId: t.assigneeId,
        status: c.done ? 'Hoàn thành' : t.status,
        checklist: [], isSubtask: true, parentTitle: t.title,
      });
    });
  });
  return out;
}
function tasksForDay(d){
  const timedTasks = activeTasks().filter(t=>{
    // An event belongs to EVERY day it runs across, not just the one it began
    // on — a three-day conference has to be visible on all three.
    if(isEvent(t)) return eventCoversDay(t, d);
    const s = timetableSlotDate(t);
    return s && s.toDateString() === d.toDateString();
  });
  const timedSubs = timedSubtaskEntries().filter(s=> new Date(s.start).toDateString() === d.toDateString());
  return [...timedTasks, ...timedSubs].sort((a,b)=> new Date(a.start) - new Date(b.start));
}
/** Colour a task by its priority (shared by timetable, calendar and gantt). */
function priorityColor(p){
  return p==='Cao' ? 'var(--danger)' : p==='Trung bình' ? 'var(--warning)' : 'var(--text-3)';
}
function priorityColorHex(p){
  return p==='ASAP' ? '#9E1B1B' : p==='Cao' ? '#EF4444' : p==='Trung bình' ? '#F59E0B' : '#64748B';
}
/** Assign overlapping tasks to side-by-side lanes so nothing is hidden. */
function layoutTimetableLanes(tasks, day){
  const dayStart = day ? new Date(day) : null;
  if(dayStart) dayStart.setHours(0,0,0,0);
  const items = tasks.map(t=>{
    // Events are clipped to the day being drawn. A run that starts Friday
    // evening and ends Sunday noon becomes: Friday from its start to midnight,
    // Saturday edge to edge, Sunday midnight to its end. `contFrom`/`contTo`
    // record which ends were cut, so the card can say it carries on.
    if(isEvent(t) && dayStart){
      const r = eventRange(t);
      if(r){
        const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate()+1);
        const s = r.start > dayStart ? r.start : dayStart;
        const e = r.end   < dayEnd   ? r.end   : dayEnd;
        const hrs = (x)=> (x - dayStart) / 3600000;
        // Clamped into the visible window, or an early-morning event would be
        // drawn above the top of the grid where it cannot be seen.
        const startH = Math.max(TT_START_HOUR, Math.min(TT_END_HOUR + 1, hrs(s)));
        const endH   = Math.max(startH + 0.5,  Math.min(TT_END_HOUR + 1, hrs(e)));
        return { t, startH, endH, lane:0, lanes:1, day:dayStart,
                 contFrom: r.start < dayStart, contTo: r.end > dayEnd };
      }
    }
    const s = timetableSlotDate(t);
    const startH = s.getHours() + s.getMinutes()/60;
    const endH = startH + Math.max(0.5, t.estimateHours || 1);
    return { t, startH, endH, lane:0, lanes:1, day:dayStart };
  }).sort((a,b)=> a.startH - b.startH || a.endH - b.endH);

  // Group items into clusters of mutually overlapping blocks; every item in a
  // cluster shares the same lane count so the widths line up.
  let cluster = [], clusterEnd = -Infinity;
  const flush = ()=>{
    if(!cluster.length) return;
    const laneEnds = [];
    cluster.forEach(it=>{
      let lane = laneEnds.findIndex(end=> it.startH >= end - 1e-6);
      if(lane === -1){ lane = laneEnds.length; laneEnds.push(it.endH); }
      else laneEnds[lane] = it.endH;
      it.lane = lane;
    });
    cluster.forEach(it=> it.lanes = laneEnds.length);
    cluster = [];
  };
  items.forEach(it=>{
    if(it.startH >= clusterEnd - 1e-6){ flush(); clusterEnd = it.endH; }
    else clusterEnd = Math.max(clusterEnd, it.endH);
    cluster.push(it);
  });
  flush();
  return items;
}
function timetableBlockHtml(item){
  const { t, startH, endH, lane, lanes, contFrom, contTo } = item;
  const ev = isEvent(t);
  // For an event the drawn segment IS the truth for this day — reading t.start
  // would print Friday's 19:00 on all three days of a weekend festival.
  const s = (ev && item.day)
    ? new Date(item.day.getTime() + startH*3600000)
    : timetableSlotDate(t);
  const top = (startH - TT_START_HOUR) * TT_HOUR_H;
  const height = Math.max(24, (endH - startH) * TT_HOUR_H - 4);
  const color = priorityColorHex(t.priority);
  const done = t.status==='Hoàn thành';
  const assignee = empById(t.assigneeId);
  const widthPct = 100 / lanes;
  const leftPct = lane * widthPct;
  const openId = t.isSubtask ? t.parentId : t.id;
  const proj = projectById(t.projectId);
  // Tint the card by its project (falling back to priority), like the reference.
  // Pink beats the project tint for events: the colour is what tells you at a
  // glance that this block is something happening, not something to do.
  const tint = ev ? '#EC4899' : (proj ? proj.color : color);
  const endDate = new Date(s.getTime() + (endH-startH)*3600000);
  const now = new Date();
  const running = now >= s && now <= endDate && !done;
  const leftMin = running ? Math.max(1, Math.round((endDate-now)/60000)) : 0;
  const elapsedPct = running ? Math.min(100, Math.max(0, ((now-s)/(endDate-s))*100)) : 0;
  const chipIcon = ev ? 'calendar' : (t.isSubtask ? 'check' : (proj ? 'folder' : 'clock'));
  const compact = height < 52 || lanes >= 3;
  // Arrows on the cut ends, so a middle day does not look like a fresh event
  // that happens to start at midnight. Kept as two separate strings: built as
  // one, the trailing arrow ended up printed at both ends of the title.
  const spanIn  = (ev && contFrom) ? '↑ ' : '';
  const spanOut = (ev && contTo)   ? ' ↓' : '';

  // People on the card: assignee first, then executors — shown as an
  // overlapping stack with a count badge, as in the reference.
  const peopleIds = [...new Set([t.assigneeId, ...(t.executorIds||[])].filter(Boolean))];
  const people = peopleIds.map(empById).filter(Boolean);
  const stack = people.slice(0,3);
  const pct = done ? 100 : (t.completion || 0);

  return `<div class="task-row-wrap tt-block ${ev?'is-event':''} ${compact?'is-compact':''} ${t.isSubtask?'is-sub':''} ${running?'running':''} ${done?'is-done':''}"
      data-open="${openId}"
      style="top:${top}px;height:${height}px;left:calc(${leftPct}% + 3px);width:calc(${widthPct}% - 6px);
             --tint:${tint};">
    <div class="tt-head">
      <span class="tt-head-ico">${icon(chipIcon,13)}</span>
      ${stack.length ? `<span class="tt-avatars">${stack.map(p=>avatarHtml(p,17)).join("")}</span>` : ''}
      ${people.length ? `<span class="tt-count">${people.length}</span>` : ''}
    </div>
    <div class="tt-block-body">
      <span class="tt-block-title ${done?'done':''}">${spanIn}${t.isSubtask?'↳ ':''}${esc(t.title)}${spanOut}</span>
      ${!compact ? `<span class="tt-time">${fmtHM(s.toISOString())} <i>›</i> ${fmtHM(endDate.toISOString())}</span>` : ''}
    </div>
    ${running ? `<span class="tt-left-label">Còn ${leftMin}m</span>` : ''}
    <div class="tt-progress"><i style="width:${running ? elapsedPct : pct}%;"></i></div>
    ${t.isSubtask ? '' : fullTaskHoverCardHtml(t)}
  </div>`;
}
function viewTimetable(){
  const hours = [...Array(TT_END_HOUR-TT_START_HOUR+1)].map((_,i)=>TT_START_HOUR+i);
  const now = new Date();
  let days;
  if(timetableMode==='day'){
    const d = new Date(now); d.setDate(d.getDate()+timetableOffset); d.setHours(0,0,0,0);
    days = [d];
  } else {
    const base = new Date(now); base.setDate(base.getDate() + timetableOffset*7 - base.getDay()); base.setHours(0,0,0,0);
    days = [...Array(7)].map((_,i)=>{ const d=new Date(base); d.setDate(base.getDate()+i); return d; });
  }
  const label = timetableMode==='day'
    ? days[0].toLocaleDateString(loc(),{weekday:'long', day:'2-digit', month:'2-digit', year:'numeric'})
    : `${days[0].toLocaleDateString(loc(),{day:'2-digit',month:'2-digit'})} – ${days[6].toLocaleDateString(loc(),{day:'2-digit',month:'2-digit',year:'numeric'})}`;
  const total = days.reduce((n,d)=>n+tasksForDay(d).length, 0);
  const nowTop = (now.getHours()+now.getMinutes()/60 - TT_START_HOUR) * TT_HOUR_H;
  const showNowLine = days.some(d=>d.toDateString()===now.toDateString()) && now.getHours()>=TT_START_HOUR && now.getHours()<=TT_END_HOUR;

  return `
    ${topbarHtml('Thời gian biểu', icon('clock',20), 'Công việc xếp theo giờ — đặt "Bắt đầu" hoặc giờ hạn chót để việc hiện ở đây', `
      <div class="cal-view-toggle">
        <button data-tt-mode="day" class="${timetableMode==='day'?'active':''}">Ngày</button>
        <button data-tt-mode="week" class="${timetableMode==='week'?'active':''}">Tuần</button>
      </div>
      <button class="btn-icon" id="ttPrev">←</button>
      <button class="btn btn-ghost btn-sm" id="ttToday">📍 Hôm nay</button>
      <button class="btn-icon" id="ttNext">→</button>
    `)}
    <div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <b style="font-size:15px;text-transform:capitalize;">${label}</b>
      <span class="badge">${total} công việc</span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--text-3);">Khung giờ ${TT_START_HOUR}:00 – ${TT_END_HOUR}:00</span>
    </div>
    <div class="tt-wrap">
      <div class="tt-headrow">
        <div class="tt-corner"></div>
        ${days.map(d=>{
          const isToday = d.toDateString()===now.toDateString();
          const n = tasksForDay(d).length;
          const dd = String(d.getDate()).padStart(2,'0');
          const mm = String(d.getMonth()+1).padStart(2,'0');
          return `<div class="tt-dayhead ${isToday?'today':''}" data-tt-dayjump="${ymdLocal(d)}">
            <!-- Both labels ship and CSS picks between them. Choosing in JS
                 would be correct only until the window was resized, because
                 the view is not re-rendered on resize. -->
            <div class="tt-dayname"
              ><b>${d.toLocaleDateString(loc(),{weekday:'long'})}</b
              ><i>${d.toLocaleDateString(loc(),{weekday:'narrow'})}</i
            ></div>
            <div class="tt-daydate">${dd}.${mm}.${d.getFullYear()}</div>
            ${n?`<span class="tt-day-badge">${n}</span>`:''}
          </div>`;
        }).join("")}
      </div>
      <div class="tt-body" style="height:${hours.length*TT_HOUR_H}px;">
        <div class="tt-hours">
          ${hours.map(h=>`<div class="tt-hourlabel" style="height:${TT_HOUR_H}px;">${String(h).padStart(2,'0')}:00</div>`).join("")}
        </div>
        ${days.map(d=>{
          const dayTasks = tasksForDay(d);
          const isToday = d.toDateString()===now.toDateString();
          return `<div class="tt-daycol ${isToday?'is-today':''}">
            ${hours.map(h=>`<div class="tt-hourcell" style="height:${TT_HOUR_H}px;" data-tt-slot="${ymdLocal(d)}|${h}" title="Bấm để thêm việc lúc ${String(h).padStart(2,'0')}:00"></div>`).join("")}
            ${layoutTimetableLanes(dayTasks, d).map(item=>timetableBlockHtml(item)).join("")}
          </div>`;
        }).join("")}
        ${showNowLine ? `<div class="tt-nowline" style="top:${nowTop}px;"><span class="tt-now-dot"></span><span class="tt-now-time">${fmtHM(now.toISOString())}</span></div>` : ''}
      </div>
    </div>
  `;
}
function wireTimetable(){
  document.querySelectorAll('[data-tt-mode]').forEach(el=> el.onclick = ()=>{ timetableMode = el.dataset.ttMode; timetableOffset = 0; renderView(); });
  document.getElementById('ttPrev').onclick = ()=>{ timetableOffset--; renderView(); };
  document.getElementById('ttNext').onclick = ()=>{ timetableOffset++; renderView(); };
  document.getElementById('ttToday').onclick = ()=>{ timetableOffset = 0; renderView(); };
  // Clicking a day header in week view drills into that day.
  document.querySelectorAll('[data-tt-dayjump]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    const target = new Date(el.dataset.ttDayjump + "T00:00:00");
    const today = new Date(); today.setHours(0,0,0,0);
    timetableMode = 'day';
    timetableOffset = Math.round((target.getTime()-today.getTime())/86400000);
    renderView();
    toast(target.toLocaleDateString(loc(),{weekday:'long', day:'2-digit', month:'2-digit'}));
  });
  document.querySelectorAll('.tt-block[data-open]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); openTaskModal(el.dataset.open); });
  // click an empty hour cell → create a task at that time
  document.querySelectorAll('[data-tt-slot]').forEach(el=> el.onclick = ()=>{
    const [dateStr, hourStr] = el.dataset.ttSlot.split('|');
    const when = new Date(dateStr+"T"+String(hourStr).padStart(2,'0')+":00:00");
    openTaskModal(null, { start: when.toISOString(), deadline: when.toISOString() });
  });
  wireHoverSubtasks();
}

/* =========================================================
   CALENDAR (month view)
   ========================================================= */
let calProjectFilter = "";
let calSlideDir = null;   // 'next' | 'prev' — drives the month slide direction
let calStatusFilters = new Set(TASK_STATUSES);
function viewCalendar(){
  const base = new Date(); base.setMonth(base.getMonth()+calMonthOffset); base.setDate(1);
  const monthStart = new Date(base.getFullYear(), base.getMonth(), 1);
  const startOffset = monthStart.getDay();
  const gridStart = new Date(monthStart); gridStart.setDate(gridStart.getDate()-startOffset);
  const daysInGrid = 42;
  const cells = [...Array(daysInGrid)].map((_,i)=>{ const d=new Date(gridStart); d.setDate(d.getDate()+i); return d; });
  const today = new Date();

  // An event earns its place with a start even if no end was filled in —
  // eventRange() supplies the missing end. A plain task still needs a deadline
  // to have a day to sit on.
  let ts = activeTasks().filter(t=> t.deadline || (isEvent(t) && t.start));
  if(calProjectFilter) ts = ts.filter(t=>t.projectId===calProjectFilter);
  ts = ts.filter(t=> calStatusFilters.has(t.status));

  const byDay = {};
  ts.forEach(t=>{
    // A task lands on its deadline. An event lands on every day it runs, so a
    // week-long trip fills the week instead of marking only the day it ends.
    const r = isEvent(t) ? eventRange(t) : null;
    if(r){
      const d = new Date(r.start); d.setHours(0,0,0,0);
      // Guard the loop: a corrupt or absurd range must not spin forever.
      for(let i=0; i<370 && d < r.end; i++){
        (byDay[d.toDateString()] = byDay[d.toDateString()] || []).push(t);
        d.setDate(d.getDate()+1);
      }
    } else {
      const k = new Date(t.deadline).toDateString();
      (byDay[k]=byDay[k]||[]).push(t);
    }
  });

  return `
    ${topbarHtml('Lịch', icon('calendar',20), '', `<div style="font-size:12.5px;color:var(--text-2);">${ts.length} nhiệm vụ</div>`)}
    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;">
        <button class="btn-icon" id="calPrev">←</button>
        <b style="font-size:15px;">Tháng ${base.getMonth()+1}, ${base.getFullYear()}</b>
        <button class="btn-icon" id="calNext">→</button>
        <button class="btn btn-ghost btn-sm" id="calToday">📍 Hôm nay</button>
        <select class="filter-select" id="calProjFilter"><option value="">Tất cả Dự án</option>${groupedProjects().map(p=>`<option value="${p.id}" ${calProjectFilter===p.id?'selected':''}>${p.icon} ${esc(p.name)}</option>`).join("")}</select>
        <div class="pill-toggle-row">
          ${STATE.projects.slice(0,6).map(p=>`<span class="badge" style="background:${p.color}1A;color:${p.color};">${p.icon} ${esc(p.name)}</span>`).join("")}
        </div>
      </div>
      <div class="pill-toggle-row">
        ${TASK_STATUSES.map(s=>`<button class="pill-toggle ${calStatusFilters.has(s)?'active':''}" data-cal-status="${s}">${s}</button>`).join("")}
        <button class="pill-toggle ${calStatusFilters.size===TASK_STATUSES.length?'active':''}" id="calAllStatus">Tất cả</button>
      </div>
    </div>
    <div class="cal-month-grid ${calSlideDir==='next'?'month-next':calSlideDir==='prev'?'month-prev':''}">
      ${["CN","T2","T3","T4","T5","T6","T7"].map(d=>`<div class="cal-month-head">${d}</div>`).join("")}
      ${cells.map(d=>{
        const inMonth = d.getMonth()===base.getMonth();
        const isToday = d.toDateString()===today.toDateString();
        const dayTasks = byDay[d.toDateString()]||[];
        return `<div class="cal-month-cell ${inMonth?'':'other-month'} ${isToday?'today':''}">
          <span class="cal-day-num" data-open-day="${ymdLocal(d)}" style="cursor:pointer;" title="Xem thời khoá biểu ngày ${d.getDate()}/${d.getMonth()+1}">${d.getDate()}</span>
          <div class="cal-pill-stack">
            ${dayTasks.map(t=>`<div class="task-row-wrap"><div class="cal-pill ${isFrozen(t)?'frozen':''}" style="background:${priorityColorHex(t.priority)};" data-open="${t.id}" data-task-ctx="${t.id}">
              <span class="cal-pill-text">${esc(t.title)}</span>
              ${progressRingHtml(computeCompletion(t), 15)}
            </div>${fullTaskHoverCardHtml(t)}</div>`).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}
function wireCalendar(){
  document.getElementById('calPrev').onclick = ()=>{ calMonthOffset--; calSlideDir='prev'; renderView(); };
  document.getElementById('calNext').onclick = ()=>{ calMonthOffset++; calSlideDir='next'; renderView(); };
  document.getElementById('calToday').onclick = ()=>{
    calSlideDir = calMonthOffset>0 ? 'prev' : calMonthOffset<0 ? 'next' : null;

  overlay.innerHTML = `<div class="modal">

            ${proj?`<span class="badge" style="background:${proj.color}1A;color:${proj.color};">${esc(proj.name)}</span>`:''}
            ${assignee?avatarHtml(assignee,24):''}

    </div>` : `<div class="empty-state"><div class="glyph">🌤️</div>Không có nhiệm vụ nào đến hạn trong ngày này</div>`}

/* =========================================================
   NOTES — list, editor, linked tasks
   `noteView` picks the rail filter; `openNoteId` switches the
   main column between the list and the editor. Both live in
   module state so a re-render lands back where the user was.
   ========================================================= */
let noteView = "all";
let noteViewArg = null;
let openNoteId = null;

let noteEditorMode = "rich";     // rich (WYSIWYG) | source (raw Markdown)
let noteMobilePanel = "none";    // none | tasks | details

function notesForView(){
  const scoped = STATE.notes.filter(inActiveGroupNote);
  const byUpdated = (a,b)=> new Date(b.updatedAt) - new Date(a.updatedAt);
  const live = scoped.filter(n=>!n.archived && !n.deletedAt);
  let list;
  switch(noteView){
    case 'trash':     list = scoped.filter(n=>n.deletedAt); break;
    case 'archive':   list = scoped.filter(n=>n.archived && !n.deletedAt); break;
    case 'favorites': list = live.filter(n=>n.favorite); break;
    case 'recent':    list = live.slice().sort(byUpdated).slice(0,20); break;
    case 'notebook':  list = live.filter(n=>n.notebookId===noteViewArg); break;
    case 'tag':       list = live.filter(n=>(n.hashtags||[]).includes(noteViewArg)); break;
    case 'templates': return [];
    default:          list = live;
  }
  list = list.slice().sort(byUpdated);
  if(noteQuery.trim()) list = list.filter(n=> noteMatches(n, noteQuery));
  return list;
}

/* ---------- right-click menu on a note card ----------
   Everything here routes through runNoteAction/updateNote, so the context menu
   and the editor's ⋯ menu can never drift apart. */
let openNoteCtxMenu = null;
function closeNoteCtxMenu(){
  if(!openNoteCtxMenu) return;
  if(openNoteCtxMenu._cleanup) openNoteCtxMenu._cleanup();
  openNoteCtxMenu.remove();
  openNoteCtxMenu = null;
}
function openNoteContextMenu(noteId, x, y){
  closeNoteCtxMenu();
  const n = noteById(noteId);
  if(!n) return;

  const menu = document.createElement('div');
  menu.className = 'note-ctx';
  const inTrash = !!n.deletedAt;
  menu.innerHTML = `
    <div class="note-ctx-title">${esc(noteTitleOf(n))}</div>
    <button class="note-menu-item" data-ctx="open">${icon('edit',14)} Mở & sửa</button>
    <button class="note-menu-item" data-ctx="rename">${icon('edit',14)} Đổi tên</button>
    <button class="note-menu-item" data-ctx="favorite">${icon(n.favorite?'star-filled':'star',14)} ${n.favorite?'Bỏ yêu thích':'Đánh dấu yêu thích'}</button>
    <div class="note-ctx-sep"></div>
    <div class="note-ctx-label">Màu ghi chú</div>
    <div class="note-ctx-swatches">
      ${NOTE_CARD_COLORS.map(c=>{
        const v = c.varName ? `var(${c.varName})` : '';
        const on = (n.color||null) === c.key;
        return `<button class="note-swatch${on?' on':''}${c.varName?'':' none'}"
          data-ctx-color="${c.key||''}" title="${esc(c.name)}"
          ${v?`style="background:${v};"`:''}></button>`;
      }).join("")}
    </div>
    <div class="note-ctx-sep"></div>
    ${inTrash
      ? `<button class="note-menu-item" data-ctx="restore">${icon('refresh',14)} Khôi phục</button>
         <button class="note-menu-item danger" data-ctx="purge">${icon('trash',14)} Xoá vĩnh viễn</button>`
      : `<button class="note-menu-item danger" data-ctx="trash">${icon('trash',14)} Chuyển vào thùng rác</button>`}
  `;
  document.body.appendChild(menu);
  openNoteCtxMenu = menu;

  // Place it at the cursor, then pull it back inside the viewport if it would
  // hang off the right or bottom edge.
  const r = menu.getBoundingClientRect();
  const left = Math.max(8, Math.min(x, innerWidth  - r.width  - 8));
  const top  = Math.max(8, Math.min(y, innerHeight - r.height - 8));
  menu.style.left = left+'px';
  menu.style.top  = top+'px';

  menu.querySelectorAll('[data-ctx-color]').forEach(el=> el.onclick = ()=>{
    const key = el.dataset.ctxColor || null;
    updateNote(n.id, {color:key}, {snapshot:false});
    const c = NOTE_CARD_COLORS.find(x=>x.key===key);
    toast(key ? `Đã đổi màu ghi chú — ${c.name}` : 'Đã bỏ màu ghi chú');
    closeNoteCtxMenu();
    renderView();
  });
  menu.querySelectorAll('[data-ctx]').forEach(el=> el.onclick = ()=>{
    const action = el.dataset.ctx;
    closeNoteCtxMenu();
    // "Open" and "rename" both need the editor; renaming focuses the title once there.
    if(action==='open' || action==='rename'){
      openNote(n.id);
      if(action==='rename') setTimeout(()=>{ const t=document.getElementById('noteTitle'); if(t){ t.focus(); t.select(); } }, 60);
      return;
    }
    runNoteAction(n, action);
  });

  // One-shot dismissers. `capture` so a click anywhere closes before it lands.
  const away = (e)=>{ if(!menu.contains(e.target)) closeNoteCtxMenu(); };
  const esc_ = (e)=>{ if(e.key==='Escape') closeNoteCtxMenu(); };
  setTimeout(()=>{
    document.addEventListener('mousedown', away, true);
    document.addEventListener('keydown', esc_);
    document.addEventListener('scroll', closeNoteCtxMenu, true);
  }, 0);
  menu._cleanup = ()=>{
    document.removeEventListener('mousedown', away, true);
    document.removeEventListener('keydown', esc_);
    document.removeEventListener('scroll', closeNoteCtxMenu, true);
  };
}
