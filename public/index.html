const TB_BOWL_COLORS = [
  [TB_BOWL_CLAY,'Đất nung'], ['#C0483A','Đỏ gạch'], ['#2E7BC4','Xanh dương'],
  ['#3E8F5A','Xanh lá'],     ['#E0A33A','Vàng'],    ['#7C5CBF','Tím'], ['#4A5568','Xám'],
];

const TobbyBowl = {
  fit:null, mine:null,
  state(){ return tobby().bowl; },

  /** Measure the basin once, from the rig's own kibble: it already occupies
   *  exactly the volume a dish should. */
  measure(){
    if(this.fit || !TobbyRig.ready) return this.fit;
    const T = TobbyRig.THREE, box = new T.Box3();
    // Accumulate the matrices from bowl_food DOWN to each kibble mesh. Using a
    // mesh's own `matrix` measures it relative to its parent, and the kibble
    // sits two levels deep under bowl_contents — so that measured one biscuit
    // (r = 0.02) instead of the heap (r = 0.10) and every dish came out five
    // times too small for the bowl. Not matrixWorld either: the served food is
    // a child of bowl_food, so bowl_food's own frame is the one it is built in.
    // And update the matrices before reading them. `matrix` is composed lazily,
    // so the first call — which happens during load, before anything has been
    // rendered — walked a tree of identity transforms and measured a single
    // 0.04 biscuit as if it were the whole heap. The wrong answer was then
    // cached for the life of the page, which is why it looked like the fix had
    // not applied when the same code run later gave the right number.
    const base = TobbyRig.bowl.food;
    TobbyRig.root.updateMatrixWorld(true);
    const want = new Set(TobbyRig.bowl.rigKibble);
    (function walk(o, m){
      const mm = o === base ? m : new T.Matrix4().multiplyMatrices(m, o.matrix);
      if(want.has(o) && o.geometry){
        o.geometry.computeBoundingBox();
        box.union(o.geometry.boundingBox.clone().applyMatrix4(mm));
      }
      o.children.forEach(c=> walk(c, mm));
    })(base, new T.Matrix4());
    const size = box.getSize(new T.Vector3());
    this.fit = box.isEmpty()
      ? { r:0.10, floor:0.04, top:0.16 }
      : { r: Math.max(size.x, size.z)*0.5, floor: box.min.y, top: box.max.y };
    return this.fit;
  },

  /** Showing or hiding the bowl changes what has to be in shot, so the camera
   *  is re-aimed. It reads as a small pull-back when dinner arrives. */
  show(on){
    if(!TobbyRig.ready) return;
    const was = TobbyRig.bowl.root.visible;
    TobbyRig.bowl.root.visible = !!on;
    if(was !== !!on) TobbyRig.frame();
  },
  visible(){ return TobbyRig.ready && TobbyRig.bowl.root.visible; },

  /** Voxel clusters, in the bowl's own idiom. Layers are
   *  [colour, count, spread, size, height] — enough vocabulary to say
   *  'broth, pale noodles, dark slices' without hand-modelling phở. */
  build(kind){
    if(!TobbyRig.ready) return 0;
    const T = TobbyRig.THREE, fit = this.measure();
    if(!this.mine){
      this.mine = new T.Group(); this.mine.name = 'tb_served';
      TobbyRig.bowl.food.add(this.mine);
    }
    while(this.mine.children.length){
      const c = this.mine.children.pop();
      c.geometry && c.geometry.dispose(); c.material && c.material.dispose();
      this.mine.remove(c);
    }
    const def = TB_BOWL_FOODS.find(f=>f[0]===kind);
    const rigOwn = def && def[3] === 'rig';
    // The rig's own dish is shown as authored rather than imitated.
    TobbyRig.bowl.rigKibble.forEach(m=> m.visible = !!rigOwn);
    if(!def || rigOwn || !def[3] || !def[3].length) return rigOwn ? TobbyRig.bowl.rigKibble.length : 0;
    let seed = 0; for(const ch of kind) seed = (seed*31 + ch.charCodeAt(0)) >>> 0;
    const rnd = ()=> ((seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296);
    const rise = fit.top - fit.floor;
    let n = 0;
    def[3].forEach(([colour, count, spread, size, height])=>{
      const pool = count === 1;
      const s = fit.r * (pool ? Math.min(size, 1.84) : size);
      const geo = new T.BoxGeometry(s, s * (pool ? 0.22 : 0.85), s);
      const mat = new T.MeshStandardMaterial({ color:colour, roughness:0.72, metalness:0.02,
        transparent:pool, opacity: pool ? 0.92 : 1 });
      for(let i=0;i<count;i++){
        const m = new T.Mesh(geo, mat);
        const y = fit.floor + height * rise;
        if(pool) m.position.set(0, y, 0);
        else{
          const a = rnd()*Math.PI*2, d = Math.sqrt(rnd()) * fit.r * spread;
          m.position.set(Math.cos(a)*d, y + rnd()*s*0.25, Math.sin(a)*d);
          m.rotation.y = rnd()*Math.PI;
        }
        this.mine.add(m); n++;
      }
    });
    return n;
  },

  /** Repaint the bowl itself. Checked that none of its three materials is
   *  shared with the dog, so a green bowl cannot give you a green dog. */
  setColor(hex, quiet){
    if(!hex) return false;
    if(!quiet){ this.state().color = hex; persist(); }
    if(!TobbyRig.ready) return false;
    const base = new TobbyRig.THREE.Color(hex);
    const seen = new Set();
    TobbyRig.bowl.prop.traverse(o=>{
      if(!o.isMesh || !o.material || !o.material.color || seen.has(o.material)) return;
      seen.add(o.material);
      const n = o.material.name || '';
      const k = /rim/.test(n) ? 1.16 : /inner/.test(n) ? 0.78 : 1;
      o.material.color.copy(base).multiplyScalar(k);
    });
    return true;
  },

  apply(){
    if(!TobbyRig.ready) return false;
    const s = this.state();
    this.build(s.kind || 'empty');
    this.setColor(s.color || TB_BOWL_CLAY, true);
    this.show(s.kind !== 'empty');
    return true;
  },
};

/* ---------- feeding ---------- */
let tbFeedTimer = 0, tbMealResumed = false;
/** Serve a dish and let him eat it. Not gated on the model: a meal is state, a
 *  timer and some XP, none of which need WebGL. */
function tobbyFeed(kind){
  const bowl = tobby().bowl;
  if(kind === 'empty'){ tobbyEndMeal({ cancel:true }); return; }
  if(bowl.kind !== 'empty') return;              // one meal at a time
  bowl.kind = kind;
  bowl.fedCount = (bowl.fedCount||0) + 1;
  bowl.lastFedAt = nowISO();
  persist();
  TobbyBowl.apply();
  TobbyBrain.feel('happy', 1600);
  TobbyAnim.playAction('Tobby_EatFromBowl', TB_BOWL_EAT_MS);
  clearTimeout(tbFeedTimer);
  tbFeedTimer = setTimeout(tobbyEndMeal, TB_BOWL_EAT_MS);
}
/** Meal over: empty the bowl and pay the XP.
 *
 *  Clearing the timer is not tidiness. Without it a meal that ended any other
 *  way left a live thirty-second timer behind, which then fired during the NEXT
 *  meal and cut it short while paying out its XP early. */
function tobbyEndMeal(opts){
  clearTimeout(tbFeedTimer); tbFeedTimer = 0;
  const bowl = tobby().bowl;
  const wasFed = bowl.kind !== 'empty';
  bowl.kind = 'empty';
  persist();
  TobbyBowl.apply();
  if(!wasFed) return;
  // Taking the food away is not a meal. And a finished one pays the
  // RELATIONSHIP, not XP: feeding him is care, not work, and letting care
  // grow him up would make the growth meaningless.
  if(!(opts && opts.cancel)){
    tobbyBond(TB_BOND.FEED, 'feed');
    tobbyRemember('INTERACTION', TB_L('Được cho ăn', 'Was fed'), {});
  }
  if(TobbyAnim.actionName === 'Tobby_EatFromBowl') TobbyAnim.endAction();
  TobbyBrain.relax();
}
/** A meal must not outlive the page: the dish is saved but the timer only ever
 *  lived in memory, so a reload used to leave the bowl permanently mid-meal —
 *  every dish refused, and no meal running either. */
function tobbyResumeMeal(){
  if(tbMealResumed) return;
  const bowl = tobby().bowl;
  if(bowl.kind === 'empty'){ tbMealResumed = true; return; }
  const started = Date.parse(bowl.lastFedAt || '') || 0;
  const left = started ? TB_BOWL_EAT_MS - (Date.now() - started) : 0;
  if(left <= 800){ tbMealResumed = true; tobbyEndMeal(); return; }
  tbMealResumed = true;
  TobbyBowl.apply();
  TobbyAnim.playAction('Tobby_EatFromBowl', left);
  clearTimeout(tbFeedTimer);
  tbFeedTimer = setTimeout(tobbyEndMeal, left);
}
/* ---------------------------------------------------------
   The panel. One window, opened by right-clicking him, reaching everything he
   can be asked to do. Dishes and outfits are laid out on a fixed grid rather
   than a wrapped row: items that reflow into a different shape each time are
   hard to aim at.
   --------------------------------------------------------- */
/** A popup anchored beside Tobby.
 *
 *  Placed above him when there is room and below when there is not, and always
 *  nudged back inside the window — he can be dragged to either edge, and a
 *  panel that opens off-screen is a panel that does not exist. Returns the
 *  element plus a close(); the caller fills the body.
 *
 *  There is deliberately no backdrop. The board behind him stays readable and
 *  stays usable, and a click anywhere outside simply closes this. */
function tobbyPopup(title, onClose){
  document.querySelectorAll('.tb-pop').forEach(p=> p.remove());
  const pop = document.createElement('div');
  pop.className = 'tb-pop';
  pop.innerHTML = '<div class="tb-pop-head">' +
    '<div class="tb-title">' + title + '</div>' +
    '<button data-x aria-label="close">\u2715</button></div>' +
    '<div class="tb-pop-body"></div>';
  document.body.appendChild(pop);

  let away = null;
  const close = ()=>{
    pop.remove();
    if(away) document.removeEventListener('pointerdown', away);
    document.removeEventListener('keydown', onKey);
    removeEventListener('resize', place);
    if(onClose) onClose();
  };
  const onKey = (e)=>{ if(e.key === 'Escape') close(); };

  function place(){
    const dock = document.getElementById('tobbyDock');
    const r = dock ? dock.getBoundingClientRect()
                   : { left:innerWidth-90, right:innerWidth-14, top:innerHeight-100, bottom:innerHeight-14 };
    const w = pop.offsetWidth, h = pop.offsetHeight;
    // Centred on him, then pulled back inside the window.
    const left = Math.max(10, Math.min(r.left + r.width/2 - w/2, innerWidth - w - 10));
    // Above him if it fits, otherwise below — on a short window neither fits
    // fully and the clamp keeps it on screen rather than half off the top.
    const above = r.top - h - 10;
    const top = above >= 10 ? above : Math.min(r.bottom + 10, innerHeight - h - 10);
    pop.style.left = Math.round(left) + 'px';
    pop.style.top  = Math.round(Math.max(10, top)) + 'px';
  }
  place();
  addEventListener('resize', place, { passive:true });

  pop.querySelector('[data-x]').onclick = (e)=>{ e.stopPropagation(); close(); };
  // Deferred by a tick, or the very click that opened this would close it.
  setTimeout(()=>{
    away = (e)=>{
      if(pop.contains(e.target)) return;
      const dock = document.getElementById('tobbyDock');
      if(dock && dock.contains(e.target)) return;   // his own menu re-opens it
      close();
    };
    document.addEventListener('pointerdown', away);
  }, 0);
  document.addEventListener('keydown', onKey);

  return { el: pop, body: pop.querySelector('.tb-pop-body'), close, place };
}
/* ---------------------------------------------------------
   Ask Tobby. Answers are computed from the board, not generated: he reads the
   same STATE every view reads and says what is in it. The Gemini action layer
   is still here (AI_ACTIONS / executeAIAction) if a model is ever wired back
   in, but nothing on this screen needs one to be useful.
   --------------------------------------------------------- */
const TB_QUESTIONS = [
  ['next',     'Giờ nên làm gì?',        'What now?'],
  ['urgent',   'Có gì gấp không?',      'Anything urgent?'],
  ['overdue',  'Mình đang nợ gì?',      'What am I behind on?'],
  ['today',    'Hôm nay xong gì rồi?',    'Done today?'],
  ['week',     'Tuần này thế nào?',      'How is the week?'],
  ['heavy',    'Việc nào nặng nhất?',    'Heaviest task?'],
  ['tobby',    'Tobby lớn tới đâu rồi?', 'How grown are you?'],
];
/** The one thing worth doing next: overdue first, then due soonest, then
 *  whatever is already furthest along — finishing beats starting. */
function tobbyPickNext(){
  const open = activeTasks().filter(t=> t.status!=='Hoàn thành' && !isFrozen(t));
  if(!open.length) return null;
  const score = (t)=>{
    let s = 0;
    if(isOverdue(t)) s += 1000;
    if(isSameDay(t.deadline)) s += 600;
    if(/ASAP/i.test(t.priority||'')) s += 400;
    if(/Cao/i.test(t.priority||'')) s += 250;
    if(t.deadline){ const d = (new Date(t.deadline) - new Date())/86400000; s += Math.max(0, 200 - d*20); }
    s += computeCompletion(t) * 1.2;
    if(t.pinned) s += 150;
    return s;
  };
  return open.slice().sort((a,b)=> score(b)-score(a))[0];
}
function tobbyAnswer(key){
  const L2 = TB_L;
  const open = activeTasks().filter(t=> t.status!=='Hoàn thành' && !isFrozen(t));
  const overdue = open.filter(isOverdue);
  const today = activeTasks().filter(t=> t.status==='Hoàn thành' && isSameDay(t.completedAt));
  switch(key){
    case 'next': {
      const t = tobbyPickNext();
      if(!t) return { text: L2('Không còn việc nào đang mở. Nghᢁ mᢗt lát đi.','Nothing open. Take a break.') };
      return { text: L2('Làm “' + t.title + '” trước.', 'Start with “' + t.title + '”.') +
        (t.deadline ? ' ' + L2('Hạn: ','Due: ') + fmtDate(t.deadline) : ''), task:t };
    }
    case 'urgent': {
      const soon = open.filter(t=> isSameDay(t.deadline));
      if(!overdue.length && !soon.length) return { text: L2('Không có gì gấp.','Nothing urgent.') };
      return { text: L2(
        (overdue.length ? overdue.length + ' việc quá hạn. ' : '') + (soon.length ? soon.length + ' việc đến hạn hôm nay.' : ''),
        (overdue.length ? overdue.length + ' overdue. ' : '') + (soon.length ? soon.length + ' due today.' : '')),
        task: overdue[0] || soon[0] };
    }
    case 'overdue':
      if(!overdue.length) return { text: L2('Không nợ gì cả.','Nothing overdue.') };
      return { text: L2('Đang nợ ' + overdue.length + ' việc. Cũ nhất: “' + overdue[0].title + '”.',
                        overdue.length + ' overdue. Oldest: “' + overdue[0].title + '”.'), task: overdue[0] };
    case 'today':
      return { text: today.length
        ? L2('Hôm nay xong ' + today.length + ' việc. Giỏi đấy.', today.length + ' done today. Nice.')
        : L2('Hôm nay chưa xong việc nào.','Nothing finished today yet.') };
    case 'week': {
      const wk = activeTasks().filter(t=>{
        if(t.status!=='Hoàn thành' || !t.completedAt) return false;
        return (Date.now() - new Date(t.completedAt)) < 7*86400000;
      });
      return { text: L2('7 ngày qua xong ' + wk.length + ' việc, còn ' + open.length + ' việc đang mở.',
                        wk.length + ' finished this week, ' + open.length + ' still open.') };
    }
    case 'heavy': {
      const h = open.slice().sort((a,b)=> (b.estimateHours||0)-(a.estimateHours||0))[0];
      if(!h) return { text: L2('Không có việc nào đang mở.','Nothing open.') };
      return { text: L2('Nặng nhất là “' + h.title + '”.', 'Heaviest is “' + h.title + '”.'), task:h };
    }
    case 'tobby': {
      const g = TobbyGrowth.progress();
      const T = tobby();
      return { text: L2(
        'Mình đang là ' + g.cur.vi + ', ' + (T.xp||0) + ' XP. ' +
          (g.next ? 'Còn ' + g.xpLeft + ' XP nữa lên ' + g.next.vi + '.' : 'Đã trưởng thành rồi.') +
          ' Chúng ta là ' + tobbyBondLevel().vi.toLowerCase() + ', quen nhau ' + TobbyGrowth.ageDays() + ' ngày.',
        'I am a ' + g.cur.en + ' on ' + (T.xp||0) + ' XP. ' +
          (g.next ? g.xpLeft + ' XP to ' + g.next.en + '.' : 'Fully grown.') +
          ' We are ' + tobbyBondLevel().en.toLowerCase() + ', ' + TobbyGrowth.ageDays() + ' days now.') };
    }
  }
  return { text: L2('Mình chưa hiểu ý bạn.','I did not follow that.') };
}
/** Free text, matched against the same questions. Deliberately simple: it
 *  answers from the board or says it does not know, rather than inventing. */
function tobbyAsk(text){
  const q = String(text||'').toLowerCase();
  const hit =
    /quá hạn|trễ|nợ|overdue|late/.test(q)          ? 'overdue' :
    /gấp|urgent|khẩn|hôm nay hạn|due/.test(q)       ? 'urgent'  :
    /xong|hoàn thành|done|finish/.test(q)          ? 'today'   :
    /tuần|week/.test(q)                             ? 'week'    :
    /nặng|lâu|heavy|big/.test(q)                    ? 'heavy'   :
    /tobby|lớn|tuổi|age|grow/.test(q)               ? 'tobby'   :
    /làm gì|next|bắt đầu|start/.test(q)            ? 'next'    : null;
  if(!hit) return { text: TB_L(
    'Mình trả lời được về: việc nên làm, việc gấp, việc quá hạn, việc đã xong, tuần này, việc nặng nhất.',
    'I can answer: what to do next, what is urgent, what is overdue, what is done, this week, the heaviest task.') };
  return tobbyAnswer(hit);
}

        '<button class="tb-care" data-care>' +
          '<i>\ud83c\udf7d\ufe0f</i>' +
          '<span><b>' + L2('Cho \u0103n, m\u00e0u b\u00e1t, qu\u1ea7n \u00e1o','Feed, bowl colour, clothes') + '</b>' +
          '<small>' + (eating ? L2('\u0111ang \u0103n ' + (cur?cur[2]:''), 'eating')
                     : lent ? L2('\u0111ang m\u01b0\u1ee3n ' + tbWearName(lent), 'wearing ' + lent)
                     : L2('b\u00e1t \u0111ang tr\u1ed1ng', 'bowl empty')) + '</small></span>' +
          '<em>\u203a</em>' +
        '</button>';
    wire();
    pop.place();          // the height changed, so where it sits does too
  }

  function wire(){
    const show = (r)=>{ answer = r; draw(); };
    overlay.querySelectorAll('[data-q-key]').forEach(b=> b.onclick = (e)=>{
      e.stopPropagation(); show(tobbyAnswer(b.dataset.qKey));
    });
    const form = overlay.querySelector('[data-ask]');
    if(form) form.onsubmit = (e)=>{
      e.preventDefault(); e.stopPropagation();
      const q = overlay.querySelector('[data-q]').value.trim();
      if(q) show(tobbyAsk(q));
    };
    const acts = overlay.querySelector('.tb-answer-acts');
    if(acts && answer && answer.task){
      acts.querySelector('[data-a="open"]').onclick = (e)=>{ e.stopPropagation(); close(); openTaskModal(answer.task.id); };
      acts.querySelector('[data-a="focus"]').onclick = (e)=>{ e.stopPropagation(); close(); toggleTimer(answer.task.id); };
    }
    overlay.querySelectorAll('[data-do]').forEach(b=> b.onclick = (e)=>{
      e.stopPropagation();
      const k = b.dataset.do;
      close();
      if(k==='task'){ openTaskModal(null); }
      if(k==='note'){ const n = addNote({ title:'', content:'' }); render(); if(typeof openNote==='function' && n) openNote(n.id); }
      if(k==='focus'){ const t = tobbyPickNext(); if(t) toggleTimer(t.id); else toast(TB_L('Kh\u00f4ng c\u00f3 vi\u1ec7c n\u00e0o \u0111\u1ec3 t\u1eadp trung.','Nothing to focus on.')); }
      if(k==='review'){ VIEW='dashboard'; standupRange='week'; try{ tobbyOnReview('week'); }catch(e){} render(); }
      if(k==='calendar'){ VIEW='calendar'; render(); }
      if(k==='notif'){ VIEW='notifications'; render(); }
    });
    const care = overlay.querySelector('[data-care]');
    if(care) care.onclick = (e)=>{ e.stopPropagation(); close(); tobbyCarePanel(); };
  }

  draw();
}
/** Feeding, the bowl's colour and the wardrobe — one screen, opened from the
 *  main panel rather than living in it. Three long sections in the same window
 *  as the ask box pushed everything else below the fold. */
function tobbyCarePanel(){
  const L2 = TB_L;
  const pop = tobbyPopup('\ud83c\udf7d\ufe0f ' + TB_L('Ch\u0103m s\u00f3c Tobby','Look after Tobby'));
  const overlay = pop.el;
  const close = pop.close;
  // A way back to the main panel, in the popup's own header.
  const back = document.createElement('button');
  back.textContent = '\u2039';
  back.style.cssText = 'font-size:20px;order:-1;';
  back.onclick = (e)=>{ e.stopPropagation(); close(); tobbyPanel(); };
  pop.el.querySelector('.tb-pop-head').prepend(back);

  function draw(){
    const T = tobby(), b = T.bowl;
    const eating = b.kind !== 'empty';
    const cur = TB_BOWL_FOODS.find(f=>f[0]===b.kind);
    const g = TobbyGrowth.progress();
    const ready = TobbyRig.ready;
    const unlocked = TobbyWear.unlocked();
    const lent = TobbyWear.borrowed();
    const worn = new Set(TobbyWear.outfit());

    // An item occupies every slot it has a marker for — the raincoat is head,
    // neck AND spine — so listing the slots verbatim showed it three times.
    // Each item is filed once, under the most body-covering slot it uses,
    // which is also the one a person would look for it in.
    const PRIMARY = ['body','spine','neck','eyes','head'];
    const filed = {};
    Object.keys(TobbyRig.wear).forEach(item=>{
      const slot = PRIMARY.find(s=> (TobbyRig.slots[s]||[]).includes(item));
      if(slot) (filed[slot] = filed[slot] || []).push(item);
    });
    const slotRows = ['head','eyes','neck','body','spine']
      .filter(s=> filed[s] && filed[s].length)
      .map(s=> [s, filed[s].sort()])
      .map(([slot, items])=>
      '<div class="tb-sec">' + esc(TB_SLOT_VI[slot] || slot) + '</div>' +
      '<div class="tb-grid">' + items.map(it=>{
        const own = unlocked.includes(it);
        const day = TB_UNLOCK_DAY[it];
        const isLent = lent === it;
        return '<button class="tb-pick ' + (worn.has(it)?'on':'') + '" data-wear="' + it + '"' +
          (own ? '' : ' disabled') + '>' +
          '<i>' + (isLent ? '\u2601\ufe0f' : own ? '\u2713' : '\ud83d\udd12') + '</i>' +
          esc(tbWearName(it)) +
          (own ? (isLent ? '<small>' + L2('th\u1eddi ti\u1ebft','weather') + '</small>' : '')
               : '<small>' + L2('ng\u00e0y ' + day, 'day ' + day) + '</small>') +
          '</button>';
      }).join('') + '</div>').join('');

    pop.body.innerHTML =
        '<div class="tb-age">' +
          '<b>' + esc(LANG==='en' ? g.cur.en : g.cur.vi) + '</b>' +
          '<span class="bar"><i style="width:' + Math.round(g.pct*100) + '%"></i></span>' +
          '<span>' + (g.next
            ? L2(g.xpLeft + ' XP n\u1eefa', g.xpLeft + ' XP to go')
            : L2('\u0111\u00e3 tr\u01b0\u1edfng th\u00e0nh','fully grown')) + '</span>' +
        '</div>' +
        '<div style="font-size:11.5px;color:var(--text-3);margin-top:6px;">' +
          (T.xp||0) + ' XP \u00b7 ' +
          esc(LANG==='en' ? tobbyBondLevel().en : tobbyBondLevel().vi) +
          ' \u00b7 ' + L2('\u0111\u00e3 cho \u0103n ' + (b.fedCount||0) + ' l\u1ea7n', (b.fedCount||0) + ' meals') +
        '</div>' +
        (ready ? '' : '<div class="tb-borrowed">' +
          L2('Ch\u01b0a t\u1ea3i \u0111\u01b0\u1ee3c h\u00ecnh 3D \u2014 v\u1eabn cho \u0103n v\u00e0 thay \u0111\u1ed3 \u0111\u01b0\u1ee3c nh\u01b0 th\u01b0\u1eddng.',
             'The 3D model has not loaded \u2014 feeding and dressing still work.') + '</div>') +

        '<div class="tb-sec">' + L2('Cho \u0103n','Feed') +
          (eating ? ' \u00b7 ' + L2('\u0111ang \u0103n ' + (cur?cur[2]:''), 'eating') : '') + '</div>' +
        '<div class="tb-grid">' +
          TB_BOWL_FOODS.filter(f=>f[0]!=='empty').map(f=>
            '<button class="tb-pick ' + (b.kind===f[0]?'on':'') + '" data-food="' + f[0] + '"' +
            (eating?' disabled':'') + '><i>' + f[1] + '</i>' + esc(f[2]) + '</button>').join('') +
        '</div>' +
        (eating ? '<div style="margin-top:8px;"><button class="btn btn-ghost btn-sm" data-stop>' +
          L2('D\u1eebng b\u1eefa','Stop the meal') + '</button></div>' : '') +

        '<div class="tb-sec">' + L2('M\u00e0u b\u00e1t','Bowl colour') + '</div>' +
        '<div class="tb-cols">' +
          TB_BOWL_COLORS.map(c=>
            '<button data-col="' + c[0] + '" title="' + esc(c[1]) + '" class="' +
            ((b.color||TB_BOWL_CLAY).toLowerCase()===c[0].toLowerCase()?'on':'') +
            '" style="background:' + c[0] + '"></button>').join('') +
        '</div>' +

        slotRows +
        (lent ? '<div class="tb-borrowed">' + L2(
            'Tr\u1eddi ' + (WEATHER.kind==='rain'||WEATHER.kind==='storm' ? 'm\u01b0a' : WEATHER.kind==='snow' ? 'tuy\u1ebft' : 'th\u1ea5t th\u01b0\u1eddng') +
            ' \u2014 Tobby \u0111ang m\u01b0\u1ee3n ' + tbWearName(lent) + '. Tr\u1ea3 l\u1ea1i khi tr\u1eddi \u0111\u1eb9p.',
            'Weather gear on loan: ' + tbWearName(lent) + '.') + '</div>' : '');
    wire();
    pop.place();
  }

  function wire(){
    // Everything here stops the click bubbling: these handlers redraw their own
    // container, which detaches the node that was clicked, and any listener
    // further up then reads a target belonging to nothing.
    overlay.querySelectorAll('[data-food]').forEach(el=> el.onclick = (e)=>{
      e.stopPropagation(); tobbyFeed(el.dataset.food); close();
    });
    const stop = overlay.querySelector('[data-stop]');
    if(stop) stop.onclick = (e)=>{ e.stopPropagation(); tobbyEndMeal({cancel:true}); draw(); };
    overlay.querySelectorAll('[data-col]').forEach(el=> el.onclick = (e)=>{
      e.stopPropagation(); TobbyBowl.setColor(el.dataset.col); draw();
    });
    overlay.querySelectorAll('[data-wear]').forEach(el=> el.onclick = (e)=>{
      e.stopPropagation(); TobbyWear.toggle(el.dataset.wear); draw();
    });
  }

  draw();
}
/** A short line over his head. Auto-dismissed; never blocks anything. */
let tbSpeechTimer = 0;
function tobbySay(text, ms){
  if(!text) return;
  document.querySelectorAll('.tb-speech').forEach(e=> e.remove());
  const dock = document.getElementById('tobbyDock');
  if(!dock) return;
  const el = document.createElement('div');
  el.className = 'tb-speech';
  el.textContent = text;
  document.body.appendChild(el);
  const d = dock.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(d.left + d.width/2 - w/2, innerWidth - w - 8)) + 'px';
  el.style.top  = Math.max(8, d.top - h - 10) + 'px';
  clearTimeout(tbSpeechTimer);
  tbSpeechTimer = setTimeout(()=>{
    el.classList.add('out');
    setTimeout(()=> el.remove(), 220);
  }, ms || 3200);
}
/** Six sparks off the top of him. Deliberately small: the brief asks for a
 *  moment, not a mobile-game popup. */
function tobbySparks(n, opt){
  if(tbReduceMotion()) return;
  const dock = document.getElementById('tobbyDock');
  if(!dock) return;
  const o = opt || {};
  const d = dock.getBoundingClientRect();
  const cx = d.left + d.width/2;
  const cy = d.top + d.height * (o.low ? 0.86 : 0.35);
  const spread = o.spread || 40;
  for(let i = 0; i < (n||6); i++){
    const s = document.createElement('div');
    s.className = 'tb-spark' + (o.cls ? ' ' + o.cls : '') + (o.inward ? ' in' : '');
    // Dust settles sideways along the floor; everything else lifts.
    const a = o.low ? (Math.random() - 0.5) * Math.PI * 0.7
                    : (-0.5 - Math.random()) * Math.PI;
    const r = spread * (0.6 + Math.random()*0.6);
    s.style.setProperty('--dx', Math.cos(a)*r + 'px');
    s.style.setProperty('--dy', (o.low ? Math.abs(Math.sin(a))*r*0.3 : Math.sin(a)*r) + 'px');
    s.style.left = (cx - 2 + (Math.random()-0.5)*18) + 'px';
    s.style.top  = (cy - 2) + 'px';
    s.style.animationDelay = (i*35) + 'ms';
    document.body.appendChild(s);
    setTimeout(()=> s.remove(), 1200 + i*35);
  }
}
/* =========================================================
   Effects, as the rig specifies them
   ---------------------------------------------------------
   The model ships a table of events keyed by clip — which effect, and at
   what time within the clip. Reading it means the sparks land on the beat the
   animator intended (the charge at 0.7s of an evolution, the transformation at
   1.5, the settle at 4.0) instead of all at once when the clip is triggered.
   ========================================================= */
const TB_FX = {
  SMALL_PIXEL_SPARKS:   { n:4,  spread:26, cls:'' },
  PIXEL_BURST:          { n:10, spread:44, cls:'big' },
  PIXEL_DUST:           { n:6,  spread:22, cls:'calm', low:true },
  PIXEL_CHARGE:         { n:9,  spread:40, cls:'', inward:true },
  PIXEL_EXPLOSION:      { n:14, spread:60, cls:'big' },
  PIXEL_TRANSFORMATION: { n:16, spread:58, cls:'big' },
  PIXEL_SETTLE:         { n:5,  spread:20, cls:'calm' },
  PIXEL_ALERT:          { n:6,  spread:30, cls:'warn' },
  PIXEL_PING:           { n:2,  spread:18, cls:'' },
  PIXEL_ZZZ:            { zzz:true },
  PIXEL_ZZZ_LOOP:       { zzz:true, every:2600 },
  // The three screen/thought loops are ambient states rather than moments;
  // they belong to the clip itself and need nothing drawn over the top.
  PIXEL_THOUGHT_LOOP:   null,
  PIXEL_SCREEN_LOOP:    null,
};
function tobbyFx(kind){
  const f = TB_FX[kind];
  if(!f || tbReduceMotion()) return;
  if(f.zzz) return tobbyZzz();
  tobbySparks(f.n, f);
}
function tobbyZzz(){
  const dock = document.getElementById('tobbyDock');
  if(!dock) return;
  const d = dock.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'tb-zzz';
  el.textContent = 'z';
  el.style.left = (d.left + d.width*0.62) + 'px';
  el.style.top  = (d.top + d.height*0.28) + 'px';
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 2500);
}
/** Put him in the DOM and keep him there.
 *
 *  render() rebuilds the whole shell, so the stage element is a NEW node on
 *  every navigation while the WebGL canvas and the loaded model are not. The
 *  canvas is moved into the new stage rather than the model being reloaded —
 *  and this is also where the old build went wrong: it left the canvas
 *  orphaned in a discarded node while still believing it was mounted, which is
 *  what froze him. */
function wireTobbyStage(){
  const stage = document.getElementById('tobbyStage');
  if(!stage) return;
  if(TobbyRig.ready){
    if(TobbyRig.container !== stage || TobbyRig.renderer.domElement.parentNode !== stage){
      TobbyRig.container = stage;
      stage.appendChild(TobbyRig.renderer.domElement);
      TobbyRig.resize();
      TobbyRig.render();
    }
    wireTobbyInteraction();
    TobbyBrain.restorePlace();
    return;
  }
  if(TobbyRig.loading || TobbyRig.failed) return;
  TobbyRig.init(stage).then(ok=>{
    if(!ok) return;
    TobbyAnim.setBase('Tobby_Idle');
    TobbyAnim.start();
    TobbyGrowth.tick();
    TobbyGrowth.apply();
    tobbyWelcomeBack();
    TobbyWear.unlocked();
    TobbyWear.apply();
    TobbyBowl.apply();
    tobbyResumeMeal();
    TobbyBrain.relax();
    TobbyBrain.restorePlace();
    wireTobbyInteraction();
  });
}
/** Interactions. Bound once and removed first: wireTobbyStage runs on every
 *  render, and a document-level handler added each time is a leak that only
 *  shows up an hour in. */
let tbDocDbl = null, tbDocMove = null, tbOnResizeTobby = null;
function wireTobbyInteraction(){
  const dock = document.getElementById('tobbyDock');
  const body = document.getElementById('tobbyBody');
  if(!dock || !body) return;

  // Double-click anywhere else: he comes to you.
  if(tbDocDbl) document.removeEventListener('dblclick', tbDocDbl);
  tbDocDbl = (e)=>{
    if(!TobbyRig.ready) return;
    // `closest` lives on Element. A double-click can be retargeted at the
    // document or a text node, and calling it blind threw before any of the
    // checks below could run — which made him ignore the gesture entirely.
    const el = e.target && e.target.closest ? e.target
             : (e.target && e.target.parentElement) || null;
    if(!el || !el.closest) return;
    if(el.closest('#tobbyDock, .modal, .overlay, .tb-modal')) return;
    // Double-click is also "select this word", "open this row" and "navigate".
    // Anywhere the user is reading, typing or operating a control, that meaning
    // wins — including the sidebar, where a double-click is two navigations and
    // very obviously not a request to move the dog.
    if(el.closest('input, textarea, select, button, a, [contenteditable], [data-open], ' +
                  '.data-table, .note-card, .nav-item, [data-view], .btn, .pill-toggle, ' +
                  '.tb-pick, .sidebar, .kanban-card, .cal-pill, .task-row')) return;
    if(window.getSelection && String(window.getSelection()).length) return;
    if(TobbyBrain.sleeping) TobbyBrain.wake();
    TobbyBrain.goTo(e.clientX, ()=> TobbyBrain.hop());
  };
  document.addEventListener('dblclick', tbDocDbl);

  // His head follows the pointer while it is near him — the one continuous
  // piece of feedback that makes him feel present rather than parked.
  if(tbDocMove) document.removeEventListener('pointermove', tbDocMove);
  let lastGlance = 0;
  tbDocMove = (e)=>{
    if(!TobbyRig.ready || TobbyBrain.sleeping) return;
    const r = dock.getBoundingClientRect();
    if(Math.abs(e.clientY - r.top) > 260 || Math.abs(e.clientX - (r.left+r.width/2)) > 320) return;
    const now = performance.now();
    if(now - lastGlance < 5000) return;
    lastGlance = now;
    TobbyBrain.glanceAt(e.clientX);
  };
  document.addEventListener('pointermove', tbDocMove, { passive:true });

  dock.oncontextmenu = (e)=>{ e.preventDefault(); tobbyPanel(); };

  // Hold and drag him along the bottom edge. Sideways only: his height is not
  // a free choice, he stands on the floor.
  let drag = null;
  body.addEventListener('pointerdown', (e)=>{
    if(e.button && e.button !== 0) return;
    // preventDefault, or the browser starts its own gesture on a button — a
    // native drag or a text selection — and that cancels the pointer capture,
    // which fires pointercancel and kills the drag before it moves a pixel.
    // Synthetic events never trigger that, which is why this worked in every
    // scripted test and not under a real hand.
    e.preventDefault();
    // Clear it HERE, not after the click that consumes it. Left set, the flag
    // from one drag swallowed the next plain tap — so the first click after
    // moving him did nothing at all.
    delete dock.dataset.justDragged;
    drag = { x:e.clientX, left:parseFloat(dock.style.left) || dock.getBoundingClientRect().x, moved:false };
    try{ body.setPointerCapture(e.pointerId); }catch(_){}
    // Belt and braces: if capture is refused for any reason, the pointer
    // leaving this 76px box would end the drag on the spot. Listening on the
    // document too means the gesture survives either way.
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);
  });
  const onMove = (e)=>{
    if(!drag || !TobbyRig.ready) return;
    const dx = e.clientX - drag.x;
    if(!drag.moved && Math.abs(dx) < 5) return;    // a tap has a little wobble
    if(!drag.moved){
      drag.moved = true;
      dock.dataset.dragging = '1';
      TobbyBrain.moving = true;
      TobbyAnim.setBase('Tobby_Walk');
    }
    const w = dock.offsetWidth || 76;
    dock.style.left = Math.max(6, Math.min(innerWidth - w - 6, drag.left + dx)) + 'px';
    TobbyBrain.face(dx < 0 ? -1 : 1);
  };
  const endDrag = (e)=>{
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', endDrag);
    document.removeEventListener('pointercancel', endDrag);
    if(!drag) return;
    const moved = drag.moved;
    drag = null;
    delete dock.dataset.dragging;
    try{ if(e && e.pointerId != null) body.releasePointerCapture(e.pointerId); }catch(_){}
    if(!moved) return;                              // a tap; onclick handles it
    dock.dataset.justDragged = '1';                 // the click that follows is not a tap
    TobbyBrain.moving = false;
    TobbyBrain.x = parseFloat(dock.style.left) || 0;
    TobbyBrain.faceForward();
    // Stand him up explicitly. relax() will not do it: walking counts as a job
    // a mood may not take, which is right while he is actually going somewhere
    // and wrong the moment he is put down — he kept stepping on the spot.
    TobbyAnim.setBase('Tobby_Idle');
    TobbyBrain.relax();
  };

  // Knocking wakes him; otherwise a tap is a hello. A drag is neither.
  body.onclick = (e)=>{
    e.stopPropagation();
    if(!TobbyRig.ready) return;
    if(dock.dataset.justDragged){ delete dock.dataset.justDragged; return; }
    if(TobbyBrain.sleeping){ TobbyBrain.wake(); return; }
    TobbyBrain.play();
  };

  removeEventListener('resize', tbOnResizeTobby);
  tbOnResizeTobby = ()=>{
    if(!TobbyRig.ready) return;
    TobbyRig.resize();
    const w = dock.offsetWidth || 76;
    dock.style.left = Math.max(6, Math.min(parseFloat(dock.style.left)||0, innerWidth - w - 6)) + 'px';
  };
  addEventListener('resize', tbOnResizeTobby, { passive:true });
}

/* ---------- boot ---------- */
(function boot(){
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-2);">Đang tải Bach Office…</div>`;
  STATE = loadState();
  normalizeState();
  applyGroupTheme();
  startLangObserver();
  // Restore an in-tab session so a refresh doesn't force a re-login.
  try{
    const sid = sessionStorage.getItem('bachoffice.session');
    if(sid && empById(sid)){ SESSION_USER_ID = sid; STATE.currentUserId = sid; }
  }catch(e){}
  renderApp();
  // Ambient systems. Each guards itself, so a failure in one never stops boot.
  try{ startAlarmEngine(); renderAlarmDock(); }catch(e){ console.warn('alarms', e); }
  try{ startWeather(); }catch(e){ console.warn('weather', e); }
  // He ages on the wall clock and dresses for the sky. Both are cheap enough
  // to check every minute, and doing so means a machine left open overnight
  // wakes up a day older instead of waiting for a reload.
  setInterval(()=>{
    try{ TobbyGrowth.tick(); TobbyGrowth.check(); TobbyWear.unlocked(); TobbyWear.apply(); }catch(e){}
  }, 60*1000);
})();
</script>
