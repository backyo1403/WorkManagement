<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bach Office</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bach Office">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.min.css">
<!-- Tobby's 3D renderer. Declared here because an import map has to exist
     before the first module loads, and GLTFLoader imports the bare specifier
     "three". Nothing is fetched until Tobby actually asks for it — the whole
     app runs, and stays usable, if these never arrive.

     Served from this origin rather than unpkg. A CDN is one more network that
     has to be reachable, and when it is not, Tobby never becomes 3D and there
     is nothing the app can do about it: an import map has no fallback syntax,
     so a failed CDN is simply a dead end. These files ship with the app, so if
     the page loaded at all, they will load too. three@0.160.0, unmodified;
     the addons keep their original layout because GLTFLoader reaches
     ../utils/BufferGeometryUtils.js by relative path. -->
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/addons/"
  }
}
</script>
<script>
(function(){ try{
  var t = localStorage.getItem('bachoffice.theme');
  if(!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  /* Motion is a setting, not a verdict handed down by the OS.
     Windows' "Animation effects: off" reports prefers-reduced-motion, which was
     silently switching off the weather, the star field and the map's easing —
     effects that are the point of those features. The app now decides:
       full   → always animate
       reduced→ never animate
       system → follow the OS (the accessible default for anyone who has not
                expressed a preference here)
     Set before first paint so nothing animates for a frame and then stops. */
  var m = localStorage.getItem('bachoffice.motion') || 'full';
  document.documentElement.setAttribute('data-motion', m);
}catch(e){} })();
</script>
<style>
/* =========================================================
   THEME SYSTEM
   Two axes that compose:
     data-theme = light | dark   → surfaces, text, elevation
     data-group = "" | work | sport | life → accent palette
   Group palettes are drawn from the reference boards:
     WORK  · #006454 green / #E26D33 orange / #FABF40 xanthous / #001914
     SPORT · Sun Glare / Exuberant Orange / Blue Violet / Darkest Hour
     LIFE  · #0E6973 / #118C8C / #BAD9CE mint / #F2BB16 gold
   ========================================================= */
:root{
  /* neutral surfaces (default / no group) */
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#F7F9FD; --surface-3:#EEF1F8;
  --border:#E4E8F2; --border-strong:#D3D9E8;
  --text:#131726; --text-2:#5C6480; --text-3:#98A0B8;
  --brand:#2F5BEA; --brand-soft:#E8EEFF; --brand-dark:#1E44C4; --on-brand:#FFFFFF;
  --purple:#7C3AED; --purple-soft:#F2EAFE;
  --pink:#EC4899; --pink-soft:#FDE8F3;
  --sky:#0EA5E9; --sky-soft:#E4F6FE;
  --danger:#E1483C; --danger-soft:#FDEAE8;
  --warning:#E8930C; --warning-soft:#FEF3DF;
  --success:#12965A; --success-soft:#E3F7EC;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,54,.05), 0 6px 18px rgba(16,24,54,.05);
  --shadow-lg:0 10px 26px rgba(16,24,54,.10), 0 34px 60px rgba(16,24,54,.14);
  --ring:0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent);
}
:root[data-theme="dark"]{
  --bg:#0A0C12; --surface:#14171F; --surface-2:#0F1218; --surface-3:#1C2029;
  --border:#242935; --border-strong:#333A49;
  --text:#EDF0F7; --text-2:#98A1B8; --text-3:#646C82;
  --brand:#6C93FF; --brand-soft:rgba(108,147,255,.15); --brand-dark:#8FAFFF; --on-brand:#0A0C12;
  --purple:#A98BFF; --purple-soft:rgba(169,139,255,.16);
  --pink:#F27BB0; --pink-soft:rgba(242,123,176,.16);
  --sky:#48C4F8; --sky-soft:rgba(72,196,248,.16);
  --danger:#F0705F; --danger-soft:rgba(240,112,95,.17);
  --warning:#F3B23F; --warning-soft:rgba(243,178,63,.17);
  --success:#3FCB86; --success-soft:rgba(63,203,134,.17);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.45);
  --shadow-lg:0 12px 30px rgba(0,0,0,.55), 0 36px 70px rgba(0,0,0,.6);
}

/* ---------- WORK · deep green + burnt orange ---------- */
:root[data-group="work"]{
  --bg:#F4F1E8; --surface:#FFFDF8; --surface-2:#FAF6EC; --surface-3:#F1EADA;
  --border:#E3DAC6; --border-strong:#D2C6AC;
  --text:#001914; --text-2:#4C5C55; --text-3:#8A968F;
  --brand:#006454; --brand-soft:#DDEDE7; --brand-dark:#004B3F; --on-brand:#FFFDF8;
  --purple:#B4551F; --purple-soft:#F7E5D8;
  --pink:#E26D33; --pink-soft:#FBE6D9;
  --sky:#0F8C77; --sky-soft:#DEF0EB;
  --danger:#C0392B; --danger-soft:#F8E4E1;
  --warning:#C08A0B; --warning-soft:#FCF0D5;
  --success:#006454; --success-soft:#DDEDE7;
}
:root[data-theme="dark"][data-group="work"]{
  --bg:#001914; --surface:#04241D; --surface-2:#021D18; --surface-3:#0A3329;
  --border:#0F3E33; --border-strong:#1A5647;
  --text:#FFEFD4; --text-2:#9FBAB0; --text-3:#6A857B;
  --brand:#17A085; --brand-soft:rgba(23,160,133,.18); --brand-dark:#35C4A6; --on-brand:#001914;
  --purple:#E26D33; --purple-soft:rgba(226,109,51,.18);
  --pink:#E26D33; --pink-soft:rgba(226,109,51,.18);
  --sky:#2BB89B; --sky-soft:rgba(43,184,155,.18);
  --danger:#E2604B; --danger-soft:rgba(226,96,75,.2);
  --warning:#FABF40; --warning-soft:rgba(250,191,64,.18);
  --success:#3FC9A4; --success-soft:rgba(63,201,164,.18);
}

/* ---------- SPORT · sun glare + exuberant orange + blue violet ---------- */
:root[data-group="sport"]{
  --bg:#F0EEE9; --surface:#FFFFFF; --surface-2:#F6F5F1; --surface-3:#EAE8E2;
  --border:#DDDAD2; --border-strong:#C7C3B9;
  --text:#20201F; --text-2:#5B5B58; --text-3:#918F89;
  --brand:#4F42B5; --brand-soft:#E8E5F9; --brand-dark:#3A2F94; --on-brand:#FFFFFF;
  --purple:#5B4CC4; --purple-soft:#E9E6FA;
  --pink:#F4622E; --pink-soft:#FDE6DD;
  --sky:#7A8F00; --sky-soft:#F0F5D2;
  --danger:#E33B1B; --danger-soft:#FCE3DC;
  --warning:#B58900; --warning-soft:#FBF2CE;
  --success:#6E8F00; --success-soft:#EFF5CE;
}
:root[data-theme="dark"][data-group="sport"]{
  --bg:#151514; --surface:#20201F; --surface-2:#1A1A19; --surface-3:#2B2B29;
  --border:#33332F; --border-strong:#474742;
  --text:#F0EEE9; --text-2:#A5A39C; --text-3:#6E6C66;
  --brand:#8B7BFF; --brand-soft:rgba(139,123,255,.18); --brand-dark:#A99CFF; --on-brand:#151514;
  --purple:#8B7BFF; --purple-soft:rgba(139,123,255,.18);
  --pink:#FF7448; --pink-soft:rgba(255,116,72,.18);
  --sky:#C6D92D; --sky-soft:rgba(198,217,45,.18);
  --danger:#FF6242; --danger-soft:rgba(255,98,66,.2);
  --warning:#D9C51F; --warning-soft:rgba(217,197,31,.18);
  --success:#C6D92D; --success-soft:rgba(198,217,45,.18);
}

/* ---------- LIFE · teal + mint + gold ---------- */
:root[data-group="life"]{
  --bg:#EDF5F3; --surface:#FFFFFF; --surface-2:#F4FAF8; --surface-3:#E3F0EC;
  --border:#D2E4DE; --border-strong:#B6D2C9;
  --text:#07272B; --text-2:#4A6B6D; --text-3:#8AA5A4;
  --brand:#118C8C; --brand-soft:#DDF0EF; --brand-dark:#0E6973; --on-brand:#FFFFFF;
  --purple:#0E6973; --purple-soft:#DCEBEE;
  --pink:#BF820F; --pink-soft:#FAEFD3;
  --sky:#118C8C; --sky-soft:#DDF0EF;
  --danger:#C0433A; --danger-soft:#F9E5E3;
  --warning:#BF820F; --warning-soft:#FBF0D6;
  --success:#0E8C6E; --success-soft:#DBF1EA;
}
:root[data-theme="dark"][data-group="life"]{
  --bg:#04191C; --surface:#0A272C; --surface-2:#071F23; --surface-3:#103840;
  --border:#144049; --border-strong:#1E5A64;
  --text:#E6F4F0; --text-2:#93B3B2; --text-3:#5F8080;
  --brand:#2FB3B3; --brand-soft:rgba(47,179,179,.18); --brand-dark:#54CFCF; --on-brand:#04191C;
  --purple:#BAD9CE; --purple-soft:rgba(186,217,206,.16);
  --pink:#F2BB16; --pink-soft:rgba(242,187,22,.18);
  --sky:#2FB3B3; --sky-soft:rgba(47,179,179,.18);
  --danger:#E9695C; --danger-soft:rgba(233,105,92,.2);
  --warning:#F2BB16; --warning-soft:rgba(242,187,22,.18);
  --success:#3ECBA5; --success-soft:rgba(62,203,165,.18);
}
html{transition:background-color .25s ease;}

/* =========================================================
   WORK · "onetask"-style shell
   Two detached, heavily-rounded panels floating on a soft
   gradient backdrop, over near-black surfaces. Scoped to the
   WORK group so SPORT/LIFE keep the flat full-bleed layout.
   ========================================================= */
:root[data-group="work"] body{
  background:
    radial-gradient(1100px 700px at 0% 0%,   #F6C9A8 0%, transparent 55%),
    radial-gradient(1100px 700px at 100% 100%, #CFC3EC 0%, transparent 55%),
    linear-gradient(135deg, #F3D9C4 0%, #E2DCEF 100%);
  background-attachment:fixed;
}
:root[data-theme="dark"][data-group="work"] body{
  background:
    radial-gradient(1000px 620px at 0% 0%,   #4A2E22 0%, transparent 55%),
    radial-gradient(1000px 620px at 100% 100%, #2A2740 0%, transparent 55%),
    linear-gradient(135deg, #17110E 0%, #14131F 100%);
  background-attachment:fixed;
}
:root[data-group="work"] #app{
  padding:16px; gap:14px; background:transparent; box-sizing:border-box;
}
:root[data-group="work"] .sidebar{
  border-radius:26px; border:1px solid var(--border);
  background:var(--surface-2); box-shadow:var(--shadow-lg); padding:18px 12px; height:auto;
}
:root[data-group="work"] .main{
  border-radius:26px; border:1px solid var(--border);
  background:var(--surface-2); box-shadow:var(--shadow-lg); padding:24px 26px 40px;
}
/* deeper, more neutral blacks — closer to the reference than the green-black */
:root[data-theme="dark"][data-group="work"]{
  --bg:#0A0A0C; --surface:#141416; --surface-2:#0E0E11; --surface-3:#1C1C20;
  --border:#242427; --border-strong:#33333A;
  --text:#F2EFE9; --text-2:#9A968E; --text-3:#66635E;
}
:root[data-group="work"] .nav-item.active{
  background:var(--brand); color:var(--on-brand); box-shadow:0 4px 14px color-mix(in srgb, var(--brand) 40%, transparent);
}
@media (max-width:699px){
  :root[data-group="work"] #app{padding:0; gap:0;}
  :root[data-group="work"] .sidebar{border-radius:0; box-shadow:none;}
  :root[data-group="work"] .main{border-radius:0; box-shadow:none; border:none; padding:14px 12px 84px;}
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; transition:background-color .15s ease, color .15s ease;}
::selection{background:var(--brand-soft);}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:14px; color:var(--text);}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#C7CBE0; border-radius:8px;}
:root[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#33374d;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;}

#app{display:flex; height:100vh; overflow:hidden;}

/* ---------- Sidebar ---------- */
.sidebar{width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:16px 12px; overflow-y:auto;}
.brand{display:flex; align-items:center; gap:10px; padding:8px 8px 6px 8px;}
.brand-mark{width:34px; height:34px; border-radius:11px; background:linear-gradient(135deg,var(--brand),var(--purple)); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:17px;}
.brand-name{font-weight:750; font-size:15.5px; letter-spacing:-.01em;}
.brand-sub{font-size:10.5px; color:var(--text-3); margin-top:1px;}
.theme-toggle{margin-left:auto; width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); font-size:13px; flex-shrink:0;}
.nav-group-label{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); padding:14px 10px 6px 10px;}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:11px; color:var(--text-2); font-weight:560; font-size:13.5px; cursor:pointer; user-select:none; transition:background .12s, color .12s;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--brand); color:#fff; font-weight:650; box-shadow:0 4px 12px rgba(37,99,235,.28);}
.nav-item .dot{width:18px; text-align:center; font-size:15px;}
.nav-badge{margin-left:auto; background:var(--danger); color:#fff; font-size:10px; font-weight:700; border-radius:10px; padding:1px 6px;}
.nav-item.active .nav-badge{background:rgba(255,255,255,.3);}
.sidebar-user{margin-top:auto; display:flex; align-items:center; gap:9px; padding:10px 8px; border-top:1px solid var(--border); padding-top:14px;}
.sidebar-user-name{font-size:12.5px; font-weight:650;}
.sidebar-user-role{font-size:10.5px; color:var(--text-3);}
.sidebar-logout{margin-left:auto; font-size:11px; color:var(--text-3); background:none; border:none;}

/* ---------- Main ---------- */
.main{flex:1; overflow-y:auto; padding:26px 32px 60px 32px;}
.view{max-width:1280px; margin:0 auto;}
/* Title left, actions right, both on one baseline row. Actions wrap as a
   right-aligned block so they never stagger into a ragged staircase. */
.page-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:16px; flex-wrap:nowrap;}
.page-header-main{min-width:0; flex:1 1 auto;}
.page-title{font-size:22px; font-weight:700; letter-spacing:-.02em; display:flex; align-items:center; gap:9px;
  line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.page-sub{color:var(--text-2); font-size:12.5px; margin-top:2px; line-height:1.4;}
.page-actions{display:flex; align-items:center; justify-content:flex-end; gap:10px;
  flex:0 1 auto; flex-wrap:wrap; row-gap:8px;}
.page-actions > *{flex:0 0 auto;}
@media (max-width:1099px){
  .page-header{flex-wrap:wrap;}
  .page-actions{width:100%; justify-content:flex-start;}
}
.topbar-icons{display:flex; align-items:center; gap:10px;}
/* `color` is set explicitly: a <button> does not inherit it (the UA forces
   `buttontext`), so the bell's `stroke="currentColor"` would draw black on the
   dark surface. Same treatment `.btn-icon` already gets below. */
.icon-circle-btn{width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface); font-size:14px; position:relative; flex-shrink:0; color:var(--text-2);}
.icon-circle-btn .ico{color:var(--text-2);}
.icon-circle-btn:hover{background:var(--brand); border-color:transparent; color:var(--on-brand);}
.icon-circle-btn:hover .ico{color:var(--on-brand);}
:root[data-theme="dark"] .icon-circle-btn{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.14); color:var(--text);}
:root[data-theme="dark"] .icon-circle-btn .ico{color:var(--text);}
:root[data-theme="dark"] .icon-circle-btn:hover{background:var(--brand);}
:root[data-theme="dark"] .icon-circle-btn:hover .ico{color:var(--on-brand);}
.icon-circle-btn .dot-badge{position:absolute; top:2px; right:2px; width:8px; height:8px; border-radius:50%; background:var(--danger); box-shadow:0 0 0 2px var(--surface);}

/* ---------- Buttons / chips / badges ---------- */
.btn{border:none; border-radius:11px; padding:10px 16px; font-weight:650; font-size:13.5px; transition:transform .08s, opacity .12s, box-shadow .12s; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--brand); color:#fff; box-shadow:0 4px 10px rgba(37,99,235,.25);}
.btn-primary:hover{background:var(--brand-dark);}
.btn-primary:disabled{opacity:.45; cursor:default;}
.btn:disabled{opacity:.45; cursor:default; pointer-events:none;}
.btn-purple{background:var(--purple); color:#fff; box-shadow:0 4px 10px rgba(124,58,237,.25);}
.btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{background:var(--border);}
.btn-danger-ghost{background:var(--danger-soft); color:var(--danger); border:none;}
.btn-sm{padding:6px 12px; font-size:12.5px; border-radius:9px;}
/* Icon buttons need real contrast — on near-black surfaces a subtle grey
   border+fill disappears, so lift the surface and brighten the glyph. */
.btn-icon{width:34px; height:34px; border-radius:10px; border:1px solid var(--border-strong);
  background:var(--surface-3); color:var(--text); font-size:13px; padding:0; justify-content:center;
  transition:background .13s ease, color .13s ease, border-color .13s ease, transform .1s ease;}
.btn-icon .ico{color:var(--text-2);}
.btn-icon:hover{background:var(--brand); border-color:transparent; color:var(--on-brand); transform:translateY(-1px);}
.btn-icon:hover .ico{color:var(--on-brand);}
.btn-icon.danger:hover{background:var(--danger); border-color:transparent; color:#fff;}
.btn-icon.danger:hover .ico{color:#fff;}
:root[data-theme="dark"] .btn-icon{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.14);}
:root[data-theme="dark"] .btn-icon .ico{color:var(--text);}
:root[data-theme="dark"] .btn-icon:hover{background:var(--brand);}
/* the pin keeps its own colour so it stays readable in both states */
.btn-icon.pin-btn:hover{background:var(--warning); border-color:transparent;}
.btn-icon.pin-btn:hover .ico{color:#fff;}

.badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:8px; background:var(--surface-2); color:var(--text-2); white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
.badge.overdue{background:var(--danger-soft); color:var(--danger);}
.badge.today{background:var(--brand-soft); color:var(--brand-dark);}
.badge.success{background:var(--success-soft); color:var(--success);}
.badge.warning{background:var(--warning-soft); color:#B45309;}
.badge.purple{background:var(--purple-soft); color:var(--purple);}
.pill{border-radius:20px; padding:5px 13px; font-size:12px; font-weight:650;}
.pill-ASAP{background:#9E1B1B; color:#fff; letter-spacing:.03em;}
.pill-CAO{background:var(--danger-soft); color:var(--danger);}
.pill-TB{background:var(--warning-soft); color:#B45309;}
.pill-THAP{background:var(--surface-2); color:var(--text-2);}

.avatar{border-radius:50%; flex-shrink:0; object-fit:cover; display:inline-flex; align-items:center; justify-content:center; font-weight:750; color:#fff; box-shadow:0 0 0 2px var(--surface);}

/* ---------- Cards ---------- */
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:2fr 1fr;}
.grid-2e{grid-template-columns:1fr 1fr;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
.card h3{font-size:14px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
.stat-card{border-radius:var(--radius); padding:16px 18px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat-card .stat-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px;}
.stat-card .stat-num{font-size:26px; font-weight:800; letter-spacing:-.02em;}
.stat-card .stat-label{font-size:12px; font-weight:600; opacity:.85;}
.stat-card .stat-link{font-size:11px; font-weight:700; text-decoration:none; opacity:.75;}
.stat-blue{background:linear-gradient(160deg,var(--brand-soft),var(--surface)); color:var(--brand-dark);}
.stat-blue .stat-icon{background:var(--brand); color:#fff;}
.stat-amber{background:linear-gradient(160deg,var(--warning-soft),var(--surface)); color:#B45309;}
.stat-amber .stat-icon{background:var(--warning); color:#fff;}
.stat-green{background:linear-gradient(160deg,var(--success-soft),var(--surface)); color:#15803D;}
.stat-green .stat-icon{background:var(--success); color:#fff;}
.stat-red{background:linear-gradient(160deg,var(--danger-soft),var(--surface)); color:#B91C1C;}
.stat-red .stat-icon{background:var(--danger); color:#fff;}
.mini-progress{height:5px; border-radius:4px; background:rgba(120,120,160,.18); overflow:hidden;}
.mini-progress-fill{height:100%; border-radius:4px;}
.progress-bar{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
.progress-fill{height:100%; border-radius:4px; transition:width .25s;}

/* ---------- Tables ---------- */
.data-table{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.data-table th{text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); background:var(--surface-2); padding:11px 14px; border-bottom:1px solid var(--border);}
.data-table td{padding:12px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--surface-2);}
.table-wrap{overflow-x:auto; border-radius:var(--radius);}

/* ---------- Search / filters ---------- */
.search-box{position:relative; width:100%; max-width:260px;}
.search-input-wrap{display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface-2); border-radius:11px; padding:8px 13px;}
.search-input-wrap input{flex:1; border:none; background:transparent; outline:none; font-size:13px; color:var(--text);}
.search-results{position:absolute; left:0; right:0; top:100%; margin-top:6px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-lg); max-height:320px; overflow-y:auto; z-index:60; display:none;}
.search-box.open .search-results{display:block;}
.search-result-row{display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer;}
.search-result-row:hover{background:var(--surface-2);}
.filter-select{border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:8px 11px; font-size:12.5px; font-weight:600; color:var(--text-2); outline:none;}
.composer-chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); background:var(--surface-2); border-radius:20px; padding:6px 12px; font-size:12px; font-weight:650; color:var(--text-2); cursor:pointer;}
.composer-chip:hover{background:var(--border);}
.composer-chip select,.composer-chip input{border:none; background:transparent; outline:none; font-size:12px; font-weight:650; color:var(--text); cursor:pointer; font-family:inherit; max-width:118px;}
.pill-toggle-row{display:flex; gap:6px; flex-wrap:wrap;}
.pill-toggle{border:1px solid var(--border); background:var(--surface); border-radius:20px; padding:6px 13px; font-size:12px; font-weight:650; color:var(--text-2);}
.pill-toggle.active{background:var(--brand); color:#fff; border-color:transparent;}

/* ---------- Modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(15,17,35,.45); display:flex; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(2px); padding:20px;}
.modal{background:var(--surface); border-radius:20px; width:600px; max-width:96vw; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg); padding:26px 28px;}
.modal.wide{width:720px;}
.modal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.modal-title{font-size:18px; font-weight:750; display:flex; align-items:center; gap:8px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:650; color:var(--text-2); margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%; border:1px solid var(--border); border-radius:10px; padding:9px 12px; outline:none; background:var(--surface-2); color:var(--text);}
.field textarea{resize:vertical; min-height:64px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand); background:var(--surface);}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.close-x{width:30px; height:30px; border-radius:50%; border:none; background:var(--surface-2); font-size:15px; color:var(--text-2);}
.avatar-upload-label{cursor:pointer;}
.avatar-upload-label input{display:none;}
.icon-picker{display:flex; flex-wrap:wrap; gap:6px;}
.icon-picker span{width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:9px; border:1px solid var(--border); font-size:16px; cursor:pointer; background:var(--surface-2);}
.icon-picker span.selected{border-color:var(--brand); background:var(--brand-soft);}
.color-swatch-row{display:flex; gap:8px; flex-wrap:wrap;}
.color-swatch{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
.color-swatch.selected{border-color:var(--text);}

/* ---------- Task list rows ---------- */
.task-list{display:flex; flex-direction:column; gap:8px;}
.task-row-wrap{position:relative;}
.task-row{background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:12px 14px; display:flex; align-items:center; gap:11px; cursor:pointer; transition:box-shadow .12s, border-color .12s;}
.task-row:hover{box-shadow:var(--shadow); border-color:var(--brand);}
.task-check{width:20px; height:20px; border-radius:50%; border:2px solid var(--text-3); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
.task-check.done{background:var(--success); border-color:var(--success);}
.task-title{font-weight:650; font-size:13.6px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.task-title.done{text-decoration:line-through; color:var(--text-3);}
.task-meta{display:flex; gap:7px; align-items:center; flex-shrink:0;}
.status-select{border:none; border-radius:8px; padding:5px 10px; font-size:11.5px; font-weight:700; outline:none; cursor:pointer;}
/* fixed-width columns so project / due / status line up down the list */
.col-project{width:172px; flex-shrink:0; display:flex; justify-content:flex-start; overflow:hidden;}
.col-due{width:132px; flex-shrink:0; display:flex; justify-content:flex-start;}
.col-status{width:116px; flex-shrink:0;}
@media (max-width:1100px){ .col-project{width:120px;} .col-due{width:112px;} .col-status{width:104px;} }
.due-pill{display:inline-block; padding:3px 9px; border-radius:8px; font-size:11px; font-weight:750;
  white-space:nowrap; letter-spacing:.01em;}
.due-time{margin-left:5px; font-weight:800; color:var(--brand);}
.status-Can-lam{background:var(--surface-2); color:var(--text-2);}
.status-Dang-lam{background:#FDF3D0; color:#8A6100;}
:root[data-theme="dark"] .status-Dang-lam{background:rgba(243,196,53,.20); color:#F3C435;}
.status-Hoan-thanh{background:var(--success-soft); color:var(--success);}
/* Pink, and only ever pink — an event is not a stage of work, so it does not
   borrow the to-do/doing/done palette. */
.status-Su-kien{background:#FCE7F3; color:#BE185D;}
:root[data-theme="dark"] .status-Su-kien{background:rgba(236,72,153,.20); color:#F9A8D4;}

.hover-card{display:none; position:absolute; left:0; top:100%; margin-top:6px; width:230px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-lg); padding:12px; z-index:40; cursor:default; max-height:min(340px, 70vh); overflow-y:auto;}
/* flipped variants keep the card on-screen near the viewport edges */
.hover-card.flip-up{top:auto; bottom:100%; margin-top:0; margin-bottom:6px;}
.hover-card.flip-left{left:auto; right:0;}
.task-row-wrap:hover .hover-card{display:block;}
.hover-card-title{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700; margin-bottom:8px; gap:8px;}
.hover-sub{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-2); margin-top:5px;}
.hover-sub.done{color:var(--text-3); text-decoration:line-through;}
.hover-sub-check{width:14px; height:14px; border-radius:50%; border:2px solid var(--text-3); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#fff; cursor:pointer;}
.hover-sub-check:hover{border-color:var(--brand);}
.hover-sub-check.done{background:var(--success); border-color:var(--success);}

/* ---------- Kanban ---------- */
.kanban-wrap{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-items:start;}
.kanban-col{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:12px; min-height:200px;}
.kanban-col-head{display:flex; align-items:center; gap:8px; padding:4px 6px 12px 6px; font-weight:700; font-size:13px;}
.kanban-col-count{margin-left:auto; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:2px 9px; font-size:11.5px; color:var(--text-2);}
.kanban-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:9px; cursor:grab; box-shadow:var(--shadow);}
.kanban-card:hover{border-color:var(--brand);}
.kanban-card-title{font-size:13px; font-weight:650; margin:7px 0;}
.kanban-card-foot{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}

/* ---------- Gantt ---------- */
.gantt-wrap{display:flex; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface);}
.gantt-side{width:220px; flex-shrink:0; border-right:1px solid var(--border);}
.gantt-side-head{height:42px; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 12px; font-size:11px; font-weight:700; color:var(--text-3); text-transform:uppercase;}
.gantt-side-row{height:40px; display:flex; align-items:center; gap:8px; padding:0 12px; border-bottom:1px solid var(--border); cursor:pointer;}
.gantt-scroll{flex:1; overflow-x:auto;}
.gantt-day-head{display:flex; height:42px; border-bottom:1px solid var(--border);}
.gantt-day{flex-shrink:0; width:42px; text-align:center; border-right:1px solid var(--border); font-size:10px; color:var(--text-2); padding-top:5px;}
.gantt-day.today{background:var(--brand-soft); color:var(--brand-dark); font-weight:700;}
.gantt-day .sub{font-size:9px; color:var(--text-3); font-weight:400;}
.gantt-rows{position:relative;}
.gantt-row{height:40px; border-bottom:1px solid var(--border); position:relative;}
.gantt-bar{position:absolute; top:8px; height:24px; border-radius:7px; display:flex; align-items:center; gap:5px; padding:0 8px; font-size:10.5px; font-weight:700; color:#fff; cursor:pointer; overflow:hidden; white-space:nowrap;}
.gantt-today-line{position:absolute; top:0; bottom:0; width:2px; background:var(--purple); z-index:5;}

/* ---------- Gantt: subtasks ----------
   Left column and chart rows must stay the same height or the two halves drift
   apart, so every rule below changes both sides together. */
.gantt-caret{width:16px; height:16px; flex-shrink:0; border:none; background:none; padding:0;
  color:var(--text-3); font-size:10px; line-height:1; cursor:pointer; border-radius:4px;
  transition:transform .14s ease, color .14s ease;}
.gantt-caret:hover{color:var(--brand); background:var(--surface-2);}
.gantt-caret.open{transform:rotate(90deg); color:var(--brand);}
.gantt-caret.placeholder{cursor:default; visibility:hidden;}
.gantt-sub-count{font-size:9.5px; font-weight:700; color:var(--text-3); flex-shrink:0;}

.gantt-side-row.sub,.gantt-row.sub{height:30px;}
.gantt-side-row.sub{padding-left:34px; background:color-mix(in srgb, var(--brand) 3.5%, transparent);}
.gantt-side-row.sub.done .gantt-sub-name{text-decoration:line-through; color:var(--text-3);}
.gantt-sub-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-size:11.5px; font-weight:550; color:var(--text-2);}
.gantt-sub-tick{width:13px; height:13px; flex-shrink:0; border-radius:4px; font-size:9px;
  display:flex; align-items:center; justify-content:center; color:#fff;
  border:1.5px solid var(--border-strong); background:transparent;}
.gantt-sub-tick.on{background:var(--success); border-color:var(--success);}
.gantt-sub-hint{font-size:11px; color:var(--text-3); flex-shrink:0;}
.gantt-row.sub{background:color-mix(in srgb, var(--brand) 3.5%, transparent);}

.gantt-bar.sub{top:6px; height:18px; font-size:9.5px; font-weight:650; opacity:.9;}
.gantt-bar.sub.done{opacity:.5;}
/* Not scheduled on its own — drawn as an outline so it never reads as a real date. */
.gantt-bar.sub.undated{background:transparent !important; color:var(--text-2);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--text-3) 55%, transparent);}
.gantt-bar.sub.late{box-shadow:0 0 0 1.5px var(--danger);}
/* Progress fill inside a parent bar, so a task with subtasks shows how far along it is. */
.gantt-bar-fill{position:absolute; left:0; top:0; bottom:0; background:rgba(255,255,255,.28);
  pointer-events:none; z-index:0;}
.gantt-bar > span{position:relative; z-index:1;}

/* ---------- Hashtags ---------- */
.hashtag-box{display:flex; flex-wrap:wrap; gap:6px; align-items:center; border:1px solid var(--border);
  background:var(--surface-2); border-radius:10px; padding:7px 9px; min-height:42px;}
.hashtag-chip{display:inline-flex; align-items:center; gap:5px; background:var(--purple-soft); color:var(--purple);
  border-radius:20px; padding:4px 10px; font-size:12px; font-weight:700;}
.hashtag-chip button{border:none; background:none; color:inherit; cursor:pointer; font-size:11px; padding:0; line-height:1;}
.hashtag-input-wrap{position:relative; flex:1; min-width:120px;}
.hashtag-input-wrap input{width:100%; border:none; background:transparent; outline:none; font-size:12.5px; padding:3px 2px;}
.hashtag-suggest{display:none; position:absolute; left:0; top:100%; margin-top:5px; z-index:60; min-width:170px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); overflow:hidden;}
.hashtag-suggest.open{display:block;}
.hashtag-suggest button{display:block; width:100%; text-align:left; border:none; background:none; padding:8px 12px;
  font-size:12.5px; font-weight:650; color:var(--purple); cursor:pointer;}
.hashtag-suggest button:hover{background:var(--surface-2);}
.hashtag-mini{display:inline-block; background:var(--purple-soft); color:var(--purple); border-radius:6px;
  padding:1px 6px; font-size:10.5px; font-weight:700; margin-right:4px;}
.search-group{padding:7px 12px 4px; font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--text-3);
  background:var(--surface-2); border-bottom:1px solid var(--border);}
.task-progress{display:flex; align-items:center; gap:7px; margin-top:5px; max-width:320px;}

/* square "+" that lines up with the search box and filters */
.btn-add{width:36px; height:36px; border-radius:10px; border:none; background:var(--brand); color:var(--on-brand);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  box-shadow:0 3px 10px color-mix(in srgb, var(--brand) 35%, transparent); transition:transform .12s ease;}
.btn-add:hover{transform:scale(1.06);}
.page-actions .filter-select,.page-actions .search-input-wrap{height:36px;}
.page-actions .btn-icon{width:36px; height:36px;}
.list-meta{font-size:12px; color:var(--text-3); font-weight:600; margin:0 2px 8px;}

/* subtask editor rows with their own date/time */
.sub-edit-row{display:flex; align-items:center; gap:7px; padding:5px 0; flex-wrap:wrap;}
.sub-edit-title{flex:1; min-width:130px; border:none; background:transparent; padding:2px; outline:none; color:var(--text);}
.sub-edit-when{display:inline-flex; align-items:center; gap:4px; border:1px solid var(--border);
  background:var(--surface-2); border-radius:8px; padding:3px 7px; color:var(--text-3);}
.sub-edit-when input{border:none; background:transparent; outline:none; font-size:11.5px; color:var(--text); width:auto;}
.tt-block.is-sub{opacity:.95;}

/* ---------- Monochrome icon system ---------- */
.ico{display:inline-block; vertical-align:-0.18em; flex-shrink:0;}
.nav-item .dot{display:inline-flex; align-items:center; justify-content:center; width:20px; color:currentColor;}
.page-title-icon{display:inline-flex; align-items:center; color:var(--brand);}
.btn .ico{margin-right:-1px;}
.srch-ico{display:inline-flex; align-items:center; color:var(--text-3);}

/* deadline shown as its own cell, days-left badge sits beside it */
.due-date{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:650;
  color:var(--text-2); white-space:nowrap;}
.due-date.overdue{color:var(--danger);}
.due-date.muted{color:var(--text-3);}
.col-deadline{width:104px; flex-shrink:0; display:flex; justify-content:flex-start;}
/* small deadline chip used on subtask rows */
.sub-due{display:inline-flex; align-items:center; gap:4px; flex-shrink:0; font-size:10.5px; font-weight:700;
  color:var(--text-3); background:var(--surface-2); border-radius:6px; padding:2px 6px; white-space:nowrap;
  text-decoration:none;}
.sub-due.over{color:var(--danger); background:var(--danger-soft);}
.sub-due b{color:var(--brand);}
.hover-sub{gap:6px;}

/* row caret rotates on expand; whole row is the toggle */
.row-caret{display:inline-flex; align-items:center; justify-content:center; width:20px; flex-shrink:0;
  color:var(--text-3); transition:transform .18s ease;}
.row-caret.invisible{opacity:0;}
.task-row.expanded .row-caret,.row-caret.open{transform:rotate(90deg); color:var(--brand);}
.task-row.has-children{cursor:pointer;}

/* work-group picker inside the project modal */
.group-picker{display:flex; gap:8px; flex-wrap:wrap;}
.group-opt{display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:10px;
  border:1.5px solid var(--border); background:var(--surface-2); color:var(--text-2);
  font-size:12.5px; font-weight:700; cursor:pointer; transition:all .14s ease;}
.group-opt:hover{border-color:var(--gc); color:var(--gc);}
.group-opt.active{border-color:var(--gc); color:#fff; background:var(--gc);}

/* pinned rows */
.pin-btn{color:var(--text-3); flex-shrink:0;}
.pin-btn:hover{color:var(--warning);}
.pin-btn.pinned{color:var(--warning);}
.task-row.pinned-row{border-color:color-mix(in srgb, var(--warning) 45%, var(--border));
  box-shadow:inset 3px 0 0 var(--warning), var(--shadow);}

/* ---------- Floating dock: ⋯ button + radial group picker ---------- */
.fab-dock{position:fixed; right:24px; bottom:24px; z-index:120; width:58px; height:58px;}
.fab-composer{position:absolute; inset:0; width:58px; height:58px; border-radius:50%; border:none;
  background:linear-gradient(140deg, var(--brand), var(--purple)); color:var(--on-brand); font-size:26px;
  font-weight:800; line-height:1; letter-spacing:1px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 24px color-mix(in srgb, var(--brand) 45%, transparent), var(--shadow);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;}
.fab-composer:hover{transform:scale(1.06);}
.fab-dock.open .fab-composer{transform:rotate(90deg) scale(1.04);}

/* Orbs sit on a quarter-circle arc sweeping up-and-left from the button. */
.fab-arc{position:absolute; inset:0; pointer-events:none;}
/* Orbs start collapsed under the ⋯ button and spring outwards one after the
   other (top → bottom). Closing reverses the order so they fold back in. */
.fab-orb{position:absolute; left:3px; top:3px; width:52px; height:52px; border-radius:50%; border:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; cursor:pointer;
  background:var(--surface); color:var(--text); border:1.5px solid var(--border);
  box-shadow:var(--shadow-lg); opacity:0; transform:translate(0,0) scale(.25);
  pointer-events:none;
  transition:transform .42s cubic-bezier(.34,1.46,.5,1), opacity .22s ease, border-color .15s ease;
  transition-delay:calc((3 - var(--i)) * 45ms);}   /* reversed while closing */
.fab-dock.open .fab-orb{opacity:1; pointer-events:auto; transition-delay:calc(var(--i) * 65ms);}
.fab-dock.open .fab-arc{pointer-events:auto;}
/* All four orbs sit on ONE circle of radius 122px centred on the ⋯ button,
   evenly spaced every 30° from straight-up (90°) round to straight-left (180°). */
.fab-dock.open .fab-orb[data-orb="today"]{transform:translate(0px,    -122px) scale(1);} /*  90° */
.fab-dock.open .fab-orb[data-orb="work"] {transform:translate(-61px,  -106px) scale(1);} /* 120° */
.fab-dock.open .fab-orb[data-orb="sport"]{transform:translate(-106px, -61px)  scale(1);} /* 150° */
.fab-dock.open .fab-orb[data-orb="life"] {transform:translate(-122px, 0px)    scale(1);} /* 180° */
.fab-orb:hover{border-color:var(--brand);}
.fab-orb .orb-icon{font-size:19px; line-height:1;}
.fab-orb .orb-label{font-size:8.5px; font-weight:800; letter-spacing:.02em; text-transform:uppercase;}
.fab-orb.orb-today{background:linear-gradient(140deg,var(--brand),var(--purple)); color:var(--on-brand); border-color:transparent;}
.fab-orb.orb-work.active{background:#006454; color:#FFFDF8; border-color:transparent;}
.fab-orb.orb-sport.active{background:#F4622E; color:#fff; border-color:transparent;}
.fab-orb.orb-life.active{background:#118C8C; color:#fff; border-color:transparent;}

.composer-pop{position:fixed; right:24px; bottom:96px; z-index:121; width:min(560px, calc(100vw - 40px));
  background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg);
  padding:14px 16px 16px; animation:popIn .16s ease;}
.composer-pop[hidden]{display:none;}
.composer-pop-head{display:flex; align-items:center; justify-content:space-between; font-size:13.5px;
  font-weight:750; margin-bottom:10px;}
.composer-pop .card{border:none; box-shadow:none; padding:0; background:transparent;}
@keyframes popIn{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;}}

/* Active-group indicator in the sidebar */
.group-chip{display:flex; align-items:center; gap:7px; margin:8px 2px 4px; padding:7px 10px; border-radius:11px;
  background:var(--brand-soft); color:var(--brand-dark); font-size:11.5px; font-weight:800;}
.group-chip button{margin-left:auto; border:none; background:none; color:inherit; cursor:pointer; font-size:12px;}

/* ---------- Dashboard widget grid ---------- */
.dash-grid{display:grid; grid-template-columns:repeat(12,1fr); gap:16px; align-items:start;}
.dash-widget{position:relative; min-width:0;}
.dash-widget .card{height:100%;}
.dash-card{display:flex; flex-direction:column; overflow:hidden;}
.dash-card-body{flex:1; min-height:0; overflow:auto;}
.dash-grid.editing .dash-widget{outline:1.5px dashed var(--border); outline-offset:3px; border-radius:var(--radius);}
.dash-grid.editing .dash-widget:hover{outline-color:var(--brand);}
.dash-widget.dragging{opacity:.45;}
.dash-widget.drop-target{outline:2px solid var(--brand); outline-offset:3px;}
.dash-handle{display:flex; align-items:center; gap:8px; background:var(--brand-soft); color:var(--brand-dark);
  border-radius:9px; padding:5px 10px; font-size:11.5px; font-weight:700; margin-bottom:6px; cursor:grab;}
.dash-hide{border:none; background:transparent; color:var(--danger); font-size:12px; font-weight:800; cursor:pointer; padding:0 2px;}
.dash-resize{position:absolute; right:-3px; bottom:-3px; width:16px; height:16px; cursor:nwse-resize;
  background:linear-gradient(135deg, transparent 45%, var(--brand) 45%, var(--brand) 62%, transparent 62%);
  border-radius:0 0 6px 0; z-index:5;}
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
@media (max-width:960px){ .stat-row{grid-template-columns:repeat(2,1fr);} }

/* ---------- Dashboard mini month calendar ---------- */
/* The month title and the weekday row are one pinned block: scrolling the
   dates must never take the "which month am I in" away with it. */
.dash-cal-nav{
  position:sticky; top:0; z-index:4;
  display:flex; align-items:center; gap:7px;
  padding:1px 0 6px; margin-bottom:2px; background:var(--surface);
}
.dash-cal-nav b{font-size:12px;}
.dash-cal{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
/* The weekday row stays put while the month scrolls under it — a date is
   meaningless if you have to scroll back up to see which column it is in. */
.dash-cal-head{
  /* Parks directly under the pinned month row rather than at the scroll box's
     own top, which would put it behind that row. 40px is that row's measured
     height (24px button + its padding). */
  position:sticky; top:40px; z-index:3;
  text-align:center; font-size:9px; font-weight:800; color:var(--text-3);
  padding:2px 0 4px; background:var(--surface);
  box-shadow:0 1px 0 var(--border);
}
/* Cells are wider than tall: a month then fits without the widget having to
   grow, and the numbers still have room to breathe. */
.dash-cal-cell{position:relative; aspect-ratio:auto; min-height:26px;
  display:flex; align-items:center; justify-content:center;
  font-size:10.5px; border-radius:6px; cursor:pointer; color:var(--text-2);}
.dash-cal-cell:hover{background:var(--surface-2);}
.dash-cal-cell.dim{opacity:.35;}
.dash-cal-cell.today{background:var(--brand); color:#fff; font-weight:800;}
.dash-cal-dot{position:absolute; bottom:4px; width:5px; height:5px; border-radius:50%;}
.dash-cal-cell.today .dash-cal-dot{background:#fff !important;}

/* Heatmap: density of work per day, built from --brand so every palette and
   both themes get their own ramp for free. Darker = busier. */
.dash-cal-cell.heat-1{background:color-mix(in srgb, var(--brand) 12%, transparent);}
.dash-cal-cell.heat-2{background:color-mix(in srgb, var(--brand) 26%, transparent);}
.dash-cal-cell.heat-3{background:color-mix(in srgb, var(--brand) 44%, transparent); color:var(--text); font-weight:700;}
.dash-cal-cell.heat-4{background:color-mix(in srgb, var(--brand) 66%, transparent); color:var(--on-brand,#fff); font-weight:800;}
/* A day carrying overdue work is called out by outline, not by hue, so the
   density reading stays intact. */
.dash-cal-cell.heat-late{box-shadow:inset 0 0 0 1.5px var(--danger);}
/* Today outranks its own heat level — knowing where you are beats knowing how
   busy the day is, and the ring would fight the solid fill. */
.dash-cal-cell.today{background:var(--brand); color:#fff; font-weight:800; box-shadow:none;}
.dash-cal-cell.heat-1:hover,.dash-cal-cell.heat-2:hover,
.dash-cal-cell.heat-3:hover,.dash-cal-cell.heat-4:hover{filter:brightness(1.08);}

/* The widget body scrolls when the month is tall, so the key is pinned to its
   floor — a legend you have to scroll to find is not a legend. */
.dash-cal-legend{display:flex; align-items:center; gap:5px; flex-wrap:wrap;
  position:sticky; bottom:0; z-index:2; margin-top:9px; padding:7px 0 1px;
  font-size:9.5px; color:var(--text-3);
  background:var(--surface); border-top:1px solid var(--border);}
.dash-cal-key{width:11px; height:11px; border-radius:3px; flex-shrink:0;
  background:color-mix(in srgb, var(--text-3) 14%, transparent);}
.dash-cal-legend .dash-cal-key.heat-1{background:color-mix(in srgb, var(--brand) 12%, transparent);}
.dash-cal-legend .dash-cal-key.heat-2{background:color-mix(in srgb, var(--brand) 26%, transparent);}
.dash-cal-legend .dash-cal-key.heat-3{background:color-mix(in srgb, var(--brand) 44%, transparent);}
.dash-cal-legend .dash-cal-key.heat-4{background:color-mix(in srgb, var(--brand) 66%, transparent);}
.dash-cal-legend .dash-cal-key.heat-late{background:transparent; box-shadow:inset 0 0 0 1.5px var(--danger);}

/* ---------- Standup / auto report widget ---------- */
.su-toolbar{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
.su-tabs{display:flex; gap:3px; background:var(--surface-2); border-radius:9px; padding:3px;}
.su-tab{border:none; background:none; color:var(--text-2); font-size:11.5px; font-weight:650;
  padding:5px 11px; border-radius:7px; cursor:pointer; transition:background .13s, color .13s;}
.su-tab:hover{color:var(--text);}
.su-tab.active{background:var(--surface); color:var(--brand); box-shadow:var(--shadow-sm);}
.su-period{font-size:10.5px; color:var(--text-3); font-weight:600; margin-bottom:7px; text-transform:capitalize;}
.su-headline{font-size:13px; line-height:1.5; color:var(--text); margin-bottom:12px;
  padding:10px 12px; border-radius:11px; background:color-mix(in srgb, var(--brand) 7%, transparent);
  border-left:3px solid var(--brand);}
.su-headline b{color:var(--brand); font-weight:800;}

.su-metrics{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:14px;}
.su-metric{text-align:center; padding:8px 4px; border-radius:10px; background:var(--surface-2);}
.su-metric b{display:block; font-size:18px; font-weight:750; letter-spacing:-.02em; color:var(--text);}
.su-metric span{font-size:9.5px; color:var(--text-3); font-weight:600;}
.su-metric.bad b{color:var(--danger);}

.su-section{margin-bottom:12px;}
.su-head{font-size:11px; font-weight:700; color:var(--text-2); margin-bottom:6px;
  display:flex; align-items:center; gap:6px;}
.su-head.bad{color:var(--danger);}
.su-head em{font-style:normal; font-size:9.5px; font-weight:700; color:var(--text-3);
  background:var(--surface-2); border-radius:20px; padding:1px 7px;}
.su-line{display:flex; align-items:center; gap:7px; padding:4px 0; min-width:0;}
.su-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
.su-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-size:12px; color:var(--text);}
.su-proj{font-size:10px; font-weight:650; color:var(--text-3); flex-shrink:0;
  max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.su-more{font-size:10.5px; color:var(--text-3); padding:3px 0 0 13px; font-style:italic;}

/* ---------- Digital clock ---------- */
.dash-clock{display:flex; flex-direction:column; align-items:flex-end; line-height:1.15; padding:4px 12px;
  border:1px solid var(--border); border-radius:11px; background:var(--surface-2);}
.dash-clock-time{font-size:17px; font-weight:800; letter-spacing:.5px; font-variant-numeric:tabular-nums; color:var(--brand);}
.dash-clock-date{font-size:10px; color:var(--text-3); font-weight:600;}
.dash-weather{display:flex; align-items:center; gap:4px; margin-top:3px; padding-top:3px;
  border-top:1px solid var(--border); width:100%; justify-content:flex-end;}
.dash-weather[hidden]{display:none;}
.dash-weather b{font-size:12px; line-height:1;}
.dash-weather span{font-size:9.5px; font-weight:650; color:var(--text-2); white-space:nowrap;}

/* ---------- Timetable ---------- */
/* The WRAP scrolls, not the body, and the header rides along stuck to its top.
   When the body scrolled instead, its scrollbar took ~9px out of the seven
   columns while the header — which does not scroll — kept the full width. That
   is 1.28px of extra width per day head, so by Sunday the label sat 8px right
   of its own column. One scroll container means one width for both, and the
   drift cannot exist. */
.tt-wrap{border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden auto; max-height:calc(100vh - 260px); background:var(--surface);}
.tt-headrow{display:flex; border-bottom:1px solid var(--border); background:var(--surface-2);
  position:sticky; top:0; z-index:6;}
.tt-corner{width:62px; flex-shrink:0; border-right:1px solid var(--border);}
.tt-dayhead{flex:1; text-align:center; padding:10px 4px 9px; border-right:1px solid var(--border);
  color:var(--text-2); cursor:pointer; position:relative; min-width:0;}
/* Seven columns in a phone's width leave ~42px each, where "Thứ Hai" cannot
   fit and every heading was being clipped mid-word. Below the app's mobile
   breakpoint the narrow form (T2…CN) takes over. */
.tt-dayname b{font-weight:inherit;}
.tt-dayname i{display:none; font-style:normal;}
@media (max-width:699px){
  .tt-dayname b{display:none;}
  .tt-dayname i{display:inline;}
}
.tt-dayname{font-size:12px; font-weight:600; color:var(--text-2); text-transform:capitalize;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tt-daydate{font-size:12px; font-weight:800; color:var(--text); margin-top:1px; letter-spacing:-.01em;}
.tt-dayhead.today .tt-dayname,.tt-dayhead.today .tt-daydate{color:var(--brand-dark);}
.tt-day-badge{position:absolute; top:5px; right:6px; min-width:15px; height:15px; padding:0 4px; border-radius:8px;
  background:var(--brand); color:var(--on-brand); font-size:9px; font-weight:800;
  display:inline-flex; align-items:center; justify-content:center;}
/* today's column gets a soft vertical band running the full height */
.tt-daycol.is-today{background:
  repeating-linear-gradient(135deg, transparent 0 9px, color-mix(in srgb, var(--brand) 5%, transparent) 9px 18px),
  color-mix(in srgb, var(--brand) 6%, transparent);}
.tt-dayhead.today{background:color-mix(in srgb, var(--brand) 8%, transparent);}
.tt-dayhead:last-child{border-right:none;}
.tt-dayhead.today{background:var(--brand-soft); color:var(--brand-dark);}
.tt-body{display:flex; position:relative;}   /* scrolling moved to .tt-wrap */
.tt-hours{width:62px; flex-shrink:0; border-right:1px solid var(--border);}
.tt-hourlabel{font-size:10.5px; color:var(--text-3); text-align:right; padding:2px 7px 0 0; border-bottom:1px solid var(--border); box-sizing:border-box;}
.tt-daycol{flex:1; position:relative; border-right:1px solid var(--border); min-width:0;}
.tt-daycol:last-child{border-right:none;}
.tt-hourcell{border-bottom:1px solid var(--border); box-sizing:border-box; cursor:pointer;}
.tt-hourcell:hover{background:var(--surface-2);}
/* Timetable cards: solid colour fill, white content, header strip with an
   overlapping avatar stack + count, and a darker progress bar pinned to the
   bottom edge. Colours come from the existing project/priority palette. */
.tt-block{position:absolute; border-radius:12px; padding:7px 8px 10px; overflow:hidden; cursor:pointer; z-index:2;
  box-sizing:border-box; border:none; background:var(--tint); color:#fff;
  display:flex; flex-direction:column; gap:4px;
  box-shadow:0 3px 10px color-mix(in srgb, var(--tint) 38%, transparent);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;}
.tt-block:hover{z-index:20; overflow:visible; transform:translateY(-2px); filter:brightness(1.06);
  box-shadow:0 8px 20px color-mix(in srgb, var(--tint) 50%, transparent);}
.tt-block.is-sub{outline:1.5px dashed rgba(255,255,255,.55); outline-offset:-4px;}
.tt-block.running{box-shadow:0 0 0 2px #fff, 0 3px 12px color-mix(in srgb, var(--tint) 55%, transparent);}
.tt-block.is-done{opacity:.5;}

.tt-head{display:flex; align-items:center; gap:5px; flex-shrink:0; min-height:18px;}
.tt-head-ico{display:inline-flex; align-items:center; color:rgba(255,255,255,.92); flex-shrink:0;}
.tt-avatars{display:inline-flex; align-items:center; margin-left:2px;}
.tt-avatars .avatar{margin-left:-6px; box-shadow:0 0 0 1.5px var(--tint);}
.tt-avatars .avatar:first-child{margin-left:0;}
.tt-count{margin-left:auto; min-width:17px; height:17px; padding:0 4px; border-radius:9px; flex-shrink:0;
  background:rgba(255,255,255,.24); color:#fff; font-size:9.5px; font-weight:800;
  display:inline-flex; align-items:center; justify-content:center;}

/* Named for the block it belongs to, NOT `.tt-body` — that name is already the
   week grid's, and this rule sits later in the sheet, so it was winning for
   both. The grid became `flex-direction:column` and stacked all seven days on
   top of each other instead of side by side. Two different things cannot share
   one class name when they want opposite layouts. */
.tt-block-body{flex:1; min-height:0; display:flex; flex-direction:column; gap:1px; overflow:hidden;}
/* Short cards: the NAME survives, the avatars go.
   A half-hour task is 24px tall. Take 19px of padding and an 18px avatar row
   that refuses to shrink, and the title is left with zero height — the card
   showed a row of faces and no indication of what the task was. On a card this
   size the one thing worth the space is what it is; who it belongs to is a
   hover or a click away. */
/* Events read as one continuous ribbon rather than a work card: no progress
   bar to fill in, and a dashed edge on whichever end was cut by midnight. */
.tt-block.is-event .tt-progress{display:none;}
.tt-block.is-event{border:1.5px solid rgba(255,255,255,.35);}
.tt-block.is-compact{padding:3px 8px 7px;}
.tt-block.is-compact .tt-head{display:none;}
.tt-block.is-compact .tt-block-title{
  font-size:10.5px; line-height:1.2; -webkit-line-clamp:1;}
.tt-block-title{font-size:11.5px; font-weight:700; color:#fff; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; word-break:break-word; line-height:1.28;}
.tt-block-title.done{text-decoration:line-through;}
.tt-time{font-size:9.5px; font-weight:700; color:rgba(255,255,255,.8); white-space:nowrap; margin-top:2px;}
.tt-time i{font-style:normal; opacity:.7; margin:0 1px;}
.tt-left-label{position:absolute; right:8px; bottom:9px; font-size:9px; font-weight:800; color:#fff;
  background:rgba(0,0,0,.22); border-radius:6px; padding:1px 5px;}
/* progress bar sits flush on the bottom edge, in a darker shade of the card */
.tt-progress{position:absolute; left:0; right:0; bottom:0; height:6px;
  background:color-mix(in srgb, var(--tint) 62%, #000);}
.tt-progress i{display:block; height:100%; background:rgba(255,255,255,.55); transition:width .35s ease;}

/* Sectioned detail modal + action grid, after the reference panel */
.modal-section-label{display:flex; align-items:center; gap:7px; font-size:10.5px; font-weight:800;
  letter-spacing:.07em; color:var(--text-3); margin:18px 0 9px; padding-top:14px;
  border-top:1px solid var(--border);}
.action-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.action-item{display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:10px;
  border:1px solid transparent; background:transparent; color:var(--text); font-size:12.8px;
  font-weight:600; cursor:pointer; text-align:left; transition:background .12s ease;}
.action-item:hover{background:var(--surface-2); border-color:var(--border);}
.action-item .ico{color:var(--text-2);}
.action-item.danger{color:var(--danger);}
.action-item.danger .ico{color:var(--danger);}
.action-item.danger:hover{background:var(--danger-soft); border-color:transparent;}
@media (max-width:699px){ .action-grid{grid-template-columns:1fr;} }
/* one line across the whole grid, dot anchored in the hour gutter */
.tt-nowline{position:absolute; left:0; right:0; height:2px; background:var(--brand); z-index:15; pointer-events:none;}
.tt-now-dot{position:absolute; left:56px; top:-4px; width:10px; height:10px; border-radius:50%;
  background:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent);}
.tt-now-time{position:absolute; left:4px; top:-8px; font-size:10px; font-weight:800; color:var(--brand);
  background:var(--surface); padding:0 3px; border-radius:4px;}

/* ---------- Calendar month ---------- */
.cal-month-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:minmax(96px,auto);
  border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface);}
.cal-month-head{padding:9px 4px; text-align:center; font-size:11.5px; font-weight:700; color:var(--text-2); background:var(--surface-2); border-bottom:1px solid var(--border);}
.cal-month-cell{min-height:96px; border-top:1px solid var(--border); border-left:1px solid var(--border); padding:6px; position:relative;}
.cal-month-cell.other-month{background:var(--surface-2); opacity:.5;}
.cal-month-cell.today .cal-day-num{background:var(--brand); color:#fff; border-radius:50%; width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;}
.cal-day-num{font-size:11.5px; font-weight:700; color:var(--text-2);}
/* Cells share one height per row (grid default) and only the row grows when a
   day has many tasks; titles wrap instead of being clipped. */
.cal-pill-stack{display:flex; flex-direction:column; gap:3px; margin-top:4px;}
/* Title takes the room it needs; the ring is pinned to the far right so the
   column of rings reads as its own little progress gutter down the day. */
.cal-pill{border-radius:6px; padding:3px 6px; font-size:10px; font-weight:650; color:#fff; cursor:pointer;
  white-space:normal; word-break:break-word; line-height:1.25;
  display:flex; align-items:center; gap:5px;}
.cal-pill-text{flex:1; min-width:0;}
.cal-pill .prog-ring{flex-shrink:0; align-self:flex-start; margin-top:1px;}

/* ---------- progress ring ---------- */
.prog-ring{display:block;}
.prog-ring-track{stroke:currentColor; opacity:.28;}
.prog-ring-bar{stroke:currentColor; transition:stroke-dashoffset .35s cubic-bezier(.22,.61,.36,1);}
.prog-ring.full .prog-ring-bar{stroke:currentColor;}
/* On a coloured pill the ring is white-on-colour; elsewhere it takes the tone
   of whatever text it sits beside. */
.cal-pill .prog-ring-track,.cal-pill .prog-ring-bar{stroke:#fff;}
.cal-pill .prog-ring-track{opacity:.35;}
/* A phone-width month cell is about 50px across. An inline ring would leave
   roughly one character for the title, so down here it moves into the pill's
   corner and costs no inline width at all. */
@media (max-width:699px){
  .cal-pill{position:relative; display:block; padding-right:14px;}
  .cal-pill .prog-ring{position:absolute; top:2px; right:2px; width:10px; height:10px; margin:0;}
}

/* ---------- Charts ---------- */
.bar-chart{display:flex; align-items:flex-end; gap:12px; height:150px; padding-top:14px; overflow-x:auto;}
.bar-col{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:34px; height:100%; justify-content:flex-end;}
.bar-fill{width:26px; border-radius:6px 6px 3px 3px; transition:height .3s;}
.bar-label{font-size:10px; color:var(--text-2); text-align:center; max-width:50px;}
.chart-legend{display:flex; gap:14px; margin-top:12px; flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-2);}
.legend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.hbar-row{display:flex; align-items:center; gap:10px; margin-bottom:11px;}
.hbar-label{width:100px; font-size:12px; color:var(--text-2); flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hbar-track{flex:1; height:10px; border-radius:6px; background:var(--surface-2); overflow:hidden; display:flex;}
.hbar-fill{height:100%;}
.hbar-value{width:34px; text-align:right; font-size:11.5px; font-weight:700; flex-shrink:0;}

.typing{display:flex; gap:4px; padding:4px 0;}
.typing span{width:6px; height:6px; border-radius:50%; background:var(--text-3); animation:blink 1.1s infinite;}
.typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
@keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

.empty-state{text-align:center; padding:46px 20px; color:var(--text-3);}
.empty-state .glyph{font-size:30px; margin-bottom:10px;}

.settings-layout{display:flex; gap:20px; align-items:flex-start;}
.settings-nav{width:210px; flex-shrink:0; display:flex; flex-direction:column; gap:2px;}
.settings-nav button{text-align:left; border:none; background:none; padding:9px 12px; border-radius:10px; font-size:13px; font-weight:600; color:var(--text-2);}
.settings-nav button.active{background:var(--brand-soft); color:var(--brand-dark);}
.settings-panel{flex:1; min-width:0;}

/* =========================================================
   NOTES
   Three columns on desktop (rail · content · details), two on
   tablet, one on mobile. Reuses the card/shadow/radius language
   of the rest of the app rather than introducing a new one.
   ========================================================= */
.notes-layout{display:flex; gap:20px; align-items:flex-start;}
.notes-main{flex:1; min-width:0;}
.notes-rail{width:212px; flex-shrink:0;}
.notes-rail-group{display:flex; flex-direction:column; gap:2px; margin-bottom:6px;}
.notes-rail-item{display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  border:none; background:none; padding:8px 10px; border-radius:10px; cursor:pointer;
  font-size:13px; font-weight:600; color:var(--text-2); transition:background .12s, color .12s;}
.notes-rail-item:hover{background:var(--surface-2); color:var(--text);}
.notes-rail-item.active{background:var(--brand-soft); color:var(--brand-dark);}
.notes-rail-item span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.notes-rail-item em{font-style:normal; font-size:11px; font-weight:700; color:var(--text-3);}
.notes-rail-item.active em{color:var(--brand-dark);}
.notes-rail-label{display:flex; align-items:center; font-size:10.5px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); padding:12px 10px 6px;}
.notes-rail-label button{margin-left:auto; border:none; background:none; color:var(--text-3);
  cursor:pointer; display:inline-flex; padding:2px; border-radius:5px;}
.notes-rail-label button:hover{color:var(--brand); background:var(--surface-2);}
.notes-rail-hint{font-size:11.5px; color:var(--text-3); padding:4px 10px 8px;}

/* A <button> does not inherit `color` — the UA gives it `buttontext`, which is
   black and unreadable on the dark surfaces. Every button used as a container
   here has to state its colour explicitly. */
.note-card,.template-card,.picker-row,.linked-main,.version-row,.md-tool,
.note-panel-toggle,.dash-note-row,.notes-rail-item,.note-menu-item{color:var(--text);}

.note-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px;}
.note-card{display:flex; flex-direction:column; gap:7px; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:15px 16px; box-shadow:var(--shadow); min-width:0;
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;}
.note-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--brand);}
.note-card-head{display:flex; align-items:center; gap:8px; color:var(--text-2);}
.note-card-title{flex:1; min-width:0; font-size:13.8px; font-weight:700; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.note-fav{color:var(--warning); display:inline-flex;}
.note-card-preview{font-size:12.3px; color:var(--text-2); line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; min-height:2.4em;}
.note-card-tags{display:flex; flex-wrap:wrap; gap:4px;}
.note-card-meta{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:auto;
  padding-top:8px; border-top:1px solid var(--border);}
.note-meta-chip{display:inline-flex; align-items:center; gap:4px; font-size:11px;
  font-weight:650; color:var(--text-2); min-width:0;}
.note-meta-time{margin-left:auto; font-size:10.5px; color:var(--text-3); white-space:nowrap;}

.template-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr)); gap:14px;}
.template-card{text-align:left; cursor:pointer; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius); padding:16px;
  display:flex; flex-direction:column; gap:9px; box-shadow:var(--shadow);
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;}
.template-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--brand);}
.template-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center;
  justify-content:center; background:var(--brand-soft); color:var(--brand-dark);}
.template-name{font-size:13.5px; font-weight:700;}
.template-outline{list-style:none; display:flex; flex-direction:column; gap:3px;
  font-size:11.5px; color:var(--text-3);}
.template-outline.empty{font-style:italic;}

.note-editor-layout{display:flex; gap:20px; align-items:flex-start;}
.note-editor-main{flex:1; min-width:0;}
.note-side{width:330px; flex-shrink:0; display:flex; flex-direction:column; gap:14px;}
.note-editor-head{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.note-editor-actions{margin-left:auto; display:flex; align-items:center; gap:8px;}
.note-save-state{display:inline-flex; align-items:center; gap:4px; font-size:11.5px;
  color:var(--text-3); font-weight:600; transition:color .2s ease;}
.note-save-state.saving{color:var(--warning);}
.note-save-state.saved{color:var(--success); animation:savePop 260ms ease;}
@keyframes savePop{ 0%{transform:scale(.9); opacity:0;} 100%{transform:none; opacity:1;} }
.btn-icon.pinned{color:var(--warning); border-color:color-mix(in srgb, var(--warning) 45%, var(--border));}

.note-title-input{width:100%; border:none; background:transparent; outline:none;
  font-size:26px; font-weight:800; letter-spacing:-.02em; color:var(--text);
  padding:2px 0 10px; font-family:inherit;}
.note-title-input::placeholder{color:var(--text-3);}

.md-editor{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);
  overflow:hidden; box-shadow:var(--shadow);}
.md-toolbar{display:flex; align-items:center; gap:2px; flex-wrap:wrap; padding:7px 9px;
  border-bottom:1px solid var(--border); background:var(--surface-2);}
.md-tool{min-width:29px; height:29px; padding:0 7px; border:none; background:none; cursor:pointer;
  border-radius:7px; font-size:12.5px; font-weight:700; color:var(--text-2);
  display:inline-flex; align-items:center; justify-content:center; transition:background .12s, color .12s;}
.md-tool:hover:not(:disabled){background:var(--surface-3); color:var(--text);}
.md-tool:disabled{opacity:.35; cursor:default;}
/* ---------- colour + highlight pickers ---------- */
.md-swatch-wrap{position:relative; display:inline-flex;}
.md-tool-color{flex-direction:column; gap:1px; padding:0 6px;}
.md-swatch-bar{display:block; width:15px; height:3px; border-radius:2px; background:var(--text-3);}
.md-palette{position:absolute; left:0; top:100%; margin-top:6px; z-index:80;
  display:grid; grid-template-columns:repeat(5,1fr); gap:5px; padding:7px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  box-shadow:var(--shadow-lg); animation:popIn .13s ease;}
.md-palette[hidden]{display:none;}
.md-swatch{width:20px; height:20px; border-radius:6px; cursor:pointer;
  border:1px solid rgba(120,120,150,.28); padding:0;}
.md-swatch:hover{transform:scale(1.12);}
/* "no colour" reads as a crossed-out chip rather than an empty hole. */
.md-swatch.none{background:
  linear-gradient(45deg, transparent 44%, var(--danger) 44%, var(--danger) 56%, transparent 56%),
  var(--surface-2);}

/* Coloured runs. A highlight pins its text to a dark ink: the pale tints stay
   pale in dark mode, and inheriting the near-white body colour there would make
   the text unreadable on its own highlight. */
.md-fg{transition:color .12s ease;}
.md-bg{border-radius:4px; padding:0 3px; color:#1F2430;}
.md-bg .md-fg,.md-fg .md-bg{color:inherit;}

.md-mode{margin-left:auto; display:flex; gap:2px; background:var(--surface-3); border-radius:8px; padding:2px;}
.md-mode button{border:none; background:none; cursor:pointer; padding:4px 11px; border-radius:6px;
  font-size:11.5px; font-weight:700; color:var(--text-2);}
.md-mode button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}
.md-input{width:100%; min-height:420px; border:none; outline:none; resize:vertical;
  padding:18px 20px; background:transparent; color:var(--text); display:block;
  font-family:'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
  font-size:13.2px; line-height:1.72;}
.md-preview{padding:18px 20px; min-height:420px;}
/* The WYSIWYG surface. It reuses the rendered-markdown styles below, so what
   is typed here looks exactly like the saved note. */
.md-rich{padding:18px 20px; min-height:420px; outline:none; color:var(--text);
  font-size:14px; line-height:1.72;}
.md-rich:empty::before,.md-rich > br:only-child::before{content:attr(data-placeholder); color:var(--text-3);}
.md-rich > * + *{margin-top:.85em;}
.md-rich h1{font-size:23px; font-weight:800; letter-spacing:-.02em;}
.md-rich h2{font-size:18.5px; font-weight:750; letter-spacing:-.01em;}
.md-rich h3{font-size:15.5px; font-weight:700;}
.md-rich h1,.md-rich h2,.md-rich h3{margin-top:1.3em;}
.md-rich > h1:first-child,.md-rich > h2:first-child,.md-rich > h3:first-child{margin-top:0;}
.md-rich ul,.md-rich ol{padding-left:1.35em; display:flex; flex-direction:column; gap:.3em;}
.md-rich ul{list-style:disc;} .md-rich ol{list-style:decimal;}
.md-rich ul.md-tasklist{list-style:none; padding-left:0;}
.md-rich li.md-task{display:flex; align-items:flex-start; gap:9px;}
.md-rich blockquote{border-left:3px solid var(--brand); padding:2px 0 2px 14px; color:var(--text-2);}
.md-rich hr{border:none; border-top:1px solid var(--border); margin:1.4em 0;}
.md-rich a{color:var(--brand); text-decoration:underline; text-underline-offset:2px;}
.md-rich pre{background:var(--surface-3); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; overflow-x:auto; font-size:12.5px; line-height:1.6;
  font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;}
.md-rich code{background:var(--surface-3); border-radius:5px; padding:1px 5px; font-size:.9em;
  font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;}
.md-rich .md-checkbox{cursor:pointer;}

.md-body{font-size:14px; line-height:1.72; color:var(--text);}
.md-body > * + *{margin-top:.85em;}
.md-body h1{font-size:23px; font-weight:800; letter-spacing:-.02em;}
.md-body h2{font-size:18.5px; font-weight:750; letter-spacing:-.01em;}
.md-body h3{font-size:15.5px; font-weight:700;}
.md-body h1,.md-body h2,.md-body h3{margin-top:1.3em;}
.md-body > h1:first-child,.md-body > h2:first-child,.md-body > h3:first-child{margin-top:0;}
.md-body ul,.md-body ol{padding-left:1.35em; display:flex; flex-direction:column; gap:.3em;}
.md-body ul{list-style:disc;} .md-body ol{list-style:decimal;}
.md-body ul.md-tasklist{list-style:none; padding-left:0;}
.md-body li.md-task{display:flex; align-items:flex-start; gap:9px;}
.md-checkbox{width:17px; height:17px; flex-shrink:0; margin-top:2px; border-radius:5px;
  border:1.8px solid var(--text-3); background:transparent; color:#fff; cursor:pointer;
  font-size:11px; line-height:1; display:inline-flex; align-items:center; justify-content:center;
  transition:background .14s ease, border-color .14s ease;}
.md-checkbox:hover:not(:disabled){border-color:var(--brand);}
.md-checkbox.done{background:var(--success); border-color:var(--success);}
.md-checkbox:disabled{cursor:default;}
.md-task-done{color:var(--text-3); text-decoration:line-through;}
.md-body blockquote{border-left:3px solid var(--brand); padding:2px 0 2px 14px; color:var(--text-2);}
.md-body hr{border:none; border-top:1px solid var(--border); margin:1.4em 0;}
.md-body a{color:var(--brand); text-decoration:underline; text-underline-offset:2px;}
.md-code{background:var(--surface-3); border-radius:5px; padding:1px 5px; font-size:.9em;
  font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;}
.md-pre{background:var(--surface-3); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; overflow-x:auto; font-size:12.5px; line-height:1.6;
  font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;}
.md-empty{color:var(--text-3); font-style:italic;}

.note-quick-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}

.note-panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:15px 16px; box-shadow:var(--shadow);}
.note-panel + .note-panel{margin-top:14px;}
.note-panel-head{display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-size:13px; font-weight:700; margin-bottom:11px;}
.note-panel-head > span{display:inline-flex; align-items:center; gap:7px; min-width:0;}
.note-panel-count{font-style:normal; font-size:11px; font-weight:700; color:var(--text-3);
  background:var(--surface-2); border-radius:9px; padding:1px 7px;}
.note-details{display:flex; flex-direction:column; gap:14px;}
.note-details .field{margin-bottom:11px;}
.note-details .note-panel + .note-panel{margin-top:0;}
/* Inside a modal the panel is already on a card — drop the double frame. */
.modal .note-panel{border:none; box-shadow:none; padding:0; background:transparent;}
.card > .note-panel{border:none; box-shadow:none; padding:0; background:transparent;}

.linked-list{display:flex; flex-direction:column; gap:7px;}
.linked-row{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:11px;
  background:var(--surface-2); border:1px solid transparent;
  animation:linkIn 220ms cubic-bezier(.22,.61,.36,1) both;}
.linked-row:hover{border-color:var(--border-strong);}
.linked-row.missing{color:var(--danger); background:var(--danger-soft);}
@keyframes linkIn{ from{opacity:0; transform:scale(.96);} to{opacity:1; transform:none;} }
.linked-row.removing{animation:linkOut 200ms ease forwards; overflow:hidden;}
@keyframes linkOut{ to{opacity:0; max-height:0; padding-top:0; padding-bottom:0; margin-top:-7px;} }
.linked-main{flex:1; min-width:0; text-align:left; border:none; background:none; cursor:pointer;
  display:flex; flex-direction:column; gap:2px; padding:0;}
.linked-title{font-size:12.8px; font-weight:650; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.linked-title.done{color:var(--text-3); text-decoration:line-through;}
.linked-sub{font-size:11px; color:var(--text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.attach-list{display:flex; flex-direction:column; gap:6px;}
.attach-row{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--text-2);}
.attach-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
.attach-main a{color:var(--text); font-weight:650;}
.attach-main em{font-style:normal; font-size:10.5px; color:var(--text-3);}

.note-times{display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text-2);}
.note-times div{display:flex; gap:8px;}
.note-times em{font-style:normal; width:90px; flex-shrink:0; color:var(--text-3);}

.note-empty{display:flex; flex-direction:column; align-items:center; text-align:center;
  gap:8px; padding:40px 20px; color:var(--text-3);}
.note-empty.small{padding:16px 8px; gap:4px;}
.note-empty-title{font-size:14.5px; font-weight:700; color:var(--text);}
.note-empty p{font-size:12.5px; max-width:340px; line-height:1.6;}

.picker-list{max-height:min(420px,50vh); overflow-y:auto; display:flex; flex-direction:column;
  gap:5px; border:1px solid var(--border); border-radius:12px; padding:7px; background:var(--surface-2);}
.picker-row{display:flex; align-items:center; gap:9px; width:100%; text-align:left; cursor:pointer;
  border:1px solid transparent; background:var(--surface); border-radius:10px; padding:9px 11px;
  transition:border-color .12s, background .12s;}
.picker-row:hover{border-color:var(--brand);}
.picker-row.linked{background:var(--brand-soft); border-color:transparent;}
.picker-check{width:19px; height:19px; flex-shrink:0; border-radius:6px; border:1.8px solid var(--text-3);
  display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
.picker-check.on{background:var(--brand); border-color:var(--brand);}
.picker-title{flex:1; min-width:0; font-size:12.8px; font-weight:650;
  display:flex; flex-direction:column; gap:1px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;}
.picker-sub{font-style:normal; font-size:11px; font-weight:500; color:var(--text-3);
