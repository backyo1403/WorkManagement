<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Work OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.min.css">
<style>
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#FAFAFA; --border:#E5E5E9;
  --text:#1D1D1F; --text-2:#6E6E73; --text-3:#A1A1A6;
  --accent:#0071E3; --accent-soft:#E8F2FF; --accent-dark:#0058B0;
  --danger:#FF3B30; --danger-soft:#FFEDEC;
  --warning:#FF9500; --warning-soft:#FFF4E5;
  --success:#2FA84F; --success-soft:#E9F8EE;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  --shadow-lg:0 4px 12px rgba(0,0,0,.06), 0 24px 48px rgba(0,0,0,.10);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;}
::selection{background:var(--accent-soft);}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:14px;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#D7D7DB; border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;}

#app{display:flex; height:100vh; overflow:hidden;}

/* ---------- Sidebar ---------- */
.sidebar{width:220px; flex-shrink:0; background:var(--surface-2); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:18px 12px;}
.brand{display:flex; align-items:center; gap:8px; padding:6px 8px 20px 8px;}
.brand-mark{width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--accent),#5AA9FF); flex-shrink:0;}
.brand-name{font-weight:650; font-size:15px; letter-spacing:-.01em;}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; color:var(--text-2); font-weight:500; font-size:13.5px; cursor:pointer; user-select:none; transition:background .12s;}
.nav-item:hover{background:#ECECEE;}
.nav-item.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow); font-weight:600;}
.nav-item .dot{width:16px; text-align:center; font-size:14px;}
.nav-section{margin-top:14px;}
.sidebar-footer{margin-top:auto; padding:10px 8px; font-size:11.5px; color:var(--text-3);}

/* ---------- Main ---------- */
.main{flex:1; overflow-y:auto; padding:28px 34px 60px 34px;}
.view{max-width:1180px; margin:0 auto;}
.page-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px;}
.page-title{font-size:24px; font-weight:700; letter-spacing:-.02em;}
.page-sub{color:var(--text-2); font-size:13px; margin-top:3px;}

/* ---------- Quick Capture ---------- */
.capture-box{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:22px;}
.capture-label{font-size:12px; color:var(--text-2); font-weight:600; margin-bottom:8px;}
.capture-row{display:flex; gap:10px; align-items:center;}
.capture-input{flex:1; border:none; outline:none; font-size:17px; font-weight:500; padding:6px 2px; background:transparent;}
.capture-input::placeholder{color:var(--text-3); font-weight:400;}
.btn{border:none; border-radius:10px; padding:10px 16px; font-weight:600; font-size:13.5px; transition:transform .08s, opacity .12s; white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-primary:disabled{opacity:.45; cursor:default;}
.btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{background:#ECECEE;}
.btn-danger-ghost{background:var(--danger-soft); color:var(--danger);}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}

.suggest-card{margin-top:14px; border-top:1px solid var(--border); padding-top:14px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.chip{background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:6px 12px; font-size:12.5px; display:flex; align-items:center; gap:6px;}
.chip b{font-weight:600;}
.chip.risk-high{background:var(--danger-soft); color:var(--danger); border-color:transparent;}
.chip.risk-medium{background:var(--warning-soft); color:#B9670A; border-color:transparent;}
.chip.risk-low{background:var(--success-soft); color:var(--success); border-color:transparent;}
.chip.priority-Critical{background:var(--danger-soft); color:var(--danger);}
.chip.priority-High{background:var(--warning-soft); color:#B9670A;}
.chip.priority-Medium{background:var(--accent-soft); color:var(--accent-dark);}
.chip.priority-Low{background:#F1F1F3; color:var(--text-2);}

/* ---------- Cards / grid ---------- */
.grid{display:grid; gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:2fr 1fr;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow);}
.card h3{font-size:14px; font-weight:650; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;}
.stat-num{font-size:30px; font-weight:700; letter-spacing:-.02em;}
.stat-label{color:var(--text-2); font-size:12.5px; margin-top:2px;}

/* ---------- Task rows ---------- */
.tabs{display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.tab{padding:9px 14px; font-size:13px; font-weight:600; color:var(--text-2); border-bottom:2px solid transparent; cursor:pointer;}
.tab.active{color:var(--accent); border-color:var(--accent);}
.task-list{display:flex; flex-direction:column; gap:8px;}
.task-row{background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:box-shadow .12s;}
.task-row:hover{box-shadow:var(--shadow);}
.task-check{width:19px; height:19px; border-radius:50%; border:2px solid var(--text-3); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
.task-check.done{background:var(--success); border-color:var(--success);}
.priority-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.pr-Critical{background:var(--danger);} .pr-High{background:var(--warning);} .pr-Medium{background:var(--accent);} .pr-Low{background:var(--text-3);}
.task-title{font-weight:600; font-size:13.7px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.task-title.done{text-decoration:line-through; color:var(--text-3);}
.task-meta{display:flex; gap:8px; align-items:center; flex-shrink:0;}
.badge{font-size:11px; font-weight:600; padding:3px 8px; border-radius:7px; background:var(--surface-2); color:var(--text-2); white-space:nowrap;}
.badge.overdue{background:var(--danger-soft); color:var(--danger);}
.badge.today{background:var(--accent-soft); color:var(--accent-dark);}
.empty-state{text-align:center; padding:50px 20px; color:var(--text-3);}
.empty-state .glyph{font-size:30px; margin-bottom:10px;}

/* ---------- Modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.28); display:flex; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(2px);}
.modal{background:var(--surface); border-radius:20px; width:560px; max-width:92vw; max-height:86vh; overflow-y:auto; box-shadow:var(--shadow-lg); padding:26px 28px;}
.modal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.modal-title{font-size:18px; font-weight:700;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--text-2); margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%; border:1px solid var(--border); border-radius:9px; padding:9px 11px; outline:none; background:var(--surface-2);}
.field textarea{resize:vertical; min-height:60px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent); background:#fff;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.subtask-row{display:flex; align-items:center; gap:8px; padding:4px 0;}
.subtask-row input[type=text]{border:none; background:transparent; padding:2px;}
.close-x{width:28px; height:28px; border-radius:50%; border:none; background:var(--surface-2); font-size:15px; color:var(--text-2);}
.progress-bar{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); border-radius:4px;}

/* ---------- Calendar ---------- */
.cal-grid{display:grid; grid-template-columns:52px repeat(7,1fr); border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--surface);}
.cal-head{padding:8px 4px; text-align:center; font-size:11.5px; font-weight:700; color:var(--text-2); border-bottom:1px solid var(--border); border-left:1px solid var(--border);}
.cal-head.today{color:var(--accent);}
.cal-hour-label{font-size:10px; color:var(--text-3); text-align:right; padding:2px 6px 0 0; border-top:1px solid var(--border); height:44px;}
.cal-cell{border-top:1px solid var(--border); border-left:1px solid var(--border); height:44px; position:relative;}
.cal-block{position:absolute; left:2px; right:2px; background:var(--accent-soft); border-left:3px solid var(--accent); border-radius:6px; padding:3px 16px 3px 6px; font-size:10.5px; font-weight:600; color:var(--accent-dark); overflow:hidden; cursor:grab; z-index:2;}
.cal-block.pr-Critical{background:var(--danger-soft); border-color:var(--danger); color:#B0261C;}
.cal-block.pr-High{background:var(--warning-soft); border-color:var(--warning); color:#B9670A;}

/* ---------- Goals ---------- */
.goal-col{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; min-width:190px;}
.goal-cols{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px;}
.goal-item{background:var(--surface-2); border-radius:10px; padding:10px; margin-bottom:8px; font-size:12.5px;}
.goal-item .g-title{font-weight:650; margin-bottom:6px;}

/* ---------- Heatmap ---------- */
.heatmap{display:grid; grid-template-columns:repeat(26,10px); grid-auto-flow:column; gap:3px;}
.heat-cell{width:10px; height:10px; border-radius:2px; background:#EDEDEF;}

/* ---------- AI Chat ---------- */
.chat-wrap{display:flex; height:calc(100vh - 100px); gap:16px;}
.chat-col{flex:1; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden;}
.chat-messages{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px;}
.msg{max-width:78%; padding:11px 14px; border-radius:14px; font-size:13.5px; line-height:1.5;}
.msg.user{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start; background:var(--surface-2); border-bottom-left-radius:4px; white-space:pre-wrap;}
.msg.ai .action-card{margin-top:10px; background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px; }
.chat-input-row{display:flex; gap:8px; padding:14px; border-top:1px solid var(--border);}
.chat-input-row input{flex:1; border:1px solid var(--border); border-radius:10px; padding:10px 12px; outline:none;}
.context-col{width:250px; flex-shrink:0; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; overflow-y:auto; font-size:12.5px;}
.context-col h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); margin:14px 0 8px 0;}
.context-col h4:first-child{margin-top:0;}
.typing{display:flex; gap:4px; padding:4px 0;}
.typing span{width:6px; height:6px; border-radius:50%; background:var(--text-3); animation:blink 1.1s infinite;}
.typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
@keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

.timer-btn{width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); font-size:11px; flex-shrink:0;}
.timer-btn.running{background:var(--danger-soft); color:var(--danger); border-color:transparent;}

/* ---------- Quick capture extras ---------- */
.capture-extra{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap;}
.icon-btn{display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface-2); border-radius:9px; padding:7px 11px; font-size:12.5px; font-weight:600; color:var(--text-2); cursor:pointer;}
.icon-btn:hover{background:#ECECEE;}
.icon-btn.active{background:var(--warning-soft); color:#B9670A; border-color:transparent;}
.icon-btn input{border:none; background:transparent; outline:none; font-size:12.5px; font-weight:600; color:var(--text); width:112px; cursor:pointer; font-family:inherit;}
.icon-btn.assignee input{cursor:text;}
.star-badge{font-size:12px;}

/* ---------- Charts ---------- */
.chart-legend{display:flex; gap:14px; margin-top:12px; flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-2);}
.legend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.bar-chart{display:flex; align-items:flex-end; gap:14px; height:150px; padding-top:14px; overflow-x:auto;}
.bar-col{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:44px; height:100%; justify-content:flex-end;}
.bar-fill{width:36px; border-radius:6px 6px 3px 3px; transition:height .3s;}
.bar-label{font-size:10.5px; color:var(--text-2); text-align:center; max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-value{font-size:11px; font-weight:700;}

/* ---------- Task expand / inline subtasks ---------- */
.task-expand-btn{width:22px; height:22px; border-radius:6px; border:none; background:var(--surface-2); color:var(--text-2); font-size:10px; flex-shrink:0;}
.task-expand-btn.open{background:var(--accent-soft); color:var(--accent-dark);}
.subtask-inline-wrap{padding:6px 14px 10px 57px; display:flex; flex-direction:column; gap:5px; margin-top:-4px;}
.subtask-inline-item{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-2);}
.subtask-inline-item.done{text-decoration:line-through; color:var(--text-3);}
.subtask-inline-check{width:14px; height:14px; border-radius:50%; border:2px solid var(--text-3); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#fff; cursor:pointer;}
.subtask-inline-check.done{background:var(--success); border-color:var(--success);}

/* ---------- Calendar extras ---------- */
.cal-badge{position:absolute; top:1px; right:2px; width:14px; height:14px; border-radius:50%; z-index:3; box-shadow:0 0 0 2px #fff;}
.cal-tooltip{position:fixed; background:var(--text); color:#fff; padding:10px 12px; border-radius:10px; font-size:11.5px; z-index:300; max-width:230px; box-shadow:var(--shadow-lg); pointer-events:none;}
.cal-tooltip .tt-title{font-weight:700; margin-bottom:5px;}
.cal-tooltip .tt-row{color:#ddd; margin-bottom:3px;}
.cal-tooltip .tt-sub{padding-left:4px; opacity:.85;}

.toast-wrap{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:200;}
.toast{background:var(--text); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; box-shadow:var(--shadow-lg); animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

@media (max-width:900px){
  .sidebar{position:fixed; bottom:0; left:0; right:0; top:auto; width:100%; height:60px; flex-direction:row; padding:0; border-right:none; border-top:1px solid var(--border); justify-content:space-around; align-items:center; z-index:50;}
  .brand,.sidebar-footer,.nav-section{display:none;}
  .nav-item{flex-direction:column; font-size:9.5px; padding:6px; gap:2px;}
  .main{padding:16px 16px 80px 16px;}
  .grid-3{grid-template-columns:1fr;}
  .grid-2{grid-template-columns:1fr;}
  .chat-wrap{flex-direction:column; height:auto;}
  .context-col{width:100%;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* =========================================================
   AI WORK OS — single-file prototype
   Persistence: window.storage (personal, per-user)
   AI: Anthropic Messages API (claude-sonnet-4-6)
   ========================================================= */

const AI_MODEL = "claude-sonnet-4-6";
const STATUSES = ["Inbox","Planned","Today","In Progress","Waiting","Completed","Archived"];
const PRIORITIES = ["Critical","High","Medium","Low"];
const WORK_HOURS = {start:9, end:18}; // simple working-hours model for risk calc

let STATE = { tasks: [], goals: [], chat: [], settings: { workStart:9, workEnd:18 }, loaded:false };
let VIEW = "dashboard";
let activeTimer = null; // {taskId, startedAt}
let timerTick = null;

// ---------- storage helpers ----------
async function loadAll(){
  async function safeGet(key, fallback){
    try{ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; }
    catch(e){ return fallback; }
  }
  STATE.tasks = await safeGet('tasks', seedTasks());
  STATE.goals = await safeGet('goals', seedGoals());
  STATE.chat = await safeGet('chat', []);
  STATE.settings = await safeGet('settings', {workStart:9, workEnd:18});
  STATE.loaded = true;
}
async function persist(key){
  try{ await window.storage.set(key, JSON.stringify(STATE[key === 'settings' ? 'settings' : key])); }
  catch(e){ console.error('storage failed', e); toast('Could not save — changes may not persist'); }
}

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function nowISO(){ return new Date().toISOString(); }
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

// ---------- seed demo data (clearly marked as demo/seed only) ----------
function seedTasks(){
  const today = new Date();
  const iso = (d,h)=>{ const x=new Date(d); if(h!==undefined) x.setHours(h,0,0,0); return x.toISOString(); };
  const plus = (days)=>{ const d=new Date(today); d.setDate(d.getDate()+days); return d; };
  return [
    { id: uid(), title:"Prepare AMS sales report", description:"Q3 regional sales summary for AMS.", deadline: iso(plus(4)), start: iso(today,14), priority:"High", project:"Sales Ops", category:"Report", tags:["reporting"], estimate:4, actual:1.2, checklist:[{id:uid(),text:"Pull raw sales data",done:true},{id:uid(),text:"Build charts",done:false},{id:uid(),text:"Write summary",done:false}], attachments:[], notes:"", completion:30, recurrence:null, dependencies:[], status:"In Progress", created: nowISO(), updated: nowISO(), completedAt:null, timeLogs:[{start:iso(today,9), end:iso(today,10.2), minutes:72}] },
    { id: uid(), title:"Send quotation to OTA", description:"", deadline: iso(plus(1)), start: iso(plus(1),10), priority:"Critical", project:"Partnerships", category:"Admin", tags:[], estimate:1, actual:0, checklist:[], attachments:[], notes:"", completion:0, recurrence:null, dependencies:[], status:"Planned", created: nowISO(), updated: nowISO(), completedAt:null, timeLogs:[] },
    { id: uid(), title:"Prepare presentation for next week's meeting", description:"", deadline: iso(plus(6)), start:null, priority:"Medium", project:"Leadership", category:"Presentation", tags:["deck"], estimate:5, actual:0, checklist:[], attachments:[], notes:"", completion:0, recurrence:null, dependencies:[], status:"Planned", created: nowISO(), updated: nowISO(), completedAt:null, timeLogs:[] },
    { id: uid(), title:"Reply to vendor emails", description:"", deadline: iso(today,17), start: iso(today,16), priority:"Low", project:"Admin", category:"Email", tags:[], estimate:0.5, actual:0, checklist:[], attachments:[], notes:"", completion:0, recurrence:null, dependencies:[], status:"Today", created: nowISO(), updated: nowISO(), completedAt:null, timeLogs:[] },
    { id: uid(), title:"Q2 retro notes", description:"", deadline: iso(plus(-2)), start:null, priority:"Medium", project:"Leadership", category:"Docs", tags:[], estimate:2, actual:0, checklist:[], attachments:[], notes:"", completion:10, recurrence:null, dependencies:[], status:"Waiting", created: nowISO(), updated: nowISO(), completedAt:null, timeLogs:[] },
  ];
}
function seedGoals(){
  return [
    { id: uid(), level:"yearly", title:"Grow AMS revenue 20%", period:"2026", progress:38 },
    { id: uid(), level:"quarterly", title:"Close 3 new OTA partnerships", period:"Q3 2026", progress:55 },
    { id: uid(), level:"monthly", title:"Ship revised sales reporting process", period:"August 2026", progress:20 },
    { id: uid(), level:"weekly", title:"Clear reporting backlog", period:"Week 32", progress:40 },
    { id: uid(), level:"daily", title:"Finish AMS report draft", period: new Date().toDateString(), progress:30 },
  ];
}

// ---------- Claude API helper ----------
async function callClaude(messages, system, maxTokens){
  const body = { model: AI_MODEL, max_tokens: maxTokens || 1000, messages };
  if(system) body.system = system;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("AI request failed: " + res.status);
  const data = await res.json();
  const text = (data.content||[]).map(b=>b.text||"").join("\n").trim();
  return text;
}
function stripFence(t){ return t.replace(/```json|```/g,"").trim(); }

// ---------- Derived / analytics ----------
function isOverdue(t){ return t.deadline && new Date(t.deadline) < new Date() && t.status!=="Completed" && t.status!=="Archived"; }
function isToday(dateStr){ if(!dateStr) return false; const d=new Date(dateStr), n=new Date(); return d.toDateString()===n.toDateString(); }
function hoursUntil(dateStr){ return (new Date(dateStr) - new Date())/3600000; }

function availableWorkingHours(untilDate){
  // crude model: counts weekday working-hour windows between now and deadline
  let h = 0; let cur = new Date();
  const end = new Date(untilDate);
  if(end <= cur) return 0;
  const ws = STATE.settings.workStart, we = STATE.settings.workEnd;
  while(cur < end){
    const day = cur.getDay();
    if(day!==0 && day!==6){
      const dayStart = new Date(cur); dayStart.setHours(ws,0,0,0);
      const dayEnd = new Date(cur); dayEnd.setHours(we,0,0,0);
      const winStart = cur > dayStart ? cur : dayStart;
      const winEnd = end < dayEnd ? end : dayEnd;
      if(winEnd > winStart) h += (winEnd-winStart)/3600000;
    }
    cur.setDate(cur.getDate()+1); cur.setHours(0,0,0,0);
  }
  return h;
}
function deadlineRisk(t){
  if(!t.deadline || t.status==="Completed" || t.status==="Archived") return {level:"none"};
  const remainingEffort = Math.max(0, (t.estimate||1) * (1 - (t.completion||0)/100));
  const avail = availableWorkingHours(t.deadline);
  const overdue = isOverdue(t);
  if(overdue) return {level:"high", remainingEffort, avail, reason:"Past deadline"};
  if(avail <= 0) return {level:"high", remainingEffort, avail, reason:"No working time left before deadline"};
  const ratio = remainingEffort / avail;
  if(ratio >= 0.8) return {level:"high", remainingEffort, avail, reason:"Remaining work exceeds available time"};
  if(ratio >= 0.45) return {level:"medium", remainingEffort, avail, reason:"Tight but feasible"};
  return {level:"low", remainingEffort, avail, reason:"On track"};
}

function dayPart(){ const h = new Date().getHours(); return h<12?"morning":h<18?"afternoon":"evening"; }
function weekTimeLogged(){
  const start = new Date(); start.setDate(start.getDate()-start.getDay()); start.setHours(0,0,0,0);
  let mins=0;
  STATE.tasks.forEach(t=> (t.timeLogs||[]).forEach(l=>{ if(new Date(l.start) >= start) mins += (l.minutes||0); }));
  return mins/60;
}
function topProject(){
  const map={};
  STATE.tasks.forEach(t=> (t.timeLogs||[]).forEach(l=>{ map[t.project||'Unassigned'] = (map[t.project||'Unassigned']||0) + (l.minutes||0); }));
  const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  return entries.length? entries[0][0] : "—";
}
function emptyRow(text){ return `<div class="empty-state" style="padding:20px;"><div class="glyph">✓</div>${text}</div>`; }
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); const n=new Date();
  if(d.toDateString()===n.toDateString()) return "Today " + d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

async function runCapture(){
  const input = document.getElementById('captureInput');
  const text = input.value.trim();
  if(!text) return;
  const resultEl = document.getElementById('captureResult');
  const btn = document.getElementById('captureBtn');
  btn.disabled = true; btn.textContent = "Thinking…";
  resultEl.innerHTML = `<div class="typing" style="margin-top:12px;"><span></span><span></span><span></span></div>`;
  try{
    const today = new Date();
    const system = `You are the task-parsing engine for a personal work OS. Today's date is ${today.toDateString()} (${today.toISOString()}). Extract a structured task from the user's free-text capture. Respond with ONLY a raw JSON object, no markdown fences, no commentary. Schema:
{"title": string, "deadline": ISO8601 datetime or null, "priority": "Critical"|"High"|"Medium"|"Low", "project": short string guess or null, "category": short string or null, "estimate_hours": number (realistic guess, 0.25-8), "clarification_needed": string or null (a single short question ONLY if the request is too ambiguous to schedule, else null), "suggested_start": ISO8601 datetime or null (a reasonable work slot before the deadline, during working hours ${STATE.settings.workStart}:00-${STATE.settings.workEnd}:00, weekdays)}`;
    const raw = await callClaude([{role:"user", content:text}], system, 500);
    let parsed;

function wireTasks(){
  document.querySelectorAll('[data-tab]').forEach(el=> el.onclick = ()=>{ taskTab = el.dataset.tab; renderView(); });

  document.querySelectorAll('[data-timer]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); toggleTimer(el.dataset.timer); });
  document.querySelectorAll('[data-expand]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation();
    const id = el.dataset.expand; if(expandedTasks.has(id)) expandedTasks.delete(id); else expandedTasks.add(id); renderView(); });
  document.querySelectorAll('[data-inline-sub-toggle]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation();
    const [tid,cid] = el.dataset.inlineSubToggle.split('|'); const t = STATE.tasks.find(x=>x.id===tid); if(!t) return;
    const c = (t.checklist||[]).find(x=>x.id===cid); if(!c) return; c.done = !c.done; t.updated = nowISO(); persist('tasks'); renderView(); });
}
function toggleComplete(id){
  const t = STATE.tasks.find(x=>x.id===id); if(!t) return;
  if(t.status==='Completed'){ t.status='Planned'; t.completedAt=null; t.completion=Math.min(t.completion,90); }
  else { t.status='Completed'; t.completedAt=nowISO(); t.completion=100; if(activeTimer && activeTimer.taskId===id) stopTimer(); }
  t.updated=nowISO(); persist('tasks'); renderView();
}
function toggleTimer(id){
  if(activeTimer && activeTimer.taskId===id) stopTimer();
  else { if(activeTimer) stopTimer(); activeTimer = {taskId:id, startedAt:Date.now()}; toast('Timer started'); renderView(); }
}
function stopTimer(){
  if(!activeTimer) return;
  const t = STATE.tasks.find(x=>x.id===activeTimer.taskId);
  const minutes = Math.max(1, Math.round((Date.now()-activeTimer.startedAt)/60000));
  if(t){ t.timeLogs = t.timeLogs||[]; t.timeLogs.push({start:new Date(activeTimer.startedAt).toISOString(), end:nowISO(), minutes});
    t.actual = +(( (t.actual||0) + minutes/60 ).toFixed(2)); t.updated=nowISO(); persist('tasks'); }
  toast(`Logged ${minutes} min`);
  activeTimer = null; renderView();
}

    notes: partial.notes||"", completion:0, recurrence:null, dependencies:[],

  overlay.innerHTML = `

function subtaskRowHtml(c){

function toLocalInput(iso){ if(!iso) return ""; const d = new Date(iso); const off = d.getTimezoneOffset(); const local = new Date(d.getTime()-off*60000); return local.toISOString().slice(0,16); }

   CALENDAR VIEW (week, drag to reschedule)

let calWeekOffset = 0;
function viewCalendar(){
  const base = new Date(); base.setDate(base.getDate() + calWeekOffset*7 - base.getDay());
  const days = [...Array(7)].map((_,i)=>{ const d=new Date(base); d.setDate(base.getDate()+i); return d; });
  const hours = [...Array(14)].map((_,i)=>i+7); // 7am - 8pm
  return `
    <div class="page-header">
      <div><div class="page-title">Calendar</div><div class="page-sub">Drag a task block to reschedule</div></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost btn-sm" id="prevWeek">←</button>
        <button class="btn btn-ghost btn-sm" id="todayWeek">Today</button>
        <button class="btn btn-ghost btn-sm" id="nextWeek">→</button>
      </div>
    </div>
    <div class="cal-grid">
      <div class="cal-head"></div>
      ${days.map(d=>`<div class="cal-head ${d.toDateString()===new Date().toDateString()?'today':''}">${d.toLocaleDateString(undefined,{weekday:'short'})}<br>${d.getDate()}</div>`).join("")}
      ${hours.map(h=>`
        <div class="cal-hour-label">${h%12||12}${h<12?'a':'p'}</div>
        ${days.map(d=>{
          const cellId = d.toISOString().slice(0,10)+"_"+h;
          return `<div class="cal-cell" data-cell="${cellId}" data-date="${d.toISOString().slice(0,10)}" data-hour="${h}">${renderBlocksFor(d,h)}</div>`;
        }).join("")}
      `).join("")}
    </div>
  `;
}
function renderBlocksFor(date,hour){
  const tasks = activeTasks().filter(t=>{
    if(!t.start) return false; const s = new Date(t.start);
    return s.toDateString()===date.toDateString() && s.getHours()===hour;
  });
  return tasks.map(t=>{
    const pct = t.status==='Completed' ? 100 : (t.completion||0);
    const color = completionColor(pct);
    return `<div class="cal-block pr-${t.priority}" draggable="true" data-drag="${t.id}" data-hover="${t.id}">
      <div class="cal-badge" style="background:conic-gradient(${color} ${pct}%, #E5E5E9 0);" title="${pct}% complete"></div>
      ${t.important?'⭐ ':''}${esc(t.title)}
      <div style="font-size:9px; opacity:.8; margin-top:1px; font-weight:500;">${t.deadline? fmtDate(t.deadline):'No deadline'} · ${t.priority}</div>
    </div>`;
  }).join("");
}
let calTooltipEl = null;
function showCalTooltip(evt, taskId){
  const t = STATE.tasks.find(x=>x.id===taskId); if(!t) return;
  hideCalTooltip();
  const pct = t.status==='Completed' ? 100 : (t.completion||0);
  calTooltipEl = document.createElement('div');
  calTooltipEl.className = 'cal-tooltip';
  calTooltipEl.innerHTML = `
    <div class="tt-title">${esc(t.title)}</div>
    <div class="tt-row">⏳ ${t.deadline? fmtDate(t.deadline):'No deadline'} · ${t.priority}${t.important?' · ⭐ Important':''}</div>
    <div class="tt-row">Progress: ${pct}%${t.assignee?' · 👤 '+esc(t.assignee):''}</div>
    ${(t.checklist||[]).length? `<div class="tt-row" style="margin-top:6px; font-weight:700;">Subtasks (${t.checklist.filter(c=>c.done).length}/${t.checklist.length})</div>${t.checklist.map(c=>`<div class="tt-row tt-sub">${c.done?'✓':'○'} ${esc(c.text||'(untitled)')}</div>`).join("")}` : `<div class="tt-row" style="opacity:.7;">No subtasks</div>`}
  `;
  document.body.appendChild(calTooltipEl);
  positionTooltip(evt);
}
function positionTooltip(evt){
  if(!calTooltipEl) return;
  const x = Math.min(evt.clientX + 14, window.innerWidth - 246);
  const y = Math.min(evt.clientY + 14, window.innerHeight - 170);
  calTooltipEl.style.left = x + 'px'; calTooltipEl.style.top = y + 'px';
}
function hideCalTooltip(){ if(calTooltipEl){ calTooltipEl.remove(); calTooltipEl = null; } }
function wireCalendar(){
  document.getElementById('prevWeek').onclick = ()=>{ calWeekOffset--; renderView(); };
  document.getElementById('nextWeek').onclick = ()=>{ calWeekOffset++; renderView(); };
  document.getElementById('todayWeek').onclick = ()=>{ calWeekOffset=0; renderView(); };
  document.querySelectorAll('[data-drag]').forEach(el=>{
    el.ondragstart = (e)=>{ e.dataTransfer.setData('text/plain', el.dataset.drag); hideCalTooltip(); };
    el.onclick = ()=> openTaskModal(el.dataset.drag);
  });
  document.querySelectorAll('[data-hover]').forEach(el=>{
    el.addEventListener('mouseenter', (e)=> showCalTooltip(e, el.dataset.hover));
    el.addEventListener('mousemove', positionTooltip);
    el.addEventListener('mouseleave', hideCalTooltip);
  });
  document.querySelectorAll('[data-cell]').forEach(el=>{
    el.ondragover = (e)=> e.preventDefault();
    el.ondrop = (e)=>{
      e.preventDefault();
      const taskId = e.dataTransfer.getData('text/plain');
      const t = STATE.tasks.find(x=>x.id===taskId); if(!t) return;
      const d = new Date(el.dataset.date + "T00:00:00"); d.setHours(parseInt(el.dataset.hour),0,0,0);
      const prevStart = t.start;
      t.start = d.toISOString(); t.updated = nowISO();
      if(t.status==="Inbox") t.status="Planned";
      persist('tasks'); renderView();
      toast(`Moved "${t.title}" to ${d.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'})}`);
    };
  });
}

/* =========================================================
   ANALYTICS VIEW  — bar chart + pie chart, red/yellow/green by completion
   ========================================================= */
function completionColor(pct){
  if(pct < 34) return '#FF3B30';   // red   — low completion
  if(pct < 67) return '#FF9500';   // amber — medium completion
  return '#2FA84F';                // green — high / done
}
function taskCompletionBuckets(){
  const tasks = activeTasks();
  let low=0, mid=0, high=0;
  tasks.forEach(t=>{ const pct = t.status==='Completed' ? 100 : (t.completion||0);
    if(pct<34) low++; else if(pct<67) mid++; else high++; });
  return [
    {label:'Low (<34%)', count:low, color:'#FF3B30'},
    {label:'Medium (34–66%)', count:mid, color:'#FF9500'},
    {label:'High / done (≥67%)', count:high, color:'#2FA84F'}
  ];
}
function projectStats(){
  const map = {};
  STATE.tasks.forEach(t=>{
    const key = t.project || 'Unassigned';
    if(!map[key]) map[key] = {minutes:0, completions:[]};
    map[key].minutes += (t.timeLogs||[]).reduce((a,l)=>a+l.minutes,0);
    map[key].completions.push(t.status==='Completed' ? 100 : (t.completion||0));
  });
  return Object.entries(map).map(([label,v])=>({
    label, value: +(v.minutes/60).toFixed(2), displayValue: (v.minutes/60).toFixed(1)+'h',
    pct: v.completions.length ? v.completions.reduce((a,b)=>a+b,0)/v.completions.length : 0
  })).sort((a,b)=>b.value-a.value);
}
function renderBarChart(items){
  if(!items.length) return emptyRow("No time logged yet — start a timer on a task");
  const max = Math.max(1, ...items.map(i=>i.value));
  return `<div class="bar-chart">${items.map(i=>{
    const h = Math.max(4, i.value/max*118);
    return `<div class="bar-col">
      <div class="bar-value" style="color:${completionColor(i.pct)};">${i.displayValue}</div>
      <div class="bar-fill" style="height:${h}px; background:${completionColor(i.pct)};" title="${esc(i.label)}: avg ${Math.round(i.pct)}% complete"></div>
      <div class="bar-label">${esc(i.label)}</div>
    </div>`;
  }).join("")}</div>`;
}
function renderPieChart(buckets){
  const total = buckets.reduce((a,b)=>a+b.count,0) || 1;
  let cumulative = 0;
  const r=54, cx=64, cy=64;
  const segments = buckets.filter(b=>b.count>0).map(b=>{
    const frac = b.count/total;
    const a0 = cumulative*2*Math.PI; cumulative += frac; const a1 = cumulative*2*Math.PI;
    const x1 = cx + r*Math.sin(a0), y1 = cy - r*Math.cos(a0);
    const x2 = cx + r*Math.sin(a1), y2 = cy - r*Math.cos(a1);
    const largeArc = (frac > 0.5) ? 1 : 0;
    const path = frac >= 0.999
      ? `M${cx},${cy-r} A${r},${r} 0 1 1 ${cx-0.01},${cy-r} Z`
      : `M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
    return `<path d="${path}" fill="${b.color}"></path>`;
  }).join("");
  return `<svg viewBox="0 0 128 128" width="128" height="128" style="flex-shrink:0;">${segments}<circle cx="${cx}" cy="${cy}" r="30" fill="#fff"></circle><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="16" font-weight="700" fill="#1D1D1F">${total}</text></svg>`;
}

      <h3>AI insight</h3>
      <div id="insightBox" style="font-size:13px; color:var(--text-2);">Overdue: ${overdueCount} tasks. Click "Generate insight" for an AI-written summary of your week.</div>
      <button class="btn btn-ghost btn-sm" id="genInsight" style="margin-top:10px;">Generate insight</button>

function estimationAccuracy(){
  const withBoth = STATE.tasks.filter(t=>t.status==='Completed' && t.estimate && t.actual);
  if(!withBoth.length) return "—";
  const errs = withBoth.map(t=> Math.abs(t.actual-t.estimate)/t.estimate);
  const avg = errs.reduce((a,b)=>a+b,0)/errs.length;
  return Math.max(0, Math.round((1-avg)*100)) + "%";
}
function heatmapHtml(){
  const days=[]; const today = new Date();
  for(let i=181;i>=0;i--){ const d=new Date(today); d.setDate(d.getDate()-i); days.push(d); }
  const minsByDay = {};
  STATE.tasks.forEach(t=>(t.timeLogs||[]).forEach(l=>{ const key = new Date(l.start).toDateString(); minsByDay[key]=(minsByDay[key]||0)+l.minutes; }));
  return `<div class="heatmap">${days.map(d=>{
    const m = minsByDay[d.toDateString()]||0;
    const level = m===0?0: m<30?1: m<90?2: m<180?3:4;
    const bg = ["#EDEDEF","#CFE8FF","#8FC6FF","#4FA3FF","#0071E3"][level];
    return `<div class="heat-cell" style="background:${bg};" title="${d.toDateString()}: ${(m/60).toFixed(1)}h"></div>`;
  }).join("")}</div>`;
}

        ${activeTasks().map(t=>({t,r:deadlineRisk(t)})).filter(x=>x.r.level==='high').slice(0,5).map(x=>`<div style="padding:6px 0; border-bottom:1px solid var(--border); color:var(--danger);">${esc(x.t.title)}</div>`).join("") || '<div style="color:var(--text-3);">None</div>'}
        <h4>Goals in focus</h4>
        ${STATE.goals.filter(g=>g.level==='weekly'||g.level==='daily').map(g=>`<div style="padding:6px 0; border-bottom:1px solid var(--border);">${esc(g.title)} — ${g.progress}%</div>`).join("")}
      </div>
    </div>
  `;
}
function formatAiText(t){ return esc(t).replace(/\n/g,"<br>"); }
function buildAppContext(){
  const t = STATE.tasks.filter(x=>x.status!=='Archived').map(t=>({
    id:t.id, title:t.title, status:t.status, priority:t.priority, project:t.project,
    deadline:t.deadline, start:t.start, estimate:t.estimate, actual:t.actual, completion:t.completion,
    risk: deadlineRisk(t).level
  }));
  return JSON.stringify({ today: new Date().toISOString(), tasks:t, goals: STATE.goals, week_hours_logged: weekTimeLogged().toFixed(1) });
}
function wireAssistant(){
  document.getElementById('clearChat').onclick = ()=>{ STATE.chat=[]; persist('chat'); renderView(); };
  const send = async ()=>{
    const input = document.getElementById('chatInput');
    const text = input.value.trim(); if(!text) return;
    input.value='';
    STATE.chat.push({role:'user', text}); persist('chat'); renderView();
    const box = document.getElementById('chatMessages');
    box.insertAdjacentHTML('beforeend', `<div class="msg ai" id="typingMsg"><div class="typing"><span></span><span></span><span></span></div></div>`);
    box.scrollTop = box.scrollHeight;
    try{
      const system = `You are the AI assistant inside "AI Work OS", a personal productivity app. You have access to the user's real current data as JSON below — use it directly, be specific (reference actual task titles, dates, numbers), and be concise. Never claim to have taken an action (like moving or deleting a task) — you can only suggest it; the app will show accept/reject controls separately. Speak like a sharp, calm chief of staff, not a generic chatbot.

APP DATA:
${buildAppContext()}`;
      const history = STATE.chat.slice(-8).map(m=>({role: m.role==='user'?'user':'assistant', content:m.text}));
      const reply = await callClaude(history, system, 700);
      document.getElementById('typingMsg')?.remove();
      STATE.chat.push({role:'assistant', text: reply}); persist('chat'); renderView();
    }catch(e){
      document.getElementById('typingMsg')?.remove();
      STATE.chat.push({role:'assistant', text: "I couldn't reach the AI service just now ("+e.message+"). Try again in a moment."});
      persist('chat'); renderView();
    }
  };
  document.getElementById('chatSend').onclick = send;
  document.getElementById('chatInput').onkeydown = (e)=>{ if(e.key==='Enter') send(); };
  const box = document.getElementById('chatMessages'); if(box) box.scrollTop = box.scrollHeight;
}

function viewSettings(){
  return `
    <div class="page-header"><div><div class="page-title">Settings</div><div class="page-sub">Working hours are used for deadline-risk and AI scheduling calculations</div></div></div>
    <div class="card" style="max-width:420px;">
      <h3>Working hours</h3>
      <div class="field-row">
        <div class="field"><label>Start</label><input id="s_start" type="number" min="0" max="23" value="${STATE.settings.workStart}"></div>
        <div class="field"><label>End</label><input id="s_end" type="number" min="1" max="24" value="${STATE.settings.workEnd}"></div>
      </div>
      <button class="btn btn-primary btn-sm" id="saveSettings">Save</button>
    </div>
    <div class="card" style="max-width:420px; margin-top:16px;">
      <h3>AI provider</h3>
      <div style="font-size:12.5px; color:var(--text-2);">Connected via the Anthropic Messages API (model: ${AI_MODEL}). No key management needed in this environment.</div>
    </div>
  `;
}
function wireSettings(){
  document.getElementById('saveSettings').onclick = ()=>{
    STATE.settings.workStart = parseInt(document.getElementById('s_start').value)||9;
    STATE.settings.workEnd = parseInt(document.getElementById('s_end').value)||18;
    persist('settings'); toast('Settings saved'); renderView();
  };
}

/* ---------- boot ---------- */
(async function boot(){
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#6E6E73;">Loading AI Work OS…</div>`;
  await loadAll();
  render();
  setInterval(()=>{ if(activeTimer && VIEW==='tasks') { /* could add live badge here */ } }, 5000);
})();
</script>
